schemaVersion: 1
id: afghanistan-bank-statement-parser
kind: tool
module: validohub
country: AF
category: finance
status: active
name:
  en: "Afghan Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.afghanistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026/07/21; 1,234.56 AFN; 001 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [afghanistan-masked-bank-account-formatter, afghanistan-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Afghan Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
