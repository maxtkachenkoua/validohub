schemaVersion: 1
id: afghanistan-form-field-auditor
kind: tool
module: validohub
country: AF
category: developer-tools
status: active
name:
  en: "Afghan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.afghanistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TIN123456789&postal=1001 Kabul&phone=+93 70 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [afghanistan-locale-number-parser, afghanistan-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Afghan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
