schemaVersion: 1
id: albania-company-onboarding-auditor
kind: tool
module: validohub
country: AL
category: developer-tools
status: active
name:
  en: "Albanian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for NIPT, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.albania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"AL\",\"nipt\":\"L12345678A\",\"iban\":\"AL47212110090000000235698741\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [albania-business-register-readiness-helper, albania-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Albanian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for NIPT, VAT, address, banking, and official registry handoff readiness."
