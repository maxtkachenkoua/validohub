schemaVersion: 1
id: albania-company-suffix-normalizer
kind: tool
module: validohub
country: AL
category: developer-tools
status: active
name:
  en: "Albanian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.albania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Albania Sample Holding Ltd L12345678A"
    actions: [validate, parse, format, explain]
related:
  explicit: [albania-procurement-identifier-helper, albania-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Albanian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
