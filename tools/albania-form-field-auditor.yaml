schemaVersion: 1
id: albania-form-field-auditor
kind: tool
module: validohub
country: AL
category: developer-tools
status: active
name:
  en: "Albanian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.albania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=AL L12345678A&postal=1001 Tirana&phone=+355 69 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [albania-locale-number-parser, albania-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Albanian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
