schemaVersion: 1
id: albania-locale-number-parser
kind: tool
module: validohub
country: AL
category: localization
status: active
name:
  en: "Albanian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Albania."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.albania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 ALL"
    actions: [validate, parse, format, explain]
related:
  explicit: [albania-calendar-week-helper, albania-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Albanian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Albania."
