schemaVersion: 1
id: albania-regex-pack-helper
kind: tool
module: validohub
country: AL
category: developer-tools
status: active
name:
  en: "Albanian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.albania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Personal number NIPT postal code  AL47212110090000000235698741"
    actions: [validate, parse, format, explain]
related:
  explicit: [albania-api-payload-auditor, albania-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Albanian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
