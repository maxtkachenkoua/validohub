schemaVersion: 1
id: albania-remittance-text-builder
kind: tool
module: validohub
country: AL
category: finance
status: active
name:
  en: "Albanian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.albania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 AL L12345678A 1.234,56 ALL"
    actions: [validate, parse, format, explain]
related:
  explicit: [albania-payment-reconciliation-helper, albania-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Albanian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
