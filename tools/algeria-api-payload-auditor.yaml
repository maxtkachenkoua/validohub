schemaVersion: 1
id: algeria-api-payload-auditor
kind: tool
module: validohub
country: DZ
category: developer-tools
status: active
name:
  en: "Algerian API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.algeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"DZ\",\"taxNumber\":\"DZ123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [algeria-form-field-auditor, algeria-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Algerian API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
