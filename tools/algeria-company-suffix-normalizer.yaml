schemaVersion: 1
id: algeria-company-suffix-normalizer
kind: tool
module: validohub
country: DZ
category: developer-tools
status: active
name:
  en: "Algerian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.algeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Algeria Sample Holding Ltd DZ-REG-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [algeria-procurement-identifier-helper, algeria-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Algerian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
