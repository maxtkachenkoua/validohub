schemaVersion: 1
id: algeria-csv-locale-normalizer
kind: tool
module: validohub
country: DZ
category: developer-tools
status: active
name:
  en: "Algerian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Algeria decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.algeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 DZD;24/07/2026;DZ123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [algeria-slug-normalizer, algeria-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Algerian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Algeria decimal, date, postal, phone, tax, and banking fields."
