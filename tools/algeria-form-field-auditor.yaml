schemaVersion: 1
id: algeria-form-field-auditor
kind: tool
module: validohub
country: DZ
category: developer-tools
status: active
name:
  en: "Algerian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.algeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=DZ123456789&postal=1000 Algiers&phone=+213 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [algeria-locale-number-parser, algeria-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Algerian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
