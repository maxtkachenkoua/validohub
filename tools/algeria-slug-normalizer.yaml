schemaVersion: 1
id: algeria-slug-normalizer
kind: tool
module: validohub
country: DZ
category: developer-tools
status: active
name:
  en: "Algerian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.algeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Algeria sample company Central business district, Algiers 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [algeria-document-ocr-fixer, algeria-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Algerian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
