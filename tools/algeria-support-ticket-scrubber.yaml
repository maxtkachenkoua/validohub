      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent DZ-ID-123456, 001 1234567890, Central business district, Algiers 1000"
    actions: [validate, parse, format, explain]
related:
