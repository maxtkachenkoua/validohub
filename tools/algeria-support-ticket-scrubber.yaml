  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Algerian Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
