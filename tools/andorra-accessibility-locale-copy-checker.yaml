schemaVersion: 1
id: andorra-accessibility-locale-copy-checker
kind: tool
module: validohub
country: AD
category: localization
status: active
name:
  en: "Andorran Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "CASS number input, codi postal input, amount 1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-support-ticket-scrubber, andorra-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
