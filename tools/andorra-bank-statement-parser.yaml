schemaVersion: 1
id: andorra-bank-statement-parser
kind: tool
module: validohub
country: AD
category: finance
status: active
name:
  en: "Andorran Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 EUR; AD1200012030200359100100; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-masked-iban-formatter, andorra-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
