schemaVersion: 1
id: andorra-company-onboarding-auditor
kind: tool
module: validohub
country: AD
category: developer-tools
status: active
name:
  en: "Andorran Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for NRT, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"AD\",\"nrt\":\"F-123456-Z\",\"iban\":\"AD1200012030200359100100\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-business-register-readiness-helper, andorra-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for NRT, VAT, address, banking, and official registry handoff readiness."
