schemaVersion: 1
id: andorra-company-suffix-normalizer
kind: tool
module: validohub
country: AD
category: developer-tools
status: active
name:
  en: "Andorran Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Andorra Sample Holding Ltd F-123456-Z"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-procurement-identifier-helper, andorra-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
