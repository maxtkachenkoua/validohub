  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran EORI / Customs Identifier Helper | ValidoHub"
  description:
    en: "Inspect customs identifiers, country prefixes, VAT-style bodies, and border-process boundaries."
