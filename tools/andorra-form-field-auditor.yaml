schemaVersion: 1
id: andorra-form-field-auditor
kind: tool
module: validohub
country: AD
category: developer-tools
status: active
name:
  en: "Andorran Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=AD F123456Z&postal=AD500 Andorra la Vella&phone=+376 312 345"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-locale-number-parser, andorra-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
