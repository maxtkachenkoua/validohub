summary:
  en: "Generate AD IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "IBG input"
        required: true
        placeholder:
          en: "00012030200359100100"
    actions: [generate, validate, explain]
related:
  explicit: [andorra-bank-account-inspector, andorra-bic-swift-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorra IBAN Generator | ValidoHub"
  description:
    en: "Generate AD IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
