    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
