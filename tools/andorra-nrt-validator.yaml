schemaVersion: 1
id: andorra-nrt-validator
kind: tool
module: validohub
country: AD
category: national-identifiers
status: active
name:
  en: "Andorran NRT Validator"
summary:
  en: "Inspect NRT structure, registry-style prefixes, control digits, and official lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ORG input"
        required: true
        placeholder:
          en: "F-123456-Z"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-vat-id-validator, andorra-eori-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran NRT Validator | ValidoHub"
  description:
    en: "Inspect NRT structure, registry-style prefixes, control digits, and official lookup boundaries."
