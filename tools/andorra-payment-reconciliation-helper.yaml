schemaVersion: 1
id: andorra-payment-reconciliation-helper
kind: tool
module: validohub
country: AD
category: finance
status: active
name:
  en: "Andorran Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 EUR; AD1200012030200359100100; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-bank-statement-parser, andorra-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
