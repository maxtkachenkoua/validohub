schemaVersion: 1
id: andorra-regex-pack-helper
kind: tool
module: validohub
country: AD
category: developer-tools
status: active
name:
  en: "Andorran Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.andorra-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "CASS number NRT codi postal  AD1200012030200359100100"
    actions: [validate, parse, format, explain]
related:
  explicit: [andorra-api-payload-auditor, andorra-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Andorran Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
