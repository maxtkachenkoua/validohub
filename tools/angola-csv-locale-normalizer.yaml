schemaVersion: 1
id: angola-csv-locale-normalizer
kind: tool
module: validohub
country: AO
category: developer-tools
status: active
name:
  en: "Angolan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Angola decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.angola-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 AOA;24/07/2026;AO123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [angola-slug-normalizer, angola-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Angolan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Angola decimal, date, postal, phone, tax, and banking fields."
