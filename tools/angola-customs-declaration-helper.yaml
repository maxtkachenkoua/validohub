schemaVersion: 1
id: angola-customs-declaration-helper
kind: tool
module: validohub
country: AO
category: government
status: active
name:
  en: "Angolan Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.angola-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "AO123456789 HS 8471 1,234.56 AOA"
    actions: [validate, parse, format, explain]
related:
  explicit: [angola-postal-tracking-helper, angola-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Angolan Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
