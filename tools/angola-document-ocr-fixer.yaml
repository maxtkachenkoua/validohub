schemaVersion: 1
id: angola-document-ocr-fixer
kind: tool
module: validohub
country: AO
category: documents
status: active
name:
  en: "Angolan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.angola-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "AO-ID-123456 AO123456789 001 1234567890 1000 Luanda"
    actions: [validate, parse, format, explain]
related:
  explicit: [angola-privacy-redaction-helper, angola-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Angolan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
