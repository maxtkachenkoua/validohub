schemaVersion: 1
id: angola-form-field-auditor
kind: tool
module: validohub
country: AO
category: developer-tools
status: active
name:
  en: "Angolan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.angola-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=AO123456789&postal=1000 Luanda&phone=+244 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [angola-locale-number-parser, angola-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Angolan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
