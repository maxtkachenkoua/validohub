capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 ARS; CBU 2850590940090418135201; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-masked-bank-account-formatter, argentina-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
