schemaVersion: 1
id: argentina-company-onboarding-auditor
kind: tool
module: validohub
country: AR
category: developer-tools
status: active
name:
  en: "Argentine Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for CUIT, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"AR\",\"cuit\":\"30-12345678-9\",\"cbu\":\"2850590940090418135201\",\"amount\":\"1.234,56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-business-register-readiness-helper, argentina-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for CUIT, VAT, address, banking, and official registry handoff readiness."
