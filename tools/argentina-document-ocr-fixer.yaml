schemaVersion: 1
id: argentina-document-ocr-fixer
kind: tool
module: validohub
country: AR
category: documents
status: active
name:
  en: "Argentine Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "30123456 AR 30-12345678-9 CBU 2850590940090418135201 C1002ABC Buenos Aires"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-gdpr-redaction-helper, argentina-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
