schemaVersion: 1
id: argentina-form-field-auditor
kind: tool
module: validohub
country: AR
category: developer-tools
status: active
name:
  en: "Argentine Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=AR 30-12345678-9&postal=C1002ABC Buenos Aires&phone=+54 9 11 2345 6789"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-locale-number-parser, argentina-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
