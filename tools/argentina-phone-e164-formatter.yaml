schemaVersion: 1
id: argentina-phone-e164-formatter
kind: tool
module: validohub
country: AR
category: address
status: active
name:
  en: "Argentine Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+54 9 11 2345 6789"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-date-locale-formatter, argentina-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
