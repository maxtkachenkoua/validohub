schemaVersion: 1
id: argentina-phone-number-validator
kind: tool
module: validohub
country: AR
category: address
status: active
name:
  en: "Argentine Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+54 9 11 2345 6789"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-phone-e164-formatter, argentina-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
