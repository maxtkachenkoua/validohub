schemaVersion: 1
id: argentina-postal-code-validator
kind: tool
module: validohub
country: AR
category: address
status: active
name:
  en: "Argentine Postal Code Validator"
summary:
  en: "Validate codigo postal argentino shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "C1002ABC Buenos Aires"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-address-normalizer, argentina-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Postal Code Validator | ValidoHub"
  description:
    en: "Validate codigo postal argentino shape, split area/delivery hints, and preserve official postal lookup boundaries."
