schemaVersion: 1
id: argentina-regex-pack-helper
kind: tool
module: validohub
country: AR
category: developer-tools
status: active
name:
  en: "Argentine Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "DNI CUIT codigo postal argentino  CBU 2850590940090418135201"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-api-payload-auditor, argentina-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
