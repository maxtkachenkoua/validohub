schemaVersion: 1
id: argentina-slug-normalizer
kind: tool
module: validohub
country: AR
category: developer-tools
status: active
name:
  en: "Argentine Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.argentina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Argentina sample company Av. Corrientes 1234, C1043 Buenos Aires"
    actions: [validate, parse, format, explain]
related:
  explicit: [argentina-document-ocr-fixer, argentina-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Argentine Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
