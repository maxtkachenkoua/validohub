schemaVersion: 1
id: armenia-accessibility-locale-copy-checker
kind: tool
module: validohub
country: AM
category: localization
status: active
name:
  en: "Armenian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "public services number boundary input, postal code input, amount 1 234.56 AMD"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-support-ticket-scrubber, armenia-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
