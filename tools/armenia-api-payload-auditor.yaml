schemaVersion: 1
id: armenia-api-payload-auditor
kind: tool
module: validohub
country: AM
category: developer-tools
status: active
name:
  en: "Armenian API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"AM\",\"tin\":\"01234567\",\"arca\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-form-field-auditor, armenia-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
