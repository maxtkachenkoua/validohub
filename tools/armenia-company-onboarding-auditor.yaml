schemaVersion: 1
id: armenia-company-onboarding-auditor
kind: tool
module: validohub
country: AM
category: developer-tools
status: active
name:
  en: "Armenian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for state register number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"AM\",\"tin\":\"01234567\",\"arca\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-business-register-readiness-helper, armenia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for state register number, VAT, address, banking, and official registry handoff readiness."
