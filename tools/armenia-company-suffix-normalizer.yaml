schemaVersion: 1
id: armenia-company-suffix-normalizer
kind: tool
module: validohub
country: AM
category: developer-tools
status: active
name:
  en: "Armenian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Armenia Sample Holding Ltd 271.110.123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-procurement-identifier-helper, armenia-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
