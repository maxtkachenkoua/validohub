schemaVersion: 1
id: armenia-csv-locale-normalizer
kind: tool
module: validohub
country: AM
category: developer-tools
status: active
name:
  en: "Armenian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Armenia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234.56 AMD;21.07.2026;01234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-slug-normalizer, armenia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Armenia decimal, date, postal, phone, tax, and banking fields."
