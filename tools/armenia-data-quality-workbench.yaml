schemaVersion: 1
id: armenia-data-quality-workbench
kind: tool
module: validohub
country: AM
category: developer-tools
status: active
name:
  en: "Armenian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"AM\",\"tin\":\"01234567\",\"arca\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-json-fixture-generator, armenia-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
