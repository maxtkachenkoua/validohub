schemaVersion: 1
id: armenia-document-ocr-fixer
kind: tool
module: validohub
country: AM
category: documents
status: active
name:
  en: "Armenian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "1234567890 01234567 001 123456789012 0010 Yerevan"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-privacy-redaction-helper, armenia-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
