schemaVersion: 1
id: armenia-form-field-auditor
kind: tool
module: validohub
country: AM
category: developer-tools
status: active
name:
  en: "Armenian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=01234567&postal=0010 Yerevan&phone=+374 91 123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-locale-number-parser, armenia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
