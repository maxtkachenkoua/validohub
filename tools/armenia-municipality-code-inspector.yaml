schemaVersion: 1
id: armenia-municipality-code-inspector
kind: tool
module: validohub
country: AM
category: address
status: active
name:
  en: "Armenian Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Mashtots Avenue 1, Yerevan 0010"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-phone-number-validator, armenia-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
