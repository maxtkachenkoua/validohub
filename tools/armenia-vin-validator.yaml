schemaVersion: 1
id: armenia-vin-validator
kind: tool
module: validohub
country: AM
category: transport
status: active
name:
  en: "Armenian VIN Validator"
summary:
  en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare vehicle-intake diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.armenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VIN input"
        required: true
        placeholder:
          en: "WVWZZZ1JZXW000001"
    actions: [validate, parse, format, explain]
related:
  explicit: [armenia-vehicle-data-redaction-helper, armenia-customs-declaration-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Armenian VIN Validator | ValidoHub"
  description:
    en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare vehicle-intake diagnostics."
