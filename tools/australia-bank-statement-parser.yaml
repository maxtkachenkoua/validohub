schemaVersion: 1
id: australia-bank-statement-parser
kind: tool
module: validohub
country: AU
category: finance
status: active
name:
  en: "Australian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.australia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "24/07/2026; 1,234.56 AUD; 062-000 12345678; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [australia-masked-bank-account-formatter, australia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Australian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
