schemaVersion: 1
id: australia-company-suffix-normalizer
kind: tool
module: validohub
country: AU
category: developer-tools
status: active
name:
  en: "Australian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.australia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Australia Sample Holding Ltd 51 824 753 556"
    actions: [validate, parse, format, explain]
related:
  explicit: [australia-procurement-identifier-helper, australia-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Australian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
