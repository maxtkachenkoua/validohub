schemaVersion: 1
id: australia-json-fixture-generator
kind: tool
module: validohub
country: AU
category: developer-tools
status: active
name:
  en: "Australian JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.australia-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"AU\",\"abn\":\"51824753556\",\"bsb\":\"062000\",\"amount\":\"1,234.56\"}"
    actions: [generate, validate, explain]
related:
  explicit: [australia-regex-pack-helper, australia-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Australian JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
