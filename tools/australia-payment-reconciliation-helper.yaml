schemaVersion: 1
id: australia-payment-reconciliation-helper
kind: tool
module: validohub
country: AU
category: finance
status: active
name:
  en: "Australian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.australia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "24/07/2026; 1,234.56 AUD; 062-000 12345678; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [australia-bank-statement-parser, australia-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Australian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
