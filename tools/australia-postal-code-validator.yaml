schemaVersion: 1
id: australia-postal-code-validator
kind: tool
module: validohub
country: AU
category: address
status: active
name:
  en: "Australian Postal Code Validator"
summary:
  en: "Validate postcode shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.australia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "2600 Canberra ACT"
    actions: [validate, parse, format, explain]
related:
  explicit: [australia-address-normalizer, australia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Australian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postcode shape, split area/delivery hints, and preserve official postal lookup boundaries."
