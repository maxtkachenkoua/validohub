schemaVersion: 1
id: australia-slug-normalizer
kind: tool
module: validohub
country: AU
category: developer-tools
status: active
name:
  en: "Australian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.australia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Australia sample company 1 National Circuit, Canberra ACT 2600"
    actions: [validate, parse, format, explain]
related:
  explicit: [australia-document-ocr-fixer, australia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Australian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
