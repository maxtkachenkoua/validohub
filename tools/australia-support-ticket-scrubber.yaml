schemaVersion: 1
id: australia-support-ticket-scrubber
kind: tool
module: validohub
country: AU
category: privacy
status: active
name:
  en: "Australian Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.australia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 123 456 782, 062-000 12345678, 1 National Circuit, Canberra ACT 2600"
    actions: [validate, parse, format, explain]
related:
  explicit: [australia-integration-smoke-test-builder, australia-tfn-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Australian Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
