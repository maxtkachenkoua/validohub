schemaVersion: 1
id: austria-company-onboarding-auditor
kind: tool
module: validohub
country: AT
category: developer-tools
status: active
name:
  en: "Austrian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for Firmenbuchnummer, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.austria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"AT\",\"uid\":\"ATU12345674\",\"iban\":\"AT611904300234573201\",\"amount\":\"1.234,56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [austria-business-register-readiness-helper, austria-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Austrian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for Firmenbuchnummer, VAT, address, banking, and official registry handoff readiness."
