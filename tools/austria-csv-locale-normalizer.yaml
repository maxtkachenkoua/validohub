schemaVersion: 1
id: austria-csv-locale-normalizer
kind: tool
module: validohub
country: AT
category: developer-tools
status: active
name:
  en: "Austrian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Austria decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.austria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 EUR;21.07.2026;ATU12345674"
    actions: [validate, parse, format, explain]
related:
  explicit: [austria-slug-normalizer, austria-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Austrian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Austria decimal, date, postal, phone, tax, and banking fields."
