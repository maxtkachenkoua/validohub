schemaVersion: 1
id: austria-document-ocr-fixer
kind: tool
module: validohub
country: AT
category: documents
status: active
name:
  en: "Austrian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.austria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "1234010180 ATU12345674 AT611904300234573201 1010 Wien"
    actions: [validate, parse, format, explain]
related:
  explicit: [austria-gdpr-redaction-helper, austria-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Austrian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
