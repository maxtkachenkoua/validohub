schemaVersion: 1
id: austria-form-field-auditor
kind: tool
module: validohub
country: AT
category: developer-tools
status: active
name:
  en: "Austrian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.austria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=ATU12345674&postal=1010 Wien&phone=+43 664 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [austria-locale-number-parser, austria-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Austrian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
