schemaVersion: 1
id: austria-payment-reconciliation-helper
kind: tool
module: validohub
country: AT
category: finance
status: active
name:
  en: "Austrian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.austria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 EUR; AT611904300234573201; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [austria-bank-statement-parser, austria-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Austrian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
