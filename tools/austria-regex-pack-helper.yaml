schemaVersion: 1
id: austria-regex-pack-helper
kind: tool
module: validohub
country: AT
category: developer-tools
status: active
name:
  en: "Austrian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.austria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "SVNR Firmenbuchnummer Postleitzahl  AT611904300234573201"
    actions: [validate, parse, format, explain]
related:
  explicit: [austria-api-payload-auditor, austria-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Austrian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
