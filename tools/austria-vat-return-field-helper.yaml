    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "UID / USt; ATU12345674; period 2026-07; 1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [austria-invoice-number-helper, austria-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Austrian VAT Return Field Helper | ValidoHub"
  description:
    en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
