schemaVersion: 1
id: azerbaijan-api-payload-auditor
kind: tool
module: validohub
country: AZ
category: developer-tools
status: active
name:
  en: "Azerbaijani API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.azerbaijan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"AZ\",\"voen\":\"9900003611\",\"iban\":\"AZ21NABZ00000000137010001944\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [azerbaijan-form-field-auditor, azerbaijan-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Azerbaijani API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
