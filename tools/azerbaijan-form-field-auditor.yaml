schemaVersion: 1
id: azerbaijan-form-field-auditor
kind: tool
module: validohub
country: AZ
category: developer-tools
status: active
name:
  en: "Azerbaijani Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.azerbaijan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=9900003611&postal=AZ1000 Baku&phone=+994 50 123 45 67"
    actions: [validate, parse, format, explain]
related:
  explicit: [azerbaijan-locale-number-parser, azerbaijan-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Azerbaijani Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
