schemaVersion: 1
id: azerbaijan-locale-number-parser
kind: tool
module: validohub
country: AZ
category: localization
status: active
name:
  en: "Azerbaijani Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Azerbaijan."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.azerbaijan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 AZN"
    actions: [validate, parse, format, explain]
related:
  explicit: [azerbaijan-calendar-week-helper, azerbaijan-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Azerbaijani Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Azerbaijan."
