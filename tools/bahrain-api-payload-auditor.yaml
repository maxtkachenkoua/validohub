schemaVersion: 1
id: bahrain-api-payload-auditor
kind: tool
module: validohub
country: BH
category: developer-tools
status: active
name:
  en: "Bahraini API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"BH\",\"cpr\":\"900101123\",\"iban\":\"BH67BMAG00001299123456\",\"benefitPay\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-form-field-auditor, bahrain-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
