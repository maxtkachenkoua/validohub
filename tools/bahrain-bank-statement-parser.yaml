schemaVersion: 1
id: bahrain-bank-statement-parser
kind: tool
module: validohub
country: BH
category: finance
status: active
name:
  en: "Bahraini Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.560 BHD; BMAG 1299123456; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-masked-bank-account-formatter, bahrain-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
