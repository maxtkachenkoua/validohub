schemaVersion: 1
id: bahrain-company-onboarding-auditor
kind: tool
module: validohub
country: BH
category: developer-tools
status: active
name:
  en: "Bahraini Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"BH\",\"cpr\":\"900101123\",\"iban\":\"BH67BMAG00001299123456\",\"benefitPay\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-business-register-readiness-helper, bahrain-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
