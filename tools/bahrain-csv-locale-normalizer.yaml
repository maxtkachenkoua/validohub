schemaVersion: 1
id: bahrain-csv-locale-normalizer
kind: tool
module: validohub
country: BH
category: developer-tools
status: active
name:
  en: "Bahraini CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Bahrain decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.560 BHD;21/07/2026;220012345600002"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-slug-normalizer, bahrain-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Bahrain decimal, date, postal, phone, tax, and banking fields."
