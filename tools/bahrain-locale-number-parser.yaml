schemaVersion: 1
id: bahrain-locale-number-parser
kind: tool
module: validohub
country: BH
category: localization
status: active
name:
  en: "Bahraini Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Bahrain."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.560 BHD"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-calendar-week-helper, bahrain-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Bahrain."
