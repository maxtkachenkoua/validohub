schemaVersion: 1
id: bahrain-phone-number-validator
kind: tool
module: validohub
country: BH
category: address
status: active
name:
  en: "Bahraini Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+973 3600 1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-phone-e164-formatter, bahrain-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
