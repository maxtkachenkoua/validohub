schemaVersion: 1
id: bahrain-postal-code-validator
kind: tool
module: validohub
country: BH
category: address
status: active
name:
  en: "Bahraini Postal Code Validator"
summary:
  en: "Validate block/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "Block 316 Manama"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-address-normalizer, bahrain-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini Postal Code Validator | ValidoHub"
  description:
    en: "Validate block/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
