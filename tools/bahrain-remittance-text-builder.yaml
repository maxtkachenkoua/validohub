schemaVersion: 1
id: bahrain-remittance-text-builder
kind: tool
module: validohub
country: BH
category: finance
status: active
name:
  en: "Bahraini Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 220012345600002 1,234.560 BHD"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-payment-reconciliation-helper, bahrain-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
