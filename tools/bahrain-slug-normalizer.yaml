schemaVersion: 1
id: bahrain-slug-normalizer
kind: tool
module: validohub
country: BH
category: developer-tools
status: active
name:
  en: "Bahraini Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bahrain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Bahrain sample company Government Avenue 1, Manama, Block 316"
    actions: [validate, parse, format, explain]
related:
  explicit: [bahrain-document-ocr-fixer, bahrain-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bahraini Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
