schemaVersion: 1
id: bangladesh-accessibility-locale-copy-checker
kind: tool
module: validohub
country: BD
category: localization
status: active
name:
  en: "Bangladeshi Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "NID boundary input, postal code input, amount 1,234.56 BDT"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-support-ticket-scrubber, bangladesh-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
