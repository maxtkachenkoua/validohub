schemaVersion: 1
id: bangladesh-bank-statement-parser
kind: tool
module: validohub
country: BD
category: finance
status: active
name:
  en: "Bangladeshi Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 BDT; 145 1234567890123; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-masked-bank-account-formatter, bangladesh-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
