schemaVersion: 1
id: bangladesh-company-onboarding-auditor
kind: tool
module: validohub
country: BD
category: developer-tools
status: active
name:
  en: "Bangladeshi Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for RJSC registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"BD\",\"tin\":\"123456789012\",\"routing\":\"145\",\"beftn\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-business-register-readiness-helper, bangladesh-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for RJSC registration number, VAT, address, banking, and official registry handoff readiness."
