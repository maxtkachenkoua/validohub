schemaVersion: 1
id: bangladesh-csv-locale-normalizer
kind: tool
module: validohub
country: BD
category: developer-tools
status: active
name:
  en: "Bangladeshi CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Bangladesh decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 BDT;21/07/2026;123456789012"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-slug-normalizer, bangladesh-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Bangladesh decimal, date, postal, phone, tax, and banking fields."
