schemaVersion: 1
id: bangladesh-locale-number-parser
kind: tool
module: validohub
country: BD
category: localization
status: active
name:
  en: "Bangladeshi Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Bangladesh."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 BDT"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-calendar-week-helper, bangladesh-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Bangladesh."
