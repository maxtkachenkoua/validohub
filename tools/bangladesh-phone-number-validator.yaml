schemaVersion: 1
id: bangladesh-phone-number-validator
kind: tool
module: validohub
country: BD
category: address
status: active
name:
  en: "Bangladeshi Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+880 1712 345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-phone-e164-formatter, bangladesh-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
