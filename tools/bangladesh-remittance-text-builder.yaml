schemaVersion: 1
id: bangladesh-remittance-text-builder
kind: tool
module: validohub
country: BD
category: finance
status: active
name:
  en: "Bangladeshi Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 123456789012 1,234.56 BDT"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-payment-reconciliation-helper, bangladesh-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
