schemaVersion: 1
id: bangladesh-slug-normalizer
kind: tool
module: validohub
country: BD
category: developer-tools
status: active
name:
  en: "Bangladeshi Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Bangladesh sample company Motijheel Road 1, Dhaka 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-document-ocr-fixer, bangladesh-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
