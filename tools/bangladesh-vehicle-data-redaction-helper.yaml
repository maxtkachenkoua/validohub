    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "DHAKA METRO GA 12-3456 WVWZZZ1JZXW000001 1990123456789"
    actions: [validate, parse, format, explain]
related:
