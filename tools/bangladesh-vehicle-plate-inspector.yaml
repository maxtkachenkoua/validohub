schemaVersion: 1
id: bangladesh-vehicle-plate-inspector
kind: tool
module: validohub
country: BD
category: transport
status: active
name:
  en: "Bangladeshi Vehicle Plate Inspector"
summary:
  en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bangladesh-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PLATE input"
        required: true
        placeholder:
          en: "DHAKA METRO GA 12-3456"
    actions: [validate, parse, format, explain]
related:
  explicit: [bangladesh-vin-validator, bangladesh-vehicle-data-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bangladeshi Vehicle Plate Inspector | ValidoHub"
  description:
    en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
