schemaVersion: 1
id: belgium-accessibility-locale-copy-checker
kind: tool
module: validohub
country: BE
category: localization
status: active
name:
  en: "Belgian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "RRN / NISS input, postcode / code postal input, amount 1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-support-ticket-scrubber, belgium-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
