schemaVersion: 1
id: belgium-bank-statement-parser
kind: tool
module: validohub
country: BE
category: finance
status: active
name:
  en: "Belgian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 EUR; BE68539007547034; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-masked-iban-formatter, belgium-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
