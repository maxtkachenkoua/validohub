schemaVersion: 1
id: belgium-company-onboarding-auditor
kind: tool
module: validohub
country: BE
category: developer-tools
status: active
name:
  en: "Belgian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for KBO / BCE, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"BE\",\"vat\":\"BE0123456749\",\"iban\":\"BE68539007547034\",\"amount\":\"1.234,56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-business-register-readiness-helper, belgium-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for KBO / BCE, VAT, address, banking, and official registry handoff readiness."
