schemaVersion: 1
id: belgium-company-suffix-normalizer
kind: tool
module: validohub
country: BE
category: developer-tools
status: active
name:
  en: "Belgian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Belgium Sample Holding Ltd BE0123456749"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-procurement-identifier-helper, belgium-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
