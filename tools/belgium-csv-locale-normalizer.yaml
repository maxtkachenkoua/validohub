schemaVersion: 1
id: belgium-csv-locale-normalizer
kind: tool
module: validohub
country: BE
category: developer-tools
status: active
name:
  en: "Belgian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Belgium decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 EUR;21/07/2026;BE0123456749"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-slug-normalizer, belgium-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Belgium decimal, date, postal, phone, tax, and banking fields."
