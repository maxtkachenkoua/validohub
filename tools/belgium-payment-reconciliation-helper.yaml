schemaVersion: 1
id: belgium-payment-reconciliation-helper
kind: tool
module: validohub
country: BE
category: finance
status: active
name:
  en: "Belgian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 EUR; BE68539007547034; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-bank-statement-parser, belgium-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
