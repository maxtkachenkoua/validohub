schemaVersion: 1
id: belgium-phone-e164-formatter
kind: tool
module: validohub
country: BE
category: address
status: active
name:
  en: "Belgian Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+32 2 123 45 67"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-date-locale-formatter, belgium-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
