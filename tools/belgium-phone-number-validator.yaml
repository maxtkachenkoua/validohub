schemaVersion: 1
id: belgium-phone-number-validator
kind: tool
module: validohub
country: BE
category: address
status: active
name:
  en: "Belgian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+32 2 123 45 67"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-phone-e164-formatter, belgium-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
