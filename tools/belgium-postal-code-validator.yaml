schemaVersion: 1
id: belgium-postal-code-validator
kind: tool
module: validohub
country: BE
category: address
status: active
name:
  en: "Belgian Postal Code Validator"
summary:
  en: "Validate postcode / code postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "1000 Brussels"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-address-normalizer, belgium-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postcode / code postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
