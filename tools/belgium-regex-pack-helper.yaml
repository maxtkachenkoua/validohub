schemaVersion: 1
id: belgium-regex-pack-helper
kind: tool
module: validohub
country: BE
category: developer-tools
status: active
name:
  en: "Belgian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "RRN / NISS KBO / BCE postcode / code postal  BE68539007547034"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-api-payload-auditor, belgium-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
