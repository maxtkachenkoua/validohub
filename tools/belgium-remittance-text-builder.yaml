schemaVersion: 1
id: belgium-remittance-text-builder
kind: tool
module: validohub
country: BE
category: finance
status: active
name:
  en: "Belgian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 BE0123456749 1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-payment-reconciliation-helper, belgium-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
