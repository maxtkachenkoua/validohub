schemaVersion: 1
id: belgium-slug-normalizer
kind: tool
module: validohub
country: BE
category: developer-tools
status: active
name:
  en: "Belgian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.belgium-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Belgium sample company Rue de la Loi 16, 1000 Brussels"
    actions: [validate, parse, format, explain]
related:
  explicit: [belgium-document-ocr-fixer, belgium-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Belgian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
