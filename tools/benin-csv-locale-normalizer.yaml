schemaVersion: 1
id: benin-csv-locale-normalizer
kind: tool
module: validohub
country: BJ
category: developer-tools
status: active
name:
  en: "Beninese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Benin decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.benin-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;BJ123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [benin-slug-normalizer, benin-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Beninese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Benin decimal, date, postal, phone, tax, and banking fields."
