      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "BJ-ID-123456 BJ123456789 001 1234567890 1000 Porto-Novo"
    actions: [validate, parse, format, explain]
related:
  explicit: [benin-privacy-redaction-helper, benin-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Beninese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
