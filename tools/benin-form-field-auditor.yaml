schemaVersion: 1
id: benin-form-field-auditor
kind: tool
module: validohub
country: BJ
category: developer-tools
status: active
name:
  en: "Beninese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.benin-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=BJ123456789&postal=1000 Porto-Novo&phone=+229 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [benin-locale-number-parser, benin-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Beninese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
