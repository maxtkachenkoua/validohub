schemaVersion: 1
id: benin-slug-normalizer
kind: tool
module: validohub
country: BJ
category: developer-tools
status: active
name:
  en: "Beninese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.benin-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Benin sample company Central business district, Porto-Novo 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [benin-document-ocr-fixer, benin-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Beninese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
