schemaVersion: 1
id: bhutan-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: BT
category: tax
status: active
name:
  en: "Bhutanese Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21/07/2026 1,234.56 BTN TPN1234567"
    actions: [generate, validate, explain]
related:
  explicit: [bhutan-postal-code-validator, bhutan-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
