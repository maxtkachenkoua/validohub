schemaVersion: 1
id: bhutan-address-normalizer
kind: tool
module: validohub
country: BT
category: address
status: active
name:
  en: "Bhutanese Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Norzin Lam 1, Thimphu 11001"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-address-transliteration-normalizer, bhutan-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
