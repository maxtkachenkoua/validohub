schemaVersion: 1
id: bhutan-api-payload-auditor
kind: tool
module: validohub
country: BT
category: developer-tools
status: active
name:
  en: "Bhutanese API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"BT\",\"cid\":\"10101001234\",\"tpn\":\"TPN1234567\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-form-field-auditor, bhutan-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
