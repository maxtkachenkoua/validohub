schemaVersion: 1
id: bhutan-company-suffix-normalizer
kind: tool
module: validohub
country: BT
category: developer-tools
status: active
name:
  en: "Bhutanese Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Bhutan Sample Holding Ltd BT-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-procurement-identifier-helper, bhutan-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
