summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "TPN1234567 HS 8471 1,234.56 BTN"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-postal-tracking-helper, bhutan-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
