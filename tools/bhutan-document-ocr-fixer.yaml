schemaVersion: 1
id: bhutan-document-ocr-fixer
kind: tool
module: validohub
country: BT
category: documents
status: active
name:
  en: "Bhutanese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "10101001234 TPN1234567 001 1234567890 11001 Thimphu"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-privacy-redaction-helper, bhutan-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
