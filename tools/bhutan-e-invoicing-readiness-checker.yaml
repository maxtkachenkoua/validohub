schemaVersion: 1
id: bhutan-e-invoicing-readiness-checker
kind: tool
module: validohub
country: BT
category: tax
status: active
name:
  en: "Bhutanese tax invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"BT\",\"cid\":\"10101001234\",\"tpn\":\"TPN1234567\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-tax-authority-handoff-helper, bhutan-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese tax invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
