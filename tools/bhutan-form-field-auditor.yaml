schemaVersion: 1
id: bhutan-form-field-auditor
kind: tool
module: validohub
country: BT
category: developer-tools
status: active
name:
  en: "Bhutanese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TPN1234567&postal=11001 Thimphu&phone=+975 17 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-locale-number-parser, bhutan-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
