schemaVersion: 1
id: bhutan-integration-smoke-test-builder
kind: tool
module: validohub
country: BT
category: developer-tools
status: active
name:
  en: "Bhutanese Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"BT\",\"cid\":\"10101001234\",\"tpn\":\"TPN1234567\"}"
    actions: [generate, validate, explain]
related:
  explicit: [bhutan-cid-boundary-validator, bhutan-company-registration-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
