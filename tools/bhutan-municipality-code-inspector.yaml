schemaVersion: 1
id: bhutan-municipality-code-inspector
kind: tool
module: validohub
country: BT
category: address
status: active
name:
  en: "Bhutanese Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Norzin Lam 1, Thimphu 11001"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-phone-number-validator, bhutan-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
