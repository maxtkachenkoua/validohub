schemaVersion: 1
id: bhutan-pii-masker
kind: tool
module: validohub
country: BT
category: privacy
status: active
name:
  en: "Bhutanese PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "10101001234 +975 17 123 456 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-personal-data-fixture-generator, bhutan-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
