schemaVersion: 1
id: bhutan-remittance-text-builder
kind: tool
module: validohub
country: BT
category: finance
status: active
name:
  en: "Bhutanese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 TPN1234567 1,234.56 BTN"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-payment-reconciliation-helper, bhutan-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
