schemaVersion: 1
id: bhutan-support-ticket-scrubber
kind: tool
module: validohub
country: BT
category: privacy
status: active
name:
  en: "Bhutanese Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 10101001234, 001 1234567890, Norzin Lam 1, Thimphu 11001"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-integration-smoke-test-builder, bhutan-cid-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
