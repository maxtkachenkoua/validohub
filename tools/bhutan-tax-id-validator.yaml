schemaVersion: 1
id: bhutan-tax-id-validator
kind: tool
module: validohub
country: BT
category: national-identifiers
status: active
name:
  en: "Bhutanese TPN / tax number Validator"
summary:
  en: "Normalize TPN / tax number identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "TPN1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-customs-importer-code-helper, bhutan-social-protection-boundary-social-insurance-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese TPN / tax number Validator | ValidoHub"
  description:
    en: "Normalize TPN / tax number identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
