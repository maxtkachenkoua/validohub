schemaVersion: 1
id: bhutan-tax-rate-sanity-helper
kind: tool
module: validohub
country: BT
category: tax
status: active
name:
  en: "Bhutanese Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "TPN / tax number 20% base 1,234.56 BTN"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-tax-return-field-helper, bhutan-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
