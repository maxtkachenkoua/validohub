schemaVersion: 1
id: bhutan-vehicle-data-redaction-helper
kind: tool
module: validohub
country: BT
category: transport
status: active
name:
  en: "Bhutanese Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bhutan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "BP-1-A1234 WVWZZZ1JZXW000001 10101001234"
    actions: [validate, parse, format, explain]
related:
  explicit: [bhutan-customs-declaration-helper, bhutan-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bhutanese Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
