schemaVersion: 1
id: bolivia-accessibility-locale-copy-checker
kind: tool
module: validohub
country: BO
category: localization
status: active
name:
  en: "Bolivian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "CI input, postal/address reference input, amount 1.234,56 BOB"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-support-ticket-scrubber, bolivia-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
