schemaVersion: 1
id: bolivia-bank-statement-parser
kind: tool
module: validohub
country: BO
category: finance
status: active
name:
  en: "Bolivian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 BOB; BO-BANK-001-1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-masked-bank-account-formatter, bolivia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
