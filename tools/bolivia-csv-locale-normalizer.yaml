schemaVersion: 1
id: bolivia-csv-locale-normalizer
kind: tool
module: validohub
country: BO
category: developer-tools
status: active
name:
  en: "Bolivian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Bolivia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 BOB;21/07/2026;BO NIT 1023459028"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-slug-normalizer, bolivia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Bolivia decimal, date, postal, phone, tax, and banking fields."
