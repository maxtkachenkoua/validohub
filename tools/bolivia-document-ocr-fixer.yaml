schemaVersion: 1
id: bolivia-document-ocr-fixer
kind: tool
module: validohub
country: BO
category: documents
status: active
name:
  en: "Bolivian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "1234567 LP BO NIT 1023459028 BO-BANK-001-1234567890 La Paz 0000"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-gdpr-redaction-helper, bolivia-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
