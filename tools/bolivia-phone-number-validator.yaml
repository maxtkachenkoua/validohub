schemaVersion: 1
id: bolivia-phone-number-validator
kind: tool
module: validohub
country: BO
category: address
status: active
name:
  en: "Bolivian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+591 71234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-phone-e164-formatter, bolivia-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
