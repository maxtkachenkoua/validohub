schemaVersion: 1
id: bolivia-postal-code-validator
kind: tool
module: validohub
country: BO
category: address
status: active
name:
  en: "Bolivian Postal Code Validator"
summary:
  en: "Validate postal/address reference shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "La Paz 0000"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-address-normalizer, bolivia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal/address reference shape, split area/delivery hints, and preserve official postal lookup boundaries."
