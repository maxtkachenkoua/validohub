schemaVersion: 1
id: bolivia-regex-pack-helper
kind: tool
module: validohub
country: BO
category: developer-tools
status: active
name:
  en: "Bolivian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "CI NIT postal/address reference  BO-BANK-001-1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-api-payload-auditor, bolivia-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
