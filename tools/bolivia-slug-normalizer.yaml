schemaVersion: 1
id: bolivia-slug-normalizer
kind: tool
module: validohub
country: BO
category: developer-tools
status: active
name:
  en: "Bolivian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bolivia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Bolivia sample company Av. Arce 123, La Paz"
    actions: [validate, parse, format, explain]
related:
  explicit: [bolivia-document-ocr-fixer, bolivia-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bolivian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
