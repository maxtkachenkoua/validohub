schemaVersion: 1
id: bosnia-and-herzegovina-form-field-auditor
kind: tool
module: validohub
country: BA
category: developer-tools
status: active
name:
  en: "Bosnian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bosnia-and-herzegovina-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=BA4200123450006&postal=71000 Sarajevo&phone=+387 61 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [bosnia-and-herzegovina-locale-number-parser, bosnia-and-herzegovina-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bosnian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
