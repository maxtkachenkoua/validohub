schemaVersion: 1
id: botswana-business-register-readiness-helper
kind: tool
module: validohub
country: BW
category: government
status: active
name:
  en: "Botswana business registry Readiness Helper"
summary:
  en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.botswana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REG input"
        required: true
        placeholder:
          en: "BW-REG-123456 BW123456789 Central business district, Gaborone 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [botswana-id-card-format-helper, botswana-passport-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Botswana business registry Readiness Helper | ValidoHub"
  description:
    en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
