schemaVersion: 1
id: botswana-csv-locale-normalizer
kind: tool
module: validohub
country: BW
category: developer-tools
status: active
name:
  en: "Botswana CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Botswana decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.botswana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 BWP;24/07/2026;BW123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [botswana-slug-normalizer, botswana-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Botswana CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Botswana decimal, date, postal, phone, tax, and banking fields."
