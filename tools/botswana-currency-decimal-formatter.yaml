schemaVersion: 1
id: botswana-currency-decimal-formatter
kind: tool
module: validohub
country: BW
category: finance
status: active
name:
  en: "Botswana BWP Decimal Currency Formatter"
summary:
  en: "Normalize BWP amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.botswana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234.56 BWP"
    actions: [validate, parse, format, explain]
related:
  explicit: [botswana-tax-rate-sanity-helper, botswana-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Botswana BWP Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize BWP amount strings, decimal separators, grouping, and API-safe numeric previews."
