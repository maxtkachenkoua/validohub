schemaVersion: 1
id: botswana-locale-number-parser
kind: tool
module: validohub
country: BW
category: localization
status: active
name:
  en: "Botswana Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Botswana."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.botswana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 BWP"
    actions: [validate, parse, format, explain]
related:
  explicit: [botswana-calendar-week-helper, botswana-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Botswana Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Botswana."
