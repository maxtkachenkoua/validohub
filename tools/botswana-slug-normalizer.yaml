schemaVersion: 1
id: botswana-slug-normalizer
kind: tool
module: validohub
country: BW
category: developer-tools
status: active
name:
  en: "Botswana Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.botswana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Botswana sample company Central business district, Gaborone 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [botswana-document-ocr-fixer, botswana-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Botswana Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
