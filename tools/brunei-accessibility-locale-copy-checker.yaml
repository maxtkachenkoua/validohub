schemaVersion: 1
id: brunei-accessibility-locale-copy-checker
kind: tool
module: validohub
country: BN
category: localization
status: active
name:
  en: "Bruneian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "smart identity card boundary input, postal code input, amount 1,234.56 BND"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-support-ticket-scrubber, brunei-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
