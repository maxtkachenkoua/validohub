schemaVersion: 1
id: brunei-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: BN
category: tax
status: active
name:
  en: "Bruneian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21/07/2026 1,234.56 BND TIN1234567"
    actions: [generate, validate, explain]
related:
  explicit: [brunei-postal-code-validator, brunei-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
