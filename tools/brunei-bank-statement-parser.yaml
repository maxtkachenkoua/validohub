schemaVersion: 1
id: brunei-bank-statement-parser
kind: tool
module: validohub
country: BN
category: finance
status: active
name:
  en: "Bruneian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 BND; 001 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-masked-bank-account-formatter, brunei-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
