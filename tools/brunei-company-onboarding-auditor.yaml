schemaVersion: 1
id: brunei-company-onboarding-auditor
kind: tool
module: validohub
country: BN
category: developer-tools
status: active
name:
  en: "Bruneian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for ROC number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"BN\",\"roc\":\"RC123456\",\"bank\":\"0011234567890\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-business-register-readiness-helper, brunei-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for ROC number, VAT, address, banking, and official registry handoff readiness."
