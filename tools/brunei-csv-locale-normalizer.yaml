schemaVersion: 1
id: brunei-csv-locale-normalizer
kind: tool
module: validohub
country: BN
category: developer-tools
status: active
name:
  en: "Bruneian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Brunei decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 BND;21/07/2026;TIN1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-slug-normalizer, brunei-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Brunei decimal, date, postal, phone, tax, and banking fields."
