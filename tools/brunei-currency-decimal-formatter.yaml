    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian BND Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize BND amount strings, decimal separators, grouping, and API-safe numeric previews."
