schemaVersion: 1
id: brunei-data-quality-workbench
kind: tool
module: validohub
country: BN
category: developer-tools
status: active
name:
  en: "Bruneian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"BN\",\"roc\":\"RC123456\",\"bank\":\"0011234567890\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-json-fixture-generator, brunei-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
