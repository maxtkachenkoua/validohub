schemaVersion: 1
id: brunei-form-field-auditor
kind: tool
module: validohub
country: BN
category: developer-tools
status: active
name:
  en: "Bruneian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TIN1234567&postal=BS8711 Bandar Seri Begawan&phone=+673 712 3456"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-locale-number-parser, brunei-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
