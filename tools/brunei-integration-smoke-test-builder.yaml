schemaVersion: 1
id: brunei-integration-smoke-test-builder
kind: tool
module: validohub
country: BN
category: developer-tools
status: active
name:
  en: "Bruneian Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"BN\",\"roc\":\"RC123456\",\"bank\":\"0011234567890\"}"
    actions: [generate, validate, explain]
related:
  explicit: [brunei-smart-identity-card-boundary-validator, brunei-roc-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
