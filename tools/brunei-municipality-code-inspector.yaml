summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Jalan Sultan 1, Bandar Seri Begawan BS8711"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-phone-number-validator, brunei-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
