schemaVersion: 1
id: brunei-pii-masker
kind: tool
module: validohub
country: BN
category: privacy
status: active
name:
  en: "Bruneian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "00-123456 +673 712 3456 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-personal-data-fixture-generator, brunei-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
