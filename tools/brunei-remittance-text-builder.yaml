schemaVersion: 1
id: brunei-remittance-text-builder
kind: tool
module: validohub
country: BN
category: finance
status: active
name:
  en: "Bruneian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.brunei-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 TIN1234567 1,234.56 BND"
    actions: [validate, parse, format, explain]
related:
  explicit: [brunei-payment-reconciliation-helper, brunei-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
