    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bruneian TIN Validator | ValidoHub"
  description:
    en: "Normalize TIN identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
