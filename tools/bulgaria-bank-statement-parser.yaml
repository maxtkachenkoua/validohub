schemaVersion: 1
id: bulgaria-bank-statement-parser
kind: tool
module: validohub
country: BG
category: finance
status: active
name:
  en: "Bulgarian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bulgaria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1 234,56 BGN; BG80BNBG96611020345678; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [bulgaria-masked-iban-formatter, bulgaria-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bulgarian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
