schemaVersion: 1
id: bulgaria-company-suffix-normalizer
kind: tool
module: validohub
country: BG
category: developer-tools
status: active
name:
  en: "Bulgarian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bulgaria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Bulgaria Sample Holding Ltd 123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [bulgaria-procurement-identifier-helper, bulgaria-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bulgarian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
