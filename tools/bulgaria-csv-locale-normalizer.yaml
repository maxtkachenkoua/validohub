schemaVersion: 1
id: bulgaria-csv-locale-normalizer
kind: tool
module: validohub
country: BG
category: developer-tools
status: active
name:
  en: "Bulgarian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Bulgaria decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bulgaria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 BGN;21.07.2026;BG123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [bulgaria-slug-normalizer, bulgaria-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bulgarian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Bulgaria decimal, date, postal, phone, tax, and banking fields."
