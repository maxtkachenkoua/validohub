schemaVersion: 1
id: bulgaria-form-field-auditor
kind: tool
module: validohub
country: BG
category: developer-tools
status: active
name:
  en: "Bulgarian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bulgaria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=BG123456789&postal=1000 Sofia&phone=+359 88 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [bulgaria-locale-number-parser, bulgaria-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bulgarian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
