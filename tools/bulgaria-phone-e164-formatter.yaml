schemaVersion: 1
id: bulgaria-phone-e164-formatter
kind: tool
module: validohub
country: BG
category: address
status: active
name:
  en: "Bulgarian Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bulgaria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+359 88 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [bulgaria-date-locale-formatter, bulgaria-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bulgarian Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
