schemaVersion: 1
id: bulgaria-pii-masker
kind: tool
module: validohub
country: BG
category: privacy
status: active
name:
  en: "Bulgarian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bulgaria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "8001010008 +359 88 123 4567 BG80BNBG96611020345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [bulgaria-personal-data-fixture-generator, bulgaria-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bulgarian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
