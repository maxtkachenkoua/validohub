schemaVersion: 1
id: bulgaria-remittance-text-builder
kind: tool
module: validohub
country: BG
category: finance
status: active
name:
  en: "Bulgarian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.bulgaria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 BG123456789 1 234,56 BGN"
    actions: [validate, parse, format, explain]
related:
  explicit: [bulgaria-payment-reconciliation-helper, bulgaria-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bulgarian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
