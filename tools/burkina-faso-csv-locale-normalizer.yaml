schemaVersion: 1
id: burkina-faso-csv-locale-normalizer
kind: tool
module: validohub
country: BF
category: developer-tools
status: active
name:
  en: "Burkinabe CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Burkina Faso decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burkina-faso-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;BF123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [burkina-faso-slug-normalizer, burkina-faso-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burkinabe CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Burkina Faso decimal, date, postal, phone, tax, and banking fields."
