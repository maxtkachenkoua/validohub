schemaVersion: 1
id: burkina-faso-e-invoicing-readiness-checker
kind: tool
module: validohub
country: BF
category: tax
status: active
name:
  en: "Burkinabe tax invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burkina-faso-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"BF\",\"taxNumber\":\"BF123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [burkina-faso-tax-authority-handoff-helper, burkina-faso-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burkinabe tax invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
