schemaVersion: 1
id: burkina-faso-form-field-auditor
kind: tool
module: validohub
country: BF
category: developer-tools
status: active
name:
  en: "Burkinabe Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burkina-faso-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=BF123456789&postal=1000 Ouagadougou&phone=+226 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [burkina-faso-locale-number-parser, burkina-faso-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burkinabe Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
