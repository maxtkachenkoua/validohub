schemaVersion: 1
id: burkina-faso-locale-number-parser
kind: tool
module: validohub
country: BF
category: localization
status: active
name:
  en: "Burkinabe Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Burkina Faso."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burkina-faso-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 XOF"
    actions: [validate, parse, format, explain]
related:
  explicit: [burkina-faso-calendar-week-helper, burkina-faso-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burkinabe Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Burkina Faso."
