schemaVersion: 1
id: burkina-faso-pii-masker
kind: tool
module: validohub
country: BF
category: privacy
status: active
name:
  en: "Burkinabe PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burkina-faso-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "BF-ID-123456 +226 123 456 789 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [burkina-faso-personal-data-fixture-generator, burkina-faso-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burkinabe PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
