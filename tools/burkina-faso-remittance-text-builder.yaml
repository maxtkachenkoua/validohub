schemaVersion: 1
id: burkina-faso-remittance-text-builder
kind: tool
module: validohub
country: BF
category: finance
status: active
name:
  en: "Burkinabe Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burkina-faso-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 BF123456789 1,234.56 XOF"
    actions: [validate, parse, format, explain]
related:
  explicit: [burkina-faso-payment-reconciliation-helper, burkina-faso-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burkinabe Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
