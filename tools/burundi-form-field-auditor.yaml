schemaVersion: 1
id: burundi-form-field-auditor
kind: tool
module: validohub
country: BI
category: developer-tools
status: active
name:
  en: "Burundian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burundi-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=BI123456789&postal=1000 Gitega&phone=+257 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [burundi-locale-number-parser, burundi-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burundian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
