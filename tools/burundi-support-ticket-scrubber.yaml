schemaVersion: 1
id: burundi-support-ticket-scrubber
kind: tool
module: validohub
country: BI
category: privacy
status: active
name:
  en: "Burundian Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.burundi-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent BI-ID-123456, 001 1234567890, Central business district, Gitega 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [burundi-integration-smoke-test-builder, burundi-national-id-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Burundian Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
