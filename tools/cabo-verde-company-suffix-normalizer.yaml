schemaVersion: 1
id: cabo-verde-company-suffix-normalizer
kind: tool
module: validohub
country: CV
category: developer-tools
status: active
name:
  en: "Cabo Verdean Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Cabo Verde Sample Holding Ltd CV-REG-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-procurement-identifier-helper, cabo-verde-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
