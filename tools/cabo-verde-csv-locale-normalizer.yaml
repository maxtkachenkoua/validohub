schemaVersion: 1
id: cabo-verde-csv-locale-normalizer
kind: tool
module: validohub
country: CV
category: developer-tools
status: active
name:
  en: "Cabo Verdean CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Cabo Verde decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 CVE;24/07/2026;CV123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-slug-normalizer, cabo-verde-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Cabo Verde decimal, date, postal, phone, tax, and banking fields."
