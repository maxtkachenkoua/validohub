schemaVersion: 1
id: cabo-verde-document-ocr-fixer
kind: tool
module: validohub
country: CV
category: documents
status: active
name:
  en: "Cabo Verdean Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "CV-ID-123456 CV123456789 001 1234567890 1000 Praia"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-privacy-redaction-helper, cabo-verde-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
