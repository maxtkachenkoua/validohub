schemaVersion: 1
id: cabo-verde-form-field-auditor
kind: tool
module: validohub
country: CV
category: developer-tools
status: active
name:
  en: "Cabo Verdean Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=CV123456789&postal=1000 Praia&phone=+238 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-locale-number-parser, cabo-verde-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
