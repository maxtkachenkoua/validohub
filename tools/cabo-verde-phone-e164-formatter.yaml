schemaVersion: 1
id: cabo-verde-phone-e164-formatter
kind: tool
module: validohub
country: CV
category: address
status: active
name:
  en: "Cabo Verdean Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+238 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-date-locale-formatter, cabo-verde-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
