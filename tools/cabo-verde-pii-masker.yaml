schemaVersion: 1
id: cabo-verde-pii-masker
kind: tool
module: validohub
country: CV
category: privacy
status: active
name:
  en: "Cabo Verdean PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "CV-ID-123456 +238 123 456 789 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-personal-data-fixture-generator, cabo-verde-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
