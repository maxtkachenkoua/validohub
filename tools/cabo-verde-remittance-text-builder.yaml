schemaVersion: 1
id: cabo-verde-remittance-text-builder
kind: tool
module: validohub
country: CV
category: finance
status: active
name:
  en: "Cabo Verdean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 CV123456789 1,234.56 CVE"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-payment-reconciliation-helper, cabo-verde-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
