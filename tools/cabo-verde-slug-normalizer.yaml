schemaVersion: 1
id: cabo-verde-slug-normalizer
kind: tool
module: validohub
country: CV
category: developer-tools
status: active
name:
  en: "Cabo Verdean Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cabo-verde-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Cabo Verde sample company Central business district, Praia 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [cabo-verde-document-ocr-fixer, cabo-verde-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cabo Verdean Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
