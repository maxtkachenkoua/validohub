schemaVersion: 1
id: cambodia-locale-number-parser
kind: tool
module: validohub
country: KH
category: localization
status: active
name:
  en: "Cambodian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Cambodia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cambodia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234,567 KHR"
    actions: [validate, parse, format, explain]
related:
  explicit: [cambodia-calendar-week-helper, cambodia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cambodian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Cambodia."
