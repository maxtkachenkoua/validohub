schemaVersion: 1
id: cambodia-remittance-text-builder
kind: tool
module: validohub
country: KH
category: finance
status: active
name:
  en: "Cambodian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cambodia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 K001-123456789 1,234,567 KHR"
    actions: [validate, parse, format, explain]
related:
  explicit: [cambodia-payment-reconciliation-helper, cambodia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cambodian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
