schemaVersion: 1
id: cambodia-slug-normalizer
kind: tool
module: validohub
country: KH
category: developer-tools
status: active
name:
  en: "Cambodian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cambodia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Cambodia sample company Preah Monivong Blvd 1, Phnom Penh 12000"
    actions: [validate, parse, format, explain]
related:
  explicit: [cambodia-document-ocr-fixer, cambodia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cambodian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
