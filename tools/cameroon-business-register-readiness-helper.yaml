    inputs:
      - type: textarea
        name: input
        label:
          en: "REG input"
        required: true
        placeholder:
          en: "CM-REG-123456 CM123456789 Central business district, Yaounde 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [cameroon-id-card-format-helper, cameroon-passport-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cameroonian business registry Readiness Helper | ValidoHub"
  description:
    en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
