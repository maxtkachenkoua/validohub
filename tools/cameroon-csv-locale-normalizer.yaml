schemaVersion: 1
id: cameroon-csv-locale-normalizer
kind: tool
module: validohub
country: CM
category: developer-tools
status: active
name:
  en: "Cameroonian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Cameroon decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cameroon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XAF;24/07/2026;CM123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cameroon-slug-normalizer, cameroon-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cameroonian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Cameroon decimal, date, postal, phone, tax, and banking fields."
