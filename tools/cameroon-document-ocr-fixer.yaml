schemaVersion: 1
id: cameroon-document-ocr-fixer
kind: tool
module: validohub
country: CM
category: documents
status: active
name:
  en: "Cameroonian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cameroon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "CM-ID-123456 CM123456789 001 1234567890 1000 Yaounde"
    actions: [validate, parse, format, explain]
related:
  explicit: [cameroon-privacy-redaction-helper, cameroon-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cameroonian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
