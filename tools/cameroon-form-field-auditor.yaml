schemaVersion: 1
id: cameroon-form-field-auditor
kind: tool
module: validohub
country: CM
category: developer-tools
status: active
name:
  en: "Cameroonian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cameroon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=CM123456789&postal=1000 Yaounde&phone=+237 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cameroon-locale-number-parser, cameroon-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cameroonian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
