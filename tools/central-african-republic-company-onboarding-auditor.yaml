schemaVersion: 1
id: central-african-republic-company-onboarding-auditor
kind: tool
module: validohub
country: CF
category: developer-tools
status: active
name:
  en: "Central African Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.central-african-republic-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"CF\",\"taxNumber\":\"CF123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [central-african-republic-business-register-readiness-helper, central-african-republic-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Central African Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
