schemaVersion: 1
id: central-african-republic-csv-locale-normalizer
kind: tool
module: validohub
country: CF
category: developer-tools
status: active
name:
  en: "Central African CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Central African Republic decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.central-african-republic-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XAF;24/07/2026;CF123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [central-african-republic-slug-normalizer, central-african-republic-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Central African CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Central African Republic decimal, date, postal, phone, tax, and banking fields."
