  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Central African Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
