schemaVersion: 1
id: chad-csv-locale-normalizer
kind: tool
module: validohub
country: TD
category: developer-tools
status: active
name:
  en: "Chadian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Chad decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chad-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XAF;24/07/2026;TD123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [chad-slug-normalizer, chad-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chadian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Chad decimal, date, postal, phone, tax, and banking fields."
