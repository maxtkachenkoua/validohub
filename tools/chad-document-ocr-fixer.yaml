schemaVersion: 1
id: chad-document-ocr-fixer
kind: tool
module: validohub
country: TD
category: documents
status: active
name:
  en: "Chadian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chad-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "TD-ID-123456 TD123456789 001 1234567890 1000 NDjamena"
    actions: [validate, parse, format, explain]
related:
  explicit: [chad-privacy-redaction-helper, chad-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chadian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
