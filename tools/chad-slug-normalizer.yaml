schemaVersion: 1
id: chad-slug-normalizer
kind: tool
module: validohub
country: TD
category: developer-tools
status: active
name:
  en: "Chadian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chad-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Chad sample company Central business district, NDjamena 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [chad-document-ocr-fixer, chad-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chadian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
