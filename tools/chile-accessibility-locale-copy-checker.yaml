schemaVersion: 1
id: chile-accessibility-locale-copy-checker
kind: tool
module: validohub
country: CL
category: localization
status: active
name:
  en: "Chilean Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "RUN input, codigo postal input, amount 1.234 CLP"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-support-ticket-scrubber, chile-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
