schemaVersion: 1
id: chile-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: CL
category: tax
status: active
name:
  en: "Chilean Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21-07-2026 1.234 CLP CL 76.123.456-7"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-postal-code-validator, chile-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
