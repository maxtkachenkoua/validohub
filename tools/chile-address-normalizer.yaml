schemaVersion: 1
id: chile-address-normalizer
kind: tool
module: validohub
country: CL
category: address
status: active
name:
  en: "Chilean Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Av. Providencia 1234, 8320000 Santiago"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-address-transliteration-normalizer, chile-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
