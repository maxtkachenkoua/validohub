schemaVersion: 1
id: chile-bank-statement-parser
kind: tool
module: validohub
country: CL
category: finance
status: active
name:
  en: "Chilean Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21-07-2026; 1.234 CLP; CL-BANK-0123-12345678; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-masked-bank-account-formatter, chile-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
