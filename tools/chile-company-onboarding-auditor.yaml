schemaVersion: 1
id: chile-company-onboarding-auditor
kind: tool
module: validohub
country: CL
category: developer-tools
status: active
name:
  en: "Chilean Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for RUT, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"CL\",\"rut\":\"76.123.456-7\",\"account\":\"0123-12345678\",\"amount\":\"1.234\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-business-register-readiness-helper, chile-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for RUT, VAT, address, banking, and official registry handoff readiness."
