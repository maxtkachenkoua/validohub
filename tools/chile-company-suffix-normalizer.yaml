schemaVersion: 1
id: chile-company-suffix-normalizer
kind: tool
module: validohub
country: CL
category: developer-tools
status: active
name:
  en: "Chilean Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Chile Sample Holding Ltd 76.123.456-7"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-procurement-identifier-helper, chile-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
