schemaVersion: 1
id: chile-csv-locale-normalizer
kind: tool
module: validohub
country: CL
category: developer-tools
status: active
name:
  en: "Chilean CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Chile decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234 CLP;21-07-2026;CL 76.123.456-7"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-slug-normalizer, chile-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Chile decimal, date, postal, phone, tax, and banking fields."
