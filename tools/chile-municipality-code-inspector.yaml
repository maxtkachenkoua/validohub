schemaVersion: 1
id: chile-municipality-code-inspector
kind: tool
module: validohub
country: CL
category: address
status: active
name:
  en: "Chilean Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Av. Providencia 1234, 8320000 Santiago"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-phone-number-validator, chile-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
