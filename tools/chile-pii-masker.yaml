schemaVersion: 1
id: chile-pii-masker
kind: tool
module: validohub
country: CL
category: privacy
status: active
name:
  en: "Chilean PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "12.345.678-5 +56 9 1234 5678 CL-BANK-0123-12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-personal-data-fixture-generator, chile-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
