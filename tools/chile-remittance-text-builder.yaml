schemaVersion: 1
id: chile-remittance-text-builder
kind: tool
module: validohub
country: CL
category: finance
status: active
name:
  en: "Chilean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 CL 76.123.456-7 1.234 CLP"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-payment-reconciliation-helper, chile-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
