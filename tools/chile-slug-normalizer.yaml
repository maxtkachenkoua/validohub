schemaVersion: 1
id: chile-slug-normalizer
kind: tool
module: validohub
country: CL
category: developer-tools
status: active
name:
  en: "Chilean Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Chile sample company Av. Providencia 1234, 8320000 Santiago"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-document-ocr-fixer, chile-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
