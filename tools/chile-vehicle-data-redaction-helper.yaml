schemaVersion: 1
id: chile-vehicle-data-redaction-helper
kind: tool
module: validohub
country: CL
category: transport
status: active
name:
  en: "Chilean Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.chile-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "ABCD12 WVWZZZ1JZXW000001 12.345.678-5"
    actions: [validate, parse, format, explain]
related:
  explicit: [chile-customs-declaration-helper, chile-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chilean Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
