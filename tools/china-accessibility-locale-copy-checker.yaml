schemaVersion: 1
id: china-accessibility-locale-copy-checker
kind: tool
module: validohub
country: CN
category: localization
status: active
name:
  en: "Chinese Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "Resident ID boundary input, postal code input, amount 1,234.56 CNY"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-support-ticket-scrubber, china-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
