schemaVersion: 1
id: china-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: CN
category: tax
status: active
name:
  en: "Chinese Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 2026-07-21 1,234.56 CNY 91310000MA1FL0AB1C"
    actions: [generate, validate, explain]
related:
  explicit: [china-postal-code-validator, china-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
