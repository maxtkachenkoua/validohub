schemaVersion: 1
id: china-bank-account-validator
kind: tool
module: validohub
country: CN
category: finance
status: active
name:
  en: "China Bank Account Validator"
summary:
  en: "Validate local bank-account or routing shape, split bank/account blocks, and keep ownership lookup outside the browser."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "BANK input"
        required: true
        placeholder:
          en: "102100099996 6222020200001234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-bank-account-fixture-generator, china-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "China Bank Account Validator | ValidoHub"
  description:
    en: "Validate local bank-account or routing shape, split bank/account blocks, and keep ownership lookup outside the browser."
