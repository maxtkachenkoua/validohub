schemaVersion: 1
id: china-bank-statement-parser
kind: tool
module: validohub
country: CN
category: finance
status: active
name:
  en: "Chinese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026-07-21; 1,234.56 CNY; 102100099996 6222020200001234567; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-masked-bank-account-formatter, china-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
