schemaVersion: 1
id: china-company-onboarding-auditor
kind: tool
module: validohub
country: CN
category: developer-tools
status: active
name:
  en: "Chinese Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for USCC, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"CN\",\"uscc\":\"91310000MA1FL0AB1C\",\"cnaps\":\"102100099996\",\"amount\":\"1,234.56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-business-register-readiness-helper, china-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for USCC, VAT, address, banking, and official registry handoff readiness."
