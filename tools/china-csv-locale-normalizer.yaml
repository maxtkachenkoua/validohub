schemaVersion: 1
id: china-csv-locale-normalizer
kind: tool
module: validohub
country: CN
category: developer-tools
status: active
name:
  en: "Chinese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for China decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 CNY;2026-07-21;91310000MA1FL0AB1C"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-slug-normalizer, china-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for China decimal, date, postal, phone, tax, and banking fields."
