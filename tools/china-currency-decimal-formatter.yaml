schemaVersion: 1
id: china-currency-decimal-formatter
kind: tool
module: validohub
country: CN
category: finance
status: active
name:
  en: "Chinese CNY Decimal Currency Formatter"
summary:
  en: "Normalize CNY amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234.56 CNY"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-tax-rate-sanity-helper, china-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese CNY Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize CNY amount strings, decimal separators, grouping, and API-safe numeric previews."
