schemaVersion: 1
id: china-form-field-auditor
kind: tool
module: validohub
country: CN
category: developer-tools
status: active
name:
  en: "Chinese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=91310000MA1FL0AB1C&postal=100000 Beijing&phone=+86 138 0013 8000"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-locale-number-parser, china-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
