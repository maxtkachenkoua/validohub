schemaVersion: 1
id: china-integration-smoke-test-builder
kind: tool
module: validohub
country: CN
category: developer-tools
status: active
name:
  en: "Chinese Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"CN\",\"uscc\":\"91310000MA1FL0AB1C\",\"cnaps\":\"102100099996\",\"amount\":\"1,234.56\"}"
    actions: [generate, validate, explain]
related:
  explicit: [china-resident-id-boundary-validator, china-uscc-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
