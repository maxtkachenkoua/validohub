schemaVersion: 1
id: china-municipality-code-inspector
kind: tool
module: validohub
country: CN
category: address
status: active
name:
  en: "Chinese Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "1 Chang An Avenue, Beijing 100000"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-phone-number-validator, china-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
