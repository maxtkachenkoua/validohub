schemaVersion: 1
id: china-payment-reconciliation-helper
kind: tool
module: validohub
country: CN
category: finance
status: active
name:
  en: "Chinese Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "2026-07-21; 1,234.56 CNY; 102100099996 6222020200001234567; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-bank-statement-parser, china-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
