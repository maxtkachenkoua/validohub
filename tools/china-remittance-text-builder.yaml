schemaVersion: 1
id: china-remittance-text-builder
kind: tool
module: validohub
country: CN
category: finance
status: active
name:
  en: "Chinese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 91310000MA1FL0AB1C 1,234.56 CNY"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-payment-reconciliation-helper, china-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
