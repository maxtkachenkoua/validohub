schemaVersion: 1
id: china-slug-normalizer
kind: tool
module: validohub
country: CN
category: developer-tools
status: active
name:
  en: "Chinese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "China sample company 1 Chang An Avenue, Beijing 100000"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-document-ocr-fixer, china-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
