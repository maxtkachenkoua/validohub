schemaVersion: 1
id: china-tax-rate-sanity-helper
kind: tool
module: validohub
country: CN
category: tax
status: active
name:
  en: "Chinese Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.china-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "VAT / taxpayer number 20% base 1,234.56 CNY"
    actions: [validate, parse, format, explain]
related:
  explicit: [china-tax-return-field-helper, china-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Chinese Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
