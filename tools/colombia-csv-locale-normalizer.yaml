schemaVersion: 1
id: colombia-csv-locale-normalizer
kind: tool
module: validohub
country: CO
category: developer-tools
status: active
name:
  en: "Colombian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Colombia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.colombia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 COP;21/07/2026;CO 900.123.456-7"
    actions: [validate, parse, format, explain]
related:
  explicit: [colombia-slug-normalizer, colombia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Colombian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Colombia decimal, date, postal, phone, tax, and banking fields."
