schemaVersion: 1
id: colombia-data-quality-workbench
kind: tool
module: validohub
country: CO
category: developer-tools
status: active
name:
  en: "Colombian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.colombia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"CO\",\"nit\":\"900.123.456-7\",\"cufe\":\"ABCDEF1234567890\",\"amount\":\"1.234,56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [colombia-json-fixture-generator, colombia-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Colombian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
