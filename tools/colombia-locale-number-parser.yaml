schemaVersion: 1
id: colombia-locale-number-parser
kind: tool
module: validohub
country: CO
category: localization
status: active
name:
  en: "Colombian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Colombia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.colombia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 COP"
    actions: [validate, parse, format, explain]
related:
  explicit: [colombia-calendar-week-helper, colombia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Colombian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Colombia."
