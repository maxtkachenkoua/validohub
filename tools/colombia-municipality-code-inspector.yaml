capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.colombia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Carrera 7 # 12-34, 110111 Bogota"
    actions: [validate, parse, format, explain]
related:
  explicit: [colombia-phone-number-validator, colombia-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Colombian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
