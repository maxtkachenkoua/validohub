schemaVersion: 1
id: colombia-payment-reconciliation-helper
kind: tool
module: validohub
country: CO
category: finance
status: active
name:
  en: "Colombian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.colombia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 COP; CO-BANK-007-123456789; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [colombia-bank-statement-parser, colombia-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Colombian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
