schemaVersion: 1
id: colombia-remittance-text-builder
kind: tool
module: validohub
country: CO
category: finance
status: active
name:
  en: "Colombian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.colombia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 CO 900.123.456-7 1.234,56 COP"
    actions: [validate, parse, format, explain]
related:
  explicit: [colombia-payment-reconciliation-helper, colombia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Colombian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
