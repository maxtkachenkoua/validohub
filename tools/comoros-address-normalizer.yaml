schemaVersion: 1
id: comoros-address-normalizer
kind: tool
module: validohub
country: KM
category: address
status: active
name:
  en: "Comorian Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Central business district, Moroni 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-address-transliteration-normalizer, comoros-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
