    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian business registry Readiness Helper | ValidoHub"
  description:
    en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
