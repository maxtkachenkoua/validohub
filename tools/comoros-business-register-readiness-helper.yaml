    inputs:
      - type: textarea
        name: input
        label:
          en: "REG input"
        required: true
        placeholder:
          en: "KM-REG-123456 KM123456789 Central business district, Moroni 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-id-card-format-helper, comoros-passport-number-helper]
