schemaVersion: 1
id: comoros-csv-locale-normalizer
kind: tool
module: validohub
country: KM
category: developer-tools
status: active
name:
  en: "Comorian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Comoros decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 KMF;24/07/2026;KM123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-slug-normalizer, comoros-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Comoros decimal, date, postal, phone, tax, and banking fields."
