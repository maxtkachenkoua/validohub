schemaVersion: 1
id: comoros-customs-declaration-helper
kind: tool
module: validohub
country: KM
category: government
status: active
name:
  en: "Comorian Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "KM123456789 HS 8471 1,234.56 KMF"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-postal-tracking-helper, comoros-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
