schemaVersion: 1
id: comoros-form-field-auditor
kind: tool
module: validohub
country: KM
category: developer-tools
status: active
name:
  en: "Comorian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=KM123456789&postal=1000 Moroni&phone=+269 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-locale-number-parser, comoros-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
