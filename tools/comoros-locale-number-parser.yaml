schemaVersion: 1
id: comoros-locale-number-parser
kind: tool
module: validohub
country: KM
category: localization
status: active
name:
  en: "Comorian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Comoros."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 KMF"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-calendar-week-helper, comoros-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Comoros."
