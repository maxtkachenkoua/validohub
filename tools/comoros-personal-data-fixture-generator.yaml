schemaVersion: 1
id: comoros-personal-data-fixture-generator
kind: tool
module: validohub
country: KM
category: privacy
status: active
name:
  en: "Comorian Personal Data Fixture Helper"
summary:
  en: "Generate fixture-safe local identity/address/payment snippets with clear non-official boundaries."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
