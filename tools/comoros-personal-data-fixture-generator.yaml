    inputs:
      - type: textarea
        name: input
        label:
          en: "FIX input"
        required: true
        placeholder:
          en: "KM-ID-123456\\nCentral business district, Moroni 1000\\n+269 123 456 789"
    actions: [generate, validate, explain]
related:
  explicit: [comoros-driving-licence-format-helper, comoros-residence-permit-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian Personal Data Fixture Helper | ValidoHub"
  description:
    en: "Generate fixture-safe local identity/address/payment snippets with clear non-official boundaries."
