schemaVersion: 1
id: comoros-slug-normalizer
kind: tool
module: validohub
country: KM
category: developer-tools
status: active
name:
  en: "Comorian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Comoros sample company Central business district, Moroni 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-document-ocr-fixer, comoros-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
