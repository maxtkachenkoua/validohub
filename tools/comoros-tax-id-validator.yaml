schemaVersion: 1
id: comoros-tax-id-validator
kind: tool
module: validohub
country: KM
category: national-identifiers
status: active
name:
  en: "Comorian tax number / VAT boundary Validator"
summary:
  en: "Normalize tax number / VAT boundary identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.comoros-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "KM123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [comoros-customs-importer-code-helper, comoros-social-security-boundary-social-insurance-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Comorian tax number / VAT boundary Validator | ValidoHub"
  description:
    en: "Normalize tax number / VAT boundary identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
