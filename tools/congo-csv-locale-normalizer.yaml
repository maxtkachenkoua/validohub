schemaVersion: 1
id: congo-csv-locale-normalizer
kind: tool
module: validohub
country: CG
category: developer-tools
status: active
name:
  en: "Congolese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Republic of the Congo decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.congo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XAF;24/07/2026;CG123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [congo-slug-normalizer, congo-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Congolese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Republic of the Congo decimal, date, postal, phone, tax, and banking fields."
