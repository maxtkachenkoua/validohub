schemaVersion: 1
id: congo-document-ocr-fixer
kind: tool
module: validohub
country: CG
category: documents
status: active
name:
  en: "Congolese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.congo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "CG-ID-123456 CG123456789 001 1234567890 1000 Brazzaville"
    actions: [validate, parse, format, explain]
related:
  explicit: [congo-privacy-redaction-helper, congo-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Congolese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
