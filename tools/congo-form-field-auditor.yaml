schemaVersion: 1
id: congo-form-field-auditor
kind: tool
module: validohub
country: CG
category: developer-tools
status: active
name:
  en: "Congolese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.congo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=CG123456789&postal=1000 Brazzaville&phone=+242 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [congo-locale-number-parser, congo-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Congolese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
