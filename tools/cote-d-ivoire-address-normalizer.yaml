schemaVersion: 1
id: cote-d-ivoire-address-normalizer
kind: tool
module: validohub
country: CI
category: address
status: active
name:
  en: "Ivorian Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Central business district, Yamoussoukro 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-address-transliteration-normalizer, cote-d-ivoire-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
