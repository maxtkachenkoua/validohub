schemaVersion: 1
id: cote-d-ivoire-api-payload-auditor
kind: tool
module: validohub
country: CI
category: developer-tools
status: active
name:
  en: "Ivorian API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"CI\",\"taxNumber\":\"CI123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-form-field-auditor, cote-d-ivoire-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
