schemaVersion: 1
id: cote-d-ivoire-csv-locale-normalizer
kind: tool
module: validohub
country: CI
category: developer-tools
status: active
name:
  en: "Ivorian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Cote dIvoire decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;CI123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-slug-normalizer, cote-d-ivoire-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Cote dIvoire decimal, date, postal, phone, tax, and banking fields."
