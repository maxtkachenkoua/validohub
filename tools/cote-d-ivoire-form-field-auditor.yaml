schemaVersion: 1
id: cote-d-ivoire-form-field-auditor
kind: tool
module: validohub
country: CI
category: developer-tools
status: active
name:
  en: "Ivorian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=CI123456789&postal=1000 Yamoussoukro&phone=+225 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-locale-number-parser, cote-d-ivoire-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
