schemaVersion: 1
id: cote-d-ivoire-mrz-passport-parser
kind: tool
module: validohub
country: CI
category: national-identifiers
status: active
name:
  en: "Ivorian MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<CIVSAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567CIV8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-bank-account-validator, cote-d-ivoire-bank-account-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
