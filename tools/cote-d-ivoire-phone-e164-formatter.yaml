schemaVersion: 1
id: cote-d-ivoire-phone-e164-formatter
kind: tool
module: validohub
country: CI
category: address
status: active
name:
  en: "Ivorian Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+225 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-date-locale-formatter, cote-d-ivoire-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
