schemaVersion: 1
id: cote-d-ivoire-postal-code-validator
kind: tool
module: validohub
country: CI
category: address
status: active
name:
  en: "Ivorian Postal Code Validator"
summary:
  en: "Validate postal/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "1000 Yamoussoukro"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-address-normalizer, cote-d-ivoire-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
