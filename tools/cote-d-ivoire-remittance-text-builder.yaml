schemaVersion: 1
id: cote-d-ivoire-remittance-text-builder
kind: tool
module: validohub
country: CI
category: finance
status: active
name:
  en: "Ivorian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cote-d-ivoire-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 CI123456789 1,234.56 XOF"
    actions: [validate, parse, format, explain]
related:
  explicit: [cote-d-ivoire-payment-reconciliation-helper, cote-d-ivoire-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ivorian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
