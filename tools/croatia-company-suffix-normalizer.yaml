schemaVersion: 1
id: croatia-company-suffix-normalizer
kind: tool
module: validohub
country: HR
category: developer-tools
status: active
name:
  en: "Croatian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.croatia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Croatia Sample Holding Ltd 080012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [croatia-procurement-identifier-helper, croatia-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Croatian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
