schemaVersion: 1
id: croatia-csv-locale-normalizer
kind: tool
module: validohub
country: HR
category: developer-tools
status: active
name:
  en: "Croatian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Croatia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.croatia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 EUR;21.07.2026;HR12345678903"
    actions: [validate, parse, format, explain]
related:
  explicit: [croatia-slug-normalizer, croatia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Croatian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Croatia decimal, date, postal, phone, tax, and banking fields."
