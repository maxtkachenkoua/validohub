schemaVersion: 1
id: croatia-form-field-auditor
kind: tool
module: validohub
country: HR
category: developer-tools
status: active
name:
  en: "Croatian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.croatia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=HR12345678903&postal=10000 Zagreb&phone=+385 91 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [croatia-locale-number-parser, croatia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Croatian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
