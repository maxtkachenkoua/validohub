schemaVersion: 1
id: croatia-locale-number-parser
kind: tool
module: validohub
country: HR
category: localization
status: active
name:
  en: "Croatian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Croatia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.croatia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [croatia-calendar-week-helper, croatia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Croatian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Croatia."
