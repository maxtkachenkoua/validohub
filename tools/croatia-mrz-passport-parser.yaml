schemaVersion: 1
id: croatia-mrz-passport-parser
kind: tool
module: validohub
country: HR
category: national-identifiers
status: active
name:
  en: "Croatian MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.croatia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<HRVSAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567HRV8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [croatia-iban-validator, croatia-iban-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Croatian MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
