schemaVersion: 1
id: croatia-postal-code-validator
kind: tool
module: validohub
country: HR
category: address
status: active
name:
  en: "Croatian Postal Code Validator"
summary:
  en: "Validate postanski broj shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.croatia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "10000 Zagreb"
    actions: [validate, parse, format, explain]
related:
  explicit: [croatia-address-normalizer, croatia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Croatian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postanski broj shape, split area/delivery hints, and preserve official postal lookup boundaries."
