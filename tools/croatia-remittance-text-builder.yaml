schemaVersion: 1
id: croatia-remittance-text-builder
kind: tool
module: validohub
country: HR
category: finance
status: active
name:
  en: "Croatian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.croatia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 HR12345678903 1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [croatia-payment-reconciliation-helper, croatia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Croatian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
