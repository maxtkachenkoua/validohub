schemaVersion: 1
id: cyprus-api-payload-auditor
kind: tool
module: validohub
country: CY
category: developer-tools
status: active
name:
  en: "Cypriot API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cyprus-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"CY\",\"vat\":\"CY12345678L\",\"iban\":\"CY17002001280000001200527600\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [cyprus-form-field-auditor, cyprus-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cypriot API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
