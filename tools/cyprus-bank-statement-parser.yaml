schemaVersion: 1
id: cyprus-bank-statement-parser
kind: tool
module: validohub
country: CY
category: finance
status: active
name:
  en: "Cypriot Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cyprus-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 EUR; CY17002001280000001200527600; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [cyprus-masked-iban-formatter, cyprus-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cypriot Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
