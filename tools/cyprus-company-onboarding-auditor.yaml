schemaVersion: 1
id: cyprus-company-onboarding-auditor
kind: tool
module: validohub
country: CY
category: developer-tools
status: active
name:
  en: "Cypriot Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for HE company number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cyprus-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"CY\",\"vat\":\"CY12345678L\",\"iban\":\"CY17002001280000001200527600\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [cyprus-business-register-readiness-helper, cyprus-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cypriot Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for HE company number, VAT, address, banking, and official registry handoff readiness."
