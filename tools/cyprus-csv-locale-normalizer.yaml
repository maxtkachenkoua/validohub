schemaVersion: 1
id: cyprus-csv-locale-normalizer
kind: tool
module: validohub
country: CY
category: developer-tools
status: active
name:
  en: "Cypriot CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Cyprus decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cyprus-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 EUR;21/07/2026;CY12345678L"
    actions: [validate, parse, format, explain]
related:
  explicit: [cyprus-slug-normalizer, cyprus-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cypriot CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Cyprus decimal, date, postal, phone, tax, and banking fields."
