schemaVersion: 1
id: cyprus-locale-number-parser
kind: tool
module: validohub
country: CY
category: localization
status: active
name:
  en: "Cypriot Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Cyprus."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cyprus-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [cyprus-calendar-week-helper, cyprus-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cypriot Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Cyprus."
