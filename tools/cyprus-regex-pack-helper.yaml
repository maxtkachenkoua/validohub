schemaVersion: 1
id: cyprus-regex-pack-helper
kind: tool
module: validohub
country: CY
category: developer-tools
status: active
name:
  en: "Cypriot Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cyprus-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Civil ID HE company number postal code  CY17002001280000001200527600"
    actions: [validate, parse, format, explain]
related:
  explicit: [cyprus-api-payload-auditor, cyprus-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cypriot Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
