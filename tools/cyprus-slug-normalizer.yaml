schemaVersion: 1
id: cyprus-slug-normalizer
kind: tool
module: validohub
country: CY
category: developer-tools
status: active
name:
  en: "Cypriot Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.cyprus-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Cyprus sample company Ledras 1, 1010 Nicosia"
    actions: [validate, parse, format, explain]
related:
  explicit: [cyprus-document-ocr-fixer, cyprus-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Cypriot Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
