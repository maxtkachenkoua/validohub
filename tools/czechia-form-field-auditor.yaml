schemaVersion: 1
id: czechia-form-field-auditor
kind: tool
module: validohub
country: CZ
category: developer-tools
status: active
name:
  en: "Czech Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.czechia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=CZ27074358&postal=110 00 Praha 1&phone=+420 777 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [czechia-locale-number-parser, czechia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Czech Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
