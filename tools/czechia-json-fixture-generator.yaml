    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Czech JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
