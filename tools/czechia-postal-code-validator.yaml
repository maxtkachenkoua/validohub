schemaVersion: 1
id: czechia-postal-code-validator
kind: tool
module: validohub
country: CZ
category: address
status: active
name:
  en: "Czech Postal Code Validator"
summary:
  en: "Validate PSC shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.czechia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "110 00 Praha 1"
    actions: [validate, parse, format, explain]
related:
  explicit: [czechia-address-normalizer, czechia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Czech Postal Code Validator | ValidoHub"
  description:
    en: "Validate PSC shape, split area/delivery hints, and preserve official postal lookup boundaries."
