capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.czechia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Rodne cislo ICO PSC  CZ6508000000192000145399"
    actions: [validate, parse, format, explain]
related:
  explicit: [czechia-api-payload-auditor, czechia-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Czech Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
