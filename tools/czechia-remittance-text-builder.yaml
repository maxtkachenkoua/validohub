schemaVersion: 1
id: czechia-remittance-text-builder
kind: tool
module: validohub
country: CZ
category: finance
status: active
name:
  en: "Czech Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.czechia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 CZ27074358 1 234,56 CZK"
    actions: [validate, parse, format, explain]
related:
  explicit: [czechia-payment-reconciliation-helper, czechia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Czech Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
