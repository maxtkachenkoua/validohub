schemaVersion: 1
id: czechia-slug-normalizer
kind: tool
module: validohub
country: CZ
category: developer-tools
status: active
name:
  en: "Czech Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.czechia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Czechia sample company Vaclavske namesti 1, 110 00 Praha 1"
    actions: [validate, parse, format, explain]
related:
  explicit: [czechia-document-ocr-fixer, czechia-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Czech Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
