summary:
  en: "Normalize CSV snippets for Democratic Republic of the Congo decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.democratic-republic-of-the-congo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 CDF;24/07/2026;CD123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [democratic-republic-of-the-congo-slug-normalizer, democratic-republic-of-the-congo-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Congolese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Democratic Republic of the Congo decimal, date, postal, phone, tax, and banking fields."
