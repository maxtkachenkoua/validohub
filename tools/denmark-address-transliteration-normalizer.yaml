schemaVersion: 1
id: denmark-address-transliteration-normalizer
kind: tool
module: validohub
country: DK
category: address
status: active
name:
  en: "Danish Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Nyhavn 1, 1051 Copenhagen K"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-region-code-mapper, denmark-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
