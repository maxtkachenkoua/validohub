schemaVersion: 1
id: denmark-api-payload-auditor
kind: tool
module: validohub
country: DK
category: developer-tools
status: active
name:
  en: "Danish API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"DK\",\"cvr\":\"12345674\",\"vat\":\"DK12345674\",\"iban\":\"DK5000400440116243\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-form-field-auditor, denmark-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
