schemaVersion: 1
id: denmark-company-onboarding-auditor
kind: tool
module: validohub
country: DK
category: developer-tools
status: active
name:
  en: "Danish Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for CVR, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"DK\",\"cvr\":\"12345674\",\"vat\":\"DK12345674\",\"iban\":\"DK5000400440116243\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-business-register-readiness-helper, denmark-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for CVR, VAT, address, banking, and official registry handoff readiness."
