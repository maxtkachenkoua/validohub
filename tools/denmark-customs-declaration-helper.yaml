    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect EORI, VAT, invoice, amount, HS-code, and border handoff evidence without official filing."
