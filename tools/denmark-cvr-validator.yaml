schemaVersion: 1
id: denmark-cvr-validator
kind: tool
module: validohub
country: DK
category: national-identifiers
status: active
name:
  en: "Danish CVR Validator"
summary:
  en: "Inspect CVR structure, registry-style prefixes, control digits, and official lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ORG input"
        required: true
        placeholder:
          en: "12345674"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-vat-id-validator, denmark-eori-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish CVR Validator | ValidoHub"
  description:
    en: "Inspect CVR structure, registry-style prefixes, control digits, and official lookup boundaries."
