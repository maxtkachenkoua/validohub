schemaVersion: 1
id: denmark-data-quality-workbench
kind: tool
module: validohub
country: DK
category: developer-tools
status: active
name:
  en: "Danish Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"DK\",\"cvr\":\"12345674\",\"vat\":\"DK12345674\",\"iban\":\"DK5000400440116243\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-json-fixture-generator, denmark-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
