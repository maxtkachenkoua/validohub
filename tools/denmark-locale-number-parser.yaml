schemaVersion: 1
id: denmark-locale-number-parser
kind: tool
module: validohub
country: DK
category: localization
status: active
name:
  en: "Danish Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Denmark."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 DKK"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-calendar-week-helper, denmark-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Denmark."
