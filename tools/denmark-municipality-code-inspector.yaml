schemaVersion: 1
id: denmark-municipality-code-inspector
kind: tool
module: validohub
country: DK
category: address
status: active
name:
  en: "Danish Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Nyhavn 1, 1051 Copenhagen K"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-phone-number-validator, denmark-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
