schemaVersion: 1
id: denmark-pii-masker
kind: tool
module: validohub
country: DK
category: privacy
status: active
name:
  en: "Danish PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "010185-1234 +45 12 34 56 78 DK5000400440116243"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-personal-data-fixture-generator, denmark-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
