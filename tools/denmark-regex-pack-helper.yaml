schemaVersion: 1
id: denmark-regex-pack-helper
kind: tool
module: validohub
country: DK
category: developer-tools
status: active
name:
  en: "Danish Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "CPR CVR postnummer  DK5000400440116243"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-api-payload-auditor, denmark-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
