schemaVersion: 1
id: denmark-slug-normalizer
kind: tool
module: validohub
country: DK
category: developer-tools
status: active
name:
  en: "Danish Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Denmark sample company Nyhavn 1, 1051 Copenhagen K"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-document-ocr-fixer, denmark-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
