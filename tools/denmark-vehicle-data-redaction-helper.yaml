schemaVersion: 1
id: denmark-vehicle-data-redaction-helper
kind: tool
module: validohub
country: DK
category: transport
status: active
name:
  en: "Danish Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.denmark-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "AB 12 345 WVWZZZ1JZXW000001 010185-1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [denmark-customs-declaration-helper, denmark-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Danish Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
