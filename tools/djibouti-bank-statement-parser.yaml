schemaVersion: 1
id: djibouti-bank-statement-parser
kind: tool
module: validohub
country: DJ
category: finance
status: active
name:
  en: "Djiboutian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "24/07/2026; 1,234.56 DJF; 001 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-masked-bank-account-formatter, djibouti-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
