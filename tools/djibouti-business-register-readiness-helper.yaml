schemaVersion: 1
id: djibouti-business-register-readiness-helper
kind: tool
module: validohub
country: DJ
category: government
status: active
name:
  en: "Djiboutian business registry Readiness Helper"
summary:
  en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REG input"
        required: true
        placeholder:
          en: "DJ-REG-123456 DJ123456789 Central business district, Djibouti 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-id-card-format-helper, djibouti-passport-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian business registry Readiness Helper | ValidoHub"
  description:
    en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
