schemaVersion: 1
id: djibouti-csv-locale-normalizer
kind: tool
module: validohub
country: DJ
category: developer-tools
status: active
name:
  en: "Djiboutian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Djibouti decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 DJF;24/07/2026;DJ123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-slug-normalizer, djibouti-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Djibouti decimal, date, postal, phone, tax, and banking fields."
