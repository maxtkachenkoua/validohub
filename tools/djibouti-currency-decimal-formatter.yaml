schemaVersion: 1
id: djibouti-currency-decimal-formatter
kind: tool
module: validohub
country: DJ
category: finance
status: active
name:
  en: "Djiboutian DJF Decimal Currency Formatter"
summary:
  en: "Normalize DJF amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234.56 DJF"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-tax-rate-sanity-helper, djibouti-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian DJF Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize DJF amount strings, decimal separators, grouping, and API-safe numeric previews."
