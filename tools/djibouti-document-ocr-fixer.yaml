schemaVersion: 1
id: djibouti-document-ocr-fixer
kind: tool
module: validohub
country: DJ
category: documents
status: active
name:
  en: "Djiboutian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "DJ-ID-123456 DJ123456789 001 1234567890 1000 Djibouti"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-privacy-redaction-helper, djibouti-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
