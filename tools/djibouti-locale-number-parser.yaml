schemaVersion: 1
id: djibouti-locale-number-parser
kind: tool
module: validohub
country: DJ
category: localization
status: active
name:
  en: "Djiboutian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Djibouti."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 DJF"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-calendar-week-helper, djibouti-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Djibouti."
