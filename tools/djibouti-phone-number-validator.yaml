schemaVersion: 1
id: djibouti-phone-number-validator
kind: tool
module: validohub
country: DJ
category: address
status: active
name:
  en: "Djiboutian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+253 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-phone-e164-formatter, djibouti-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
