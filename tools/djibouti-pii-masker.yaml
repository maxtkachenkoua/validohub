schemaVersion: 1
id: djibouti-pii-masker
kind: tool
module: validohub
country: DJ
category: privacy
status: active
name:
  en: "Djiboutian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "DJ-ID-123456 +253 123 456 789 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-personal-data-fixture-generator, djibouti-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
