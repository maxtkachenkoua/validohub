schemaVersion: 1
id: djibouti-regex-pack-helper
kind: tool
module: validohub
country: DJ
category: developer-tools
status: active
name:
  en: "Djiboutian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.djibouti-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "national ID boundary company registration number postal/address code  001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [djibouti-api-payload-auditor, djibouti-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Djiboutian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
