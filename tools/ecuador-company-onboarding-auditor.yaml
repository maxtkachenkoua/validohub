schemaVersion: 1
id: ecuador-company-onboarding-auditor
kind: tool
module: validohub
country: EC
category: developer-tools
status: active
name:
  en: "Ecuadorian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for RUC, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"EC\",\"ruc\":\"1790012345001\",\"claveAcceso\":\"2107202601179001234500120010010000000011234567819\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-business-register-readiness-helper, ecuador-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for RUC, VAT, address, banking, and official registry handoff readiness."
