schemaVersion: 1
id: ecuador-company-suffix-normalizer
kind: tool
module: validohub
country: EC
category: developer-tools
status: active
name:
  en: "Ecuadorian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Ecuador Sample Holding Ltd 1790012345001"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-procurement-identifier-helper, ecuador-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
