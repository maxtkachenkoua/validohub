  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian USD Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize USD amount strings, decimal separators, grouping, and API-safe numeric previews."
