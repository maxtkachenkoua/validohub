schemaVersion: 1
id: ecuador-document-ocr-fixer
kind: tool
module: validohub
country: EC
category: documents
status: active
name:
  en: "Ecuadorian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "1710034065 EC RUC 1790012345001 EC-BANK-010-1234567890 170150 Quito"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-gdpr-redaction-helper, ecuador-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
