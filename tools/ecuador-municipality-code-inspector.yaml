schemaVersion: 1
id: ecuador-municipality-code-inspector
kind: tool
module: validohub
country: EC
category: address
status: active
name:
  en: "Ecuadorian Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Av. Amazonas N34-123, 170150 Quito"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-phone-number-validator, ecuador-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
