schemaVersion: 1
id: ecuador-pii-masker
kind: tool
module: validohub
country: EC
category: privacy
status: active
name:
  en: "Ecuadorian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "1710034065 +593 99 123 4567 EC-BANK-010-1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-personal-data-fixture-generator, ecuador-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
