schemaVersion: 1
id: ecuador-regex-pack-helper
kind: tool
module: validohub
country: EC
category: developer-tools
status: active
name:
  en: "Ecuadorian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "cedula RUC codigo postal  EC-BANK-010-1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-api-payload-auditor, ecuador-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
