schemaVersion: 1
id: ecuador-remittance-text-builder
kind: tool
module: validohub
country: EC
category: finance
status: active
name:
  en: "Ecuadorian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 EC RUC 1790012345001 1,234.56 USD"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-payment-reconciliation-helper, ecuador-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
