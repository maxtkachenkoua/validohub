schemaVersion: 1
id: ecuador-support-ticket-scrubber
kind: tool
module: validohub
country: EC
category: privacy
status: active
name:
  en: "Ecuadorian Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ecuador-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 1710034065, EC-BANK-010-1234567890, Av. Amazonas N34-123, 170150 Quito"
    actions: [validate, parse, format, explain]
related:
  explicit: [ecuador-integration-smoke-test-builder, ecuador-cedula-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
