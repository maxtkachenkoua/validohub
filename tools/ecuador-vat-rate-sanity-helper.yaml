    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ecuadorian VAT Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
