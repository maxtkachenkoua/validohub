schemaVersion: 1
id: egypt-csv-locale-normalizer
kind: tool
module: validohub
country: EG
category: developer-tools
status: active
name:
  en: "Egyptian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Egypt decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.egypt-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 EGP;24/07/2026;EG123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [egypt-slug-normalizer, egypt-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Egyptian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Egypt decimal, date, postal, phone, tax, and banking fields."
