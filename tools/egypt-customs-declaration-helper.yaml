capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.egypt-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "EG123456789 HS 8471 1,234.56 EGP"
    actions: [validate, parse, format, explain]
related:
  explicit: [egypt-postal-tracking-helper, egypt-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Egyptian Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
