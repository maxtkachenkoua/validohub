schemaVersion: 1
id: egypt-document-ocr-fixer
kind: tool
module: validohub
country: EG
category: documents
status: active
name:
  en: "Egyptian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.egypt-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "EG-ID-123456 EG123456789 001 1234567890 1000 Cairo"
    actions: [validate, parse, format, explain]
related:
  explicit: [egypt-privacy-redaction-helper, egypt-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Egyptian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
