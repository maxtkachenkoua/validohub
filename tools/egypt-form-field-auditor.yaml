schemaVersion: 1
id: egypt-form-field-auditor
kind: tool
module: validohub
country: EG
category: developer-tools
status: active
name:
  en: "Egyptian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.egypt-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=EG123456789&postal=1000 Cairo&phone=+20 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [egypt-locale-number-parser, egypt-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Egyptian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
