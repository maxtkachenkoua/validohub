schemaVersion: 1
id: egypt-locale-number-parser
kind: tool
module: validohub
country: EG
category: localization
status: active
name:
  en: "Egyptian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Egypt."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.egypt-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 EGP"
    actions: [validate, parse, format, explain]
related:
  explicit: [egypt-calendar-week-helper, egypt-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Egyptian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Egypt."
