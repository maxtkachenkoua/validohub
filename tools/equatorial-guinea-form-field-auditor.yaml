schemaVersion: 1
id: equatorial-guinea-form-field-auditor
kind: tool
module: validohub
country: GQ
category: developer-tools
status: active
name:
  en: "Equatoguinean Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.equatorial-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=GQ123456789&postal=1000 Malabo&phone=+240 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [equatorial-guinea-locale-number-parser, equatorial-guinea-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Equatoguinean Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
