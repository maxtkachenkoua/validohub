schemaVersion: 1
id: equatorial-guinea-phone-number-validator
kind: tool
module: validohub
country: GQ
category: address
status: active
name:
  en: "Equatoguinean Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.equatorial-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+240 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [equatorial-guinea-phone-e164-formatter, equatorial-guinea-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Equatoguinean Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
