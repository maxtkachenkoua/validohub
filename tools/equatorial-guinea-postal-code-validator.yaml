schemaVersion: 1
id: equatorial-guinea-postal-code-validator
kind: tool
module: validohub
country: GQ
category: address
status: active
name:
  en: "Equatoguinean Postal Code Validator"
summary:
  en: "Validate postal/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.equatorial-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "1000 Malabo"
    actions: [validate, parse, format, explain]
related:
  explicit: [equatorial-guinea-address-normalizer, equatorial-guinea-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Equatoguinean Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
