schemaVersion: 1
id: eritrea-company-suffix-normalizer
kind: tool
module: validohub
country: ER
category: developer-tools
status: active
name:
  en: "Eritrean Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eritrea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Eritrea Sample Holding Ltd ER-REG-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [eritrea-procurement-identifier-helper, eritrea-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Eritrean Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
