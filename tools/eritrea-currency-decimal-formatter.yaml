  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Eritrean ERN Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize ERN amount strings, decimal separators, grouping, and API-safe numeric previews."
