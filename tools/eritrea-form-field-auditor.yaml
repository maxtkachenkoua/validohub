schemaVersion: 1
id: eritrea-form-field-auditor
kind: tool
module: validohub
country: ER
category: developer-tools
status: active
name:
  en: "Eritrean Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eritrea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=ER123456789&postal=1000 Asmara&phone=+291 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [eritrea-locale-number-parser, eritrea-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Eritrean Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
