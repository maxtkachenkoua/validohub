schemaVersion: 1
id: eritrea-remittance-text-builder
kind: tool
module: validohub
country: ER
category: finance
status: active
name:
  en: "Eritrean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eritrea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 ER123456789 1,234.56 ERN"
    actions: [validate, parse, format, explain]
related:
  explicit: [eritrea-payment-reconciliation-helper, eritrea-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Eritrean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
