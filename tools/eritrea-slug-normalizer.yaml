schemaVersion: 1
id: eritrea-slug-normalizer
kind: tool
module: validohub
country: ER
category: developer-tools
status: active
name:
  en: "Eritrean Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eritrea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Eritrea sample company Central business district, Asmara 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [eritrea-document-ocr-fixer, eritrea-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Eritrean Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
