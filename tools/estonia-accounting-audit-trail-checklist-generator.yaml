schemaVersion: 1
id: estonia-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: EE
category: tax
status: active
name:
  en: "Estonian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21.07.2026 1 234,56 EUR EE123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-postal-code-validator, estonia-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
