schemaVersion: 1
id: estonia-company-onboarding-auditor
kind: tool
module: validohub
country: EE
category: developer-tools
status: active
name:
  en: "Estonian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for registry code, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"EE\",\"isikukood\":\"38501010018\",\"iban\":\"EE382200221020145685\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-business-register-readiness-helper, estonia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for registry code, VAT, address, banking, and official registry handoff readiness."
