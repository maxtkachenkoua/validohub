schemaVersion: 1
id: estonia-csv-locale-normalizer
kind: tool
module: validohub
country: EE
category: developer-tools
status: active
name:
  en: "Estonian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Estonia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 EUR;21.07.2026;EE123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-slug-normalizer, estonia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Estonia decimal, date, postal, phone, tax, and banking fields."
