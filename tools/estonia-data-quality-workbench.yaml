schemaVersion: 1
id: estonia-data-quality-workbench
kind: tool
module: validohub
country: EE
category: developer-tools
status: active
name:
  en: "Estonian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"EE\",\"isikukood\":\"38501010018\",\"iban\":\"EE382200221020145685\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-json-fixture-generator, estonia-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
