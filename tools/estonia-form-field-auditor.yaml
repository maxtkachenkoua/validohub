schemaVersion: 1
id: estonia-form-field-auditor
kind: tool
module: validohub
country: EE
category: developer-tools
status: active
name:
  en: "Estonian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=EE123456789&postal=10111 Tallinn&phone=+372 5123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-locale-number-parser, estonia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
