schemaVersion: 1
id: estonia-pii-masker
kind: tool
module: validohub
country: EE
category: privacy
status: active
name:
  en: "Estonian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "38501010018 +372 5123 4567 EE382200221020145685"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-personal-data-fixture-generator, estonia-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
