schemaVersion: 1
id: estonia-regex-pack-helper
kind: tool
module: validohub
country: EE
category: developer-tools
status: active
name:
  en: "Estonian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Isikukood registry code postal code  EE382200221020145685"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-api-payload-auditor, estonia-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
