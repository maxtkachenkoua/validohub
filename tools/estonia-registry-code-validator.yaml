schemaVersion: 1
id: estonia-registry-code-validator
kind: tool
module: validohub
country: EE
category: national-identifiers
status: active
name:
  en: "Estonian registry code Validator"
summary:
  en: "Inspect registry code structure, registry-style prefixes, control digits, and official lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ORG input"
        required: true
        placeholder:
          en: "12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-vat-id-validator, estonia-eori-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian registry code Validator | ValidoHub"
  description:
    en: "Inspect registry code structure, registry-style prefixes, control digits, and official lookup boundaries."
