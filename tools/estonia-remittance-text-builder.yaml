schemaVersion: 1
id: estonia-remittance-text-builder
kind: tool
module: validohub
country: EE
category: finance
status: active
name:
  en: "Estonian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 EE123456789 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-payment-reconciliation-helper, estonia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
