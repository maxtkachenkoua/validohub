schemaVersion: 1
id: estonia-slug-normalizer
kind: tool
module: validohub
country: EE
category: developer-tools
status: active
name:
  en: "Estonian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.estonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Estonia sample company Viru 1, 10111 Tallinn"
    actions: [validate, parse, format, explain]
related:
  explicit: [estonia-document-ocr-fixer, estonia-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Estonian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
