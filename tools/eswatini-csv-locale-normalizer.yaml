schemaVersion: 1
id: eswatini-csv-locale-normalizer
kind: tool
module: validohub
country: SZ
category: developer-tools
status: active
name:
  en: "Swazi CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Eswatini decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eswatini-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 SZL;24/07/2026;SZ123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [eswatini-slug-normalizer, eswatini-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swazi CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Eswatini decimal, date, postal, phone, tax, and banking fields."
