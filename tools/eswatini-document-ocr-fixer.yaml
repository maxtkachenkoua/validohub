schemaVersion: 1
id: eswatini-document-ocr-fixer
kind: tool
module: validohub
country: SZ
category: documents
status: active
name:
  en: "Swazi Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eswatini-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "SZ-ID-123456 SZ123456789 001 1234567890 1000 Mbabane"
    actions: [validate, parse, format, explain]
related:
  explicit: [eswatini-privacy-redaction-helper, eswatini-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swazi Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
