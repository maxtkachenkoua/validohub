schemaVersion: 1
id: eswatini-form-field-auditor
kind: tool
module: validohub
country: SZ
category: developer-tools
status: active
name:
  en: "Swazi Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eswatini-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SZ123456789&postal=1000 Mbabane&phone=+268 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [eswatini-locale-number-parser, eswatini-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swazi Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
