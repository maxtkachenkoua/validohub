schemaVersion: 1
id: eswatini-slug-normalizer
kind: tool
module: validohub
country: SZ
category: developer-tools
status: active
name:
  en: "Swazi Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.eswatini-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Eswatini sample company Central business district, Mbabane 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [eswatini-document-ocr-fixer, eswatini-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swazi Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
