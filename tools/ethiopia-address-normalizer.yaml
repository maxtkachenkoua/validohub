schemaVersion: 1
id: ethiopia-address-normalizer
kind: tool
module: validohub
country: ET
category: address
status: active
name:
  en: "Ethiopian Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ethiopia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Central business district, Addis Ababa 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [ethiopia-address-transliteration-normalizer, ethiopia-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ethiopian Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
