    inputs:
      - type: textarea
        name: input
        label:
          en: "REG input"
        required: true
        placeholder:
          en: "ET-REG-123456 ET123456789 Central business district, Addis Ababa 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [ethiopia-id-card-format-helper, ethiopia-passport-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ethiopian business registry Readiness Helper | ValidoHub"
  description:
    en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
