    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ethiopian ETB Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize ETB amount strings, decimal separators, grouping, and API-safe numeric previews."
