schemaVersion: 1
id: ethiopia-form-field-auditor
kind: tool
module: validohub
country: ET
category: developer-tools
status: active
name:
  en: "Ethiopian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ethiopia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=ET123456789&postal=1000 Addis Ababa&phone=+251 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [ethiopia-locale-number-parser, ethiopia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ethiopian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
