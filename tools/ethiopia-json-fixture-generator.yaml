schemaVersion: 1
id: ethiopia-json-fixture-generator
kind: tool
module: validohub
country: ET
category: developer-tools
status: active
name:
  en: "Ethiopian JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.ethiopia-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"ET\",\"taxNumber\":\"ET123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [ethiopia-regex-pack-helper, ethiopia-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ethiopian JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
