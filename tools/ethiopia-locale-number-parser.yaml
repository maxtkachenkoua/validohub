schemaVersion: 1
id: ethiopia-locale-number-parser
kind: tool
module: validohub
country: ET
category: localization
status: active
name:
  en: "Ethiopian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Ethiopia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ethiopia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 ETB"
    actions: [validate, parse, format, explain]
related:
  explicit: [ethiopia-calendar-week-helper, ethiopia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ethiopian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Ethiopia."
