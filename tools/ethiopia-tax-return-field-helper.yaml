schemaVersion: 1
id: ethiopia-tax-return-field-helper
kind: tool
module: validohub
country: ET
category: tax
status: active
name:
  en: "Ethiopian Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ethiopia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "tax number / VAT boundary; ET123456789; period 2026-07; 1,234.56 ETB"
    actions: [validate, parse, format, explain]
related:
  explicit: [ethiopia-invoice-number-helper, ethiopia-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ethiopian Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
