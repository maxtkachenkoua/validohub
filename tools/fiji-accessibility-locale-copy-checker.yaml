schemaVersion: 1
id: fiji-accessibility-locale-copy-checker
kind: tool
module: validohub
country: FJ
category: localization
status: active
name:
  en: "Fijian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.fiji-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "TIN boundary input, postal/locality input, amount 1,234.56 FJD"
    actions: [validate, parse, format, explain]
related:
  explicit: [fiji-support-ticket-scrubber, fiji-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Fijian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
