schemaVersion: 1
id: fiji-document-ocr-fixer
kind: tool
module: validohub
country: FJ
category: documents
status: active
name:
  en: "Fijian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.fiji-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "FJ-TIN-123456 FJ123456789 001 1234567890 Suva"
    actions: [validate, parse, format, explain]
related:
  explicit: [fiji-privacy-redaction-helper, fiji-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Fijian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
