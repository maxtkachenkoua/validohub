schemaVersion: 1
id: fiji-form-field-auditor
kind: tool
module: validohub
country: FJ
category: developer-tools
status: active
name:
  en: "Fijian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.fiji-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=FJ123456789&postal=Suva&phone=+679 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [fiji-locale-number-parser, fiji-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Fijian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
