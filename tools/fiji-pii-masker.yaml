schemaVersion: 1
id: fiji-pii-masker
kind: tool
module: validohub
country: FJ
category: privacy
status: active
name:
  en: "Fijian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.fiji-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "FJ-TIN-123456 +679 123 4567 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [fiji-personal-data-fixture-generator, fiji-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Fijian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
