schemaVersion: 1
id: fiji-postal-code-validator
kind: tool
module: validohub
country: FJ
category: address
status: active
name:
  en: "Fijian Postal Code Validator"
summary:
  en: "Validate postal/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.fiji-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "Suva"
    actions: [validate, parse, format, explain]
related:
  explicit: [fiji-address-normalizer, fiji-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Fijian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
