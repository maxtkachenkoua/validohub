schemaVersion: 1
id: fiji-regex-pack-helper
kind: tool
module: validohub
country: FJ
category: developer-tools
status: active
name:
  en: "Fijian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.fiji-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "TIN boundary company registration number postal/locality  001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [fiji-api-payload-auditor, fiji-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Fijian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
