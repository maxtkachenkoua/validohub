schemaVersion: 1
id: finland-address-normalizer
kind: tool
module: validohub
country: FI
category: address
status: active
name:
  en: "Finnish Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Mannerheimintie 1, 00100 Helsinki"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-address-transliteration-normalizer, finland-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
