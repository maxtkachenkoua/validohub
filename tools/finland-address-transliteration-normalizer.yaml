schemaVersion: 1
id: finland-address-transliteration-normalizer
kind: tool
module: validohub
country: FI
category: address
status: active
name:
  en: "Finnish Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Mannerheimintie 1, 00100 Helsinki"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-region-code-mapper, finland-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
