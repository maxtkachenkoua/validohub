schemaVersion: 1
id: finland-bank-statement-parser
kind: tool
module: validohub
country: FI
category: finance
status: active
name:
  en: "Finnish Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.7.2026; 1 234,56 EUR; FI2112345600000785; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-masked-iban-formatter, finland-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
