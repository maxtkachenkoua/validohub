schemaVersion: 1
id: finland-company-suffix-normalizer
kind: tool
module: validohub
country: FI
category: developer-tools
status: active
name:
  en: "Finnish Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Finland Sample Holding Ltd 1234567-1"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-procurement-identifier-helper, finland-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
