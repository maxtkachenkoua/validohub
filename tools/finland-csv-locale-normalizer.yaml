schemaVersion: 1
id: finland-csv-locale-normalizer
kind: tool
module: validohub
country: FI
category: developer-tools
status: active
name:
  en: "Finnish CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Finland decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 EUR;21.7.2026;FI12345671"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-slug-normalizer, finland-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Finland decimal, date, postal, phone, tax, and banking fields."
