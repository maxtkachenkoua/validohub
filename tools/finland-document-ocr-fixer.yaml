schemaVersion: 1
id: finland-document-ocr-fixer
kind: tool
module: validohub
country: FI
category: documents
status: active
name:
  en: "Finnish Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "010185-123B FI12345671 FI2112345600000785 00100 Helsinki"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-gdpr-redaction-helper, finland-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
