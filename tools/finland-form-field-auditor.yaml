schemaVersion: 1
id: finland-form-field-auditor
kind: tool
module: validohub
country: FI
category: developer-tools
status: active
name:
  en: "Finnish Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=FI12345671&postal=00100 Helsinki&phone=+358 40 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-locale-number-parser, finland-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
