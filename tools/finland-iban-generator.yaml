schemaVersion: 1
id: finland-iban-generator
kind: tool
module: validohub
country: FI
category: finance
status: active
name:
  en: "Finland IBAN Generator"
summary:
  en: "Generate FI IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "IBG input"
        required: true
        placeholder:
          en: "12345600000785"
    actions: [generate, validate, explain]
related:
  explicit: [finland-bank-account-inspector, finland-bic-swift-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finland IBAN Generator | ValidoHub"
  description:
    en: "Generate FI IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
