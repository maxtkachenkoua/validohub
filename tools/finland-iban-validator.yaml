  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finland IBAN Validator | ValidoHub"
  description:
    en: "Validate FI IBAN shape, replay MOD-97 evidence, and split bank/account blocks for debugging."
