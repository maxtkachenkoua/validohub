schemaVersion: 1
id: finland-municipality-code-inspector
kind: tool
module: validohub
country: FI
category: address
status: active
name:
  en: "Finnish Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Mannerheimintie 1, 00100 Helsinki"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-phone-number-validator, finland-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
