schemaVersion: 1
id: finland-payment-reconciliation-helper
kind: tool
module: validohub
country: FI
category: finance
status: active
name:
  en: "Finnish Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.7.2026; 1 234,56 EUR; FI2112345600000785; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-bank-statement-parser, finland-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
