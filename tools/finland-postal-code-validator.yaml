schemaVersion: 1
id: finland-postal-code-validator
kind: tool
module: validohub
country: FI
category: address
status: active
name:
  en: "Finnish Postal Code Validator"
summary:
  en: "Validate postinumero shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "00100 Helsinki"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-address-normalizer, finland-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Postal Code Validator | ValidoHub"
  description:
    en: "Validate postinumero shape, split area/delivery hints, and preserve official postal lookup boundaries."
