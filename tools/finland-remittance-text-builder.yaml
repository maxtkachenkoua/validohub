schemaVersion: 1
id: finland-remittance-text-builder
kind: tool
module: validohub
country: FI
category: finance
status: active
name:
  en: "Finnish Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 FI12345671 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-payment-reconciliation-helper, finland-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
