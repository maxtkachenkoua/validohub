schemaVersion: 1
id: finland-slug-normalizer
kind: tool
module: validohub
country: FI
category: developer-tools
status: active
name:
  en: "Finnish Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.finland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Finland sample company Mannerheimintie 1, 00100 Helsinki"
    actions: [validate, parse, format, explain]
related:
  explicit: [finland-document-ocr-fixer, finland-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
