    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish Tax Authority Handoff Helper | ValidoHub"
  description:
    en: "Prepare local tax evidence for browser-only QA before regulated authority portals or API submissions."
