  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Finnish VAT Return Field Helper | ValidoHub"
  description:
    en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
