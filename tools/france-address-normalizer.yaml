schemaVersion: 1
id: france-address-normalizer
kind: tool
module: validohub
country: FR
category: national-identifiers
status: active
name:
  en: "French Address Normalizer"
summary:
  en: "Normalize French address casing, spacing, postal code placement, and country-line output."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.france-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "ADDR"
        required: true
        placeholder:
          en: "10 rue de rivoli, 75001 paris, france"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [france-postal-code-validator, france-insee-commune-code-inspector, france-department-code-inspector, france-region-code-mapper]
seo:
  title:
    en: "French Address Normalizer | ValidoHub"
  description:
    en: "Normalize French address casing, spacing, postal code placement, and country-line output."
