schemaVersion: 1
id: france-date-locale-formatter
kind: tool
module: validohub
country: FR
category: developer-tools
status: active
name:
  en: "French Date / Locale Formatter"
summary:
  en: "Parse French date strings, produce ISO dates, and show locale display variants for forms and APIs."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.france-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "DATE"
        required: true
        placeholder:
          en: "14/07/2026"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [france-address-transliteration-normalizer, france-csv-locale-normalizer, france-decimal-currency-formatter, france-accent-normalizer]
seo:
  title:
    en: "French Date / Locale Formatter | ValidoHub"
  description:
    en: "Parse French date strings, produce ISO dates, and show locale display variants for forms and APIs."
