schemaVersion: 1
id: france-iban-generator
kind: tool
module: validohub
country: FR
category: finance
status: active
name:
  en: France IBAN Generator
summary:
  en: Generate French IBAN check digits from a BBAN/RIB body, then replay MOD-97 validation locally.
capabilities: [generate, validate, parse, explain]
algorithm:
  algorithmId: validohub.iban-generator
forms:
  generate:
    inputs:
      - type: text
        name: country
        label:
          en: Country code
        required: true
      - type: text
        name: bban
        label:
          en: France BBAN / RIB body
        required: true
      - type: text
        name: iban
        label:
          en: Existing IBAN to repair or inspect
    actions: [generate, validate, explain]
related:
  explicit: [france-iban-validator, france-rib-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: France IBAN Generator | ValidoHub
  description:
    en: Generate French IBAN check digits and inspect generated French IBAN structure locally.
