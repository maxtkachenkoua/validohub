schemaVersion: 1
id: france-json-fixture-generator
kind: tool
module: validohub
country: FR
category: developer-tools
status: active
name:
  en: "French JSON Fixture Generator"
summary:
  en: "Generate France-ready JSON fixtures containing identifiers, address, phone, payment, and privacy-safe sample values."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.france-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "JSON"
        required: true
        placeholder:
          en: "customer with siret iban paris address"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [france-csv-locale-normalizer, france-decimal-currency-formatter, france-accent-normalizer, france-slug-normalizer]
seo:
  title:
    en: "French JSON Fixture Generator | ValidoHub"
  description:
    en: "Generate France-ready JSON fixtures containing identifiers, address, phone, payment, and privacy-safe sample values."
