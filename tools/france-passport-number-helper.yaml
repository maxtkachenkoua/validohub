    actions: [validate, parse, generate, format, explain]
related:
  explicit: [france-nir-syntax-inspector, france-nir-key-validator, france-nir-masker, france-id-card-format-helper]
seo:
  title:
    en: "French Passport Number Helper | ValidoHub"
  description:
    en: "Inspect French passport-like strings for safe fixture shape, length, and logging boundaries."
