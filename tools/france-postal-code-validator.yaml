schemaVersion: 1
id: france-postal-code-validator
kind: tool
module: validohub
country: FR
category: national-identifiers
status: active
name:
  en: "French Postal Code Validator"
summary:
  en: "Validate French postal codes, infer department prefixes, and flag overseas postal ranges."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.france-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "POSTAL"
        required: true
        placeholder:
          en: "75008"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [france-insee-commune-code-inspector, france-department-code-inspector, france-region-code-mapper, france-cedex-address-formatter]
seo:
  title:
    en: "French Postal Code Validator | ValidoHub"
  description:
    en: "Validate French postal codes, infer department prefixes, and flag overseas postal ranges."
