schemaVersion: 1
id: france-regex-pack-helper
kind: tool
module: validohub
country: FR
category: developer-tools
status: active
name:
  en: "French Regex Pack Helper"
summary:
  en: "Generate and explain regex snippets for French identifiers, phones, postal codes, plates, and locale fields."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.france-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "REGEX"
        required: true
        placeholder:
          en: "SIRET phone postal IBAN plate"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [france-csv-locale-normalizer, france-decimal-currency-formatter, france-accent-normalizer, france-slug-normalizer]
seo:
  title:
    en: "French Regex Pack Helper | ValidoHub"
  description:
    en: "Generate and explain regex snippets for French identifiers, phones, postal codes, plates, and locale fields."
