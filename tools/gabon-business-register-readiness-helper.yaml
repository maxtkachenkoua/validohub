    inputs:
      - type: textarea
        name: input
        label:
          en: "REG input"
        required: true
        placeholder:
          en: "GA-REG-123456 GA123456789 Central business district, Libreville 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-id-card-format-helper, gabon-passport-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese business registry Readiness Helper | ValidoHub"
  description:
    en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
