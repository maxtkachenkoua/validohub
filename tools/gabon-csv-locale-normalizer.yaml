schemaVersion: 1
id: gabon-csv-locale-normalizer
kind: tool
module: validohub
country: GA
category: developer-tools
status: active
name:
  en: "Gabonese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Gabon decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gabon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XAF;24/07/2026;GA123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-slug-normalizer, gabon-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Gabon decimal, date, postal, phone, tax, and banking fields."
