schemaVersion: 1
id: gabon-currency-decimal-formatter
kind: tool
module: validohub
country: GA
category: finance
status: active
name:
  en: "Gabonese XAF Decimal Currency Formatter"
summary:
  en: "Normalize XAF amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gabon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234.56 XAF"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-tax-rate-sanity-helper, gabon-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese XAF Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize XAF amount strings, decimal separators, grouping, and API-safe numeric previews."
