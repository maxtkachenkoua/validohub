schemaVersion: 1
id: gabon-document-ocr-fixer
kind: tool
module: validohub
country: GA
category: documents
status: active
name:
  en: "Gabonese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gabon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "GA-ID-123456 GA123456789 001 1234567890 1000 Libreville"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-privacy-redaction-helper, gabon-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
