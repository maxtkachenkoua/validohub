schemaVersion: 1
id: gabon-form-field-auditor
kind: tool
module: validohub
country: GA
category: developer-tools
status: active
name:
  en: "Gabonese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gabon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=GA123456789&postal=1000 Libreville&phone=+241 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-locale-number-parser, gabon-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
