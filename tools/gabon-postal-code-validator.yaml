schemaVersion: 1
id: gabon-postal-code-validator
kind: tool
module: validohub
country: GA
category: address
status: active
name:
  en: "Gabonese Postal Code Validator"
summary:
  en: "Validate postal/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gabon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "1000 Libreville"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-address-normalizer, gabon-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal/address code shape, split area/delivery hints, and preserve official postal lookup boundaries."
