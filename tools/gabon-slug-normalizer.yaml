schemaVersion: 1
id: gabon-slug-normalizer
kind: tool
module: validohub
country: GA
category: developer-tools
status: active
name:
  en: "Gabonese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gabon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Gabon sample company Central business district, Libreville 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-document-ocr-fixer, gabon-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
