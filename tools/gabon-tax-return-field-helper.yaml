schemaVersion: 1
id: gabon-tax-return-field-helper
kind: tool
module: validohub
country: GA
category: tax
status: active
name:
  en: "Gabonese Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gabon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "tax number / VAT boundary; GA123456789; period 2026-07; 1,234.56 XAF"
    actions: [validate, parse, format, explain]
related:
  explicit: [gabon-invoice-number-helper, gabon-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gabonese Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
