schemaVersion: 1
id: gambia-csv-locale-normalizer
kind: tool
module: validohub
country: GM
category: developer-tools
status: active
name:
  en: "Gambian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Gambia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gambia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 GMD;24/07/2026;GM123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [gambia-slug-normalizer, gambia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gambian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Gambia decimal, date, postal, phone, tax, and banking fields."
