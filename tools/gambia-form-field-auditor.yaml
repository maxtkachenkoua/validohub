schemaVersion: 1
id: gambia-form-field-auditor
kind: tool
module: validohub
country: GM
category: developer-tools
status: active
name:
  en: "Gambian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gambia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=GM123456789&postal=1000 Banjul&phone=+220 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [gambia-locale-number-parser, gambia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gambian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
