schemaVersion: 1
id: gambia-slug-normalizer
kind: tool
module: validohub
country: GM
category: developer-tools
status: active
name:
  en: "Gambian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.gambia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Gambia sample company Central business district, Banjul 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [gambia-document-ocr-fixer, gambia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Gambian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
