schemaVersion: 1
id: georgia-api-payload-auditor
kind: tool
module: validohub
country: GE
category: developer-tools
status: active
name:
  en: "Georgian API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"GE\",\"personal\":\"01001012345\",\"iban\":\"GE29NB0000000101904917\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [georgia-form-field-auditor, georgia-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
