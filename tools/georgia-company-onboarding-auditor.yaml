schemaVersion: 1
id: georgia-company-onboarding-auditor
kind: tool
module: validohub
country: GE
category: developer-tools
status: active
name:
  en: "Georgian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for identification number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"GE\",\"personal\":\"01001012345\",\"iban\":\"GE29NB0000000101904917\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [georgia-business-register-readiness-helper, georgia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for identification number, VAT, address, banking, and official registry handoff readiness."
