schemaVersion: 1
id: georgia-company-suffix-normalizer
kind: tool
module: validohub
country: GE
category: developer-tools
status: active
name:
  en: "Georgian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Georgia Sample Holding Ltd 405123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [georgia-procurement-identifier-helper, georgia-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
