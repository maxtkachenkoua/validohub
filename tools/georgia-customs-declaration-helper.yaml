schemaVersion: 1
id: georgia-customs-declaration-helper
kind: tool
module: validohub
country: GE
category: government
status: active
name:
  en: "Georgian Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "405123456 HS 8471 1 234.56 GEL"
    actions: [validate, parse, format, explain]
related:
  explicit: [georgia-postal-tracking-helper, georgia-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
