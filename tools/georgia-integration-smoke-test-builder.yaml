schemaVersion: 1
id: georgia-integration-smoke-test-builder
kind: tool
module: validohub
country: GE
category: developer-tools
status: active
name:
  en: "Georgian Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"GE\",\"personal\":\"01001012345\",\"iban\":\"GE29NB0000000101904917\"}"
    actions: [generate, validate, explain]
related:
  explicit: [georgia-personal-number-boundary-validator, georgia-identification-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
