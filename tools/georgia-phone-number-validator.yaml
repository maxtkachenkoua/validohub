schemaVersion: 1
id: georgia-phone-number-validator
kind: tool
module: validohub
country: GE
category: address
status: active
name:
  en: "Georgian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+995 599 123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [georgia-phone-e164-formatter, georgia-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
