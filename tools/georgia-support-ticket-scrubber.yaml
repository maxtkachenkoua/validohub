schemaVersion: 1
id: georgia-support-ticket-scrubber
kind: tool
module: validohub
country: GE
category: privacy
status: active
name:
  en: "Georgian Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 01001012345, NB 0101904917, Rustaveli Avenue 1, Tbilisi 0105"
    actions: [validate, parse, format, explain]
related:
  explicit: [georgia-integration-smoke-test-builder, georgia-personal-number-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
