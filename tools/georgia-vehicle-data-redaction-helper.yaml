schemaVersion: 1
id: georgia-vehicle-data-redaction-helper
kind: tool
module: validohub
country: GE
category: transport
status: active
name:
  en: "Georgian Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.georgia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "AA-123-BB WVWZZZ1JZXW000001 01001012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [georgia-customs-declaration-helper, georgia-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Georgian Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
