schemaVersion: 1
id: german-address-normalizer
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Address Normalizer"
summary:
  en: "Normalize German street, house number, postal code, city, and country lines for local forms."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Friedrichstrasse 123\n10117 Berlin\nDeutschland"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Address Normalizer | ValidoHub"
  description:
    en: "Normalize German street, house number, postal code, city, and country lines for local forms."
