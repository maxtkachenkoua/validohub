schemaVersion: 1
id: german-bank-statement-parser
kind: tool
module: validohub
country: DE
category: finance
status: active
name:
  en: "German Bank Statement Parser"
summary:
  en: "Parse German bank-statement snippets for booking dates, IBANs, BLZ/BIC evidence, amounts, and reconciliation hints."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STAT input"
        required: true
        placeholder:
          en: "14.07.2026 SEPA Gutschrift EUR 1250,75 IBAN DE89370400440532013000"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Bank Statement Parser | ValidoHub"
  description:
    en: "Parse German bank-statement snippets for booking dates, IBANs, BLZ/BIC evidence, amounts, and reconciliation hints."
