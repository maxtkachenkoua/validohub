schemaVersion: 1
id: german-company-onboarding-auditor
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Company Onboarding Auditor"
summary:
  en: "Check company intake snippets for USt-IdNr, Handelsregister, IBAN, address, and official registry boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CO input"
        required: true
        placeholder:
          en: "Example GmbH\nUSt-IdNr DE123456789\nHRB 123456\nIBAN DE89370400440532013000\nBerlin"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-elster-readiness-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Company Onboarding Auditor | ValidoHub"
  description:
    en: "Check company intake snippets for USt-IdNr, Handelsregister, IBAN, address, and official registry boundaries."
