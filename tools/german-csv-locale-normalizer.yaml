schemaVersion: 1
id: german-csv-locale-normalizer
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets containing German semicolons, comma decimals, dates, VAT ids, and postal-code fields."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "ust;betrag;datum;plz\nDE123456789;1.250,75;14.07.2026;10117"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets containing German semicolons, comma decimals, dates, VAT ids, and postal-code fields."
