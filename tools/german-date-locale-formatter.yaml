schemaVersion: 1
id: german-date-locale-formatter
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Date Locale Formatter"
summary:
  en: "Parse German DD.MM.YYYY snippets, normalize ISO dates, and expose locale parsing evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "14.07.2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Date Locale Formatter | ValidoHub"
  description:
    en: "Parse German DD.MM.YYYY snippets, normalize ISO dates, and expose locale parsing evidence."
