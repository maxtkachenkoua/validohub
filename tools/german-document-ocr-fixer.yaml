schemaVersion: 1
id: german-document-ocr-fixer
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Document OCR Fixer"
summary:
  en: "Repair common OCR spacing in German IdNr, USt-IdNr, IBAN, postal code, amount, and invoice snippets."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "USt - IdNr D E 123 456 789\nIBAN D E89 3704 0044 0532 0130 00"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Document OCR Fixer | ValidoHub"
  description:
    en: "Repair common OCR spacing in German IdNr, USt-IdNr, IBAN, postal code, amount, and invoice snippets."
