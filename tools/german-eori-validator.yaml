schemaVersion: 1
id: german-eori-validator
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German EORI / Customs Identifier Helper"
summary:
  en: "Inspect German EORI/customs identifier payloads, country prefixes, digit evidence, and customs-boundary notes."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EORI input"
        required: true
        placeholder:
          en: "DE123456789012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-handelsregister-readiness-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German EORI / Customs Identifier Helper | ValidoHub"
  description:
    en: "Inspect German EORI/customs identifier payloads, country prefixes, digit evidence, and customs-boundary notes."
