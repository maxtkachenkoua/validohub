schemaVersion: 1
id: german-eur-decimal-currency-formatter
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German EUR Decimal Currency Formatter"
summary:
  en: "Parse German Euro amounts, normalize comma decimals, produce display strings, and expose integer cent values."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EUR input"
        required: true
        placeholder:
          en: "1.250,75 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-vat-rate-sanity-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German EUR Decimal Currency Formatter | ValidoHub"
  description:
    en: "Parse German Euro amounts, normalize comma decimals, produce display strings, and expose integer cent values."
