schemaVersion: 1
id: german-health-insurance-boundary-helper
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Health Insurance Boundary Helper"
summary:
  en: "Inspect German health-insurance snippets, member numbers, employer evidence, and privacy/official boundary notes."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "GKV input"
        required: true
        placeholder:
          en: "Krankenkasse Test\nMitglied 123456789\nArbeitgeber Example GmbH\nBrutto 4200,00"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Health Insurance Boundary Helper | ValidoHub"
  description:
    en: "Inspect German health-insurance snippets, member numbers, employer evidence, and privacy/official boundary notes."
