schemaVersion: 1
id: german-json-fixture-generator
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German JSON Fixture Generator"
summary:
  en: "Generate and inspect German-localized JSON snippets with locale, VAT, IBAN, address, and amount fields."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"locale\":\"de-DE\",\"vat\":\"DE123456789\",\"iban\":\"DE89370400440532013000\",\"plz\":\"10117\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German JSON Fixture Generator | ValidoHub"
  description:
    en: "Generate and inspect German-localized JSON snippets with locale, VAT, IBAN, address, and amount fields."
