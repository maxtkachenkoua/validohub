schemaVersion: 1
id: german-passport-number-helper
kind: tool
module: validohub
country: DE
category: national-identifiers
status: active
name:
  en: "German Passport Number Helper"
summary:
  en: "Inspect German passport-number snippets, MRZ-like evidence, and official identity-document boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "Passport C01X00T47 DEU 2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Passport Number Helper | ValidoHub"
  description:
    en: "Inspect German passport-number snippets, MRZ-like evidence, and official identity-document boundaries."
