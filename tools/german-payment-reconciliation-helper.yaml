summary:
  en: "Extract German IBANs, invoice ids, EUR amounts, dates, and counterparty evidence from reconciliation text."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REC input"
        required: true
        placeholder:
          en: "Zahlung 14.07.2026 Rechnung 2026-0042 EUR 1250,75 IBAN DE89370400440532013000"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Extract German IBANs, invoice ids, EUR amounts, dates, and counterparty evidence from reconciliation text."
