schemaVersion: 1
id: german-phone-e164-formatter
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Phone E.164 Formatter"
summary:
  en: "Normalize German national numbers to +49 where possible, inspect subscriber length, and flag telecom lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "030 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize German national numbers to +49 where possible, inspect subscriber length, and flag telecom lookup boundaries."
