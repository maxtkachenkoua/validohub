schemaVersion: 1
id: german-phone-number-validator
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Phone Number Validator"
summary:
  en: "Validate German phone-number shape, normalize trunk prefixes, and prepare E.164 handoff notes."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TEL input"
        required: true
        placeholder:
          en: "030 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Phone Number Validator | ValidoHub"
  description:
    en: "Validate German phone-number shape, normalize trunk prefixes, and prepare E.164 handoff notes."
