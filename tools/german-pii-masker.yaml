schemaVersion: 1
id: german-pii-masker
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German PII Masker"
summary:
  en: "Mask German IdNr, phone, IBAN, postal address, email, and document-like evidence for logs."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "Max Test, IdNr 04452397687, IBAN DE89370400440532013000, 10117 Berlin"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-gdpr-dsgvo-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German PII Masker | ValidoHub"
  description:
    en: "Mask German IdNr, phone, IBAN, postal address, email, and document-like evidence for logs."
