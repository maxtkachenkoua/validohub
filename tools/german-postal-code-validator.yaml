schemaVersion: 1
id: german-postal-code-validator
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Postal Code Validator"
summary:
  en: "Validate German five-digit postal code shape, detect address context, and separate delivery proof from local checks."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PLZ input"
        required: true
        placeholder:
          en: "10117 Berlin"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-federal-state-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Postal Code Validator | ValidoHub"
  description:
    en: "Validate German five-digit postal code shape, detect address context, and separate delivery proof from local checks."
