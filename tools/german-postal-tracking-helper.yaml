  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Postal Tracking Helper | ValidoHub"
  description:
    en: "Inspect German parcel tracking snippets, postal-code evidence, carrier boundary notes, and log-safe previews."
