schemaVersion: 1
id: german-regex-pack-helper
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Regex Pack Helper"
summary:
  en: "Prepare regex snippets for German IdNr, USt-IdNr, IBAN, PLZ, phone, amount, and date fields."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "IdNr: ^\\d{11}$\nUSt: ^DE\\d{9}$\nPLZ: ^\\d{5}$"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for German IdNr, USt-IdNr, IBAN, PLZ, phone, amount, and date fields."
