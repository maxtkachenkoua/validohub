    inputs:
      - type: textarea
        name: input
        label:
          en: "StNr input"
        required: true
        placeholder:
          en: "12/345/67890"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-vat-ust-idnr-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Steuernummer Format Helper | ValidoHub"
  description:
    en: "Inspect German tax-number snippets, normalize separators, detect Bundesland-style segments, and prepare ELSTER-safe diagnostics."
