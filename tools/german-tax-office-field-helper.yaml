schemaVersion: 1
id: german-tax-office-field-helper
kind: tool
module: validohub
country: DE
category: developer-tools
status: active
name:
  en: "German Finanzamt Field Helper"
summary:
  en: "Inspect tax-office and assessment snippets for Steuernummer, Bundesland, city, year, and filing context without official lookup."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FA input"
        required: true
        placeholder:
          en: "Finanzamt Berlin\nSteuernummer 12/345/67890\nBescheid 2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [germany-iban-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Finanzamt Field Helper | ValidoHub"
  description:
    en: "Inspect tax-office and assessment snippets for Steuernummer, Bundesland, city, year, and filing context without official lookup."
