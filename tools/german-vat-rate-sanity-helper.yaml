schemaVersion: 1
id: german-vat-rate-sanity-helper
kind: tool
module: validohub
country: DE
category: finance
status: active
name:
  en: "German VAT Rate Sanity Helper"
summary:
  en: "Check German VAT rate snippets, net/gross consistency, and invoice-friendly EUR amount evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VAT% input"
        required: true
        placeholder:
          en: "Netto 100,00 EUR\nUSt 19%\nBrutto 119,00 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-vat-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German VAT Rate Sanity Helper | ValidoHub"
  description:
    en: "Check German VAT rate snippets, net/gross consistency, and invoice-friendly EUR amount evidence."
