schemaVersion: 1
id: german-vehicle-plate-inspector
kind: tool
module: validohub
country: DE
category: national-identifiers
status: active
name:
  en: "German Vehicle Plate Inspector"
summary:
  en: "Inspect German vehicle plate region prefixes, serial letters/digits, and fleet-safe redaction evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PLATE input"
        required: true
        placeholder:
          en: "B AB 1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-vin-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German Vehicle Plate Inspector | ValidoHub"
  description:
    en: "Inspect German vehicle plate region prefixes, serial letters/digits, and fleet-safe redaction evidence."
