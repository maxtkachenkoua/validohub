schemaVersion: 1
id: german-vin-validator
kind: tool
module: validohub
country: DE
category: national-identifiers
status: active
name:
  en: "German VIN Validator"
summary:
  en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare German vehicle-intake diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.germany-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VIN input"
        required: true
        placeholder:
          en: "WVWZZZ1JZXW000001"
    actions: [validate, parse, format, explain]
related:
  explicit: [german-vehicle-data-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "German VIN Validator | ValidoHub"
  description:
    en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare German vehicle-intake diagnostics."
