schemaVersion: 1
id: germany-iban-generator
kind: tool
module: validohub
country: DE
category: finance
status: active
name:
  en: Germany IBAN Generator
summary:
  en: Generate German IBAN check digits from BLZ/account BBAN body, then replay MOD-97 validation locally.
capabilities: [generate, validate, parse, explain]
algorithm:
  algorithmId: validohub.germany-suite
forms:
  generate:
    inputs:
      - type: text
        name: country
        label:
          en: Country code
        required: true
      - type: text
        name: bban
        label:
          en: Germany BBAN / BLZ account body
        required: true
      - type: text
        name: iban
        label:
          en: Existing IBAN to repair or inspect
    actions: [generate, validate, explain]
related:
  explicit: [germany-iban-validator, german-blz-bank-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: Germany IBAN Generator | ValidoHub
  description:
    en: Generate German IBAN check digits and inspect generated German IBAN structure locally.
