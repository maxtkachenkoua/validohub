schemaVersion: 1
id: germany-iban-validator
kind: tool
module: validohub
country: DE
category: finance
status: active
name:
  en: German IBAN Validator
summary:
  en: Validate German IBAN numbers, extract BLZ and account segments, and explain where official bank-directory checks begin.
capabilities:
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.iban
forms:
  validate:
    inputs:
      - type: text
        name: iban
        label:
          en: German IBAN
        required: true
        placeholder:
          en: DE89370400440532013000
    actions: [validate, parse, explain]
related:
  explicit: [iban-validator, steuernummer-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: German IBAN Validator
  description:
    en: Validate German IBAN structure, MOD-97 check digits, BLZ bank code, and account-number segments locally.
