schemaVersion: 1
id: ghana-currency-decimal-formatter
kind: tool
module: validohub
country: GH
category: finance
status: active
name:
  en: "Ghanaian GHS Decimal Currency Formatter"
summary:
  en: "Normalize GHS amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ghana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234.56 GHS"
    actions: [validate, parse, format, explain]
related:
  explicit: [ghana-tax-rate-sanity-helper, ghana-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ghanaian GHS Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize GHS amount strings, decimal separators, grouping, and API-safe numeric previews."
