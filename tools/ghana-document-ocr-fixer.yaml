schemaVersion: 1
id: ghana-document-ocr-fixer
kind: tool
module: validohub
country: GH
category: documents
status: active
name:
  en: "Ghanaian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ghana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "GH-ID-123456 GH123456789 001 1234567890 1000 Accra"
    actions: [validate, parse, format, explain]
related:
  explicit: [ghana-privacy-redaction-helper, ghana-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ghanaian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
