schemaVersion: 1
id: ghana-form-field-auditor
kind: tool
module: validohub
country: GH
category: developer-tools
status: active
name:
  en: "Ghanaian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ghana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=GH123456789&postal=1000 Accra&phone=+233 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [ghana-locale-number-parser, ghana-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ghanaian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
