schemaVersion: 1
id: ghana-locale-number-parser
kind: tool
module: validohub
country: GH
category: localization
status: active
name:
  en: "Ghanaian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Ghana."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ghana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 GHS"
    actions: [validate, parse, format, explain]
related:
  explicit: [ghana-calendar-week-helper, ghana-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ghanaian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Ghana."
