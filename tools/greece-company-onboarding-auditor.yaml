schemaVersion: 1
id: greece-company-onboarding-auditor
kind: tool
module: validohub
country: GR
category: developer-tools
status: active
name:
  en: "Greek Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for GEMI number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.greece-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"GR\",\"afm\":\"123456789\",\"iban\":\"GR1601101250000000012300695\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [greece-business-register-readiness-helper, greece-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Greek Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for GEMI number, VAT, address, banking, and official registry handoff readiness."
