schemaVersion: 1
id: greece-company-suffix-normalizer
kind: tool
module: validohub
country: GR
category: developer-tools
status: active
name:
  en: "Greek Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.greece-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Greece Sample Holding Ltd 123456789000"
    actions: [validate, parse, format, explain]
related:
  explicit: [greece-procurement-identifier-helper, greece-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Greek Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
