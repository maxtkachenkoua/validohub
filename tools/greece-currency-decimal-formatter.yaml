schemaVersion: 1
id: greece-currency-decimal-formatter
kind: tool
module: validohub
country: GR
category: finance
status: active
name:
  en: "Greek EUR Decimal Currency Formatter"
summary:
  en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.greece-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [greece-vat-rate-sanity-helper, greece-vat-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Greek EUR Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
