    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Greek myDATA / AADE invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
