schemaVersion: 1
id: greece-form-field-auditor
kind: tool
module: validohub
country: GR
category: developer-tools
status: active
name:
  en: "Greek Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.greece-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=EL123456789&postal=105 57 Athens&phone=+30 210 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [greece-locale-number-parser, greece-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Greek Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
