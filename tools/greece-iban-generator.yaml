forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "IBG input"
        required: true
        placeholder:
          en: "01101250000000012300695"
    actions: [generate, validate, explain]
related:
  explicit: [greece-bank-account-inspector, greece-bic-swift-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Greece IBAN Generator | ValidoHub"
  description:
    en: "Generate GR IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
