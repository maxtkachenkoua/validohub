schemaVersion: 1
id: greece-slug-normalizer
kind: tool
module: validohub
country: GR
category: developer-tools
status: active
name:
  en: "Greek Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.greece-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Greece sample company Ermou 1, 105 57 Athens"
    actions: [validate, parse, format, explain]
related:
  explicit: [greece-document-ocr-fixer, greece-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Greek Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
