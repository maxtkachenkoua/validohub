capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.guinea-bissau-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 24/07/2026 1,234.56 XOF GW123456789"
    actions: [generate, validate, explain]
related:
  explicit: [guinea-bissau-postal-code-validator, guinea-bissau-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bissau-Guinean Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
