schemaVersion: 1
id: guinea-bissau-api-payload-auditor
kind: tool
module: validohub
country: GW
category: developer-tools
status: active
name:
  en: "Bissau-Guinean API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guinea-bissau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"GW\",\"taxNumber\":\"GW123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-bissau-form-field-auditor, guinea-bissau-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bissau-Guinean API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
