schemaVersion: 1
id: guinea-bissau-csv-locale-normalizer
kind: tool
module: validohub
country: GW
category: developer-tools
status: active
name:
  en: "Bissau-Guinean CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Guinea-Bissau decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guinea-bissau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;GW123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-bissau-slug-normalizer, guinea-bissau-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bissau-Guinean CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Guinea-Bissau decimal, date, postal, phone, tax, and banking fields."
