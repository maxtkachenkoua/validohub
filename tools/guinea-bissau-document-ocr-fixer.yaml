schemaVersion: 1
id: guinea-bissau-document-ocr-fixer
kind: tool
module: validohub
country: GW
category: documents
status: active
name:
  en: "Bissau-Guinean Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guinea-bissau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "GW-ID-123456 GW123456789 001 1234567890 1000 Bissau"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-bissau-privacy-redaction-helper, guinea-bissau-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bissau-Guinean Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
