schemaVersion: 1
id: guinea-bissau-json-fixture-generator
kind: tool
module: validohub
country: GW
category: developer-tools
status: active
name:
  en: "Bissau-Guinean JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.guinea-bissau-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"GW\",\"taxNumber\":\"GW123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [guinea-bissau-regex-pack-helper, guinea-bissau-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bissau-Guinean JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
