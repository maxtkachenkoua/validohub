    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "P<GNBBISSAU-GUINEAN<<SAMPLE<<<<<<<<<<<<<<<<<<"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-bissau-mrz-passport-parser, guinea-bissau-bank-account-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bissau-Guinean Passport Number Helper | ValidoHub"
  description:
    en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
