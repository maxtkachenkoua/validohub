schemaVersion: 1
id: guinea-bissau-remittance-text-builder
kind: tool
module: validohub
country: GW
category: finance
status: active
name:
  en: "Bissau-Guinean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guinea-bissau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 GW123456789 1,234.56 XOF"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-bissau-payment-reconciliation-helper, guinea-bissau-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Bissau-Guinean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
