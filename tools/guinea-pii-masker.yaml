schemaVersion: 1
id: guinea-pii-masker
kind: tool
module: validohub
country: GN
category: privacy
status: active
name:
  en: "Guinean PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "GN-ID-123456 +224 123 456 789 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-personal-data-fixture-generator, guinea-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guinean PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
