schemaVersion: 1
id: guinea-slug-normalizer
kind: tool
module: validohub
country: GN
category: developer-tools
status: active
name:
  en: "Guinean Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Guinea sample company Central business district, Conakry 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-document-ocr-fixer, guinea-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guinean Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
