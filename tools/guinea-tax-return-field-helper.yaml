schemaVersion: 1
id: guinea-tax-return-field-helper
kind: tool
module: validohub
country: GN
category: tax
status: active
name:
  en: "Guinean Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "tax number / VAT boundary; GN123456789; period 2026-07; 1,234.56 GNF"
    actions: [validate, parse, format, explain]
related:
  explicit: [guinea-invoice-number-helper, guinea-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guinean Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
