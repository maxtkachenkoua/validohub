schemaVersion: 1
id: guyana-api-payload-auditor
kind: tool
module: validohub
country: GY
category: developer-tools
status: active
name:
  en: "Guyanese API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, domestic accounts, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"GY\",\"tin\":\"123456789\",\"account\":\"001-123456789\",\"amount\":\"1,234.56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-form-field-auditor, guyana-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, domestic accounts, dates, amounts, and official boundaries."
