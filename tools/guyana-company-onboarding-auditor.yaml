schemaVersion: 1
id: guyana-company-onboarding-auditor
kind: tool
module: validohub
country: GY
category: developer-tools
status: active
name:
  en: "Guyanese Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"GY\",\"tin\":\"123456789\",\"account\":\"001-123456789\",\"amount\":\"1,234.56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-business-register-readiness-helper, guyana-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
