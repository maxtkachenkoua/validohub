schemaVersion: 1
id: guyana-company-suffix-normalizer
kind: tool
module: validohub
country: GY
category: developer-tools
status: active
name:
  en: "Guyanese Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Guyana Sample Holding Ltd GY-CO-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-procurement-identifier-helper, guyana-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
