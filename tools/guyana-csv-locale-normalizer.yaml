schemaVersion: 1
id: guyana-csv-locale-normalizer
kind: tool
module: validohub
country: GY
category: developer-tools
status: active
name:
  en: "Guyanese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Guyana decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 GYD;21/07/2026;GY TIN 123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-slug-normalizer, guyana-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Guyana decimal, date, postal, phone, tax, and banking fields."
