schemaVersion: 1
id: guyana-integration-smoke-test-builder
kind: tool
module: validohub
country: GY
category: developer-tools
status: active
name:
  en: "Guyanese Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"GY\",\"tin\":\"123456789\",\"account\":\"001-123456789\",\"amount\":\"1,234.56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-tin-nis-validator, guyana-company-registration-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
