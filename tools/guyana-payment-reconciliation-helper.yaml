schemaVersion: 1
id: guyana-payment-reconciliation-helper
kind: tool
module: validohub
country: GY
category: finance
status: active
name:
  en: "Guyanese Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 GYD; GY-BANK-001-123456789; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-bank-statement-parser, guyana-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
