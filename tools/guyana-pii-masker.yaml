schemaVersion: 1
id: guyana-pii-masker
kind: tool
module: validohub
country: GY
category: privacy
status: active
name:
  en: "Guyanese PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "123456789 +592 231 1234 GY-BANK-001-123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-personal-data-fixture-generator, guyana-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
