schemaVersion: 1
id: guyana-slug-normalizer
kind: tool
module: validohub
country: GY
category: developer-tools
status: active
name:
  en: "Guyanese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.guyana-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Guyana sample company Regent Street 1, Georgetown"
    actions: [validate, parse, format, explain]
related:
  explicit: [guyana-document-ocr-fixer, guyana-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Guyanese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
