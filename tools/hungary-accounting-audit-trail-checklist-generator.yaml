schemaVersion: 1
id: hungary-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: HU
category: tax
status: active
name:
  en: "Hungarian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 2026.07.21 1 234,56 HUF HU12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-postal-code-validator, hungary-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
