schemaVersion: 1
id: hungary-company-onboarding-auditor
kind: tool
module: validohub
country: HU
category: developer-tools
status: active
name:
  en: "Hungarian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registry number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"HU\",\"tax\":\"HU12345678\",\"iban\":\"HU42117730161111101800000000\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-business-register-readiness-helper, hungary-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registry number, VAT, address, banking, and official registry handoff readiness."
