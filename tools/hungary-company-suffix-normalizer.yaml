schemaVersion: 1
id: hungary-company-suffix-normalizer
kind: tool
module: validohub
country: HU
category: developer-tools
status: active
name:
  en: "Hungarian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Hungary Sample Holding Ltd 01-09-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-procurement-identifier-helper, hungary-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
