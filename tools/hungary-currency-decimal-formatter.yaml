  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian HUF Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize HUF amount strings, decimal separators, grouping, and API-safe numeric previews."
