schemaVersion: 1
id: hungary-gdpr-redaction-helper
kind: tool
module: validohub
country: HU
category: privacy
status: active
name:
  en: "Hungarian GDPR / NAIH Redaction Helper"
summary:
  en: "Mask personal, tax, banking, phone, and address evidence for logs and support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "GDPR input"
        required: true
        placeholder:
          en: "{\"country\":\"HU\",\"tax\":\"HU12345678\",\"iban\":\"HU42117730161111101800000000\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-pii-masker, hungary-personal-data-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian GDPR / NAIH Redaction Helper | ValidoHub"
  description:
    en: "Mask personal, tax, banking, phone, and address evidence for logs and support tickets."
