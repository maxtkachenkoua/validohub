schemaVersion: 1
id: hungary-integration-smoke-test-builder
kind: tool
module: validohub
country: HU
category: developer-tools
status: active
name:
  en: "Hungarian Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"HU\",\"tax\":\"HU12345678\",\"iban\":\"HU42117730161111101800000000\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-taj-validator, hungary-company-registry-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
