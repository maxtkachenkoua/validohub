schemaVersion: 1
id: hungary-pii-masker
kind: tool
module: validohub
country: HU
category: privacy
status: active
name:
  en: "Hungarian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "123456789 +36 30 123 4567 HU42117730161111101800000000"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-personal-data-fixture-generator, hungary-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
