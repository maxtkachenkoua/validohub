schemaVersion: 1
id: hungary-remittance-text-builder
kind: tool
module: validohub
country: HU
category: finance
status: active
name:
  en: "Hungarian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 HU12345678 1 234,56 HUF"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-payment-reconciliation-helper, hungary-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
