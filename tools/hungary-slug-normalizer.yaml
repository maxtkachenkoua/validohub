schemaVersion: 1
id: hungary-slug-normalizer
kind: tool
module: validohub
country: HU
category: developer-tools
status: active
name:
  en: "Hungarian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.hungary-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Hungary sample company Andrassy ut 1, 1051 Budapest"
    actions: [validate, parse, format, explain]
related:
  explicit: [hungary-document-ocr-fixer, hungary-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Hungarian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
