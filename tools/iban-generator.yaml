schemaVersion: 1
id: iban-generator
kind: tool
module: validohub
category: finance
status: active
name:
  en: IBAN Generator
summary:
  en: Generate IBAN check digits from a country code and BBAN/account body, then replay MOD-97 validation locally.
capabilities: [generate, validate, parse, explain]
algorithm:
  algorithmId: validohub.iban-generator
forms:
  generate:
    inputs:
      - type: text
        name: country
        label:
          en: Country code
        required: true
      - type: text
        name: bban
        label:
          en: BBAN / account body
        required: true
      - type: text
        name: iban
        label:
          en: Existing IBAN to repair or inspect
    actions: [generate, validate, explain]
related:
  explicit: [iban-validator]
  auto:
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: IBAN Generator
  description:
    en: Generate International Bank Account Number check digits and inspect generated IBAN structure locally.
