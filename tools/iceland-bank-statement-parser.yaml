schemaVersion: 1
id: iceland-bank-statement-parser
kind: tool
module: validohub
country: IS
category: finance
status: active
name:
  en: "Icelandic Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 ISK; IS140159260076545510730339; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-masked-iban-formatter, iceland-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
