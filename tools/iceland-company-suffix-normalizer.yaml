schemaVersion: 1
id: iceland-company-suffix-normalizer
kind: tool
module: validohub
country: IS
category: developer-tools
status: active
name:
  en: "Icelandic Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Iceland Sample Holding Ltd 5501692829"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-procurement-identifier-helper, iceland-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
