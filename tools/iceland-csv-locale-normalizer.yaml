schemaVersion: 1
id: iceland-csv-locale-normalizer
kind: tool
module: validohub
country: IS
category: developer-tools
status: active
name:
  en: "Icelandic CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Iceland decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 ISK;21.07.2026;IS5501692829"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-slug-normalizer, iceland-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Iceland decimal, date, postal, phone, tax, and banking fields."
