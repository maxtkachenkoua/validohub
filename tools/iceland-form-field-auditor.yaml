schemaVersion: 1
id: iceland-form-field-auditor
kind: tool
module: validohub
country: IS
category: developer-tools
status: active
name:
  en: "Icelandic Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=IS5501692829&postal=101 Reykjavik&phone=+354 555 1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-locale-number-parser, iceland-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
