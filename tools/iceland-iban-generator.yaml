  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iceland IBAN Generator | ValidoHub"
  description:
    en: "Generate IS IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
