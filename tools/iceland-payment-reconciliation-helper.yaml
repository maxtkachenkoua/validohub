schemaVersion: 1
id: iceland-payment-reconciliation-helper
kind: tool
module: validohub
country: IS
category: finance
status: active
name:
  en: "Icelandic Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 ISK; IS140159260076545510730339; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-bank-statement-parser, iceland-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
