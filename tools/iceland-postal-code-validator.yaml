schemaVersion: 1
id: iceland-postal-code-validator
kind: tool
module: validohub
country: IS
category: address
status: active
name:
  en: "Icelandic Postal Code Validator"
summary:
  en: "Validate postnumer shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "101 Reykjavik"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-address-normalizer, iceland-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic Postal Code Validator | ValidoHub"
  description:
    en: "Validate postnumer shape, split area/delivery hints, and preserve official postal lookup boundaries."
