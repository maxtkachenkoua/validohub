schemaVersion: 1
id: iceland-remittance-text-builder
kind: tool
module: validohub
country: IS
category: finance
status: active
name:
  en: "Icelandic Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 IS5501692829 1.234,56 ISK"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-payment-reconciliation-helper, iceland-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
