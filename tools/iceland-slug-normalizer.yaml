schemaVersion: 1
id: iceland-slug-normalizer
kind: tool
module: validohub
country: IS
category: developer-tools
status: active
name:
  en: "Icelandic Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iceland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Iceland sample company Laugavegur 1, 101 Reykjavik"
    actions: [validate, parse, format, explain]
related:
  explicit: [iceland-document-ocr-fixer, iceland-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Icelandic Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
