schemaVersion: 1
id: india-bank-account-validator
kind: tool
module: validohub
country: IN
category: finance
status: active
name:
  en: "India Bank Account Validator"
summary:
  en: "Validate local bank-account or routing shape, split bank/account blocks, and keep ownership lookup outside the browser."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "BANK input"
        required: true
        placeholder:
          en: "HDFC0001234 12345678901234"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-bank-account-fixture-generator, india-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "India Bank Account Validator | ValidoHub"
  description:
    en: "Validate local bank-account or routing shape, split bank/account blocks, and keep ownership lookup outside the browser."
