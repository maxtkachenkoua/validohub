schemaVersion: 1
id: india-company-onboarding-auditor
kind: tool
module: validohub
country: IN
category: developer-tools
status: active
name:
  en: "Indian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for CIN / LLPIN, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"IN\",\"pan\":\"ABCDE1234F\",\"gstin\":\"27ABCDE1234F1Z5\",\"ifsc\":\"HDFC0001234\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-business-register-readiness-helper, india-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for CIN / LLPIN, VAT, address, banking, and official registry handoff readiness."
