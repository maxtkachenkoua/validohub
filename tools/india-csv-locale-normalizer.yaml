schemaVersion: 1
id: india-csv-locale-normalizer
kind: tool
module: validohub
country: IN
category: developer-tools
status: active
name:
  en: "Indian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for India decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,23,456.78 INR;21/07/2026;27ABCDE1234F1Z5"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-slug-normalizer, india-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for India decimal, date, postal, phone, tax, and banking fields."
