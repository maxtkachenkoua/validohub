schemaVersion: 1
id: india-customs-declaration-helper
kind: tool
module: validohub
country: IN
category: government
status: active
name:
  en: "Indian Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "27ABCDE1234F1Z5 HS 8471 1,23,456.78 INR"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-postal-tracking-helper, india-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
