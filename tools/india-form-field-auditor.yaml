schemaVersion: 1
id: india-form-field-auditor
kind: tool
module: validohub
country: IN
category: developer-tools
status: active
name:
  en: "Indian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=27ABCDE1234F1Z5&postal=110001 New Delhi&phone=+91 98765 43210"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-locale-number-parser, india-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
