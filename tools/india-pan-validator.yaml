  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian PAN Validator | ValidoHub"
  description:
    en: "Validate PAN shape, split date/control/body evidence, and prepare privacy-safe debugging output."
