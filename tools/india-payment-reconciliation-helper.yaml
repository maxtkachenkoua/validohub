schemaVersion: 1
id: india-payment-reconciliation-helper
kind: tool
module: validohub
country: IN
category: finance
status: active
name:
  en: "Indian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,23,456.78 INR; HDFC0001234 12345678901234; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-bank-statement-parser, india-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
