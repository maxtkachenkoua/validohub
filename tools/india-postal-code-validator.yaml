schemaVersion: 1
id: india-postal-code-validator
kind: tool
module: validohub
country: IN
category: address
status: active
name:
  en: "Indian Postal Code Validator"
summary:
  en: "Validate PIN code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "110001 New Delhi"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-address-normalizer, india-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Postal Code Validator | ValidoHub"
  description:
    en: "Validate PIN code shape, split area/delivery hints, and preserve official postal lookup boundaries."
