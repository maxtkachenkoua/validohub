schemaVersion: 1
id: india-regex-pack-helper
kind: tool
module: validohub
country: IN
category: developer-tools
status: active
name:
  en: "Indian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "PAN CIN / LLPIN PIN code  HDFC0001234 12345678901234"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-api-payload-auditor, india-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
