schemaVersion: 1
id: india-remittance-text-builder
kind: tool
module: validohub
country: IN
category: finance
status: active
name:
  en: "Indian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.india-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 27ABCDE1234F1Z5 1,23,456.78 INR"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-payment-reconciliation-helper, india-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
