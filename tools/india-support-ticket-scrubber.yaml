    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent ABCDE1234F, HDFC0001234 12345678901234, Connaught Place, New Delhi 110001"
    actions: [validate, parse, format, explain]
related:
  explicit: [india-integration-smoke-test-builder, india-pan-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indian Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
