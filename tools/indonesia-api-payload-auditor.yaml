schemaVersion: 1
id: indonesia-api-payload-auditor
kind: tool
module: validohub
country: ID
category: developer-tools
status: active
name:
  en: "Indonesian API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"ID\",\"npwp\":\"01.234.567.8-901.000\",\"bankCode\":\"014\",\"qris\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-form-field-auditor, indonesia-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
