schemaVersion: 1
id: indonesia-company-onboarding-auditor
kind: tool
module: validohub
country: ID
category: developer-tools
status: active
name:
  en: "Indonesian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for NIB / company registration, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"ID\",\"npwp\":\"01.234.567.8-901.000\",\"bankCode\":\"014\",\"qris\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-business-register-readiness-helper, indonesia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for NIB / company registration, VAT, address, banking, and official registry handoff readiness."
