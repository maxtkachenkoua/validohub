schemaVersion: 1
id: indonesia-e-invoicing-readiness-checker
kind: tool
module: validohub
country: ID
category: tax
status: active
name:
  en: "Indonesian e-Faktur invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"ID\",\"npwp\":\"01.234.567.8-901.000\",\"bankCode\":\"014\",\"qris\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-tax-authority-handoff-helper, indonesia-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian e-Faktur invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
