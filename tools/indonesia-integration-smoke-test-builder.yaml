schemaVersion: 1
id: indonesia-integration-smoke-test-builder
kind: tool
module: validohub
country: ID
category: developer-tools
status: active
name:
  en: "Indonesian Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"ID\",\"npwp\":\"01.234.567.8-901.000\",\"bankCode\":\"014\",\"qris\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [indonesia-nik-boundary-validator, indonesia-nib-company-registration-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
