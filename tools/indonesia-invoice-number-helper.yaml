  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Invoice Number Helper | ValidoHub"
  description:
    en: "Inspect invoice numbering, period hints, VAT/customer evidence, and duplicate-risk diagnostics."
