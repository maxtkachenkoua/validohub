schemaVersion: 1
id: indonesia-json-fixture-generator
kind: tool
module: validohub
country: ID
category: developer-tools
status: active
name:
  en: "Indonesian JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"ID\",\"npwp\":\"01.234.567.8-901.000\",\"bankCode\":\"014\",\"qris\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [indonesia-regex-pack-helper, indonesia-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
