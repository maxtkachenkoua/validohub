schemaVersion: 1
id: indonesia-locale-number-parser
kind: tool
module: validohub
country: ID
category: localization
status: active
name:
  en: "Indonesian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Indonesia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234.567,89 IDR"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-calendar-week-helper, indonesia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Indonesia."
