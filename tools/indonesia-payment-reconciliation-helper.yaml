schemaVersion: 1
id: indonesia-payment-reconciliation-helper
kind: tool
module: validohub
country: ID
category: finance
status: active
name:
  en: "Indonesian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234.567,89 IDR; 014 1234567890; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-bank-statement-parser, indonesia-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
