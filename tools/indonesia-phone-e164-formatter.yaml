schemaVersion: 1
id: indonesia-phone-e164-formatter
kind: tool
module: validohub
country: ID
category: address
status: active
name:
  en: "Indonesian Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+62 812 3456 7890"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-date-locale-formatter, indonesia-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
