schemaVersion: 1
id: indonesia-phone-number-validator
kind: tool
module: validohub
country: ID
category: address
status: active
name:
  en: "Indonesian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+62 812 3456 7890"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-phone-e164-formatter, indonesia-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
