schemaVersion: 1
id: indonesia-regex-pack-helper
kind: tool
module: validohub
country: ID
category: developer-tools
status: active
name:
  en: "Indonesian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "NIK boundary NIB / company registration kode pos  014 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-api-payload-auditor, indonesia-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
