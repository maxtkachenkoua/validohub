schemaVersion: 1
id: indonesia-slug-normalizer
kind: tool
module: validohub
country: ID
category: developer-tools
status: active
name:
  en: "Indonesian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.indonesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Indonesia sample company Jl. Thamrin 1, Jakarta 10110"
    actions: [validate, parse, format, explain]
related:
  explicit: [indonesia-document-ocr-fixer, indonesia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Indonesian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
