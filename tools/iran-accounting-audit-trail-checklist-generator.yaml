schemaVersion: 1
id: iran-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: IR
category: tax
status: active
name:
  en: "Iranian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 1405/04/30 1,234,567 IRR 411111111111"
    actions: [generate, validate, explain]
related:
  explicit: [iran-postal-code-validator, iran-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
