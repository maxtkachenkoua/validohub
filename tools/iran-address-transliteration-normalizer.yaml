schemaVersion: 1
id: iran-address-transliteration-normalizer
kind: tool
module: validohub
country: IR
category: address
status: active
name:
  en: "Iranian Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Valiasr Street 1, Tehran 11369-12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-region-code-mapper, iran-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
