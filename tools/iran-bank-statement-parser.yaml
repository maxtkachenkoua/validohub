schemaVersion: 1
id: iran-bank-statement-parser
kind: tool
module: validohub
country: IR
category: finance
status: active
name:
  en: "Iranian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "1405/04/30; 1,234,567 IRR; 054 020817909002; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-masked-bank-account-formatter, iran-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
