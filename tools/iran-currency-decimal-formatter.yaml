    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian IRR Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize IRR amount strings, decimal separators, grouping, and API-safe numeric previews."
