schemaVersion: 1
id: iran-customs-declaration-helper
kind: tool
module: validohub
country: IR
category: government
status: active
name:
  en: "Iranian Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "411111111111 HS 8471 1,234,567 IRR"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-postal-tracking-helper, iran-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
