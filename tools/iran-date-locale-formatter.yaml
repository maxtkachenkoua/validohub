schemaVersion: 1
id: iran-date-locale-formatter
kind: tool
module: validohub
country: IR
category: localization
status: active
name:
  en: "Iranian Date Locale Formatter"
summary:
  en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "1405/04/30"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-csv-locale-normalizer, iran-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Date Locale Formatter | ValidoHub"
  description:
    en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
