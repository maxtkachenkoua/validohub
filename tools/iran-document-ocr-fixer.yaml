schemaVersion: 1
id: iran-document-ocr-fixer
kind: tool
module: validohub
country: IR
category: documents
status: active
name:
  en: "Iranian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "0084575941 411111111111 054 020817909002 11369-12345 Tehran"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-privacy-redaction-helper, iran-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
