schemaVersion: 1
id: iran-payment-reconciliation-helper
kind: tool
module: validohub
country: IR
category: finance
status: active
name:
  en: "Iranian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "1405/04/30; 1,234,567 IRR; 054 020817909002; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-bank-statement-parser, iran-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
