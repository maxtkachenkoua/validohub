schemaVersion: 1
id: iran-phone-number-validator
kind: tool
module: validohub
country: IR
category: address
status: active
name:
  en: "Iranian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+98 912 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-phone-e164-formatter, iran-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
