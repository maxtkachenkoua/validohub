schemaVersion: 1
id: iran-pii-masker
kind: tool
module: validohub
country: IR
category: privacy
status: active
name:
  en: "Iranian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "0084575941 +98 912 123 4567 054 020817909002"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-personal-data-fixture-generator, iran-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
