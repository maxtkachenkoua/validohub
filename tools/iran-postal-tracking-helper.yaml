schemaVersion: 1
id: iran-postal-tracking-helper
kind: tool
module: validohub
country: IR
category: logistics
status: active
name:
  en: "Iranian Postal Tracking Helper"
summary:
  en: "Inspect tracking strings, postal-code evidence, address snippets, and carrier-status boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TRACK input"
        required: true
        placeholder:
          en: "TRACK 2026 11369-12345 Tehran"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-data-quality-workbench, iran-json-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Postal Tracking Helper | ValidoHub"
  description:
    en: "Inspect tracking strings, postal-code evidence, address snippets, and carrier-status boundaries."
