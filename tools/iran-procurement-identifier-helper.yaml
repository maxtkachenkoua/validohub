    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Procurement Identifier Helper | ValidoHub"
  description:
    en: "Inspect buyer/seller identifiers, invoice references, and public-procurement handoff evidence."
