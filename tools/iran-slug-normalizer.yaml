schemaVersion: 1
id: iran-slug-normalizer
kind: tool
module: validohub
country: IR
category: developer-tools
status: active
name:
  en: "Iranian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Iran sample company Valiasr Street 1, Tehran 11369-12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-document-ocr-fixer, iran-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
