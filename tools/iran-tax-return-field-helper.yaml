schemaVersion: 1
id: iran-tax-return-field-helper
kind: tool
module: validohub
country: IR
category: tax
status: active
name:
  en: "Iranian Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "economic code / VAT; 411111111111; period 2026-07; 1,234,567 IRR"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-invoice-number-helper, iran-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
