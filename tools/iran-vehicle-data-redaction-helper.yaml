schemaVersion: 1
id: iran-vehicle-data-redaction-helper
kind: tool
module: validohub
country: IR
category: transport
status: active
name:
  en: "Iranian Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iran-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "12B345 Iran 11 WVWZZZ1JZXW000001 0084575941"
    actions: [validate, parse, format, explain]
related:
  explicit: [iran-customs-declaration-helper, iran-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iranian Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
