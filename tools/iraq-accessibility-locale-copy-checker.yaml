schemaVersion: 1
id: iraq-accessibility-locale-copy-checker
kind: tool
module: validohub
country: IQ
category: localization
status: active
name:
  en: "Iraqi Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iraq-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "national card boundary input, postal code input, amount 1,234,567 IQD"
    actions: [validate, parse, format, explain]
related:
  explicit: [iraq-support-ticket-scrubber, iraq-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
