schemaVersion: 1
id: iraq-data-quality-workbench
kind: tool
module: validohub
country: IQ
category: developer-tools
status: active
name:
  en: "Iraqi Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iraq-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"IQ\",\"tax\":\"TAX123456\",\"iban\":\"IQ20RRAF000000000123456789012\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [iraq-json-fixture-generator, iraq-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
