schemaVersion: 1
id: iraq-document-ocr-fixer
kind: tool
module: validohub
country: IQ
category: documents
status: active
name:
  en: "Iraqi Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iraq-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "123456789012 TAX123456 RRAF 123456789012 10001 Baghdad"
    actions: [validate, parse, format, explain]
related:
  explicit: [iraq-privacy-redaction-helper, iraq-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
