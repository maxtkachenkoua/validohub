schemaVersion: 1
id: iraq-form-field-auditor
kind: tool
module: validohub
country: IQ
category: developer-tools
status: active
name:
  en: "Iraqi Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iraq-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TAX123456&postal=10001 Baghdad&phone=+964 770 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [iraq-locale-number-parser, iraq-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
