schemaVersion: 1
id: iraq-phone-number-validator
kind: tool
module: validohub
country: IQ
category: address
status: active
name:
  en: "Iraqi Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iraq-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+964 770 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [iraq-phone-e164-formatter, iraq-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
