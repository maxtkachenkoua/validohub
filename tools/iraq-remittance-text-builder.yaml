schemaVersion: 1
id: iraq-remittance-text-builder
kind: tool
module: validohub
country: IQ
category: finance
status: active
name:
  en: "Iraqi Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iraq-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 TAX123456 1,234,567 IQD"
    actions: [validate, parse, format, explain]
related:
  explicit: [iraq-payment-reconciliation-helper, iraq-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
