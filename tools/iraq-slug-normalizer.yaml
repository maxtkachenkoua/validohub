schemaVersion: 1
id: iraq-slug-normalizer
kind: tool
module: validohub
country: IQ
category: developer-tools
status: active
name:
  en: "Iraqi Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.iraq-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Iraq sample company Karrada 1, Baghdad 10001"
    actions: [validate, parse, format, explain]
related:
  explicit: [iraq-document-ocr-fixer, iraq-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
