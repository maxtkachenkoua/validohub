    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Iraqi Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
