schemaVersion: 1
id: ireland-accessibility-locale-copy-checker
kind: tool
module: validohub
country: IE
category: localization
status: active
name:
  en: "Irish Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "PPSN input, Eircode input, amount 1,234.56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-support-ticket-scrubber, ireland-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
