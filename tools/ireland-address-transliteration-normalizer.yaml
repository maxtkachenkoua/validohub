    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
