schemaVersion: 1
id: ireland-company-onboarding-auditor
kind: tool
module: validohub
country: IE
category: developer-tools
status: active
name:
  en: "Irish Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for CRO number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"IE\",\"ppsn\":\"1234567T\",\"iban\":\"IE29AIBK93115212345674\",\"eircode\":\"D02 X285\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-business-register-readiness-helper, ireland-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for CRO number, VAT, address, banking, and official registry handoff readiness."
