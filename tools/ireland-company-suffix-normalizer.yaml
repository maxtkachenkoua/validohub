schemaVersion: 1
id: ireland-company-suffix-normalizer
kind: tool
module: validohub
country: IE
category: developer-tools
status: active
name:
  en: "Irish Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Ireland Sample Holding Ltd 123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-procurement-identifier-helper, ireland-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
