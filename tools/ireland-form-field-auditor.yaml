schemaVersion: 1
id: ireland-form-field-auditor
kind: tool
module: validohub
country: IE
category: developer-tools
status: active
name:
  en: "Irish Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=IE6388047V&postal=D02 X285&phone=+353 1 234 5678"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-locale-number-parser, ireland-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
