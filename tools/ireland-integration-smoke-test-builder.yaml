schemaVersion: 1
id: ireland-integration-smoke-test-builder
kind: tool
module: validohub
country: IE
category: developer-tools
status: active
name:
  en: "Irish Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"IE\",\"ppsn\":\"1234567T\",\"iban\":\"IE29AIBK93115212345674\",\"eircode\":\"D02 X285\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-ppsn-validator, ireland-cro-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
