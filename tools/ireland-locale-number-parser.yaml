schemaVersion: 1
id: ireland-locale-number-parser
kind: tool
module: validohub
country: IE
category: localization
status: active
name:
  en: "Irish Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Ireland."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-calendar-week-helper, ireland-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Ireland."
