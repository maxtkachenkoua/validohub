schemaVersion: 1
id: ireland-municipality-code-inspector
kind: tool
module: validohub
country: IE
category: address
status: active
name:
  en: "Irish Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "1 Grafton Street, Dublin, D02 X285"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-phone-number-validator, ireland-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
