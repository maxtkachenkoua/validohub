schemaVersion: 1
id: ireland-postal-code-validator
kind: tool
module: validohub
country: IE
category: address
status: active
name:
  en: "Irish Postal Code Validator"
summary:
  en: "Validate Eircode shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "D02 X285"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-address-normalizer, ireland-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Postal Code Validator | ValidoHub"
  description:
    en: "Validate Eircode shape, split area/delivery hints, and preserve official postal lookup boundaries."
