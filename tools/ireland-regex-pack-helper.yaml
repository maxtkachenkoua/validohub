schemaVersion: 1
id: ireland-regex-pack-helper
kind: tool
module: validohub
country: IE
category: developer-tools
status: active
name:
  en: "Irish Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "PPSN CRO number Eircode  IE29AIBK93115212345674"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-api-payload-auditor, ireland-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
