schemaVersion: 1
id: ireland-remittance-text-builder
kind: tool
module: validohub
country: IE
category: finance
status: active
name:
  en: "Irish Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 IE6388047V 1,234.56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-payment-reconciliation-helper, ireland-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
