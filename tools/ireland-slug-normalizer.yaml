schemaVersion: 1
id: ireland-slug-normalizer
kind: tool
module: validohub
country: IE
category: developer-tools
status: active
name:
  en: "Irish Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Ireland sample company 1 Grafton Street, Dublin, D02 X285"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-document-ocr-fixer, ireland-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
