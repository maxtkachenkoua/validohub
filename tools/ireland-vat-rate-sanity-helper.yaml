schemaVersion: 1
id: ireland-vat-rate-sanity-helper
kind: tool
module: validohub
country: IE
category: tax
status: active
name:
  en: "Irish VAT Rate Sanity Helper"
summary:
  en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ireland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "VAT / Revenue 20% base 1,234.56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [ireland-vat-return-field-helper, ireland-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Irish VAT Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
