schemaVersion: 1
id: israel-csv-locale-normalizer
kind: tool
module: validohub
country: IL
category: developer-tools
status: active
name:
  en: "Israeli CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Israel decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.israel-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 ILS;21/07/2026;512345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [israel-slug-normalizer, israel-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Israeli CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Israel decimal, date, postal, phone, tax, and banking fields."
