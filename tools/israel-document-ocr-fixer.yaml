schemaVersion: 1
id: israel-document-ocr-fixer
kind: tool
module: validohub
country: IL
category: documents
status: active
name:
  en: "Israeli Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.israel-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "123456782 512345678 010 800 0000099999999 9100001 Jerusalem"
    actions: [validate, parse, format, explain]
related:
  explicit: [israel-privacy-redaction-helper, israel-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Israeli Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
