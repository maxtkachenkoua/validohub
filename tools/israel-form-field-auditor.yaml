schemaVersion: 1
id: israel-form-field-auditor
kind: tool
module: validohub
country: IL
category: developer-tools
status: active
name:
  en: "Israeli Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.israel-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=512345678&postal=9100001 Jerusalem&phone=+972 50 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [israel-locale-number-parser, israel-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Israeli Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
