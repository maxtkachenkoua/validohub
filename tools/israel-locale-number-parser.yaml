schemaVersion: 1
id: israel-locale-number-parser
kind: tool
module: validohub
country: IL
category: localization
status: active
name:
  en: "Israeli Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Israel."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.israel-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 ILS"
    actions: [validate, parse, format, explain]
related:
  explicit: [israel-calendar-week-helper, israel-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Israeli Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Israel."
