schemaVersion: 1
id: israel-regex-pack-helper
kind: tool
module: validohub
country: IL
category: developer-tools
status: active
name:
  en: "Israeli Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.israel-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Teudat Zehut boundary company registration number postal code  010 800 0000099999999"
    actions: [validate, parse, format, explain]
related:
  explicit: [israel-api-payload-auditor, israel-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Israeli Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
