schemaVersion: 1
id: israel-slug-normalizer
kind: tool
module: validohub
country: IL
category: developer-tools
status: active
name:
  en: "Israeli Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.israel-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Israel sample company Jaffa Road 1, Jerusalem 9100001"
    actions: [validate, parse, format, explain]
related:
  explicit: [israel-document-ocr-fixer, israel-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Israeli Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
