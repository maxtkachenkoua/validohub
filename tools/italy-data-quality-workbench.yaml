schemaVersion: 1
id: italy-data-quality-workbench
kind: tool
module: validohub
country: IT
category: developer-tools
status: active
name:
  en: "Italian Data Quality Workbench"
summary:
  en: "Audit mixed Italian payloads for identifiers, dates, amounts, addresses, phone, and locale consistency."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "PIVA 12345678903 IBAN IT60X0542811101000000123456 Via Roma 10 00118 Roma importo 1.234,56"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed Italian payloads for identifiers, dates, amounts, addresses, phone, and locale consistency."
