schemaVersion: 1
id: italy-date-locale-formatter
kind: tool
module: validohub
country: IT
category: developer-tools
status: active
name:
  en: "Italian Date Locale Formatter"
summary:
  en: "Parse Italian date snippets, emit ISO/date-display variants, and expose day/month/year field slices."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "12/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian Date Locale Formatter | ValidoHub"
  description:
    en: "Parse Italian date snippets, emit ISO/date-display variants, and expose day/month/year field slices."
