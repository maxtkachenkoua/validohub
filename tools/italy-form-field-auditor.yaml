schemaVersion: 1
id: italy-form-field-auditor
kind: tool
module: validohub
country: IT
category: developer-tools
status: active
name:
  en: "Italian Form Field Auditor"
summary:
  en: "Check Italian form-field labels and values for VAT, CF, CAP, province, phone, address, and privacy handling."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "codice_fiscale=RSSMRA85M01H501Q&cap=00118&provincia=RM&telefono=+393471234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian Form Field Auditor | ValidoHub"
  description:
    en: "Check Italian form-field labels and values for VAT, CF, CAP, province, phone, address, and privacy handling."
