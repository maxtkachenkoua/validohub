schemaVersion: 1
id: italy-json-fixture-generator
kind: tool
module: validohub
country: IT
category: developer-tools
status: active
name:
  en: "Italian JSON Fixture Helper"
summary:
  en: "Inspect Italian JSON fixtures for locale, VAT, CF, IBAN, phone, date, and privacy-safe payload shape."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"locale\":\"it-IT\",\"piva\":\"12345678903\",\"iban\":\"IT60X0542811101000000123456\",\"data\":\"12/07/2026\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian JSON Fixture Helper | ValidoHub"
  description:
    en: "Inspect Italian JSON fixtures for locale, VAT, CF, IBAN, phone, date, and privacy-safe payload shape."
