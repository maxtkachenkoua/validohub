summary:
  en: "Inspect comune and Belfiore-style cadastral code snippets for place-code evidence and official lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COM input"
        required: true
        placeholder:
          en: "Comune Roma codice H501 CAP 00118"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian Municipality / Belfiore Code Inspector | ValidoHub"
  description:
    en: "Inspect comune and Belfiore-style cadastral code snippets for place-code evidence and official lookup boundaries."
