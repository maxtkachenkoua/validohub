schemaVersion: 1
id: italy-passport-number-helper
kind: tool
module: validohub
country: IT
category: national-identifiers
status: active
name:
  en: "Italian Passport Number Helper"
summary:
  en: "Inspect Italian passport-like document numbers, MRZ hints, dates, and official document-validation boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "Passaporto YA1234567 scadenza 12/07/2031"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-codice-fiscale-validator, italy-partita-iva-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian Passport Number Helper | ValidoHub"
  description:
    en: "Inspect Italian passport-like document numbers, MRZ hints, dates, and official document-validation boundaries."
