schemaVersion: 1
id: italy-postal-tracking-helper
kind: tool
module: validohub
country: IT
category: developer-tools
status: active
name:
  en: "Italian Postal Tracking Helper"
summary:
  en: "Inspect Poste/courier tracking-like snippets, country suffixes, dates, and carrier-status boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "RA123456789IT spedito 12/07/2026 CAP 00118"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian Postal Tracking Helper | ValidoHub"
  description:
    en: "Inspect Poste/courier tracking-like snippets, country suffixes, dates, and carrier-status boundaries."
