schemaVersion: 1
id: italy-slug-normalizer
kind: tool
module: validohub
country: IT
category: developer-tools
status: active
name:
  en: "Italian Slug Normalizer"
summary:
  en: "Create URL-safe slugs from Italian names, punctuation, accents, legal suffixes, and locale-specific text."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Caffe Roma S.r.l. - Unita d Italia"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian Slug Normalizer | ValidoHub"
  description:
    en: "Create URL-safe slugs from Italian names, punctuation, accents, legal suffixes, and locale-specific text."
