schemaVersion: 1
id: italy-vin-validator
kind: tool
module: validohub
country: IT
category: developer-tools
status: active
name:
  en: "Italian VIN Validator"
summary:
  en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare Italian vehicle-intake diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.italy-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VIN input"
        required: true
        placeholder:
          en: "ZFA3120000J123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [italy-postal-code-validator, italy-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Italian VIN Validator | ValidoHub"
  description:
    en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare Italian vehicle-intake diagnostics."
