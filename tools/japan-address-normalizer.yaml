    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "1-1 Chiyoda, Chiyoda-ku, Tokyo 100-0001"
    actions: [validate, parse, format, explain]
related:
