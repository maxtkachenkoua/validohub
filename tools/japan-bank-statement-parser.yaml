schemaVersion: 1
id: japan-bank-statement-parser
kind: tool
module: validohub
country: JP
category: finance
status: active
name:
  en: "Japanese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026/07/21; 1,234 JPY; 0001 001 1234567; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-masked-bank-account-formatter, japan-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
