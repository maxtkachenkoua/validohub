schemaVersion: 1
id: japan-company-suffix-normalizer
kind: tool
module: validohub
country: JP
category: developer-tools
status: active
name:
  en: "Japanese Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Japan Sample Holding Ltd 1234567890123"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-procurement-identifier-helper, japan-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
