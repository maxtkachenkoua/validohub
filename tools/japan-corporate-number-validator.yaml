capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ORG input"
        required: true
        placeholder:
          en: "1234567890123"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-tax-id-validator, japan-customs-importer-code-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Corporate Number Validator | ValidoHub"
  description:
    en: "Inspect Corporate Number structure, registry-style prefixes, control digits, and official lookup boundaries."
