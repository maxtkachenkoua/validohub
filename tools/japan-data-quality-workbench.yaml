schemaVersion: 1
id: japan-data-quality-workbench
kind: tool
module: validohub
country: JP
category: developer-tools
status: active
name:
  en: "Japanese Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"JP\",\"corporateNumber\":\"1234567890123\",\"invoiceNumber\":\"T1234567890123\",\"amount\":\"1,234\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-json-fixture-generator, japan-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
