schemaVersion: 1
id: japan-document-ocr-fixer
kind: tool
module: validohub
country: JP
category: documents
status: active
name:
  en: "Japanese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "123456789012 T1234567890123 0001 001 1234567 100-0001 Tokyo"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-privacy-redaction-helper, japan-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
