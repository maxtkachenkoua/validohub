schemaVersion: 1
id: japan-payment-reconciliation-helper
kind: tool
module: validohub
country: JP
category: finance
status: active
name:
  en: "Japanese Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "2026/07/21; 1,234 JPY; 0001 001 1234567; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-bank-statement-parser, japan-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
