schemaVersion: 1
id: japan-phone-number-validator
kind: tool
module: validohub
country: JP
category: address
status: active
name:
  en: "Japanese Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+81 3 1234 5678"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-phone-e164-formatter, japan-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
