      - type: textarea
        name: input
        label:
          en: "PROC input"
        required: true
        placeholder:
          en: "1234567890123 PO-2026-001 T1234567890123"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-accessibility-locale-copy-checker, japan-support-ticket-scrubber]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Procurement Identifier Helper | ValidoHub"
  description:
    en: "Inspect buyer/seller identifiers, invoice references, and public-procurement handoff evidence."
