schemaVersion: 1
id: japan-regex-pack-helper
kind: tool
module: validohub
country: JP
category: developer-tools
status: active
name:
  en: "Japanese Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "My Number Corporate Number postal code  0001 001 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-api-payload-auditor, japan-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
