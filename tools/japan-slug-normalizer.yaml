schemaVersion: 1
id: japan-slug-normalizer
kind: tool
module: validohub
country: JP
category: developer-tools
status: active
name:
  en: "Japanese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Japan sample company 1-1 Chiyoda, Chiyoda-ku, Tokyo 100-0001"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-document-ocr-fixer, japan-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
