schemaVersion: 1
id: japan-support-ticket-scrubber
kind: tool
module: validohub
country: JP
category: privacy
status: active
name:
  en: "Japanese Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 123456789012, 0001 001 1234567, 1-1 Chiyoda, Chiyoda-ku, Tokyo 100-0001"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-integration-smoke-test-builder, japan-my-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
