schemaVersion: 1
id: japan-tax-rate-sanity-helper
kind: tool
module: validohub
country: JP
category: tax
status: active
name:
  en: "Japanese Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.japan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "Consumption tax / T-number 20% base 1,234 JPY"
    actions: [validate, parse, format, explain]
related:
  explicit: [japan-tax-return-field-helper, japan-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Japanese Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
