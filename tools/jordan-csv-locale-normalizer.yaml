schemaVersion: 1
id: jordan-csv-locale-normalizer
kind: tool
module: validohub
country: JO
category: developer-tools
status: active
name:
  en: "Jordanian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Jordan decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.jordan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.560 JOD;21/07/2026;123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [jordan-slug-normalizer, jordan-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Jordanian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Jordan decimal, date, postal, phone, tax, and banking fields."
