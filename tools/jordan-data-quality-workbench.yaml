schemaVersion: 1
id: jordan-data-quality-workbench
kind: tool
module: validohub
country: JO
category: developer-tools
status: active
name:
  en: "Jordanian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.jordan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"JO\",\"national\":\"9901011234\",\"iban\":\"JO94CBJO0010000000000131000302\",\"cliq\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [jordan-json-fixture-generator, jordan-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Jordanian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
