schemaVersion: 1
id: jordan-form-field-auditor
kind: tool
module: validohub
country: JO
category: developer-tools
status: active
name:
  en: "Jordanian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.jordan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=123456789&postal=11118 Amman&phone=+962 7 9123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [jordan-locale-number-parser, jordan-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Jordanian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
