schemaVersion: 1
id: jordan-remittance-text-builder
kind: tool
module: validohub
country: JO
category: finance
status: active
name:
  en: "Jordanian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.jordan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 123456789 1,234.560 JOD"
    actions: [validate, parse, format, explain]
related:
  explicit: [jordan-payment-reconciliation-helper, jordan-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Jordanian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
