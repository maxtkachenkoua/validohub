schemaVersion: 1
id: jwt-jwk-oauth-inspector
kind: tool
module: validohub
category: developer-tools
status: active
name:
  en: JWT / JWK / OAuth Token Inspector
summary:
  en: Decode JWTs, inspect JWK/JWKS metadata, OAuth scopes, claim timelines, algorithm risk, and browser-only verification boundaries.
capabilities: [validate, generate, explain, parse]
algorithm:
  algorithmId: validohub.jwt-jwk-oauth
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: JWT, JWK, or OAuth material
      - type: select
        name: mode
        label:
          en: Profile
        options:
          - jwt
          - jwks
          - oauth
        default: "jwt"
    actions: [validate, generate, explain, parse]
related:
  explicit: [csp-builder-auditor, cookie-security-inspector, url-redirect-utm-workbench, http-message-diff-inspector]
  auto:
    sameCountry: false
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: JWT / JWK / OAuth Token Inspector
  description:
    en: Decode JWTs, inspect JWK/JWKS metadata, OAuth scopes, claim timelines, algorithm risk, and browser-only verification boundaries.
