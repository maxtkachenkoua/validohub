schemaVersion: 1
id: kazakhstan-bank-statement-parser
kind: tool
module: validohub
country: KZ
category: finance
status: active
name:
  en: "Kazakh Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kazakhstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1 234,56 KZT; 125 5004100100; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [kazakhstan-masked-bank-account-formatter, kazakhstan-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kazakh Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
