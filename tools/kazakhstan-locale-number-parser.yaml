schemaVersion: 1
id: kazakhstan-locale-number-parser
kind: tool
module: validohub
country: KZ
category: localization
status: active
name:
  en: "Kazakh Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kazakhstan."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kazakhstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 KZT"
    actions: [validate, parse, format, explain]
related:
  explicit: [kazakhstan-calendar-week-helper, kazakhstan-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kazakh Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kazakhstan."
