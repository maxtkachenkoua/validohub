schemaVersion: 1
id: kazakhstan-passport-number-helper
kind: tool
module: validohub
country: KZ
category: national-identifiers
status: active
name:
  en: "Kazakh Passport Number Helper"
summary:
  en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kazakhstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "P<KAZKAZAKH<<SAMPLE<<<<<<<<<<<<<<<<<<"
    actions: [validate, parse, format, explain]
related:
  explicit: [kazakhstan-mrz-passport-parser, kazakhstan-bank-account-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kazakh Passport Number Helper | ValidoHub"
  description:
    en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
