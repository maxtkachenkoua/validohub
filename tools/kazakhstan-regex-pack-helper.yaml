schemaVersion: 1
id: kazakhstan-regex-pack-helper
kind: tool
module: validohub
country: KZ
category: developer-tools
status: active
name:
  en: "Kazakh Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kazakhstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "IIN boundary BIN postal code  125 5004100100"
    actions: [validate, parse, format, explain]
related:
  explicit: [kazakhstan-api-payload-auditor, kazakhstan-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kazakh Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
