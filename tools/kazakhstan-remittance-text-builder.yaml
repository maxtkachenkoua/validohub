schemaVersion: 1
id: kazakhstan-remittance-text-builder
kind: tool
module: validohub
country: KZ
category: finance
status: active
name:
  en: "Kazakh Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kazakhstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 120940012345 1 234,56 KZT"
    actions: [validate, parse, format, explain]
related:
  explicit: [kazakhstan-payment-reconciliation-helper, kazakhstan-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kazakh Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
