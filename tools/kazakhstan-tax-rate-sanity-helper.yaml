  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kazakh Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
