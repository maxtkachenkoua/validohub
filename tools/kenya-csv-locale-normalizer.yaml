schemaVersion: 1
id: kenya-csv-locale-normalizer
kind: tool
module: validohub
country: KE
category: developer-tools
status: active
name:
  en: "Kenyan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Kenya decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kenya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 KES;24/07/2026;KE123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [kenya-slug-normalizer, kenya-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kenyan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Kenya decimal, date, postal, phone, tax, and banking fields."
