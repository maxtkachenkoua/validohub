schemaVersion: 1
id: kenya-document-ocr-fixer
kind: tool
module: validohub
country: KE
category: documents
status: active
name:
  en: "Kenyan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kenya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "KE-ID-123456 KE123456789 001 1234567890 1000 Nairobi"
    actions: [validate, parse, format, explain]
related:
  explicit: [kenya-privacy-redaction-helper, kenya-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kenyan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
