schemaVersion: 1
id: kenya-form-field-auditor
kind: tool
module: validohub
country: KE
category: developer-tools
status: active
name:
  en: "Kenyan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kenya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=KE123456789&postal=1000 Nairobi&phone=+254 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [kenya-locale-number-parser, kenya-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kenyan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
