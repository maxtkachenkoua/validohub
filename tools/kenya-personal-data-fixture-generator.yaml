  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kenyan Personal Data Fixture Helper | ValidoHub"
  description:
    en: "Generate fixture-safe local identity/address/payment snippets with clear non-official boundaries."
