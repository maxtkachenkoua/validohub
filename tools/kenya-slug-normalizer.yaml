schemaVersion: 1
id: kenya-slug-normalizer
kind: tool
module: validohub
country: KE
category: developer-tools
status: active
name:
  en: "Kenyan Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kenya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Kenya sample company Central business district, Nairobi 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [kenya-document-ocr-fixer, kenya-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kenyan Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
