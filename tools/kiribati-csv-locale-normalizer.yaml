schemaVersion: 1
id: kiribati-csv-locale-normalizer
kind: tool
module: validohub
country: KI
category: developer-tools
status: active
name:
  en: "I-Kiribati CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Kiribati decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kiribati-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 AUD;24/07/2026;KI123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [kiribati-slug-normalizer, kiribati-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "I-Kiribati CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Kiribati decimal, date, postal, phone, tax, and banking fields."
