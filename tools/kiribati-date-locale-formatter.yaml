schemaVersion: 1
id: kiribati-date-locale-formatter
kind: tool
module: validohub
country: KI
category: localization
status: active
name:
  en: "I-Kiribati Date Locale Formatter"
summary:
  en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kiribati-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "24/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [kiribati-csv-locale-normalizer, kiribati-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "I-Kiribati Date Locale Formatter | ValidoHub"
  description:
    en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
