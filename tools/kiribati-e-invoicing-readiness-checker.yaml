schemaVersion: 1
id: kiribati-e-invoicing-readiness-checker
kind: tool
module: validohub
country: KI
category: tax
status: active
name:
  en: "I-Kiribati tax invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kiribati-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"KI\",\"taxNumber\":\"KI123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [kiribati-tax-authority-handoff-helper, kiribati-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "I-Kiribati tax invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
