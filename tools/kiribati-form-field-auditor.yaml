schemaVersion: 1
id: kiribati-form-field-auditor
kind: tool
module: validohub
country: KI
category: developer-tools
status: active
name:
  en: "I-Kiribati Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kiribati-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=KI123456789&postal=South Tarawa&phone=+686 12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [kiribati-locale-number-parser, kiribati-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "I-Kiribati Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
