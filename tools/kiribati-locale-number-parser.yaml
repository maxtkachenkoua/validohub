schemaVersion: 1
id: kiribati-locale-number-parser
kind: tool
module: validohub
country: KI
category: localization
status: active
name:
  en: "I-Kiribati Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kiribati."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kiribati-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 AUD"
    actions: [validate, parse, format, explain]
related:
  explicit: [kiribati-calendar-week-helper, kiribati-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "I-Kiribati Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kiribati."
