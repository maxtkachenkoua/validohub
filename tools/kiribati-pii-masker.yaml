schemaVersion: 1
id: kiribati-pii-masker
kind: tool
module: validohub
country: KI
category: privacy
status: active
name:
  en: "I-Kiribati PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kiribati-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "KI-ID-123456 +686 12345 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [kiribati-personal-data-fixture-generator, kiribati-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "I-Kiribati PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
