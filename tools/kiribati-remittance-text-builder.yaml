schemaVersion: 1
id: kiribati-remittance-text-builder
kind: tool
module: validohub
country: KI
category: finance
status: active
name:
  en: "I-Kiribati Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kiribati-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 KI123456789 1,234.56 AUD"
    actions: [validate, parse, format, explain]
related:
  explicit: [kiribati-payment-reconciliation-helper, kiribati-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "I-Kiribati Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
