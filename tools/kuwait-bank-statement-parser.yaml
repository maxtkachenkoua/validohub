schemaVersion: 1
id: kuwait-bank-statement-parser
kind: tool
module: validohub
country: KW
category: finance
status: active
name:
  en: "Kuwaiti Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kuwait-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.560 KWD; CBKU 1234560101; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [kuwait-masked-bank-account-formatter, kuwait-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kuwaiti Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
