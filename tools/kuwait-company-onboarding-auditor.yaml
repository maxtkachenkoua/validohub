schemaVersion: 1
id: kuwait-company-onboarding-auditor
kind: tool
module: validohub
country: KW
category: developer-tools
status: active
name:
  en: "Kuwaiti Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kuwait-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"KW\",\"civilId\":\"290010112345\",\"iban\":\"KW81CBKU0000000000001234560101\",\"knet\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [kuwait-business-register-readiness-helper, kuwait-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kuwaiti Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
