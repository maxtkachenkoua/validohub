schemaVersion: 1
id: kuwait-form-field-auditor
kind: tool
module: validohub
country: KW
category: developer-tools
status: active
name:
  en: "Kuwaiti Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kuwait-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TF123456&postal=13001 Kuwait City&phone=+965 5123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [kuwait-locale-number-parser, kuwait-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kuwaiti Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
