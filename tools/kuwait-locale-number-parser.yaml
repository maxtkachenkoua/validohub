schemaVersion: 1
id: kuwait-locale-number-parser
kind: tool
module: validohub
country: KW
category: localization
status: active
name:
  en: "Kuwaiti Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kuwait."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kuwait-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.560 KWD"
    actions: [validate, parse, format, explain]
related:
  explicit: [kuwait-calendar-week-helper, kuwait-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kuwaiti Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kuwait."
