schemaVersion: 1
id: kuwait-phone-number-validator
kind: tool
module: validohub
country: KW
category: address
status: active
name:
  en: "Kuwaiti Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kuwait-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+965 5123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [kuwait-phone-e164-formatter, kuwait-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kuwaiti Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
