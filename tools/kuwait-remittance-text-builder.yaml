schemaVersion: 1
id: kuwait-remittance-text-builder
kind: tool
module: validohub
country: KW
category: finance
status: active
name:
  en: "Kuwaiti Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kuwait-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 TF123456 1,234.560 KWD"
    actions: [validate, parse, format, explain]
related:
  explicit: [kuwait-payment-reconciliation-helper, kuwait-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kuwaiti Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
