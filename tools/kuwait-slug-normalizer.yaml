schemaVersion: 1
id: kuwait-slug-normalizer
kind: tool
module: validohub
country: KW
category: developer-tools
status: active
name:
  en: "Kuwaiti Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kuwait-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Kuwait sample company Arabian Gulf Street 1, Kuwait City 13001"
    actions: [validate, parse, format, explain]
related:
  explicit: [kuwait-document-ocr-fixer, kuwait-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kuwaiti Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
