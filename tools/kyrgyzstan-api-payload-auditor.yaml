schemaVersion: 1
id: kyrgyzstan-api-payload-auditor
kind: tool
module: validohub
country: KG
category: developer-tools
status: active
name:
  en: "Kyrgyz API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"KG\",\"pin\":\"20101200123456\",\"bik\":\"109\",\"elsom\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-form-field-auditor, kyrgyzstan-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
