schemaVersion: 1
id: kyrgyzstan-company-onboarding-auditor
kind: tool
module: validohub
country: KG
category: developer-tools
status: active
name:
  en: "Kyrgyz Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for OKPO company code, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"KG\",\"pin\":\"20101200123456\",\"bik\":\"109\",\"elsom\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-business-register-readiness-helper, kyrgyzstan-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for OKPO company code, VAT, address, banking, and official registry handoff readiness."
