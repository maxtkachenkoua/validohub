schemaVersion: 1
id: kyrgyzstan-csv-locale-normalizer
kind: tool
module: validohub
country: KG
category: developer-tools
status: active
name:
  en: "Kyrgyz CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Kyrgyzstan decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 KGS;21.07.2026;12345678901234"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-slug-normalizer, kyrgyzstan-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Kyrgyzstan decimal, date, postal, phone, tax, and banking fields."
