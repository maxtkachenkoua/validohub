schemaVersion: 1
id: kyrgyzstan-data-quality-workbench
kind: tool
module: validohub
country: KG
category: developer-tools
status: active
name:
  en: "Kyrgyz Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"KG\",\"pin\":\"20101200123456\",\"bik\":\"109\",\"elsom\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-json-fixture-generator, kyrgyzstan-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
