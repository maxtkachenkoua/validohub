schemaVersion: 1
id: kyrgyzstan-document-ocr-fixer
kind: tool
module: validohub
country: KG
category: documents
status: active
name:
  en: "Kyrgyz Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "20101200123456 12345678901234 109 1234567890123456 720000 Bishkek"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-privacy-redaction-helper, kyrgyzstan-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
