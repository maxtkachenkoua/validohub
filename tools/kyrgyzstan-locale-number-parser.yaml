schemaVersion: 1
id: kyrgyzstan-locale-number-parser
kind: tool
module: validohub
country: KG
category: localization
status: active
name:
  en: "Kyrgyz Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kyrgyzstan."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 KGS"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-calendar-week-helper, kyrgyzstan-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Kyrgyzstan."
