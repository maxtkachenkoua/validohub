schemaVersion: 1
id: kyrgyzstan-pii-masker
kind: tool
module: validohub
country: KG
category: privacy
status: active
name:
  en: "Kyrgyz PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
