schemaVersion: 1
id: kyrgyzstan-postal-code-validator
kind: tool
module: validohub
country: KG
category: address
status: active
name:
  en: "Kyrgyz Postal Code Validator"
summary:
  en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "720000 Bishkek"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-address-normalizer, kyrgyzstan-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
