schemaVersion: 1
id: kyrgyzstan-regex-pack-helper
kind: tool
module: validohub
country: KG
category: developer-tools
status: active
name:
  en: "Kyrgyz Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "PIN boundary OKPO company code postal code  109 1234567890123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-api-payload-auditor, kyrgyzstan-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
