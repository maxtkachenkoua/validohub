schemaVersion: 1
id: kyrgyzstan-remittance-text-builder
kind: tool
module: validohub
country: KG
category: finance
status: active
name:
  en: "Kyrgyz Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 12345678901234 1 234,56 KGS"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-payment-reconciliation-helper, kyrgyzstan-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
