schemaVersion: 1
id: kyrgyzstan-vehicle-plate-inspector
kind: tool
module: validohub
country: KG
category: transport
status: active
name:
  en: "Kyrgyz Vehicle Plate Inspector"
summary:
  en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.kyrgyzstan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PLATE input"
        required: true
        placeholder:
          en: "01 KG 123 ABC"
    actions: [validate, parse, format, explain]
related:
  explicit: [kyrgyzstan-vin-validator, kyrgyzstan-vehicle-data-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Kyrgyz Vehicle Plate Inspector | ValidoHub"
  description:
    en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
