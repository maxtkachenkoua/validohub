schemaVersion: 1
id: laos-address-normalizer
kind: tool
module: validohub
country: LA
category: address
status: active
name:
  en: "Lao Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Lane Xang Avenue 1, Vientiane 01000"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-address-transliteration-normalizer, laos-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
