schemaVersion: 1
id: laos-address-transliteration-normalizer
kind: tool
module: validohub
country: LA
category: address
status: active
name:
  en: "Lao Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Lane Xang Avenue 1, Vientiane 01000"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-region-code-mapper, laos-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
