schemaVersion: 1
id: laos-api-payload-auditor
kind: tool
module: validohub
country: LA
category: developer-tools
status: active
name:
  en: "Lao API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"LA\",\"tin\":\"TIN123456789\",\"lapnet\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-form-field-auditor, laos-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
