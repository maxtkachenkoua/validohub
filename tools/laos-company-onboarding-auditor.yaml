schemaVersion: 1
id: laos-company-onboarding-auditor
kind: tool
module: validohub
country: LA
category: developer-tools
status: active
name:
  en: "Lao Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for enterprise registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"LA\",\"tin\":\"TIN123456789\",\"lapnet\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-business-register-readiness-helper, laos-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for enterprise registration number, VAT, address, banking, and official registry handoff readiness."
