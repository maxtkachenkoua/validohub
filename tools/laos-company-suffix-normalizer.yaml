schemaVersion: 1
id: laos-company-suffix-normalizer
kind: tool
module: validohub
country: LA
category: developer-tools
status: active
name:
  en: "Lao Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Laos Sample Holding Ltd ER-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-procurement-identifier-helper, laos-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
