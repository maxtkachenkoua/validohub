schemaVersion: 1
id: laos-customs-declaration-helper
kind: tool
module: validohub
country: LA
category: government
status: active
name:
  en: "Lao Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "TIN123456789 HS 8471 1,234,567 LAK"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-postal-tracking-helper, laos-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
