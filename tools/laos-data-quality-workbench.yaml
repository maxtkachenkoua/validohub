schemaVersion: 1
id: laos-data-quality-workbench
kind: tool
module: validohub
country: LA
category: developer-tools
status: active
name:
  en: "Lao Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"LA\",\"tin\":\"TIN123456789\",\"lapnet\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-json-fixture-generator, laos-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
