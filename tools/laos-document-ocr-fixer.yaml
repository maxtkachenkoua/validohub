schemaVersion: 1
id: laos-document-ocr-fixer
kind: tool
module: validohub
country: LA
category: documents
status: active
name:
  en: "Lao Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "010123456789 TIN123456789 010 1234567890 01000 Vientiane"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-privacy-redaction-helper, laos-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
