schemaVersion: 1
id: laos-form-field-auditor
kind: tool
module: validohub
country: LA
category: developer-tools
status: active
name:
  en: "Lao Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TIN123456789&postal=01000 Vientiane&phone=+856 20 1234 5678"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-locale-number-parser, laos-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
