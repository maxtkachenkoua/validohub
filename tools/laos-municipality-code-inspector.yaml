schemaVersion: 1
id: laos-municipality-code-inspector
kind: tool
module: validohub
country: LA
category: address
status: active
name:
  en: "Lao Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Lane Xang Avenue 1, Vientiane 01000"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-phone-number-validator, laos-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
