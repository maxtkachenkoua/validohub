schemaVersion: 1
id: laos-phone-e164-formatter
kind: tool
module: validohub
country: LA
category: address
status: active
name:
  en: "Lao Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+856 20 1234 5678"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-date-locale-formatter, laos-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
