schemaVersion: 1
id: laos-pii-masker
kind: tool
module: validohub
country: LA
category: privacy
status: active
name:
  en: "Lao PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "010123456789 +856 20 1234 5678 010 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-personal-data-fixture-generator, laos-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
