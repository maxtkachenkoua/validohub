schemaVersion: 1
id: laos-regex-pack-helper
kind: tool
module: validohub
country: LA
category: developer-tools
status: active
name:
  en: "Lao Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "National ID boundary enterprise registration number postal code  010 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-api-payload-auditor, laos-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
