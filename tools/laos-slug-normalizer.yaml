schemaVersion: 1
id: laos-slug-normalizer
kind: tool
module: validohub
country: LA
category: developer-tools
status: active
name:
  en: "Lao Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Laos sample company Lane Xang Avenue 1, Vientiane 01000"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-document-ocr-fixer, laos-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
