schemaVersion: 1
id: laos-tax-rate-sanity-helper
kind: tool
module: validohub
country: LA
category: tax
status: active
name:
  en: "Lao Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "TIN 20% base 1,234,567 LAK"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-tax-return-field-helper, laos-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
