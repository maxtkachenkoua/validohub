schemaVersion: 1
id: laos-vehicle-data-redaction-helper
kind: tool
module: validohub
country: LA
category: transport
status: active
name:
  en: "Lao Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.laos-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "VT 1234 WVWZZZ1JZXW000001 010123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [laos-customs-declaration-helper, laos-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lao Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
