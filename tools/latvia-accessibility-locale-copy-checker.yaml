schemaVersion: 1
id: latvia-accessibility-locale-copy-checker
kind: tool
module: validohub
country: LV
category: localization
status: active
name:
  en: "Latvian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "personal code input, pasta indekss input, amount 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-support-ticket-scrubber, latvia-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
