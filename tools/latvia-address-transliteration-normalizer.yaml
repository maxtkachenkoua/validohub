schemaVersion: 1
id: latvia-address-transliteration-normalizer
kind: tool
module: validohub
country: LV
category: address
status: active
name:
  en: "Latvian Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Brivibas iela 1, LV-1050 Riga"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-region-code-mapper, latvia-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
