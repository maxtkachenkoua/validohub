schemaVersion: 1
id: latvia-bank-statement-parser
kind: tool
module: validohub
country: LV
category: finance
status: active
name:
  en: "Latvian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1 234,56 EUR; LV80BANK0000435195001; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-masked-iban-formatter, latvia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
