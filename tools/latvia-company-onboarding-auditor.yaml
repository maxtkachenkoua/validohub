schemaVersion: 1
id: latvia-company-onboarding-auditor
kind: tool
module: validohub
country: LV
category: developer-tools
status: active
name:
  en: "Latvian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"LV\",\"pvn\":\"LV40003000000\",\"iban\":\"LV80BANK0000435195001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-business-register-readiness-helper, latvia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for registration number, VAT, address, banking, and official registry handoff readiness."
