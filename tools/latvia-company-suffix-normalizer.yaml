schemaVersion: 1
id: latvia-company-suffix-normalizer
kind: tool
module: validohub
country: LV
category: developer-tools
status: active
name:
  en: "Latvian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Latvia Sample Holding Ltd 40003000000"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-procurement-identifier-helper, latvia-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
