schemaVersion: 1
id: latvia-csv-locale-normalizer
kind: tool
module: validohub
country: LV
category: developer-tools
status: active
name:
  en: "Latvian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Latvia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 EUR;21.07.2026;LV40003000000"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-slug-normalizer, latvia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Latvia decimal, date, postal, phone, tax, and banking fields."
