schemaVersion: 1
id: latvia-data-quality-workbench
kind: tool
module: validohub
country: LV
category: developer-tools
status: active
name:
  en: "Latvian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"LV\",\"pvn\":\"LV40003000000\",\"iban\":\"LV80BANK0000435195001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-json-fixture-generator, latvia-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
