schemaVersion: 1
id: latvia-document-ocr-fixer
kind: tool
module: validohub
country: LV
category: documents
status: active
name:
  en: "Latvian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "010180-12345 LV40003000000 LV80BANK0000435195001 LV-1050 Riga"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-gdpr-redaction-helper, latvia-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
