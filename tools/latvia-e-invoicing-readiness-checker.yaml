schemaVersion: 1
id: latvia-e-invoicing-readiness-checker
kind: tool
module: validohub
country: LV
category: tax
status: active
name:
  en: "Latvian PVN invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"LV\",\"pvn\":\"LV40003000000\",\"iban\":\"LV80BANK0000435195001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-tax-authority-handoff-helper, latvia-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian PVN invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
