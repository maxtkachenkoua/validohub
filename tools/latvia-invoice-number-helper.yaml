schemaVersion: 1
id: latvia-invoice-number-helper
kind: tool
module: validohub
country: LV
category: tax
status: active
name:
  en: "Latvian Invoice Number Helper"
summary:
  en: "Inspect invoice numbering, period hints, VAT/customer evidence, and duplicate-risk diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "INV input"
        required: true
        placeholder:
          en: "INV-2026-0001 LV40003000000"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-e-invoicing-readiness-checker, latvia-tax-authority-handoff-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Invoice Number Helper | ValidoHub"
  description:
    en: "Inspect invoice numbering, period hints, VAT/customer evidence, and duplicate-risk diagnostics."
