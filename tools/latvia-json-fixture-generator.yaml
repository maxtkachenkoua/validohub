schemaVersion: 1
id: latvia-json-fixture-generator
kind: tool
module: validohub
country: LV
category: developer-tools
status: active
name:
  en: "Latvian JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"LV\",\"pvn\":\"LV40003000000\",\"iban\":\"LV80BANK0000435195001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-regex-pack-helper, latvia-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
