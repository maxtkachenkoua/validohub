schemaVersion: 1
id: latvia-payment-reconciliation-helper
kind: tool
module: validohub
country: LV
category: finance
status: active
name:
  en: "Latvian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.07.2026; 1 234,56 EUR; LV80BANK0000435195001; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-bank-statement-parser, latvia-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
