schemaVersion: 1
id: latvia-personal-code-validator
kind: tool
module: validohub
country: LV
category: national-identifiers
status: active
name:
  en: "Latvian personal code Validator"
summary:
  en: "Validate personal code shape, split date/control/body evidence, and prepare privacy-safe debugging output."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ID input"
        required: true
        placeholder:
          en: "010180-12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-registration-number-validator, latvia-vat-id-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian personal code Validator | ValidoHub"
  description:
    en: "Validate personal code shape, split date/control/body evidence, and prepare privacy-safe debugging output."
