schemaVersion: 1
id: latvia-pii-masker
kind: tool
module: validohub
country: LV
category: privacy
status: active
name:
  en: "Latvian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "010180-12345 +371 29 123 456 LV80BANK0000435195001"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-personal-data-fixture-generator, latvia-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
