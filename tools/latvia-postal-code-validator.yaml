schemaVersion: 1
id: latvia-postal-code-validator
kind: tool
module: validohub
country: LV
category: address
status: active
name:
  en: "Latvian Postal Code Validator"
summary:
  en: "Validate pasta indekss shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "LV-1050 Riga"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-address-normalizer, latvia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Postal Code Validator | ValidoHub"
  description:
    en: "Validate pasta indekss shape, split area/delivery hints, and preserve official postal lookup boundaries."
