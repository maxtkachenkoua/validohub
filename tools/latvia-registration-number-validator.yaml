schemaVersion: 1
id: latvia-registration-number-validator
kind: tool
module: validohub
country: LV
category: national-identifiers
status: active
name:
  en: "Latvian registration number Validator"
summary:
  en: "Inspect registration number structure, registry-style prefixes, control digits, and official lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ORG input"
        required: true
        placeholder:
          en: "40003000000"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-vat-id-validator, latvia-eori-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian registration number Validator | ValidoHub"
  description:
    en: "Inspect registration number structure, registry-style prefixes, control digits, and official lookup boundaries."
