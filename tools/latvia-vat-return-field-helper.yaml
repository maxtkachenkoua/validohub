schemaVersion: 1
id: latvia-vat-return-field-helper
kind: tool
module: validohub
country: LV
category: tax
status: active
name:
  en: "Latvian VAT Return Field Helper"
summary:
  en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "PVN / VAT; LV40003000000; period 2026-07; 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-invoice-number-helper, latvia-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian VAT Return Field Helper | ValidoHub"
  description:
    en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
