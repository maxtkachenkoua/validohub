schemaVersion: 1
id: latvia-vehicle-data-redaction-helper
kind: tool
module: validohub
country: LV
category: transport
status: active
name:
  en: "Latvian Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.latvia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "AB-1234 WVWZZZ1JZXW000001 010180-12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [latvia-customs-declaration-helper, latvia-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Latvian Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
