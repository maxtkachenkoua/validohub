schemaVersion: 1
id: lebanon-address-normalizer
kind: tool
module: validohub
country: LB
category: address
status: active
name:
  en: "Lebanese Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Hamra Street 1, Beirut 1107 2020"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-address-transliteration-normalizer, lebanon-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
