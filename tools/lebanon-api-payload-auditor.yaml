schemaVersion: 1
id: lebanon-api-payload-auditor
kind: tool
module: validohub
country: LB
category: developer-tools
status: active
name:
  en: "Lebanese API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"LB\",\"vat\":\"1234567-601\",\"iban\":\"LB62099900000001001901229114\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-form-field-auditor, lebanon-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
