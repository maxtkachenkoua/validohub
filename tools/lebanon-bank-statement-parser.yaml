schemaVersion: 1
id: lebanon-bank-statement-parser
kind: tool
module: validohub
country: LB
category: finance
status: active
name:
  en: "Lebanese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234,567 LBP; 0999 1001901229114; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-masked-bank-account-formatter, lebanon-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
