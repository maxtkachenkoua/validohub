schemaVersion: 1
id: lebanon-company-onboarding-auditor
kind: tool
module: validohub
country: LB
category: developer-tools
status: active
name:
  en: "Lebanese Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"LB\",\"vat\":\"1234567-601\",\"iban\":\"LB62099900000001001901229114\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-business-register-readiness-helper, lebanon-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
