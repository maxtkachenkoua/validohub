schemaVersion: 1
id: lebanon-customs-declaration-helper
kind: tool
module: validohub
country: LB
category: government
status: active
name:
  en: "Lebanese Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "1234567-601 HS 8471 1,234,567 LBP"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-postal-tracking-helper, lebanon-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
