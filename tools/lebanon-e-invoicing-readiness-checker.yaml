schemaVersion: 1
id: lebanon-e-invoicing-readiness-checker
kind: tool
module: validohub
country: LB
category: tax
status: active
name:
  en: "Lebanese VAT invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"LB\",\"vat\":\"1234567-601\",\"iban\":\"LB62099900000001001901229114\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-tax-authority-handoff-helper, lebanon-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese VAT invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
