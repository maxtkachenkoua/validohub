schemaVersion: 1
id: lebanon-form-field-auditor
kind: tool
module: validohub
country: LB
category: developer-tools
status: active
name:
  en: "Lebanese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=1234567-601&postal=1107 2020 Beirut&phone=+961 3 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-locale-number-parser, lebanon-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
