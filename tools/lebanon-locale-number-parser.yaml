schemaVersion: 1
id: lebanon-locale-number-parser
kind: tool
module: validohub
country: LB
category: localization
status: active
name:
  en: "Lebanese Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Lebanon."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234,567 LBP"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-calendar-week-helper, lebanon-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Lebanon."
