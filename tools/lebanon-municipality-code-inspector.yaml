schemaVersion: 1
id: lebanon-municipality-code-inspector
kind: tool
module: validohub
country: LB
category: address
status: active
name:
  en: "Lebanese Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Hamra Street 1, Beirut 1107 2020"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-phone-number-validator, lebanon-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
