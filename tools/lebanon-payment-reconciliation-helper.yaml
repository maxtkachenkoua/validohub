schemaVersion: 1
id: lebanon-payment-reconciliation-helper
kind: tool
module: validohub
country: LB
category: finance
status: active
name:
  en: "Lebanese Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234,567 LBP; 0999 1001901229114; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-bank-statement-parser, lebanon-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
