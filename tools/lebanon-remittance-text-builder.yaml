schemaVersion: 1
id: lebanon-remittance-text-builder
kind: tool
module: validohub
country: LB
category: finance
status: active
name:
  en: "Lebanese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 1234567-601 1,234,567 LBP"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-payment-reconciliation-helper, lebanon-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
