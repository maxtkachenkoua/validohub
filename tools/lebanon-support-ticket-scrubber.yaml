schemaVersion: 1
id: lebanon-support-ticket-scrubber
kind: tool
module: validohub
country: LB
category: privacy
status: active
name:
  en: "Lebanese Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 1234567890, 0999 1001901229114, Hamra Street 1, Beirut 1107 2020"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-integration-smoke-test-builder, lebanon-national-id-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
