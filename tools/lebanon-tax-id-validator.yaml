capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "1234567-601"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-customs-importer-code-helper, lebanon-nssf-boundary-social-insurance-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese VAT / tax number Validator | ValidoHub"
  description:
    en: "Normalize VAT / tax number identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
