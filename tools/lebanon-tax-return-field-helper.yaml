schemaVersion: 1
id: lebanon-tax-return-field-helper
kind: tool
module: validohub
country: LB
category: tax
status: active
name:
  en: "Lebanese Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lebanon-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "VAT / tax number; 1234567-601; period 2026-07; 1,234,567 LBP"
    actions: [validate, parse, format, explain]
related:
  explicit: [lebanon-invoice-number-helper, lebanon-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lebanese Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
