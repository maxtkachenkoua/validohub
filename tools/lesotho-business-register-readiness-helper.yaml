summary:
  en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lesotho-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REG input"
        required: true
        placeholder:
          en: "LS-REG-123456 LS123456789 Central business district, Maseru 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [lesotho-id-card-format-helper, lesotho-passport-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Basotho business registry Readiness Helper | ValidoHub"
  description:
    en: "Prepare browser-only evidence before a regulated business registry lookup or company registry workflow."
