  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Basotho LSL Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize LSL amount strings, decimal separators, grouping, and API-safe numeric previews."
