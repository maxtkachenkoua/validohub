schemaVersion: 1
id: lesotho-document-ocr-fixer
kind: tool
module: validohub
country: LS
category: documents
status: active
name:
  en: "Basotho Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lesotho-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "LS-ID-123456 LS123456789 001 1234567890 1000 Maseru"
    actions: [validate, parse, format, explain]
related:
  explicit: [lesotho-privacy-redaction-helper, lesotho-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Basotho Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
