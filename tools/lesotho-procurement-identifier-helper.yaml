    inputs:
      - type: textarea
        name: input
        label:
          en: "PROC input"
        required: true
        placeholder:
          en: "LS-REG-123456 PO-2026-001 LS123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [lesotho-accessibility-locale-copy-checker, lesotho-support-ticket-scrubber]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Basotho Procurement Identifier Helper | ValidoHub"
  description:
    en: "Inspect buyer/seller identifiers, invoice references, and public-procurement handoff evidence."
