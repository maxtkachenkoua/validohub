schemaVersion: 1
id: lesotho-vehicle-data-redaction-helper
kind: tool
module: validohub
country: LS
category: transport
status: active
name:
  en: "Basotho Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lesotho-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "LS 1234 WVWZZZ1JZXW000001 LS-ID-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [lesotho-customs-declaration-helper, lesotho-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Basotho Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
