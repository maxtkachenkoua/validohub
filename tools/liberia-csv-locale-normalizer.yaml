schemaVersion: 1
id: liberia-csv-locale-normalizer
kind: tool
module: validohub
country: LR
category: developer-tools
status: active
name:
  en: "Liberian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Liberia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liberia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 LRD;24/07/2026;LR123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [liberia-slug-normalizer, liberia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liberian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Liberia decimal, date, postal, phone, tax, and banking fields."
