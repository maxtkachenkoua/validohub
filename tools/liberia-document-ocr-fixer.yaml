schemaVersion: 1
id: liberia-document-ocr-fixer
kind: tool
module: validohub
country: LR
category: documents
status: active
name:
  en: "Liberian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liberia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "LR-ID-123456 LR123456789 001 1234567890 1000 Monrovia"
    actions: [validate, parse, format, explain]
related:
  explicit: [liberia-privacy-redaction-helper, liberia-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liberian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
