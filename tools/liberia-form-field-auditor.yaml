schemaVersion: 1
id: liberia-form-field-auditor
kind: tool
module: validohub
country: LR
category: developer-tools
status: active
name:
  en: "Liberian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liberia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=LR123456789&postal=1000 Monrovia&phone=+231 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [liberia-locale-number-parser, liberia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liberian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
