schemaVersion: 1
id: liberia-slug-normalizer
kind: tool
module: validohub
country: LR
category: developer-tools
status: active
name:
  en: "Liberian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liberia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Liberia sample company Central business district, Monrovia 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [liberia-document-ocr-fixer, liberia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liberian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
