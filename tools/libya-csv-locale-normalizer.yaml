schemaVersion: 1
id: libya-csv-locale-normalizer
kind: tool
module: validohub
country: LY
category: developer-tools
status: active
name:
  en: "Libyan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Libya decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.libya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 LYD;24/07/2026;LY123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [libya-slug-normalizer, libya-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Libyan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Libya decimal, date, postal, phone, tax, and banking fields."
