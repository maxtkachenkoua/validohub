    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Libyan LYD Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize LYD amount strings, decimal separators, grouping, and API-safe numeric previews."
