schemaVersion: 1
id: libya-document-ocr-fixer
kind: tool
module: validohub
country: LY
category: documents
status: active
name:
  en: "Libyan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.libya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "LY-ID-123456 LY123456789 001 1234567890 1000 Tripoli"
    actions: [validate, parse, format, explain]
related:
  explicit: [libya-privacy-redaction-helper, libya-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Libyan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
