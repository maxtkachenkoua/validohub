schemaVersion: 1
id: libya-form-field-auditor
kind: tool
module: validohub
country: LY
category: developer-tools
status: active
name:
  en: "Libyan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.libya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=LY123456789&postal=1000 Tripoli&phone=+218 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [libya-locale-number-parser, libya-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Libyan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
