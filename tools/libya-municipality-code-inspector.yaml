schemaVersion: 1
id: libya-municipality-code-inspector
kind: tool
module: validohub
country: LY
category: address
status: active
name:
  en: "Libyan Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.libya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Central business district, Tripoli 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [libya-phone-number-validator, libya-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Libyan Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
