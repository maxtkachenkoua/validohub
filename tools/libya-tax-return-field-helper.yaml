schemaVersion: 1
id: libya-tax-return-field-helper
kind: tool
module: validohub
country: LY
category: tax
status: active
name:
  en: "Libyan Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.libya-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "tax number / VAT boundary; LY123456789; period 2026-07; 1,234.56 LYD"
    actions: [validate, parse, format, explain]
related:
  explicit: [libya-invoice-number-helper, libya-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Libyan Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
