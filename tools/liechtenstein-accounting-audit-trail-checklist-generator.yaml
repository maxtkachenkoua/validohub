schemaVersion: 1
id: liechtenstein-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: LI
category: tax
status: active
name:
  en: "Liechtenstein Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21.07.2026 1'234.56 CHF CHE-123.456.789 MWST"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-postal-code-validator, liechtenstein-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
