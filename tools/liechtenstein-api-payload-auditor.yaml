schemaVersion: 1
id: liechtenstein-api-payload-auditor
kind: tool
module: validohub
country: LI
category: developer-tools
status: active
name:
  en: "Liechtenstein API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"LI\",\"company\":\"FL-0002.123.456-7\",\"iban\":\"LI21088100002324013AA\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-form-field-auditor, liechtenstein-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
