          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1'234.56 CHF; LI21088100002324013AA; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-masked-iban-formatter, liechtenstein-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
