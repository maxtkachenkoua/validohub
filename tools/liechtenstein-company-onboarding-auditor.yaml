schemaVersion: 1
id: liechtenstein-company-onboarding-auditor
kind: tool
module: validohub
country: LI
category: developer-tools
status: active
name:
  en: "Liechtenstein Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company register number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"LI\",\"company\":\"FL-0002.123.456-7\",\"iban\":\"LI21088100002324013AA\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-business-register-readiness-helper, liechtenstein-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company register number, VAT, address, banking, and official registry handoff readiness."
