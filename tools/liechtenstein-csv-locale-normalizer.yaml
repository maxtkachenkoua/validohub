schemaVersion: 1
id: liechtenstein-csv-locale-normalizer
kind: tool
module: validohub
country: LI
category: developer-tools
status: active
name:
  en: "Liechtenstein CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Liechtenstein decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1'234.56 CHF;21.07.2026;CHE-123.456.789 MWST"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-slug-normalizer, liechtenstein-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Liechtenstein decimal, date, postal, phone, tax, and banking fields."
