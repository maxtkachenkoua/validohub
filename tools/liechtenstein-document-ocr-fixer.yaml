schemaVersion: 1
id: liechtenstein-document-ocr-fixer
kind: tool
module: validohub
country: LI
category: documents
status: active
name:
  en: "Liechtenstein Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "756.1234.5678.97 CHE-123.456.789 MWST LI21088100002324013AA 9490 Vaduz"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-gdpr-redaction-helper, liechtenstein-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
