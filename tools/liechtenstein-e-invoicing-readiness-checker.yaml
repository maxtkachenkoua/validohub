        required: true
        placeholder:
          en: "{\"country\":\"LI\",\"company\":\"FL-0002.123.456-7\",\"iban\":\"LI21088100002324013AA\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-tax-authority-handoff-helper, liechtenstein-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein MWST invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
