schemaVersion: 1
id: liechtenstein-form-field-auditor
kind: tool
module: validohub
country: LI
category: developer-tools
status: active
name:
  en: "Liechtenstein Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=CHE-123.456.789 MWST&postal=9490 Vaduz&phone=+423 234 56 78"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-locale-number-parser, liechtenstein-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
