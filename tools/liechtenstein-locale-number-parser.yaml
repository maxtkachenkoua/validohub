schemaVersion: 1
id: liechtenstein-locale-number-parser
kind: tool
module: validohub
country: LI
category: localization
status: active
name:
  en: "Liechtenstein Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Liechtenstein."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1'234.56 CHF"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-calendar-week-helper, liechtenstein-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Liechtenstein."
