schemaVersion: 1
id: liechtenstein-phone-number-validator
kind: tool
module: validohub
country: LI
category: address
status: active
name:
  en: "Liechtenstein Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+423 234 56 78"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-phone-e164-formatter, liechtenstein-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
