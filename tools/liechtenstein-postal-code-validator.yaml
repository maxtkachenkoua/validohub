schemaVersion: 1
id: liechtenstein-postal-code-validator
kind: tool
module: validohub
country: LI
category: address
status: active
name:
  en: "Liechtenstein Postal Code Validator"
summary:
  en: "Validate Postleitzahl shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.liechtenstein-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "9490 Vaduz"
    actions: [validate, parse, format, explain]
related:
  explicit: [liechtenstein-address-normalizer, liechtenstein-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Liechtenstein Postal Code Validator | ValidoHub"
  description:
    en: "Validate Postleitzahl shape, split area/delivery hints, and preserve official postal lookup boundaries."
