schemaVersion: 1
id: lithuania-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: LT
category: tax
status: active
name:
  en: "Lithuanian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lithuania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 2026-07-21 1 234,56 EUR LT123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [lithuania-postal-code-validator, lithuania-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lithuanian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
