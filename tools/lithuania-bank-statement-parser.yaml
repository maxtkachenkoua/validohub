schemaVersion: 1
id: lithuania-bank-statement-parser
kind: tool
module: validohub
country: LT
category: finance
status: active
name:
  en: "Lithuanian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lithuania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026-07-21; 1 234,56 EUR; LT121000011101001000; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [lithuania-masked-iban-formatter, lithuania-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lithuanian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
