schemaVersion: 1
id: lithuania-company-onboarding-auditor
kind: tool
module: validohub
country: LT
category: developer-tools
status: active
name:
  en: "Lithuanian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company code, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lithuania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"LT\",\"pvm\":\"LT123456789\",\"iban\":\"LT121000011101001000\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [lithuania-business-register-readiness-helper, lithuania-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lithuanian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company code, VAT, address, banking, and official registry handoff readiness."
