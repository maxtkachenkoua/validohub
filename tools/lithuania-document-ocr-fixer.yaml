schemaVersion: 1
id: lithuania-document-ocr-fixer
kind: tool
module: validohub
country: LT
category: documents
status: active
name:
  en: "Lithuanian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lithuania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "38001010017 LT123456789 LT121000011101001000 LT-01100 Vilnius"
    actions: [validate, parse, format, explain]
related:
  explicit: [lithuania-gdpr-redaction-helper, lithuania-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lithuanian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
