schemaVersion: 1
id: lithuania-form-field-auditor
kind: tool
module: validohub
country: LT
category: developer-tools
status: active
name:
  en: "Lithuanian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lithuania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=LT123456789&postal=LT-01100 Vilnius&phone=+370 612 34567"
    actions: [validate, parse, format, explain]
related:
  explicit: [lithuania-locale-number-parser, lithuania-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lithuanian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
