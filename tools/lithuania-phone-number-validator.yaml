schemaVersion: 1
id: lithuania-phone-number-validator
kind: tool
module: validohub
country: LT
category: address
status: active
name:
  en: "Lithuanian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lithuania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+370 612 34567"
    actions: [validate, parse, format, explain]
related:
  explicit: [lithuania-phone-e164-formatter, lithuania-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lithuanian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
