schemaVersion: 1
id: lithuania-slug-normalizer
kind: tool
module: validohub
country: LT
category: developer-tools
status: active
name:
  en: "Lithuanian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.lithuania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Lithuania sample company Gedimino pr. 1, LT-01103 Vilnius"
    actions: [validate, parse, format, explain]
related:
  explicit: [lithuania-document-ocr-fixer, lithuania-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Lithuanian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
