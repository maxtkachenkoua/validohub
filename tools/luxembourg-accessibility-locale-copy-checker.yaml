    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Luxembourgish Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
