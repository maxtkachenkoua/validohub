schemaVersion: 1
id: luxembourg-company-suffix-normalizer
kind: tool
module: validohub
country: LU
category: developer-tools
status: active
name:
  en: "Luxembourgish Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.luxembourg-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Luxembourg Sample Holding Ltd B123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [luxembourg-procurement-identifier-helper, luxembourg-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Luxembourgish Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
