schemaVersion: 1
id: luxembourg-csv-locale-normalizer
kind: tool
module: validohub
country: LU
category: developer-tools
status: active
name:
  en: "Luxembourgish CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Luxembourg decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.luxembourg-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 EUR;21/07/2026;LU12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [luxembourg-slug-normalizer, luxembourg-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Luxembourgish CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Luxembourg decimal, date, postal, phone, tax, and banking fields."
