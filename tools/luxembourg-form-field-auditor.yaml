schemaVersion: 1
id: luxembourg-form-field-auditor
kind: tool
module: validohub
country: LU
category: developer-tools
status: active
name:
  en: "Luxembourgish Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.luxembourg-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=LU12345678&postal=L-1111 Luxembourg&phone=+352 621 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [luxembourg-locale-number-parser, luxembourg-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Luxembourgish Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
