schemaVersion: 1
id: luxembourg-regex-pack-helper
kind: tool
module: validohub
country: LU
category: developer-tools
status: active
name:
  en: "Luxembourgish Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.luxembourg-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "matricule RCS number code postal  LU280019400644750000"
    actions: [validate, parse, format, explain]
related:
  explicit: [luxembourg-api-payload-auditor, luxembourg-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Luxembourgish Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
