schemaVersion: 1
id: madagascar-csv-locale-normalizer
kind: tool
module: validohub
country: MG
category: developer-tools
status: active
name:
  en: "Malagasy CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Madagascar decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.madagascar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 MGA;24/07/2026;MG123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [madagascar-slug-normalizer, madagascar-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malagasy CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Madagascar decimal, date, postal, phone, tax, and banking fields."
