schemaVersion: 1
id: madagascar-form-field-auditor
kind: tool
module: validohub
country: MG
category: developer-tools
status: active
name:
  en: "Malagasy Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.madagascar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=MG123456789&postal=1000 Antananarivo&phone=+261 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [madagascar-locale-number-parser, madagascar-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malagasy Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
