schemaVersion: 1
id: madagascar-locale-number-parser
kind: tool
module: validohub
country: MG
category: localization
status: active
name:
  en: "Malagasy Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Madagascar."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.madagascar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 MGA"
    actions: [validate, parse, format, explain]
related:
  explicit: [madagascar-calendar-week-helper, madagascar-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malagasy Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Madagascar."
