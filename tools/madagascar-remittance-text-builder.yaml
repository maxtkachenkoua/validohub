schemaVersion: 1
id: madagascar-remittance-text-builder
kind: tool
module: validohub
country: MG
category: finance
status: active
name:
  en: "Malagasy Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.madagascar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 MG123456789 1,234.56 MGA"
    actions: [validate, parse, format, explain]
related:
  explicit: [madagascar-payment-reconciliation-helper, madagascar-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malagasy Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
