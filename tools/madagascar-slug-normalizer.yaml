schemaVersion: 1
id: madagascar-slug-normalizer
kind: tool
module: validohub
country: MG
category: developer-tools
status: active
name:
  en: "Malagasy Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.madagascar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Madagascar sample company Central business district, Antananarivo 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [madagascar-document-ocr-fixer, madagascar-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malagasy Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
