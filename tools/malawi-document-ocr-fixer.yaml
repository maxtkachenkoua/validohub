schemaVersion: 1
id: malawi-document-ocr-fixer
kind: tool
module: validohub
country: MW
category: documents
status: active
name:
  en: "Malawian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malawi-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "MW-ID-123456 MW123456789 001 1234567890 1000 Lilongwe"
    actions: [validate, parse, format, explain]
related:
  explicit: [malawi-privacy-redaction-helper, malawi-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malawian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
