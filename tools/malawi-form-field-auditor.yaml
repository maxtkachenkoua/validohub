schemaVersion: 1
id: malawi-form-field-auditor
kind: tool
module: validohub
country: MW
category: developer-tools
status: active
name:
  en: "Malawian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malawi-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=MW123456789&postal=1000 Lilongwe&phone=+265 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [malawi-locale-number-parser, malawi-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malawian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
