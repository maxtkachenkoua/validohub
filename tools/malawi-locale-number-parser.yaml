schemaVersion: 1
id: malawi-locale-number-parser
kind: tool
module: validohub
country: MW
category: localization
status: active
name:
  en: "Malawian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Malawi."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malawi-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 MWK"
    actions: [validate, parse, format, explain]
related:
  explicit: [malawi-calendar-week-helper, malawi-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malawian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Malawi."
