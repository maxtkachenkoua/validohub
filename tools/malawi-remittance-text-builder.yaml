schemaVersion: 1
id: malawi-remittance-text-builder
kind: tool
module: validohub
country: MW
category: finance
status: active
name:
  en: "Malawian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malawi-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 MW123456789 1,234.56 MWK"
    actions: [validate, parse, format, explain]
related:
  explicit: [malawi-payment-reconciliation-helper, malawi-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malawian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
