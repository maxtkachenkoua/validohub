schemaVersion: 1
id: malawi-slug-normalizer
kind: tool
module: validohub
country: MW
category: developer-tools
status: active
name:
  en: "Malawian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malawi-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Malawi sample company Central business district, Lilongwe 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [malawi-document-ocr-fixer, malawi-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malawian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
