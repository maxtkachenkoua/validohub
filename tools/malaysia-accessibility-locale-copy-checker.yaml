schemaVersion: 1
id: malaysia-accessibility-locale-copy-checker
kind: tool
module: validohub
country: MY
category: localization
status: active
name:
  en: "Malaysian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malaysia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "MyKad boundary input, postcode input, amount 1,234.56 MYR"
    actions: [validate, parse, format, explain]
related:
  explicit: [malaysia-support-ticket-scrubber, malaysia-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malaysian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
