schemaVersion: 1
id: malaysia-bank-statement-parser
kind: tool
module: validohub
country: MY
category: finance
status: active
name:
  en: "Malaysian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malaysia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 MYR; 5140 123456789012; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [malaysia-masked-bank-account-formatter, malaysia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malaysian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
