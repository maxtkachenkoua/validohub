schemaVersion: 1
id: malaysia-company-onboarding-auditor
kind: tool
module: validohub
country: MY
category: developer-tools
status: active
name:
  en: "Malaysian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for SSM registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malaysia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"MY\",\"ssm\":\"201901234567\",\"tin\":\"C1234567890\",\"duitnow\":\"+60123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [malaysia-business-register-readiness-helper, malaysia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malaysian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for SSM registration number, VAT, address, banking, and official registry handoff readiness."
