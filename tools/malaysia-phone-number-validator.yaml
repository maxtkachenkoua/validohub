schemaVersion: 1
id: malaysia-phone-number-validator
kind: tool
module: validohub
country: MY
category: address
status: active
name:
  en: "Malaysian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malaysia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+60 12 345 6789"
    actions: [validate, parse, format, explain]
related:
  explicit: [malaysia-phone-e164-formatter, malaysia-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malaysian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
