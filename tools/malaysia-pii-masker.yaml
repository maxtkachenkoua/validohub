schemaVersion: 1
id: malaysia-pii-masker
kind: tool
module: validohub
country: MY
category: privacy
status: active
name:
  en: "Malaysian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malaysia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "900101-14-5678 +60 12 345 6789 5140 123456789012"
    actions: [validate, parse, format, explain]
related:
  explicit: [malaysia-personal-data-fixture-generator, malaysia-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malaysian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
