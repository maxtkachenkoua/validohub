schemaVersion: 1
id: malaysia-regex-pack-helper
kind: tool
module: validohub
country: MY
category: developer-tools
status: active
name:
  en: "Malaysian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malaysia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "MyKad boundary SSM registration number postcode  5140 123456789012"
    actions: [validate, parse, format, explain]
related:
  explicit: [malaysia-api-payload-auditor, malaysia-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malaysian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
