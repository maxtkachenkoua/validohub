schemaVersion: 1
id: malaysia-slug-normalizer
kind: tool
module: validohub
country: MY
category: developer-tools
status: active
name:
  en: "Malaysian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malaysia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Malaysia sample company Jalan Ampang 1, 50050 Kuala Lumpur"
    actions: [validate, parse, format, explain]
related:
  explicit: [malaysia-document-ocr-fixer, malaysia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malaysian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
