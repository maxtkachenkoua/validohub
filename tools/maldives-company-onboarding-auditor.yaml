schemaVersion: 1
id: maldives-company-onboarding-auditor
kind: tool
module: validohub
country: MV
category: developer-tools
status: active
name:
  en: "Maldivian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.maldives-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"MV\",\"gst\":\"GST123456\",\"bank\":\"0011234567890\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [maldives-business-register-readiness-helper, maldives-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maldivian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
