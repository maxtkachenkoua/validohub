schemaVersion: 1
id: maldives-company-suffix-normalizer
kind: tool
module: validohub
country: MV
category: developer-tools
status: active
name:
  en: "Maldivian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.maldives-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Maldives Sample Holding Ltd C-012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [maldives-procurement-identifier-helper, maldives-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maldivian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
