schemaVersion: 1
id: maldives-csv-locale-normalizer
kind: tool
module: validohub
country: MV
category: developer-tools
status: active
name:
  en: "Maldivian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Maldives decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.maldives-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 MVR;21/07/2026;GST123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [maldives-slug-normalizer, maldives-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maldivian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Maldives decimal, date, postal, phone, tax, and banking fields."
