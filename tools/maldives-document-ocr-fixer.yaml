schemaVersion: 1
id: maldives-document-ocr-fixer
kind: tool
module: validohub
country: MV
category: documents
status: active
name:
  en: "Maldivian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.maldives-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "A123456 GST123456 001 1234567890 Male 20026"
    actions: [validate, parse, format, explain]
related:
  explicit: [maldives-privacy-redaction-helper, maldives-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maldivian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
