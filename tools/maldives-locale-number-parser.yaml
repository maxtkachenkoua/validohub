schemaVersion: 1
id: maldives-locale-number-parser
kind: tool
module: validohub
country: MV
category: localization
status: active
name:
  en: "Maldivian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Maldives."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.maldives-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 MVR"
    actions: [validate, parse, format, explain]
related:
  explicit: [maldives-calendar-week-helper, maldives-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maldivian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Maldives."
