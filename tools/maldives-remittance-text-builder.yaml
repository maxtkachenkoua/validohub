schemaVersion: 1
id: maldives-remittance-text-builder
kind: tool
module: validohub
country: MV
category: finance
status: active
name:
  en: "Maldivian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.maldives-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 GST123456 1,234.56 MVR"
    actions: [validate, parse, format, explain]
related:
  explicit: [maldives-payment-reconciliation-helper, maldives-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maldivian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
