schemaVersion: 1
id: maldives-slug-normalizer
kind: tool
module: validohub
country: MV
category: developer-tools
status: active
name:
  en: "Maldivian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.maldives-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Maldives sample company Majeedhee Magu 1, Male 20026"
    actions: [validate, parse, format, explain]
related:
  explicit: [maldives-document-ocr-fixer, maldives-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maldivian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
