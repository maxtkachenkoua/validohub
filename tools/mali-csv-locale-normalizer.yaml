schemaVersion: 1
id: mali-csv-locale-normalizer
kind: tool
module: validohub
country: ML
category: developer-tools
status: active
name:
  en: "Malian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Mali decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mali-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;ML123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [mali-slug-normalizer, mali-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Mali decimal, date, postal, phone, tax, and banking fields."
