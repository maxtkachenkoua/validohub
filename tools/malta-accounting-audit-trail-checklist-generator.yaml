schemaVersion: 1
id: malta-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: MT
category: tax
status: active
name:
  en: "Maltese Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21/07/2026 1,234.56 EUR MT12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-postal-code-validator, malta-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
