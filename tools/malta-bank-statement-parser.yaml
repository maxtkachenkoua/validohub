schemaVersion: 1
id: malta-bank-statement-parser
kind: tool
module: validohub
country: MT
category: finance
status: active
name:
  en: "Maltese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 EUR; MT84MALT011000012345MTLCAST001S; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-masked-iban-formatter, malta-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
