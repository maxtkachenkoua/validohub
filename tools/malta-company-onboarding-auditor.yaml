schemaVersion: 1
id: malta-company-onboarding-auditor
kind: tool
module: validohub
country: MT
category: developer-tools
status: active
name:
  en: "Maltese Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company C number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"MT\",\"vat\":\"MT12345678\",\"iban\":\"MT84MALT011000012345MTLCAST001S\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-business-register-readiness-helper, malta-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company C number, VAT, address, banking, and official registry handoff readiness."
