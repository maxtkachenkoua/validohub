summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Malta Sample Holding Ltd C12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-procurement-identifier-helper, malta-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
