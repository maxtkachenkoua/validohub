schemaVersion: 1
id: malta-csv-locale-normalizer
kind: tool
module: validohub
country: MT
category: developer-tools
status: active
name:
  en: "Maltese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Malta decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 EUR;21/07/2026;MT12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-slug-normalizer, malta-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Malta decimal, date, postal, phone, tax, and banking fields."
