schemaVersion: 1
id: malta-document-ocr-fixer
kind: tool
module: validohub
country: MT
category: documents
status: active
name:
  en: "Maltese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "1234567M MT12345678 MT84MALT011000012345MTLCAST001S VLT 1111 Valletta"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-gdpr-redaction-helper, malta-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
