schemaVersion: 1
id: malta-e-invoicing-readiness-checker
kind: tool
module: validohub
country: MT
category: tax
status: active
name:
  en: "Maltese VAT invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"MT\",\"vat\":\"MT12345678\",\"iban\":\"MT84MALT011000012345MTLCAST001S\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-tax-authority-handoff-helper, malta-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese VAT invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
