schemaVersion: 1
id: malta-form-field-auditor
kind: tool
module: validohub
country: MT
category: developer-tools
status: active
name:
  en: "Maltese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=MT12345678&postal=VLT 1111 Valletta&phone=+356 2123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-locale-number-parser, malta-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
