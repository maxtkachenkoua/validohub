schemaVersion: 1
id: malta-iban-validator
kind: tool
module: validohub
country: MT
category: finance
status: active
name:
  en: "Malta IBAN Validator"
summary:
  en: "Validate MT IBAN shape, replay MOD-97 evidence, and split bank/account blocks for debugging."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "IBAN input"
        required: true
        placeholder:
          en: "MT84MALT011000012345MTLCAST001S"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-iban-generator, malta-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Malta IBAN Validator | ValidoHub"
  description:
    en: "Validate MT IBAN shape, replay MOD-97 evidence, and split bank/account blocks for debugging."
