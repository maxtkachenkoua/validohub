    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Masked IBAN Formatter | ValidoHub"
  description:
    en: "Create log-safe IBAN previews while preserving country, check digits, and account-tail evidence."
