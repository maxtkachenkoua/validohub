schemaVersion: 1
id: malta-payment-reconciliation-helper
kind: tool
module: validohub
country: MT
category: finance
status: active
name:
  en: "Maltese Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 EUR; MT84MALT011000012345MTLCAST001S; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-bank-statement-parser, malta-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
