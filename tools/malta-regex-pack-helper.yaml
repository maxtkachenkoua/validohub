schemaVersion: 1
id: malta-regex-pack-helper
kind: tool
module: validohub
country: MT
category: developer-tools
status: active
name:
  en: "Maltese Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "ID card number company C number postal code  MT84MALT011000012345MTLCAST001S"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-api-payload-auditor, malta-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
