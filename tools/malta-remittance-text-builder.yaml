schemaVersion: 1
id: malta-remittance-text-builder
kind: tool
module: validohub
country: MT
category: finance
status: active
name:
  en: "Maltese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.malta-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 MT12345678 1,234.56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [malta-payment-reconciliation-helper, malta-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Maltese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
