schemaVersion: 1
id: marshall-islands-api-payload-auditor
kind: tool
module: validohub
country: MH
category: developer-tools
status: active
name:
  en: "Marshallese API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.marshall-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"MH\",\"company\":\"MH-REG-123456\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-form-field-auditor, marshall-islands-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
