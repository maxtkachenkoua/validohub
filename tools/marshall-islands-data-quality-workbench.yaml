schemaVersion: 1
id: marshall-islands-data-quality-workbench
kind: tool
module: validohub
country: MH
category: developer-tools
status: active
name:
  en: "Marshallese Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.marshall-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"MH\",\"company\":\"MH-REG-123456\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-json-fixture-generator, marshall-islands-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
