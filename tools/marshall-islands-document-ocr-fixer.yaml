      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "MH-ID-123456 MH123456789 001 1234567890 Majuro MH 96960"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-privacy-redaction-helper, marshall-islands-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
