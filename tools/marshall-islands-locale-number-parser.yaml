schemaVersion: 1
id: marshall-islands-locale-number-parser
kind: tool
module: validohub
country: MH
category: localization
status: active
name:
  en: "Marshallese Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Marshall Islands."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.marshall-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 USD"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-calendar-week-helper, marshall-islands-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Marshall Islands."
