capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.marshall-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "07/24/2026; 1,234.56 USD; 001 1234567890; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-bank-statement-parser, marshall-islands-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
