schemaVersion: 1
id: marshall-islands-phone-e164-formatter
kind: tool
module: validohub
country: MH
category: address
status: active
name:
  en: "Marshallese Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.marshall-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+692 247 1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-date-locale-formatter, marshall-islands-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
