schemaVersion: 1
id: marshall-islands-pii-masker
kind: tool
module: validohub
country: MH
category: privacy
status: active
name:
  en: "Marshallese PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.marshall-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "MH-ID-123456 +692 247 1234 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-personal-data-fixture-generator, marshall-islands-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
