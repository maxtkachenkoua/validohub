schemaVersion: 1
id: marshall-islands-slug-normalizer
kind: tool
module: validohub
country: MH
category: developer-tools
status: active
name:
  en: "Marshallese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.marshall-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Marshall Islands sample company Delap, Majuro MH 96960"
    actions: [validate, parse, format, explain]
related:
  explicit: [marshall-islands-document-ocr-fixer, marshall-islands-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Marshallese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
