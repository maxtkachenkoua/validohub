schemaVersion: 1
id: mauritania-form-field-auditor
kind: tool
module: validohub
country: MR
category: developer-tools
status: active
name:
  en: "Mauritanian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mauritania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=MR123456789&postal=1000 Nouakchott&phone=+222 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [mauritania-locale-number-parser, mauritania-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mauritanian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
