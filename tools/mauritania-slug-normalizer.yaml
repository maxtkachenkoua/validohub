schemaVersion: 1
id: mauritania-slug-normalizer
kind: tool
module: validohub
country: MR
category: developer-tools
status: active
name:
  en: "Mauritanian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mauritania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Mauritania sample company Central business district, Nouakchott 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [mauritania-document-ocr-fixer, mauritania-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mauritanian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
