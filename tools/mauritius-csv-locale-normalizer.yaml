schemaVersion: 1
id: mauritius-csv-locale-normalizer
kind: tool
module: validohub
country: MU
category: developer-tools
status: active
name:
  en: "Mauritian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Mauritius decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mauritius-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 MUR;24/07/2026;MU123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [mauritius-slug-normalizer, mauritius-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mauritian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Mauritius decimal, date, postal, phone, tax, and banking fields."
