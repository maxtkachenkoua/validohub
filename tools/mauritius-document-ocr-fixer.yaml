schemaVersion: 1
id: mauritius-document-ocr-fixer
kind: tool
module: validohub
country: MU
category: documents
status: active
name:
  en: "Mauritian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mauritius-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "MU-ID-123456 MU123456789 001 1234567890 1000 Port Louis"
    actions: [validate, parse, format, explain]
related:
  explicit: [mauritius-privacy-redaction-helper, mauritius-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mauritian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
