schemaVersion: 1
id: micronesia-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: FM
category: tax
status: active
name:
  en: "Micronesian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.micronesia-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 07/24/2026 1,234.56 USD FM123456789"
    actions: [generate, validate, explain]
related:
  explicit: [micronesia-postal-code-validator, micronesia-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Micronesian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
