schemaVersion: 1
id: micronesia-bank-statement-parser
kind: tool
module: validohub
country: FM
category: finance
status: active
name:
  en: "Micronesian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.micronesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "07/24/2026; 1,234.56 USD; 001 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [micronesia-masked-bank-account-formatter, micronesia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Micronesian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
