schemaVersion: 1
id: micronesia-company-onboarding-auditor
kind: tool
module: validohub
country: FM
category: developer-tools
status: active
name:
  en: "Micronesian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.micronesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"FM\",\"taxNumber\":\"FM123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [micronesia-business-register-readiness-helper, micronesia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Micronesian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
