schemaVersion: 1
id: micronesia-data-quality-workbench
kind: tool
module: validohub
country: FM
category: developer-tools
status: active
name:
  en: "Micronesian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.micronesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"FM\",\"taxNumber\":\"FM123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [micronesia-json-fixture-generator, micronesia-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Micronesian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
