schemaVersion: 1
id: micronesia-form-field-auditor
kind: tool
module: validohub
country: FM
category: developer-tools
status: active
name:
  en: "Micronesian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.micronesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=FM123456789&postal=Palikir, Pohnpei&phone=+691 320 1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [micronesia-locale-number-parser, micronesia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Micronesian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
