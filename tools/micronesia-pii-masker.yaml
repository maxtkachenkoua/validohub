schemaVersion: 1
id: micronesia-pii-masker
kind: tool
module: validohub
country: FM
category: privacy
status: active
name:
  en: "Micronesian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.micronesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "FM-ID-123456 +691 320 1234 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [micronesia-personal-data-fixture-generator, micronesia-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Micronesian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
