schemaVersion: 1
id: micronesia-slug-normalizer
kind: tool
module: validohub
country: FM
category: developer-tools
status: active
name:
  en: "Micronesian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.micronesia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Micronesia sample company Palikir, Pohnpei State"
    actions: [validate, parse, format, explain]
related:
  explicit: [micronesia-document-ocr-fixer, micronesia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Micronesian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
