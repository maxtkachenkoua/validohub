    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent FM-ID-123456, 001 1234567890, Palikir, Pohnpei State"
    actions: [validate, parse, format, explain]
related:
