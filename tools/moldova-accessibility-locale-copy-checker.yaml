schemaVersion: 1
id: moldova-accessibility-locale-copy-checker
kind: tool
module: validohub
country: MD
category: localization
status: active
name:
  en: "Moldovan Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "IDNP input, cod postal input, amount 1 234,56 MDL"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-support-ticket-scrubber, moldova-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
