schemaVersion: 1
id: moldova-address-transliteration-normalizer
kind: tool
module: validohub
country: MD
category: address
status: active
name:
  en: "Moldovan Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Stefan cel Mare 1, MD-2001 Chisinau"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-region-code-mapper, moldova-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
