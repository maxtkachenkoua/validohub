schemaVersion: 1
id: moldova-api-payload-auditor
kind: tool
module: validohub
country: MD
category: developer-tools
status: active
name:
  en: "Moldovan API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"MD\",\"idno\":\"1003600000001\",\"iban\":\"MD24AG000225100013104168\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-form-field-auditor, moldova-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
