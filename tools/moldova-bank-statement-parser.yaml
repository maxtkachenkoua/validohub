schemaVersion: 1
id: moldova-bank-statement-parser
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldovan Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1 234,56 MDL; MD24AG000225100013104168; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-masked-iban-formatter, moldova-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
