schemaVersion: 1
id: moldova-bic-swift-inspector
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldovan BIC / SWIFT Inspector"
summary:
  en: "Inspect BIC institution, country, location, and branch evidence for Moldova banking integrations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "BIC input"
        required: true
        placeholder:
          en: "ABCDMD2X"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-sepa-transfer-helper, moldova-sepa-direct-debit-mandate-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan BIC / SWIFT Inspector | ValidoHub"
  description:
    en: "Inspect BIC institution, country, location, and branch evidence for Moldova banking integrations."
