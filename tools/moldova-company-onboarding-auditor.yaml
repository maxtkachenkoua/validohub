schemaVersion: 1
id: moldova-company-onboarding-auditor
kind: tool
module: validohub
country: MD
category: developer-tools
status: active
name:
  en: "Moldovan Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for IDNO, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"MD\",\"idno\":\"1003600000001\",\"iban\":\"MD24AG000225100013104168\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-business-register-readiness-helper, moldova-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for IDNO, VAT, address, banking, and official registry handoff readiness."
