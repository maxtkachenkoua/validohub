schemaVersion: 1
id: moldova-company-suffix-normalizer
kind: tool
module: validohub
country: MD
category: developer-tools
status: active
name:
  en: "Moldovan Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Moldova Sample Holding Ltd 1003600000001"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-procurement-identifier-helper, moldova-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
