schemaVersion: 1
id: moldova-csv-locale-normalizer
kind: tool
module: validohub
country: MD
category: developer-tools
status: active
name:
  en: "Moldovan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Moldova decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 MDL;21.07.2026;MD1003600000001"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-slug-normalizer, moldova-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Moldova decimal, date, postal, phone, tax, and banking fields."
