schemaVersion: 1
id: moldova-currency-decimal-formatter
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldovan MDL Decimal Currency Formatter"
summary:
  en: "Normalize MDL amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1 234,56 MDL"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-vat-rate-sanity-helper, moldova-vat-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan MDL Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize MDL amount strings, decimal separators, grouping, and API-safe numeric previews."
