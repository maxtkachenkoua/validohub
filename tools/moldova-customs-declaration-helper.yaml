schemaVersion: 1
id: moldova-customs-declaration-helper
kind: tool
module: validohub
country: MD
category: government
status: active
name:
  en: "Moldovan Customs Declaration Helper"
summary:
  en: "Inspect EORI, VAT, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "MD1003600000001 HS 8471 1 234,56 MDL"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-postal-tracking-helper, moldova-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect EORI, VAT, invoice, amount, HS-code, and border handoff evidence without official filing."
