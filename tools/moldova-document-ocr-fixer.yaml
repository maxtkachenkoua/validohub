schemaVersion: 1
id: moldova-document-ocr-fixer
kind: tool
module: validohub
country: MD
category: documents
status: active
name:
  en: "Moldovan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "2000010101234 MD1003600000001 MD24AG000225100013104168 MD-2001 Chisinau"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-gdpr-redaction-helper, moldova-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
