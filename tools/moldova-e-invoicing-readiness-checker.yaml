schemaVersion: 1
id: moldova-e-invoicing-readiness-checker
kind: tool
module: validohub
country: MD
category: tax
status: active
name:
  en: "Moldovan TVA invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"MD\",\"idno\":\"1003600000001\",\"iban\":\"MD24AG000225100013104168\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-tax-authority-handoff-helper, moldova-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan TVA invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
