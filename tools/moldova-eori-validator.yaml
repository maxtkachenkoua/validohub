schemaVersion: 1
id: moldova-eori-validator
kind: tool
module: validohub
country: MD
category: national-identifiers
status: active
name:
  en: "Moldovan EORI / Customs Identifier Helper"
summary:
  en: "Inspect customs identifiers, country prefixes, VAT-style bodies, and border-process boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EORI input"
        required: true
        placeholder:
          en: "MD1003600000001"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-cnas-evidence-social-insurance-helper, moldova-company-onboarding-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan EORI / Customs Identifier Helper | ValidoHub"
  description:
    en: "Inspect customs identifiers, country prefixes, VAT-style bodies, and border-process boundaries."
