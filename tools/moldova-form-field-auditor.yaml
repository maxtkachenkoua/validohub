schemaVersion: 1
id: moldova-form-field-auditor
kind: tool
module: validohub
country: MD
category: developer-tools
status: active
name:
  en: "Moldovan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=MD1003600000001&postal=MD-2001 Chisinau&phone=+373 69 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-locale-number-parser, moldova-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
