schemaVersion: 1
id: moldova-iban-generator
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldova IBAN Generator"
summary:
  en: "Generate MD IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "IBG input"
        required: true
        placeholder:
          en: "AG000225100013104168"
    actions: [generate, validate, explain]
related:
  explicit: [moldova-bank-account-inspector, moldova-bic-swift-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldova IBAN Generator | ValidoHub"
  description:
    en: "Generate MD IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
