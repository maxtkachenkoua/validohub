schemaVersion: 1
id: moldova-iban-validator
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldova IBAN Validator"
summary:
  en: "Validate MD IBAN shape, replay MOD-97 evidence, and split bank/account blocks for debugging."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "IBAN input"
        required: true
        placeholder:
          en: "MD24AG000225100013104168"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-iban-generator, moldova-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldova IBAN Validator | ValidoHub"
  description:
    en: "Validate MD IBAN shape, replay MOD-97 evidence, and split bank/account blocks for debugging."
