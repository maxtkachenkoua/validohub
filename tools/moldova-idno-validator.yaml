schemaVersion: 1
id: moldova-idno-validator
kind: tool
module: validohub
country: MD
category: national-identifiers
status: active
name:
  en: "Moldovan IDNO Validator"
summary:
  en: "Inspect IDNO structure, registry-style prefixes, control digits, and official lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ORG input"
        required: true
        placeholder:
          en: "1003600000001"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-vat-id-validator, moldova-eori-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan IDNO Validator | ValidoHub"
  description:
    en: "Inspect IDNO structure, registry-style prefixes, control digits, and official lookup boundaries."
