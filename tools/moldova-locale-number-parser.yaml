schemaVersion: 1
id: moldova-locale-number-parser
kind: tool
module: validohub
country: MD
category: localization
status: active
name:
  en: "Moldovan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Moldova."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 MDL"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-calendar-week-helper, moldova-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Moldova."
