schemaVersion: 1
id: moldova-masked-iban-formatter
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldovan Masked IBAN Formatter"
summary:
  en: "Create log-safe IBAN previews while preserving country, check digits, and account-tail evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MASK input"
        required: true
        placeholder:
          en: "MD24AG000225100013104168"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-currency-decimal-formatter, moldova-vat-rate-sanity-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Masked IBAN Formatter | ValidoHub"
  description:
    en: "Create log-safe IBAN previews while preserving country, check digits, and account-tail evidence."
