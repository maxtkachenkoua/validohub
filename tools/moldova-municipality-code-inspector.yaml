schemaVersion: 1
id: moldova-municipality-code-inspector
kind: tool
module: validohub
country: MD
category: address
status: active
name:
  en: "Moldovan Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Stefan cel Mare 1, MD-2001 Chisinau"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-phone-number-validator, moldova-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
