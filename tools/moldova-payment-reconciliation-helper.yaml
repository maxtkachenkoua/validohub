schemaVersion: 1
id: moldova-payment-reconciliation-helper
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldovan Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.07.2026; 1 234,56 MDL; MD24AG000225100013104168; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-bank-statement-parser, moldova-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
