schemaVersion: 1
id: moldova-postal-code-validator
kind: tool
module: validohub
country: MD
category: address
status: active
name:
  en: "Moldovan Postal Code Validator"
summary:
  en: "Validate cod postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "MD-2001 Chisinau"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-address-normalizer, moldova-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Postal Code Validator | ValidoHub"
  description:
    en: "Validate cod postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
