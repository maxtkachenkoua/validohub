schemaVersion: 1
id: moldova-regex-pack-helper
kind: tool
module: validohub
country: MD
category: developer-tools
status: active
name:
  en: "Moldovan Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "IDNP IDNO cod postal  MD24AG000225100013104168"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-api-payload-auditor, moldova-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
