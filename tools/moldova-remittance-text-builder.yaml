schemaVersion: 1
id: moldova-remittance-text-builder
kind: tool
module: validohub
country: MD
category: finance
status: active
name:
  en: "Moldovan Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 MD1003600000001 1 234,56 MDL"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-payment-reconciliation-helper, moldova-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
