capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SEPA input"
        required: true
        placeholder:
          en: "MD24AG000225100013104168\\n1 234,56 MDL\\nInvoice 2026-001"
    actions: [validate, parse, format, explain]
related:
