  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan SEPA Transfer Helper | ValidoHub"
  description:
    en: "Check creditor, IBAN, amount, remittance, and offline SEPA handoff fields before bank submission."
