schemaVersion: 1
id: moldova-tax-authority-handoff-helper
kind: tool
module: validohub
country: MD
category: tax
status: active
name:
  en: "Moldovan Tax Authority Handoff Helper"
summary:
  en: "Prepare local tax evidence for browser-only QA before regulated authority portals or API submissions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "MD1003600000001 21.07.2026 1 234,56 MDL"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-accounting-audit-trail-checklist-generator, moldova-postal-code-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Tax Authority Handoff Helper | ValidoHub"
  description:
    en: "Prepare local tax evidence for browser-only QA before regulated authority portals or API submissions."
