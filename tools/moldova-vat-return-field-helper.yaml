schemaVersion: 1
id: moldova-vat-return-field-helper
kind: tool
module: validohub
country: MD
category: tax
status: active
name:
  en: "Moldovan VAT Return Field Helper"
summary:
  en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "TVA / VAT; MD1003600000001; period 2026-07; 1 234,56 MDL"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-invoice-number-helper, moldova-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan VAT Return Field Helper | ValidoHub"
  description:
    en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
