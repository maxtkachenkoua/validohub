schemaVersion: 1
id: moldova-vehicle-data-redaction-helper
kind: tool
module: validohub
country: MD
category: transport
status: active
name:
  en: "Moldovan Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.moldova-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "ABC 123 WVWZZZ1JZXW000001 2000010101234"
    actions: [validate, parse, format, explain]
related:
  explicit: [moldova-customs-declaration-helper, moldova-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moldovan Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
