schemaVersion: 1
id: monaco-address-normalizer
kind: tool
module: validohub
country: MC
category: address
status: active
name:
  en: "Monegasque Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Avenue de la Costa 1, 98000 Monaco"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-address-transliteration-normalizer, monaco-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
