schemaVersion: 1
id: monaco-company-onboarding-auditor
kind: tool
module: validohub
country: MC
category: developer-tools
status: active
name:
  en: "Monegasque Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for RCI number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"MC\",\"rci\":\"22S12345\",\"iban\":\"MC5811222000010123456789030\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-business-register-readiness-helper, monaco-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for RCI number, VAT, address, banking, and official registry handoff readiness."
