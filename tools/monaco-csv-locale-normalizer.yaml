schemaVersion: 1
id: monaco-csv-locale-normalizer
kind: tool
module: validohub
country: MC
category: developer-tools
status: active
name:
  en: "Monegasque CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Monaco decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 EUR;21/07/2026;FR12345678901"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-slug-normalizer, monaco-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Monaco decimal, date, postal, phone, tax, and banking fields."
