schemaVersion: 1
id: monaco-currency-decimal-formatter
kind: tool
module: validohub
country: MC
category: finance
status: active
name:
  en: "Monegasque EUR Decimal Currency Formatter"
summary:
  en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-vat-rate-sanity-helper, monaco-vat-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque EUR Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
