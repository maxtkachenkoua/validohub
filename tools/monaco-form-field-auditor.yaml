schemaVersion: 1
id: monaco-form-field-auditor
kind: tool
module: validohub
country: MC
category: developer-tools
status: active
name:
  en: "Monegasque Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=FR12345678901&postal=98000 Monaco&phone=+377 93 15 12 34"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-locale-number-parser, monaco-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
