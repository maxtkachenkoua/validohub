schemaVersion: 1
id: monaco-payment-reconciliation-helper
kind: tool
module: validohub
country: MC
category: finance
status: active
name:
  en: "Monegasque Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1 234,56 EUR; MC5811222000010123456789030; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-bank-statement-parser, monaco-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
