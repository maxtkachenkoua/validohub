schemaVersion: 1
id: monaco-pii-masker
kind: tool
module: validohub
country: MC
category: privacy
status: active
name:
  en: "Monegasque PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "123456789 +377 93 15 12 34 MC5811222000010123456789030"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-personal-data-fixture-generator, monaco-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
