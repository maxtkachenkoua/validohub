schemaVersion: 1
id: monaco-postal-code-validator
kind: tool
module: validohub
country: MC
category: address
status: active
name:
  en: "Monegasque Postal Code Validator"
summary:
  en: "Validate code postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "98000 Monaco"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-address-normalizer, monaco-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque Postal Code Validator | ValidoHub"
  description:
    en: "Validate code postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
