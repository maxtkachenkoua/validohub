schemaVersion: 1
id: monaco-remittance-text-builder
kind: tool
module: validohub
country: MC
category: finance
status: active
name:
  en: "Monegasque Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 FR12345678901 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-payment-reconciliation-helper, monaco-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
