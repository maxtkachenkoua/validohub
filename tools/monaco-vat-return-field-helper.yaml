schemaVersion: 1
id: monaco-vat-return-field-helper
kind: tool
module: validohub
country: MC
category: tax
status: active
name:
  en: "Monegasque VAT Return Field Helper"
summary:
  en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.monaco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "TVA / VAT; FR12345678901; period 2026-07; 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [monaco-invoice-number-helper, monaco-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Monegasque VAT Return Field Helper | ValidoHub"
  description:
    en: "Map VAT-return field labels, tax evidence, period dates, and export-safe developer payloads."
