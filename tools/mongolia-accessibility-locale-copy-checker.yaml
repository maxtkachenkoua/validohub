schemaVersion: 1
id: mongolia-accessibility-locale-copy-checker
kind: tool
module: validohub
country: MN
category: localization
status: active
name:
  en: "Mongolian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "Citizen registration number boundary input, postal code input, amount 1,234,567 MNT"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-support-ticket-scrubber, mongolia-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
