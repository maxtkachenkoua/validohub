schemaVersion: 1
id: mongolia-address-normalizer
kind: tool
module: validohub
country: MN
category: address
status: active
name:
  en: "Mongolian Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Peace Avenue 1, Ulaanbaatar 14200"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-address-transliteration-normalizer, mongolia-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
