schemaVersion: 1
id: mongolia-address-transliteration-normalizer
kind: tool
module: validohub
country: MN
category: address
status: active
name:
  en: "Mongolian Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Peace Avenue 1, Ulaanbaatar 14200"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-region-code-mapper, mongolia-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
