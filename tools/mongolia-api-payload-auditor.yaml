schemaVersion: 1
id: mongolia-api-payload-auditor
kind: tool
module: validohub
country: MN
category: developer-tools
status: active
name:
  en: "Mongolian API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"MN\",\"reg\":\"9012345\",\"qpay\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-form-field-auditor, mongolia-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
