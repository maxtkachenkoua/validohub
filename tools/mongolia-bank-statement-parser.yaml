schemaVersion: 1
id: mongolia-bank-statement-parser
kind: tool
module: validohub
country: MN
category: finance
status: active
name:
  en: "Mongolian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026.07.21; 1,234,567 MNT; 050 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-masked-bank-account-formatter, mongolia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
