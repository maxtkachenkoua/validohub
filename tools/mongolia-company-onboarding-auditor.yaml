schemaVersion: 1
id: mongolia-company-onboarding-auditor
kind: tool
module: validohub
country: MN
category: developer-tools
status: active
name:
  en: "Mongolian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for state registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"MN\",\"reg\":\"9012345\",\"qpay\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-business-register-readiness-helper, mongolia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for state registration number, VAT, address, banking, and official registry handoff readiness."
