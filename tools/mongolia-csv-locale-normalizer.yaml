schemaVersion: 1
id: mongolia-csv-locale-normalizer
kind: tool
module: validohub
country: MN
category: developer-tools
status: active
name:
  en: "Mongolian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Mongolia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234,567 MNT;2026.07.21;9012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-slug-normalizer, mongolia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Mongolia decimal, date, postal, phone, tax, and banking fields."
