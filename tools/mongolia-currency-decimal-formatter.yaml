schemaVersion: 1
id: mongolia-currency-decimal-formatter
kind: tool
module: validohub
country: MN
category: finance
status: active
name:
  en: "Mongolian MNT Decimal Currency Formatter"
summary:
  en: "Normalize MNT amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234,567 MNT"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-tax-rate-sanity-helper, mongolia-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian MNT Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize MNT amount strings, decimal separators, grouping, and API-safe numeric previews."
