schemaVersion: 1
id: mongolia-data-quality-workbench
kind: tool
module: validohub
country: MN
category: developer-tools
status: active
name:
  en: "Mongolian Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"MN\",\"reg\":\"9012345\",\"qpay\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-json-fixture-generator, mongolia-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
