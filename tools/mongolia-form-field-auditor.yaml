schemaVersion: 1
id: mongolia-form-field-auditor
kind: tool
module: validohub
country: MN
category: developer-tools
status: active
name:
  en: "Mongolian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=9012345&postal=14200 Ulaanbaatar&phone=+976 9911 2233"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-locale-number-parser, mongolia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
