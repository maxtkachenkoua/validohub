schemaVersion: 1
id: mongolia-municipality-code-inspector
kind: tool
module: validohub
country: MN
category: address
status: active
name:
  en: "Mongolian Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Peace Avenue 1, Ulaanbaatar 14200"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-phone-number-validator, mongolia-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
