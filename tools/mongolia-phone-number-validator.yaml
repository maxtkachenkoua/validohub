schemaVersion: 1
id: mongolia-phone-number-validator
kind: tool
module: validohub
country: MN
category: address
status: active
name:
  en: "Mongolian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+976 9911 2233"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-phone-e164-formatter, mongolia-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
