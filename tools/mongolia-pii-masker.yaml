schemaVersion: 1
id: mongolia-pii-masker
kind: tool
module: validohub
country: MN
category: privacy
status: active
name:
  en: "Mongolian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "УА90010123 +976 9911 2233 050 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-personal-data-fixture-generator, mongolia-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
