schemaVersion: 1
id: mongolia-privacy-redaction-helper
kind: tool
module: validohub
country: MN
category: privacy
status: active
name:
  en: "Mongolian personal-data privacy Redaction Helper"
summary:
  en: "Mask personal, tax, banking, phone, and address evidence for logs and support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PRIV input"
        required: true
        placeholder:
          en: "{\"country\":\"MN\",\"reg\":\"9012345\",\"qpay\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-pii-masker, mongolia-personal-data-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian personal-data privacy Redaction Helper | ValidoHub"
  description:
    en: "Mask personal, tax, banking, phone, and address evidence for logs and support tickets."
