schemaVersion: 1
id: mongolia-tax-id-validator
kind: tool
module: validohub
country: MN
category: national-identifiers
status: active
name:
  en: "Mongolian VAT payer number Validator"
summary:
  en: "Normalize VAT payer number identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "9012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-customs-importer-code-helper, mongolia-social-insurance-boundary-social-insurance-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian VAT payer number Validator | ValidoHub"
  description:
    en: "Normalize VAT payer number identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
