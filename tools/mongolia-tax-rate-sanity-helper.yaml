schemaVersion: 1
id: mongolia-tax-rate-sanity-helper
kind: tool
module: validohub
country: MN
category: tax
status: active
name:
  en: "Mongolian Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "VAT payer number 20% base 1,234,567 MNT"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-tax-return-field-helper, mongolia-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
