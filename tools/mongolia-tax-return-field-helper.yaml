schemaVersion: 1
id: mongolia-tax-return-field-helper
kind: tool
module: validohub
country: MN
category: tax
status: active
name:
  en: "Mongolian Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "VAT payer number; 9012345; period 2026-07; 1,234,567 MNT"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-invoice-number-helper, mongolia-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
