schemaVersion: 1
id: mongolia-vehicle-data-redaction-helper
kind: tool
module: validohub
country: MN
category: transport
status: active
name:
  en: "Mongolian Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "1234 УБА WVWZZZ1JZXW000001 УА90010123"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-customs-declaration-helper, mongolia-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
