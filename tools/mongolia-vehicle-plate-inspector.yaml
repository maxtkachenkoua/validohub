schemaVersion: 1
id: mongolia-vehicle-plate-inspector
kind: tool
module: validohub
country: MN
category: transport
status: active
name:
  en: "Mongolian Vehicle Plate Inspector"
summary:
  en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mongolia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PLATE input"
        required: true
        placeholder:
          en: "1234 УБА"
    actions: [validate, parse, format, explain]
related:
  explicit: [mongolia-vin-validator, mongolia-vehicle-data-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mongolian Vehicle Plate Inspector | ValidoHub"
  description:
    en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
