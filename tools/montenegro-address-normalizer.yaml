schemaVersion: 1
id: montenegro-address-normalizer
kind: tool
module: validohub
country: ME
category: address
status: active
name:
  en: "Montenegrin Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Bulevar Svetog Petra 1, 81000 Podgorica"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-address-transliteration-normalizer, montenegro-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
