schemaVersion: 1
id: montenegro-bank-statement-parser
kind: tool
module: validohub
country: ME
category: finance
status: active
name:
  en: "Montenegrin Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 EUR; ME25505000012345678951; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-masked-iban-formatter, montenegro-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
