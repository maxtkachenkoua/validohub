schemaVersion: 1
id: montenegro-company-onboarding-auditor
kind: tool
module: validohub
country: ME
category: developer-tools
status: active
name:
  en: "Montenegrin Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for PIB, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"ME\",\"pib\":\"02712345\",\"iban\":\"ME25505000012345678951\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-business-register-readiness-helper, montenegro-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for PIB, VAT, address, banking, and official registry handoff readiness."
