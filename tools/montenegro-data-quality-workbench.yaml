schemaVersion: 1
id: montenegro-data-quality-workbench
kind: tool
module: validohub
country: ME
category: developer-tools
status: active
name:
  en: "Montenegrin Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"ME\",\"pib\":\"02712345\",\"iban\":\"ME25505000012345678951\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-json-fixture-generator, montenegro-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
