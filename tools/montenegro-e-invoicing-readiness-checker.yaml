schemaVersion: 1
id: montenegro-e-invoicing-readiness-checker
kind: tool
module: validohub
country: ME
category: tax
status: active
name:
  en: "Montenegrin PDV invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"ME\",\"pib\":\"02712345\",\"iban\":\"ME25505000012345678951\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-tax-authority-handoff-helper, montenegro-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin PDV invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
