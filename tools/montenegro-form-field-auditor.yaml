schemaVersion: 1
id: montenegro-form-field-auditor
kind: tool
module: validohub
country: ME
category: developer-tools
status: active
name:
  en: "Montenegrin Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=ME02712345&postal=81000 Podgorica&phone=+382 67 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-locale-number-parser, montenegro-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
