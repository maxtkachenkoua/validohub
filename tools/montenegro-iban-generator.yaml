  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegro IBAN Generator | ValidoHub"
  description:
    en: "Generate ME IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
