schemaVersion: 1
id: montenegro-json-fixture-generator
kind: tool
module: validohub
country: ME
category: developer-tools
status: active
name:
  en: "Montenegrin JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"ME\",\"pib\":\"02712345\",\"iban\":\"ME25505000012345678951\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-regex-pack-helper, montenegro-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
