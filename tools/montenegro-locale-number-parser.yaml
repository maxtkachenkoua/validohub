schemaVersion: 1
id: montenegro-locale-number-parser
kind: tool
module: validohub
country: ME
category: localization
status: active
name:
  en: "Montenegrin Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Montenegro."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-calendar-week-helper, montenegro-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Montenegro."
