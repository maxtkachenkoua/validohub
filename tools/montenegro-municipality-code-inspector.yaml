schemaVersion: 1
id: montenegro-municipality-code-inspector
kind: tool
module: validohub
country: ME
category: address
status: active
name:
  en: "Montenegrin Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Bulevar Svetog Petra 1, 81000 Podgorica"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-phone-number-validator, montenegro-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
