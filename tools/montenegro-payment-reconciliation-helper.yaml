schemaVersion: 1
id: montenegro-payment-reconciliation-helper
kind: tool
module: validohub
country: ME
category: finance
status: active
name:
  en: "Montenegrin Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 EUR; ME25505000012345678951; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-bank-statement-parser, montenegro-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
