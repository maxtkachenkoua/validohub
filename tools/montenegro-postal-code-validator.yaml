schemaVersion: 1
id: montenegro-postal-code-validator
kind: tool
module: validohub
country: ME
category: address
status: active
name:
  en: "Montenegrin Postal Code Validator"
summary:
  en: "Validate postanski broj shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "81000 Podgorica"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-address-normalizer, montenegro-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Postal Code Validator | ValidoHub"
  description:
    en: "Validate postanski broj shape, split area/delivery hints, and preserve official postal lookup boundaries."
