schemaVersion: 1
id: montenegro-regex-pack-helper
kind: tool
module: validohub
country: ME
category: developer-tools
status: active
name:
  en: "Montenegrin Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "JMBG PIB postanski broj  ME25505000012345678951"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-api-payload-auditor, montenegro-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
