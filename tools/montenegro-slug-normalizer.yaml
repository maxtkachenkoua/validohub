schemaVersion: 1
id: montenegro-slug-normalizer
kind: tool
module: validohub
country: ME
category: developer-tools
status: active
name:
  en: "Montenegrin Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.montenegro-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Montenegro sample company Bulevar Svetog Petra 1, 81000 Podgorica"
    actions: [validate, parse, format, explain]
related:
  explicit: [montenegro-document-ocr-fixer, montenegro-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Montenegrin Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
