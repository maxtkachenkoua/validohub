schemaVersion: 1
id: morocco-csv-locale-normalizer
kind: tool
module: validohub
country: MA
category: developer-tools
status: active
name:
  en: "Moroccan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Morocco decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.morocco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 MAD;24/07/2026;MA123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [morocco-slug-normalizer, morocco-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moroccan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Morocco decimal, date, postal, phone, tax, and banking fields."
