schemaVersion: 1
id: morocco-document-ocr-fixer
kind: tool
module: validohub
country: MA
category: documents
status: active
name:
  en: "Moroccan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.morocco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "MA-ID-123456 MA123456789 001 1234567890 1000 Rabat"
    actions: [validate, parse, format, explain]
related:
  explicit: [morocco-privacy-redaction-helper, morocco-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moroccan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
