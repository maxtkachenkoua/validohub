schemaVersion: 1
id: morocco-form-field-auditor
kind: tool
module: validohub
country: MA
category: developer-tools
status: active
name:
  en: "Moroccan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.morocco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=MA123456789&postal=1000 Rabat&phone=+212 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [morocco-locale-number-parser, morocco-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moroccan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
