schemaVersion: 1
id: morocco-locale-number-parser
kind: tool
module: validohub
country: MA
category: localization
status: active
name:
  en: "Moroccan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Morocco."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.morocco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 MAD"
    actions: [validate, parse, format, explain]
related:
  explicit: [morocco-calendar-week-helper, morocco-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moroccan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Morocco."
