schemaVersion: 1
id: morocco-remittance-text-builder
kind: tool
module: validohub
country: MA
category: finance
status: active
name:
  en: "Moroccan Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.morocco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 MA123456789 1,234.56 MAD"
    actions: [validate, parse, format, explain]
related:
  explicit: [morocco-payment-reconciliation-helper, morocco-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moroccan Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
