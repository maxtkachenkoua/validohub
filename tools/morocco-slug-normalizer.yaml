schemaVersion: 1
id: morocco-slug-normalizer
kind: tool
module: validohub
country: MA
category: developer-tools
status: active
name:
  en: "Moroccan Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.morocco-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Morocco sample company Central business district, Rabat 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [morocco-document-ocr-fixer, morocco-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Moroccan Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
