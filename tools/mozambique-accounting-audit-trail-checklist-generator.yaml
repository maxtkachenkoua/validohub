schemaVersion: 1
id: mozambique-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: MZ
category: tax
status: active
name:
  en: "Mozambican Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.mozambique-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 24/07/2026 1,234.56 MZN MZ123456789"
    actions: [generate, validate, explain]
related:
  explicit: [mozambique-postal-code-validator, mozambique-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mozambican Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
