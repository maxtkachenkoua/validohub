schemaVersion: 1
id: mozambique-csv-locale-normalizer
kind: tool
module: validohub
country: MZ
category: developer-tools
status: active
name:
  en: "Mozambican CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Mozambique decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mozambique-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 MZN;24/07/2026;MZ123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [mozambique-slug-normalizer, mozambique-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mozambican CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Mozambique decimal, date, postal, phone, tax, and banking fields."
