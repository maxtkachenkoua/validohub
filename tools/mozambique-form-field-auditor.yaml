schemaVersion: 1
id: mozambique-form-field-auditor
kind: tool
module: validohub
country: MZ
category: developer-tools
status: active
name:
  en: "Mozambican Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mozambique-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=MZ123456789&postal=1000 Maputo&phone=+258 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [mozambique-locale-number-parser, mozambique-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mozambican Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
