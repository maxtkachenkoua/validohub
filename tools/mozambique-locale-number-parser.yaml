schemaVersion: 1
id: mozambique-locale-number-parser
kind: tool
module: validohub
country: MZ
category: localization
status: active
name:
  en: "Mozambican Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Mozambique."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mozambique-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 MZN"
    actions: [validate, parse, format, explain]
related:
  explicit: [mozambique-calendar-week-helper, mozambique-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mozambican Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Mozambique."
