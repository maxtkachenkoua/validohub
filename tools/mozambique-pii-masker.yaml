schemaVersion: 1
id: mozambique-pii-masker
kind: tool
module: validohub
country: MZ
category: privacy
status: active
name:
  en: "Mozambican PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mozambique-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "MZ-ID-123456 +258 123 456 789 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [mozambique-personal-data-fixture-generator, mozambique-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mozambican PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
