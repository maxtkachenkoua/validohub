schemaVersion: 1
id: mozambique-slug-normalizer
kind: tool
module: validohub
country: MZ
category: developer-tools
status: active
name:
  en: "Mozambican Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.mozambique-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Mozambique sample company Central business district, Maputo 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [mozambique-document-ocr-fixer, mozambique-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Mozambican Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
