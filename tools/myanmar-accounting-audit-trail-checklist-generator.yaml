schemaVersion: 1
id: myanmar-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: MM
category: tax
status: active
name:
  en: "Myanmar Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21/07/2026 1,234,567 MMK TIN123456789"
    actions: [generate, validate, explain]
related:
  explicit: [myanmar-postal-code-validator, myanmar-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
