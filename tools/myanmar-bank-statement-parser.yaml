schemaVersion: 1
id: myanmar-bank-statement-parser
kind: tool
module: validohub
country: MM
category: finance
status: active
name:
  en: "Myanmar Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234,567 MMK; 001 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-masked-bank-account-formatter, myanmar-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
