schemaVersion: 1
id: myanmar-company-onboarding-auditor
kind: tool
module: validohub
country: MM
category: developer-tools
status: active
name:
  en: "Myanmar Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for DICA company number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"MM\",\"nrc\":\"12/LaMaNa(N)123456\",\"tin\":\"TIN123456789\",\"mpu\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-business-register-readiness-helper, myanmar-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for DICA company number, VAT, address, banking, and official registry handoff readiness."
