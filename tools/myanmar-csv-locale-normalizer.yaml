schemaVersion: 1
id: myanmar-csv-locale-normalizer
kind: tool
module: validohub
country: MM
category: developer-tools
status: active
name:
  en: "Myanmar CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Myanmar decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234,567 MMK;21/07/2026;TIN123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-slug-normalizer, myanmar-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Myanmar decimal, date, postal, phone, tax, and banking fields."
