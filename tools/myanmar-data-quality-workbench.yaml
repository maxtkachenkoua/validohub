schemaVersion: 1
id: myanmar-data-quality-workbench
kind: tool
module: validohub
country: MM
category: developer-tools
status: active
name:
  en: "Myanmar Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"MM\",\"nrc\":\"12/LaMaNa(N)123456\",\"tin\":\"TIN123456789\",\"mpu\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-json-fixture-generator, myanmar-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
