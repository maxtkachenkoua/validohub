schemaVersion: 1
id: myanmar-e-invoicing-readiness-checker
kind: tool
module: validohub
country: MM
category: tax
status: active
name:
  en: "Myanmar commercial tax invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"MM\",\"nrc\":\"12/LaMaNa(N)123456\",\"tin\":\"TIN123456789\",\"mpu\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-tax-authority-handoff-helper, myanmar-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar commercial tax invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
