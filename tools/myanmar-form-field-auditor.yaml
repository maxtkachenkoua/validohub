schemaVersion: 1
id: myanmar-form-field-auditor
kind: tool
module: validohub
country: MM
category: developer-tools
status: active
name:
  en: "Myanmar Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TIN123456789&postal=15011 Naypyidaw&phone=+95 9 123 456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-locale-number-parser, myanmar-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
