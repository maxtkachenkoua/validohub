schemaVersion: 1
id: myanmar-id-card-format-helper
kind: tool
module: validohub
country: MM
category: national-identifiers
status: active
name:
  en: "Myanmar ID Card Format Helper"
summary:
  en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CARD input"
        required: true
        placeholder:
          en: "12/LaMaNa(N)123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-passport-number-helper, myanmar-mrz-passport-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar ID Card Format Helper | ValidoHub"
  description:
    en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
