schemaVersion: 1
id: myanmar-locale-number-parser
kind: tool
module: validohub
country: MM
category: localization
status: active
name:
  en: "Myanmar Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Myanmar."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234,567 MMK"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-calendar-week-helper, myanmar-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Myanmar."
