schemaVersion: 1
id: myanmar-payment-reconciliation-helper
kind: tool
module: validohub
country: MM
category: finance
status: active
name:
  en: "Myanmar Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234,567 MMK; 001 1234567890; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-bank-statement-parser, myanmar-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
