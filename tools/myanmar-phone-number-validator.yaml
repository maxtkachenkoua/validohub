schemaVersion: 1
id: myanmar-phone-number-validator
kind: tool
module: validohub
country: MM
category: address
status: active
name:
  en: "Myanmar Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+95 9 123 456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-phone-e164-formatter, myanmar-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
