schemaVersion: 1
id: myanmar-regex-pack-helper
kind: tool
module: validohub
country: MM
category: developer-tools
status: active
name:
  en: "Myanmar Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "NRC boundary DICA company number postal code  001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-api-payload-auditor, myanmar-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
