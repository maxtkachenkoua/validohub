schemaVersion: 1
id: myanmar-tax-rate-sanity-helper
kind: tool
module: validohub
country: MM
category: tax
status: active
name:
  en: "Myanmar Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.myanmar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "TIN / commercial tax 20% base 1,234,567 MMK"
    actions: [validate, parse, format, explain]
related:
  explicit: [myanmar-tax-return-field-helper, myanmar-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Myanmar Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
