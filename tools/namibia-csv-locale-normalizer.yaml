schemaVersion: 1
id: namibia-csv-locale-normalizer
kind: tool
module: validohub
country: NA
category: developer-tools
status: active
name:
  en: "Namibian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Namibia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.namibia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 NAD;24/07/2026;NA123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [namibia-slug-normalizer, namibia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Namibian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Namibia decimal, date, postal, phone, tax, and banking fields."
