schemaVersion: 1
id: namibia-slug-normalizer
kind: tool
module: validohub
country: NA
category: developer-tools
status: active
name:
  en: "Namibian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.namibia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Namibia sample company Central business district, Windhoek 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [namibia-document-ocr-fixer, namibia-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Namibian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
