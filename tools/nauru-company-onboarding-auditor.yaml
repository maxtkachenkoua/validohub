schemaVersion: 1
id: nauru-company-onboarding-auditor
kind: tool
module: validohub
country: NR
category: developer-tools
status: active
name:
  en: "Nauruan Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nauru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"NR\",\"company\":\"NR-REG-123456\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [nauru-business-register-readiness-helper, nauru-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nauruan Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
