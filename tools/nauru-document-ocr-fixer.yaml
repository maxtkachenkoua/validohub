schemaVersion: 1
id: nauru-document-ocr-fixer
kind: tool
module: validohub
country: NR
category: documents
status: active
name:
  en: "Nauruan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nauru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "NR-ID-123456 NR123456789 001 1234567890 Yaren District"
    actions: [validate, parse, format, explain]
related:
  explicit: [nauru-privacy-redaction-helper, nauru-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nauruan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
