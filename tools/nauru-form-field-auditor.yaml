schemaVersion: 1
id: nauru-form-field-auditor
kind: tool
module: validohub
country: NR
category: developer-tools
status: active
name:
  en: "Nauruan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nauru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=NR123456789&postal=Yaren District&phone=+674 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [nauru-locale-number-parser, nauru-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nauruan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
