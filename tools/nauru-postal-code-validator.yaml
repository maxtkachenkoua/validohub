schemaVersion: 1
id: nauru-postal-code-validator
kind: tool
module: validohub
country: NR
category: address
status: active
name:
  en: "Nauruan Postal Code Validator"
summary:
  en: "Validate district/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nauru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "Yaren District"
    actions: [validate, parse, format, explain]
related:
  explicit: [nauru-address-normalizer, nauru-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nauruan Postal Code Validator | ValidoHub"
  description:
    en: "Validate district/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
