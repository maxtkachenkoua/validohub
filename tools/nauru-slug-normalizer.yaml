schemaVersion: 1
id: nauru-slug-normalizer
kind: tool
module: validohub
country: NR
category: developer-tools
status: active
name:
  en: "Nauruan Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nauru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Nauru sample company Yaren District, Nauru"
    actions: [validate, parse, format, explain]
related:
  explicit: [nauru-document-ocr-fixer, nauru-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nauruan Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
