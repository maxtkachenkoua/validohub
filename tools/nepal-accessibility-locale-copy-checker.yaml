schemaVersion: 1
id: nepal-accessibility-locale-copy-checker
kind: tool
module: validohub
country: NP
category: localization
status: active
name:
  en: "Nepali Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "Citizenship number boundary input, postal code input, amount 1,234.56 NPR"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-support-ticket-scrubber, nepal-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
