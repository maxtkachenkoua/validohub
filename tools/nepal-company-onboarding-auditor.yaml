schemaVersion: 1
id: nepal-company-onboarding-auditor
kind: tool
module: validohub
country: NP
category: developer-tools
status: active
name:
  en: "Nepali Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"NP\",\"pan\":\"500123456\",\"bank\":\"0011234567890123\",\"connectIPS\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-business-register-readiness-helper, nepal-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
