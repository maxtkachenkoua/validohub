schemaVersion: 1
id: nepal-company-suffix-normalizer
kind: tool
module: validohub
country: NP
category: developer-tools
status: active
name:
  en: "Nepali Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Nepal Sample Holding Ltd 123456/078/079"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-procurement-identifier-helper, nepal-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
