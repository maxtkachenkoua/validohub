schemaVersion: 1
id: nepal-customs-declaration-helper
kind: tool
module: validohub
country: NP
category: government
status: active
name:
  en: "Nepali Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
