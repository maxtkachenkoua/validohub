schemaVersion: 1
id: nepal-date-locale-formatter
kind: tool
module: validohub
country: NP
category: localization
status: active
name:
  en: "Nepali Date Locale Formatter"
summary:
  en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "2026/07/21"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-csv-locale-normalizer, nepal-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Date Locale Formatter | ValidoHub"
  description:
    en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
