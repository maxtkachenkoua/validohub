schemaVersion: 1
id: nepal-locale-number-parser
kind: tool
module: validohub
country: NP
category: localization
status: active
name:
  en: "Nepali Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Nepal."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 NPR"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-calendar-week-helper, nepal-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Nepal."
