schemaVersion: 1
id: nepal-municipality-code-inspector
kind: tool
module: validohub
country: NP
category: address
status: active
name:
  en: "Nepali Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Durbar Marg 1, Kathmandu 44600"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-phone-number-validator, nepal-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
