schemaVersion: 1
id: nepal-regex-pack-helper
kind: tool
module: validohub
country: NP
category: developer-tools
status: active
name:
  en: "Nepali Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Citizenship number boundary company registration number postal code  001 1234567890123"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-api-payload-auditor, nepal-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
