schemaVersion: 1
id: nepal-support-ticket-scrubber
kind: tool
module: validohub
country: NP
category: privacy
status: active
name:
  en: "Nepali Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 27-01-76-12345, 001 1234567890123, Durbar Marg 1, Kathmandu 44600"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-integration-smoke-test-builder, nepal-citizenship-number-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
