capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nepal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "BA 2 PA 1234 WVWZZZ1JZXW000001 27-01-76-12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [nepal-customs-declaration-helper, nepal-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nepali Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
