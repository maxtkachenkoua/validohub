schemaVersion: 1
id: netherlands-csv-locale-normalizer
kind: tool
module: validohub
country: NL
category: developer-tools
status: active
name:
  en: "Dutch CSV Locale Normalizer"
summary:
  en: "Normalize Dutch CSV rows with semicolons, comma decimals, date fields, VAT/IBAN hints, and import-safe headers."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.netherlands-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "CSV"
        required: true
        placeholder:
          en: "datum;bedrag;btw;iban"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [netherlands-date-locale-formatter, netherlands-eur-decimal-currency-formatter, netherlands-audit-file-readiness-checker, netherlands-data-quality-workbench]
seo:
  title:
    en: "Dutch CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize Dutch CSV rows with semicolons, comma decimals, date fields, VAT/IBAN hints, and import-safe headers."
