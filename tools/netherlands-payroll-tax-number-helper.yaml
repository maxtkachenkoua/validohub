      - type: text
        name: input
        label:
          en: "LOON"
        required: true
        placeholder:
          en: "Loonheffingennummer 123456789L01"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [netherlands-wage-tax-readiness-helper, netherlands-compliance-checklist-generator, netherlands-gdpr-avg-redaction-helper, netherlands-api-payload-auditor]
seo:
