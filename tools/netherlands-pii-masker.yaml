schemaVersion: 1
id: netherlands-pii-masker
kind: tool
module: validohub
country: NL
category: developer-tools
status: active
name:
  en: "Dutch PII Masker"
summary:
  en: "Detect BSN, IBAN, postcode, phone, VAT, KVK, plate, email, and name-like Dutch data and produce safer debug snippets."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.netherlands-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "PII"
        required: true
        placeholder:
          en: "Jan Jansen, BSN 123456782, NL91ABNA0417164300, 1012 AB, 06 12345678"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [netherlands-gdpr-avg-redaction-helper, netherlands-bsn-masker, netherlands-masked-iban-formatter, netherlands-data-quality-workbench]
seo:
  title:
    en: "Dutch PII Masker | ValidoHub"
  description:
    en: "Detect BSN, IBAN, postcode, phone, VAT, KVK, plate, email, and name-like Dutch data and produce safer debug snippets."
