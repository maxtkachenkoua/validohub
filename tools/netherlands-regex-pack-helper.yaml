schemaVersion: 1
id: netherlands-regex-pack-helper
kind: tool
module: validohub
country: NL
category: developer-tools
status: active
name:
  en: "Dutch Regex Pack Helper"
summary:
  en: "Build Dutch regex snippets for BSN-like, KVK, VAT, postcode, IBAN, phone, and plate fields with safety notes."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.netherlands-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "REGEX"
        required: true
        placeholder:
          en: "Need regex for postcode, KVK, NL VAT, IBAN and mobile phone"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [netherlands-json-fixture-generator, netherlands-form-field-auditor, netherlands-api-payload-auditor, netherlands-data-quality-workbench]
seo:
  title:
    en: "Dutch Regex Pack Helper | ValidoHub"
  description:
    en: "Build Dutch regex snippets for BSN-like, KVK, VAT, postcode, IBAN, phone, and plate fields with safety notes."
