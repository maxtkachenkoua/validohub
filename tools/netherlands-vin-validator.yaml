schemaVersion: 1
id: netherlands-vin-validator
kind: tool
module: validohub
country: NL
category: national-identifiers
status: active
name:
  en: "VIN Validator for Netherlands Workflows"
summary:
  en: "Validate VIN structure, split WMI/VDS/VIS segments, and prepare masked vehicle data for Dutch fleet workflows."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
algorithm:
  algorithmId: validohub.netherlands-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: "VIN"
        required: true
        placeholder:
          en: "W0L000051T2123456"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [netherlands-license-plate-inspector, netherlands-rdw-vehicle-data-redaction-helper, netherlands-data-quality-workbench, netherlands-document-ocr-fixer]
seo:
  title:
    en: "VIN Validator for Netherlands Workflows | ValidoHub"
  description:
    en: "Validate VIN structure, split WMI/VDS/VIS segments, and prepare masked vehicle data for Dutch fleet workflows."
