schemaVersion: 1
id: new-zealand-accessibility-locale-copy-checker
kind: tool
module: validohub
country: NZ
category: localization
status: active
name:
  en: "New Zealand Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "IRD number boundary input, postcode input, amount 1,234.56 NZD"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-support-ticket-scrubber, new-zealand-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
