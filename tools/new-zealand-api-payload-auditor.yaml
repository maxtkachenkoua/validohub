schemaVersion: 1
id: new-zealand-api-payload-auditor
kind: tool
module: validohub
country: NZ
category: developer-tools
status: active
name:
  en: "New Zealand API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"NZ\",\"ird\":\"123456789\",\"nzbn\":\"9429000000000\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-form-field-auditor, new-zealand-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
