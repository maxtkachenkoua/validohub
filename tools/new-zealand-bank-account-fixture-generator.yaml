capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "BGEN input"
        required: true
        placeholder:
          en: "12-1234-1234567-00"
    actions: [generate, validate, explain]
related:
  explicit: [new-zealand-bank-account-inspector, new-zealand-bic-swift-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Bank Account Fixture Generator | ValidoHub"
  description:
    en: "Generate local bank-account fixture payloads, split routing/account blocks, and prepare payment QA data."
