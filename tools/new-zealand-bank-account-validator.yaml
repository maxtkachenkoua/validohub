schemaVersion: 1
id: new-zealand-bank-account-validator
kind: tool
module: validohub
country: NZ
category: finance
status: active
name:
  en: "New Zealand Bank Account Validator"
summary:
  en: "Validate local bank-account or routing shape, split bank/account blocks, and keep ownership lookup outside the browser."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "BANK input"
        required: true
        placeholder:
          en: "12-1234-1234567-00"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-bank-account-fixture-generator, new-zealand-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Bank Account Validator | ValidoHub"
  description:
    en: "Validate local bank-account or routing shape, split bank/account blocks, and keep ownership lookup outside the browser."
