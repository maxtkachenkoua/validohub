schemaVersion: 1
id: new-zealand-company-suffix-normalizer
kind: tool
module: validohub
country: NZ
category: developer-tools
status: active
name:
  en: "New Zealand Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "New Zealand Sample Holding Ltd 9429000000000"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-procurement-identifier-helper, new-zealand-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
