schemaVersion: 1
id: new-zealand-csv-locale-normalizer
kind: tool
module: validohub
country: NZ
category: developer-tools
status: active
name:
  en: "New Zealand CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for New Zealand decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 NZD;24/07/2026;123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-slug-normalizer, new-zealand-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for New Zealand decimal, date, postal, phone, tax, and banking fields."
