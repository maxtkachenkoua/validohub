  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand NZD Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize NZD amount strings, decimal separators, grouping, and API-safe numeric previews."
