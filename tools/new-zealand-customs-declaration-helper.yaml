schemaVersion: 1
id: new-zealand-customs-declaration-helper
kind: tool
module: validohub
country: NZ
category: government
status: active
name:
  en: "New Zealand Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "123456789 HS 8471 1,234.56 NZD"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-postal-tracking-helper, new-zealand-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
