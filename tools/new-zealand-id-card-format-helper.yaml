schemaVersion: 1
id: new-zealand-id-card-format-helper
kind: tool
module: validohub
country: NZ
category: national-identifiers
status: active
name:
  en: "New Zealand ID Card Format Helper"
summary:
  en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CARD input"
        required: true
        placeholder:
          en: "123-456-789"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-passport-number-helper, new-zealand-mrz-passport-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand ID Card Format Helper | ValidoHub"
  description:
    en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
