schemaVersion: 1
id: new-zealand-payment-reconciliation-helper
kind: tool
module: validohub
country: NZ
category: finance
status: active
name:
  en: "New Zealand Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "24/07/2026; 1,234.56 NZD; 12-1234-1234567-00; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-bank-statement-parser, new-zealand-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
