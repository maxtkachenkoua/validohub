schemaVersion: 1
id: new-zealand-phone-e164-formatter
kind: tool
module: validohub
country: NZ
category: address
status: active
name:
  en: "New Zealand Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+64 21 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-date-locale-formatter, new-zealand-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
