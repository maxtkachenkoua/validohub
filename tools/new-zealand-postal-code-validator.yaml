schemaVersion: 1
id: new-zealand-postal-code-validator
kind: tool
module: validohub
country: NZ
category: address
status: active
name:
  en: "New Zealand Postal Code Validator"
summary:
  en: "Validate postcode shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "6011 Wellington"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-address-normalizer, new-zealand-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Postal Code Validator | ValidoHub"
  description:
    en: "Validate postcode shape, split area/delivery hints, and preserve official postal lookup boundaries."
