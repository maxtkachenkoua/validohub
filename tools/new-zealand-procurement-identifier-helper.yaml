schemaVersion: 1
id: new-zealand-procurement-identifier-helper
kind: tool
module: validohub
country: NZ
category: government
status: active
name:
  en: "New Zealand Procurement Identifier Helper"
summary:
  en: "Inspect buyer/seller identifiers, invoice references, and public-procurement handoff evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PROC input"
        required: true
        placeholder:
          en: "9429000000000 PO-2026-001 123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-accessibility-locale-copy-checker, new-zealand-support-ticket-scrubber]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Procurement Identifier Helper | ValidoHub"
  description:
    en: "Inspect buyer/seller identifiers, invoice references, and public-procurement handoff evidence."
