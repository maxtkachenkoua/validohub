schemaVersion: 1
id: new-zealand-remittance-text-builder
kind: tool
module: validohub
country: NZ
category: finance
status: active
name:
  en: "New Zealand Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 123456789 1,234.56 NZD"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-payment-reconciliation-helper, new-zealand-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
