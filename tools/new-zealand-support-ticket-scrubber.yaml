schemaVersion: 1
id: new-zealand-support-ticket-scrubber
kind: tool
module: validohub
country: NZ
category: privacy
status: active
name:
  en: "New Zealand Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent 123-456-789, 12-1234-1234567-00, 1 Molesworth Street, Wellington 6011"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-integration-smoke-test-builder, new-zealand-ird-number-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
