summary:
  en: "Normalize GST / IRD identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-customs-importer-code-helper, new-zealand-realme-boundary-social-insurance-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand GST / IRD Validator | ValidoHub"
  description:
    en: "Normalize GST / IRD identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
