schemaVersion: 1
id: new-zealand-tax-rate-sanity-helper
kind: tool
module: validohub
country: NZ
category: tax
status: active
name:
  en: "New Zealand Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "GST / IRD 20% base 1,234.56 NZD"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-tax-return-field-helper, new-zealand-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
