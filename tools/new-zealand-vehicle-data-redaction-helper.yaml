schemaVersion: 1
id: new-zealand-vehicle-data-redaction-helper
kind: tool
module: validohub
country: NZ
category: transport
status: active
name:
  en: "New Zealand Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.new-zealand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "ABC123 WVWZZZ1JZXW000001 123-456-789"
    actions: [validate, parse, format, explain]
related:
  explicit: [new-zealand-customs-declaration-helper, new-zealand-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "New Zealand Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
