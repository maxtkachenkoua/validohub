schemaVersion: 1
id: niger-csv-locale-normalizer
kind: tool
module: validohub
country: NE
category: developer-tools
status: active
name:
  en: "Nigerien CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Niger decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.niger-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;NE123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [niger-slug-normalizer, niger-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerien CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Niger decimal, date, postal, phone, tax, and banking fields."
