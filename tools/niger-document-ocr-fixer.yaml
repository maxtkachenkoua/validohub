schemaVersion: 1
id: niger-document-ocr-fixer
kind: tool
module: validohub
country: NE
category: documents
status: active
name:
  en: "Nigerien Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.niger-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "NE-ID-123456 NE123456789 001 1234567890 1000 Niamey"
    actions: [validate, parse, format, explain]
related:
  explicit: [niger-privacy-redaction-helper, niger-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerien Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
