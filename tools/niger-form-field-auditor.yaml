schemaVersion: 1
id: niger-form-field-auditor
kind: tool
module: validohub
country: NE
category: developer-tools
status: active
name:
  en: "Nigerien Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.niger-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=NE123456789&postal=1000 Niamey&phone=+227 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [niger-locale-number-parser, niger-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerien Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
