schemaVersion: 1
id: niger-locale-number-parser
kind: tool
module: validohub
country: NE
category: localization
status: active
name:
  en: "Nigerien Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Niger."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.niger-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 XOF"
    actions: [validate, parse, format, explain]
related:
  explicit: [niger-calendar-week-helper, niger-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerien Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Niger."
