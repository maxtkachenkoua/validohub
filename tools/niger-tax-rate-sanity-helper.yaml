schemaVersion: 1
id: niger-tax-rate-sanity-helper
kind: tool
module: validohub
country: NE
category: tax
status: active
name:
  en: "Nigerien Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.niger-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "tax number / VAT boundary 20% base 1,234.56 XOF"
    actions: [validate, parse, format, explain]
related:
  explicit: [niger-tax-return-field-helper, niger-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerien Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
