schemaVersion: 1
id: nigeria-date-locale-formatter
kind: tool
module: validohub
country: NG
category: localization
status: active
name:
  en: "Nigerian Date Locale Formatter"
summary:
  en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nigeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "24/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [nigeria-csv-locale-normalizer, nigeria-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerian Date Locale Formatter | ValidoHub"
  description:
    en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
