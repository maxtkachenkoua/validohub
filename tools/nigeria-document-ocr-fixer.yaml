schemaVersion: 1
id: nigeria-document-ocr-fixer
kind: tool
module: validohub
country: NG
category: documents
status: active
name:
  en: "Nigerian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nigeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "NG-ID-123456 NG123456789 001 1234567890 1000 Abuja"
    actions: [validate, parse, format, explain]
related:
  explicit: [nigeria-privacy-redaction-helper, nigeria-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
