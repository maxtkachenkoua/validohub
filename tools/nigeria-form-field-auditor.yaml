schemaVersion: 1
id: nigeria-form-field-auditor
kind: tool
module: validohub
country: NG
category: developer-tools
status: active
name:
  en: "Nigerian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nigeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=NG123456789&postal=1000 Abuja&phone=+234 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [nigeria-locale-number-parser, nigeria-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
