schemaVersion: 1
id: nigeria-locale-number-parser
kind: tool
module: validohub
country: NG
category: localization
status: active
name:
  en: "Nigerian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Nigeria."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nigeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 NGN"
    actions: [validate, parse, format, explain]
related:
  explicit: [nigeria-calendar-week-helper, nigeria-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Nigeria."
