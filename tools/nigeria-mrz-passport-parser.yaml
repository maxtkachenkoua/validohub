schemaVersion: 1
id: nigeria-mrz-passport-parser
kind: tool
module: validohub
country: NG
category: national-identifiers
status: active
name:
  en: "Nigerian MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.nigeria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<NGASAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567NGA8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [nigeria-bank-account-validator, nigeria-bank-account-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Nigerian MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
