schemaVersion: 1
id: north-korea-bank-statement-parser
kind: tool
module: validohub
country: KP
category: finance
status: active
name:
  en: "North Korean Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026.07.21; 1,234 KPW; 001 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-korea-masked-bank-account-formatter, north-korea-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "North Korean Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
