schemaVersion: 1
id: north-korea-company-onboarding-auditor
kind: tool
module: validohub
country: KP
category: developer-tools
status: active
name:
  en: "North Korean Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for organization registration boundary, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"KP\",\"resident\":\"KP-900101-123456\",\"boundary\":\"official-lookup-required\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-korea-business-register-readiness-helper, north-korea-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "North Korean Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for organization registration boundary, VAT, address, banking, and official registry handoff readiness."
