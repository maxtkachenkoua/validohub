schemaVersion: 1
id: north-korea-data-quality-workbench
kind: tool
module: validohub
country: KP
category: developer-tools
status: active
name:
  en: "North Korean Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"KP\",\"resident\":\"KP-900101-123456\",\"boundary\":\"official-lookup-required\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-korea-json-fixture-generator, north-korea-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "North Korean Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
