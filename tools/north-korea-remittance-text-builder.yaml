schemaVersion: 1
id: north-korea-remittance-text-builder
kind: tool
module: validohub
country: KP
category: finance
status: active
name:
  en: "North Korean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 TAX123456 1,234 KPW"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-korea-payment-reconciliation-helper, north-korea-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "North Korean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
