schemaVersion: 1
id: north-korea-slug-normalizer
kind: tool
module: validohub
country: KP
category: developer-tools
status: active
name:
  en: "North Korean Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "North Korea sample company Central District 1, Pyongyang 999093"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-korea-document-ocr-fixer, north-korea-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "North Korean Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
