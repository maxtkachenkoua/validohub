schemaVersion: 1
id: north-macedonia-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: MK
category: tax
status: active
name:
  en: "Macedonian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21.07.2026 1.234,56 MKD MK4032013544513"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-postal-code-validator, north-macedonia-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
