schemaVersion: 1
id: north-macedonia-bank-statement-parser
kind: tool
module: validohub
country: MK
category: finance
status: active
name:
  en: "Macedonian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 MKD; MK07250120000058984; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-masked-iban-formatter, north-macedonia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
