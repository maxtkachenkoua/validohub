schemaVersion: 1
id: north-macedonia-company-suffix-normalizer
kind: tool
module: validohub
country: MK
category: developer-tools
status: active
name:
  en: "Macedonian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "North Macedonia Sample Holding Ltd 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-procurement-identifier-helper, north-macedonia-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
