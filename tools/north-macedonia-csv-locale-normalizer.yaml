schemaVersion: 1
id: north-macedonia-csv-locale-normalizer
kind: tool
module: validohub
country: MK
category: developer-tools
status: active
name:
  en: "Macedonian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for North Macedonia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 MKD;21.07.2026;MK4032013544513"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-slug-normalizer, north-macedonia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for North Macedonia decimal, date, postal, phone, tax, and banking fields."
