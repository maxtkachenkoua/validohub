schemaVersion: 1
id: north-macedonia-locale-number-parser
kind: tool
module: validohub
country: MK
category: localization
status: active
name:
  en: "Macedonian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for North Macedonia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 MKD"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-calendar-week-helper, north-macedonia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for North Macedonia."
