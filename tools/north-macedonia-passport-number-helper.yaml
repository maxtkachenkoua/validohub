schemaVersion: 1
id: north-macedonia-passport-number-helper
kind: tool
module: validohub
country: MK
category: national-identifiers
status: active
name:
  en: "Macedonian Passport Number Helper"
summary:
  en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "P<MKDMACEDONIAN<<SAMPLE<<<<<<<<<<<<<<<<<<"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-mrz-passport-parser, north-macedonia-iban-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Passport Number Helper | ValidoHub"
  description:
    en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
