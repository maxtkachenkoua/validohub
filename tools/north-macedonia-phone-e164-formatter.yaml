schemaVersion: 1
id: north-macedonia-phone-e164-formatter
kind: tool
module: validohub
country: MK
category: address
status: active
name:
  en: "Macedonian Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+389 70 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-date-locale-formatter, north-macedonia-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
