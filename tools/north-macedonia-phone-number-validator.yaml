schemaVersion: 1
id: north-macedonia-phone-number-validator
kind: tool
module: validohub
country: MK
category: address
status: active
name:
  en: "Macedonian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+389 70 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-phone-e164-formatter, north-macedonia-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
