schemaVersion: 1
id: north-macedonia-remittance-text-builder
kind: tool
module: validohub
country: MK
category: finance
status: active
name:
  en: "Macedonian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 MK4032013544513 1.234,56 MKD"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-payment-reconciliation-helper, north-macedonia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
