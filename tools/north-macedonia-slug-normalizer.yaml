schemaVersion: 1
id: north-macedonia-slug-normalizer
kind: tool
module: validohub
country: MK
category: developer-tools
status: active
name:
  en: "Macedonian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.north-macedonia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "North Macedonia sample company Macedonia Square 1, 1000 Skopje"
    actions: [validate, parse, format, explain]
related:
  explicit: [north-macedonia-document-ocr-fixer, north-macedonia-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Macedonian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
