schemaVersion: 1
id: norway-accessibility-locale-copy-checker
kind: tool
module: validohub
country: NO
category: localization
status: active
name:
  en: "Norwegian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.norway-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "Fodselsnummer input, postnummer input, amount 1 234,56 NOK"
    actions: [validate, parse, format, explain]
related:
  explicit: [norway-support-ticket-scrubber, norway-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Norwegian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
