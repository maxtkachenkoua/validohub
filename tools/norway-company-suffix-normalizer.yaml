    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Norwegian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
