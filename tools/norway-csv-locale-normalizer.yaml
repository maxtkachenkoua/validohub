schemaVersion: 1
id: norway-csv-locale-normalizer
kind: tool
module: validohub
country: NO
category: developer-tools
status: active
name:
  en: "Norwegian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Norway decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.norway-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 NOK;21.07.2026;NO915545943MVA"
    actions: [validate, parse, format, explain]
related:
  explicit: [norway-slug-normalizer, norway-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Norwegian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Norway decimal, date, postal, phone, tax, and banking fields."
