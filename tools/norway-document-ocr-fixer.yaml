schemaVersion: 1
id: norway-document-ocr-fixer
kind: tool
module: validohub
country: NO
category: documents
status: active
name:
  en: "Norwegian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.norway-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "01018500120 NO915545943MVA NO9386011117947 0150 Oslo"
    actions: [validate, parse, format, explain]
related:
  explicit: [norway-gdpr-redaction-helper, norway-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Norwegian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
