schemaVersion: 1
id: norway-locale-number-parser
kind: tool
module: validohub
country: NO
category: localization
status: active
name:
  en: "Norwegian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Norway."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.norway-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 NOK"
    actions: [validate, parse, format, explain]
related:
  explicit: [norway-calendar-week-helper, norway-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Norwegian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Norway."
