schemaVersion: 1
id: norway-pii-masker
kind: tool
module: validohub
country: NO
category: privacy
status: active
name:
  en: "Norwegian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.norway-suite
forms:
