schemaVersion: 1
id: norway-postal-code-validator
kind: tool
module: validohub
country: NO
category: address
status: active
name:
  en: "Norwegian Postal Code Validator"
summary:
  en: "Validate postnummer shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.norway-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "0150 Oslo"
    actions: [validate, parse, format, explain]
related:
  explicit: [norway-address-normalizer, norway-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Norwegian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postnummer shape, split area/delivery hints, and preserve official postal lookup boundaries."
