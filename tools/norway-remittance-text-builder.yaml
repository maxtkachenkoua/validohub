schemaVersion: 1
id: norway-remittance-text-builder
kind: tool
module: validohub
country: NO
category: finance
status: active
name:
  en: "Norwegian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.norway-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 NO915545943MVA 1 234,56 NOK"
    actions: [validate, parse, format, explain]
related:
  explicit: [norway-payment-reconciliation-helper, norway-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Norwegian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
