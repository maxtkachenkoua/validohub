    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Domestic Bank Account Inspector | ValidoHub"
  description:
    en: "Inspect domestic account slices, bank codes, branch/account blocks, and provider handoff boundaries."
