schemaVersion: 1
id: oman-bank-statement-parser
kind: tool
module: validohub
country: OM
category: finance
status: active
name:
  en: "Omani Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.560 OMR; 0001 123456789; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-masked-bank-account-formatter, oman-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
