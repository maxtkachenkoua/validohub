schemaVersion: 1
id: oman-csv-locale-normalizer
kind: tool
module: validohub
country: OM
category: developer-tools
status: active
name:
  en: "Omani CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Oman decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.560 OMR;21/07/2026;OM1100123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-slug-normalizer, oman-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Oman decimal, date, postal, phone, tax, and banking fields."
