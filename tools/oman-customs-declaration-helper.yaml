  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
