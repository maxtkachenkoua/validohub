schemaVersion: 1
id: oman-data-quality-workbench
kind: tool
module: validohub
country: OM
category: developer-tools
status: active
name:
  en: "Omani Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"OM\",\"civil\":\"12345678\",\"iban\":\"OM810001000000000123456789\",\"omannet\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-json-fixture-generator, oman-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
