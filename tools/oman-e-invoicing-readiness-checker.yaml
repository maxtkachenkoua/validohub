schemaVersion: 1
id: oman-e-invoicing-readiness-checker
kind: tool
module: validohub
country: OM
category: tax
status: active
name:
  en: "Omani VAT invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"OM\",\"civil\":\"12345678\",\"iban\":\"OM810001000000000123456789\",\"omannet\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-tax-authority-handoff-helper, oman-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani VAT invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
