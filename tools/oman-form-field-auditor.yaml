schemaVersion: 1
id: oman-form-field-auditor
kind: tool
module: validohub
country: OM
category: developer-tools
status: active
name:
  en: "Omani Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=OM1100123456&postal=100 Muscat&phone=+968 9123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-locale-number-parser, oman-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
