schemaVersion: 1
id: oman-municipality-code-inspector
kind: tool
module: validohub
country: OM
category: address
status: active
name:
  en: "Omani Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Sultan Qaboos Street 1, Muscat 100"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-phone-number-validator, oman-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
