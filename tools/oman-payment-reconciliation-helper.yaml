schemaVersion: 1
id: oman-payment-reconciliation-helper
kind: tool
module: validohub
country: OM
category: finance
status: active
name:
  en: "Omani Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.560 OMR; 0001 123456789; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-bank-statement-parser, oman-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
