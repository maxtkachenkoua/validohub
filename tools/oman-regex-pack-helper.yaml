schemaVersion: 1
id: oman-regex-pack-helper
kind: tool
module: validohub
country: OM
category: developer-tools
status: active
name:
  en: "Omani Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Civil number boundary commercial registration number postal code  0001 123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-api-payload-auditor, oman-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
