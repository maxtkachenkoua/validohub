schemaVersion: 1
id: oman-remittance-text-builder
kind: tool
module: validohub
country: OM
category: finance
status: active
name:
  en: "Omani Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 OM1100123456 1,234.560 OMR"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-payment-reconciliation-helper, oman-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
