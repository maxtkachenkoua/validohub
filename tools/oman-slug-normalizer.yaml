schemaVersion: 1
id: oman-slug-normalizer
kind: tool
module: validohub
country: OM
category: developer-tools
status: active
name:
  en: "Omani Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Oman sample company Sultan Qaboos Street 1, Muscat 100"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-document-ocr-fixer, oman-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
