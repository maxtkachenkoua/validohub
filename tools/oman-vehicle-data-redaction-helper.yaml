schemaVersion: 1
id: oman-vehicle-data-redaction-helper
kind: tool
module: validohub
country: OM
category: transport
status: active
name:
  en: "Omani Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.oman-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "M 12345 WVWZZZ1JZXW000001 12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [oman-customs-declaration-helper, oman-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Omani Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
