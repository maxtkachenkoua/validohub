schemaVersion: 1
id: pakistan-accessibility-locale-copy-checker
kind: tool
module: validohub
country: PK
category: localization
status: active
name:
  en: "Pakistani Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.pakistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "CNIC boundary input, postal code input, amount 1,234.56 PKR"
    actions: [validate, parse, format, explain]
related:
  explicit: [pakistan-support-ticket-scrubber, pakistan-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Pakistani Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
