schemaVersion: 1
id: pakistan-api-payload-auditor
kind: tool
module: validohub
country: PK
category: developer-tools
status: active
name:
  en: "Pakistani API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.pakistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"PK\",\"cnic\":\"35202-1234567-1\",\"iban\":\"PK36SCBL0000001123456702\",\"raast\":\"+923001234567\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [pakistan-form-field-auditor, pakistan-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Pakistani API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
