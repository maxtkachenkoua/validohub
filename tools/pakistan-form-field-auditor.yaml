schemaVersion: 1
id: pakistan-form-field-auditor
kind: tool
module: validohub
country: PK
category: developer-tools
status: active
name:
  en: "Pakistani Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.pakistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=1234567-8&postal=44000 Islamabad&phone=+92 300 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [pakistan-locale-number-parser, pakistan-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Pakistani Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
