schemaVersion: 1
id: pakistan-payment-reconciliation-helper
kind: tool
module: validohub
country: PK
category: finance
status: active
name:
  en: "Pakistani Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.pakistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 PKR; SCBL 0000001123456702; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [pakistan-bank-statement-parser, pakistan-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Pakistani Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
