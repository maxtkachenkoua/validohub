schemaVersion: 1
id: pakistan-pii-masker
kind: tool
module: validohub
country: PK
category: privacy
status: active
name:
  en: "Pakistani PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.pakistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "35202-1234567-1 +92 300 1234567 SCBL 0000001123456702"
    actions: [validate, parse, format, explain]
related:
  explicit: [pakistan-personal-data-fixture-generator, pakistan-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Pakistani PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
