schemaVersion: 1
id: pakistan-postal-code-validator
kind: tool
module: validohub
country: PK
category: address
status: active
name:
  en: "Pakistani Postal Code Validator"
summary:
  en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.pakistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "44000 Islamabad"
    actions: [validate, parse, format, explain]
related:
  explicit: [pakistan-address-normalizer, pakistan-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Pakistani Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
