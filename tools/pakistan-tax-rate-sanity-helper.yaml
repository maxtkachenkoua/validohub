schemaVersion: 1
id: pakistan-tax-rate-sanity-helper
kind: tool
module: validohub
country: PK
category: tax
status: active
name:
  en: "Pakistani Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.pakistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "FBR NTN / STRN 20% base 1,234.56 PKR"
    actions: [validate, parse, format, explain]
related:
  explicit: [pakistan-tax-return-field-helper, pakistan-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Pakistani Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
