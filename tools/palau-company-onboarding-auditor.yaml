schemaVersion: 1
id: palau-company-onboarding-auditor
kind: tool
module: validohub
country: PW
category: developer-tools
status: active
name:
  en: "Palauan Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for business registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"PW\",\"taxNumber\":\"PW123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-business-register-readiness-helper, palau-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for business registration number, VAT, address, banking, and official registry handoff readiness."
