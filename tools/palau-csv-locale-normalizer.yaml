schemaVersion: 1
id: palau-csv-locale-normalizer
kind: tool
module: validohub
country: PW
category: developer-tools
status: active
name:
  en: "Palauan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Palau decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 USD;07/24/2026;PW123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-slug-normalizer, palau-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Palau decimal, date, postal, phone, tax, and banking fields."
