capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234.56 USD"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-tax-rate-sanity-helper, palau-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan USD Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize USD amount strings, decimal separators, grouping, and API-safe numeric previews."
