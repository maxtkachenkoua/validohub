schemaVersion: 1
id: palau-data-quality-workbench
kind: tool
module: validohub
country: PW
category: developer-tools
status: active
name:
  en: "Palauan Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"PW\",\"taxNumber\":\"PW123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-json-fixture-generator, palau-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
