schemaVersion: 1
id: palau-form-field-auditor
kind: tool
module: validohub
country: PW
category: developer-tools
status: active
name:
  en: "Palauan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=PW123456789&postal=Ngerulmud, Melekeok&phone=+680 488 1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-locale-number-parser, palau-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
