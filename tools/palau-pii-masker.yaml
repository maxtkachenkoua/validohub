schemaVersion: 1
id: palau-pii-masker
kind: tool
module: validohub
country: PW
category: privacy
status: active
name:
  en: "Palauan PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "PW-ID-123456 +680 488 1234 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-personal-data-fixture-generator, palau-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
