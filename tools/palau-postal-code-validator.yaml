schemaVersion: 1
id: palau-postal-code-validator
kind: tool
module: validohub
country: PW
category: address
status: active
name:
  en: "Palauan Postal Code Validator"
summary:
  en: "Validate state/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "Ngerulmud, Melekeok"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-address-normalizer, palau-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan Postal Code Validator | ValidoHub"
  description:
    en: "Validate state/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
