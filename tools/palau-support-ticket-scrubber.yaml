schemaVersion: 1
id: palau-support-ticket-scrubber
kind: tool
module: validohub
country: PW
category: privacy
status: active
name:
  en: "Palauan Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palau-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent PW-ID-123456, 001 1234567890, Ngerulmud, Melekeok State"
    actions: [validate, parse, format, explain]
related:
  explicit: [palau-integration-smoke-test-builder, palau-national-id-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palauan Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
