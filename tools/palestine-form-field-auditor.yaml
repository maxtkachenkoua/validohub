schemaVersion: 1
id: palestine-form-field-auditor
kind: tool
module: validohub
country: PS
category: developer-tools
status: active
name:
  en: "Palestinian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palestine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=562345678&postal=P600 Ramallah&phone=+970 59 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [palestine-locale-number-parser, palestine-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palestinian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
