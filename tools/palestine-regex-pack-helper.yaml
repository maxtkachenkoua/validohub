schemaVersion: 1
id: palestine-regex-pack-helper
kind: tool
module: validohub
country: PS
category: developer-tools
status: active
name:
  en: "Palestinian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.palestine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "ID number boundary company registration number postal code  PALS 400123456702"
    actions: [validate, parse, format, explain]
related:
  explicit: [palestine-api-payload-auditor, palestine-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palestinian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
