      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Palestine sample company Al-Manara 1, Ramallah P600"
    actions: [validate, parse, format, explain]
related:
  explicit: [palestine-document-ocr-fixer, palestine-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Palestinian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
