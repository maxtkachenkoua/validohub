schemaVersion: 1
id: papua-new-guinea-api-payload-auditor
kind: tool
module: validohub
country: PG
category: developer-tools
status: active
name:
  en: "Papua New Guinean API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"PG\",\"tin\":\"PG123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-form-field-auditor, papua-new-guinea-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
