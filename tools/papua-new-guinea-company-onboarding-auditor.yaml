schemaVersion: 1
id: papua-new-guinea-company-onboarding-auditor
kind: tool
module: validohub
country: PG
category: developer-tools
status: active
name:
  en: "Papua New Guinean Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"PG\",\"tin\":\"PG123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-business-register-readiness-helper, papua-new-guinea-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
