    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "PG-TIN-123456 PG123456789 001 1234567890 Port Moresby NCD"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-privacy-redaction-helper, papua-new-guinea-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
