schemaVersion: 1
id: papua-new-guinea-form-field-auditor
kind: tool
module: validohub
country: PG
category: developer-tools
status: active
name:
  en: "Papua New Guinean Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=PG123456789&postal=Port Moresby NCD&phone=+675 7123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-locale-number-parser, papua-new-guinea-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
