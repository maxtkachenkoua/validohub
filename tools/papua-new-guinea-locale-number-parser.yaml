schemaVersion: 1
id: papua-new-guinea-locale-number-parser
kind: tool
module: validohub
country: PG
category: localization
status: active
name:
  en: "Papua New Guinean Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Papua New Guinea."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 PGK"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-calendar-week-helper, papua-new-guinea-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Papua New Guinea."
