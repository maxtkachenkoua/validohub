schemaVersion: 1
id: papua-new-guinea-mrz-passport-parser
kind: tool
module: validohub
country: PG
category: national-identifiers
status: active
name:
  en: "Papua New Guinean MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<PNGSAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567PNG8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-bank-account-validator, papua-new-guinea-bank-account-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
