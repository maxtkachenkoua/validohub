schemaVersion: 1
id: papua-new-guinea-passport-number-helper
kind: tool
module: validohub
country: PG
category: national-identifiers
status: active
name:
  en: "Papua New Guinean Passport Number Helper"
summary:
  en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "P<PNGPAPUA NEW GUINEAN<<SAMPLE<<<<<<<<<<<<<<<<<<"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-mrz-passport-parser, papua-new-guinea-bank-account-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean Passport Number Helper | ValidoHub"
  description:
    en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
