schemaVersion: 1
id: papua-new-guinea-phone-number-validator
kind: tool
module: validohub
country: PG
category: address
status: active
name:
  en: "Papua New Guinean Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+675 7123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-phone-e164-formatter, papua-new-guinea-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
