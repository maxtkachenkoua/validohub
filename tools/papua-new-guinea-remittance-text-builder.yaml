schemaVersion: 1
id: papua-new-guinea-remittance-text-builder
kind: tool
module: validohub
country: PG
category: finance
status: active
name:
  en: "Papua New Guinean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 PG123456789 1,234.56 PGK"
    actions: [validate, parse, format, explain]
related:
  explicit: [papua-new-guinea-payment-reconciliation-helper, papua-new-guinea-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Papua New Guinean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
