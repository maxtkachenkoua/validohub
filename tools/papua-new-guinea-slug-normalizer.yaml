  algorithmId: validohub.papua-new-guinea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Papua New Guinea sample company Waigani, Port Moresby NCD"
    actions: [validate, parse, format, explain]
related:
