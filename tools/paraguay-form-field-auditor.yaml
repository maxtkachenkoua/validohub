schemaVersion: 1
id: paraguay-form-field-auditor
kind: tool
module: validohub
country: PY
category: developer-tools
status: active
name:
  en: "Paraguayan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.paraguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=PY 80012345-6&postal=1209 Asuncion&phone=+595 981 123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [paraguay-locale-number-parser, paraguay-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Paraguayan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
