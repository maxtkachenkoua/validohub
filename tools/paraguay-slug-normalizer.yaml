schemaVersion: 1
id: paraguay-slug-normalizer
kind: tool
module: validohub
country: PY
category: developer-tools
status: active
name:
  en: "Paraguayan Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.paraguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Paraguay sample company Mariscal Lopez 123, 1209 Asuncion"
    actions: [validate, parse, format, explain]
related:
  explicit: [paraguay-document-ocr-fixer, paraguay-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Paraguayan Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
