schemaVersion: 1
id: password-policy-tester
kind: tool
module: validohub
category: developer-tools
status: active
name:
  en: Password Policy Tester
summary:
  en: Test password policy rules locally for length, character classes, breached-pattern hints, user-info overlap, entropy approximation, and UX-safe feedback.
capabilities: [validate, generate, explain, parse]
algorithm:
  algorithmId: validohub.password-policy-tester
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: Password policy and sample
      - type: select
        name: profile
        label:
          en: Profile
        options:
          - security-auth
          - strict
          - review
        default: "security-auth"
    actions: [validate, generate, explain, parse]
related:
  explicit: [csp-nonce-hash-helper, cookie-samesite-lab, email-header-auth-inspector, json-schema-workbench]
  auto:
    sameCountry: false
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: Password Policy Tester
  description:
    en: Test password policy rules locally for length, character classes, breached-pattern hints, user-info overlap, entropy approximation, and UX-safe feedback.
