schemaVersion: 1
id: peru-accessibility-locale-copy-checker
kind: tool
module: validohub
country: PE
category: localization
status: active
name:
  en: "Peruvian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "DNI input, codigo postal input, amount 1,234.56 PEN"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-support-ticket-scrubber, peru-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
