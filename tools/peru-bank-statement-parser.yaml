schemaVersion: 1
id: peru-bank-statement-parser
kind: tool
module: validohub
country: PE
category: finance
status: active
name:
  en: "Peruvian Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 PEN; PE-CCI-002-12345678901234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-masked-bank-account-formatter, peru-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
