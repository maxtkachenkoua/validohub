schemaVersion: 1
id: peru-company-onboarding-auditor
kind: tool
module: validohub
country: PE
category: developer-tools
status: active
name:
  en: "Peruvian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for RUC, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"PE\",\"ruc\":\"20123456789\",\"cci\":\"00212345678901234567890\",\"amount\":\"1,234.56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-business-register-readiness-helper, peru-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for RUC, VAT, address, banking, and official registry handoff readiness."
