schemaVersion: 1
id: peru-csv-locale-normalizer
kind: tool
module: validohub
country: PE
category: developer-tools
status: active
name:
  en: "Peruvian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Peru decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 PEN;21/07/2026;PE RUC 20123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-slug-normalizer, peru-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Peru decimal, date, postal, phone, tax, and banking fields."
