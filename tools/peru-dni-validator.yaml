    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian DNI Validator | ValidoHub"
  description:
    en: "Validate DNI shape, split date/control/body evidence, and prepare privacy-safe debugging output."
