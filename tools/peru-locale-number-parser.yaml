schemaVersion: 1
id: peru-locale-number-parser
kind: tool
module: validohub
country: PE
category: localization
status: active
name:
  en: "Peruvian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Peru."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 PEN"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-calendar-week-helper, peru-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Peru."
