schemaVersion: 1
id: peru-municipality-code-inspector
kind: tool
module: validohub
country: PE
category: address
status: active
name:
  en: "Peruvian Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Av. Larco 123, Miraflores, 15074 Lima"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-phone-number-validator, peru-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
