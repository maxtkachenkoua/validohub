schemaVersion: 1
id: peru-payment-reconciliation-helper
kind: tool
module: validohub
country: PE
category: finance
status: active
name:
  en: "Peruvian Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 PEN; PE-CCI-002-12345678901234567890; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-bank-statement-parser, peru-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
