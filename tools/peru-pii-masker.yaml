schemaVersion: 1
id: peru-pii-masker
kind: tool
module: validohub
country: PE
category: privacy
status: active
name:
  en: "Peruvian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "12345678 +51 912 345 678 PE-CCI-002-12345678901234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-personal-data-fixture-generator, peru-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
