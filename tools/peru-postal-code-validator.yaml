schemaVersion: 1
id: peru-postal-code-validator
kind: tool
module: validohub
country: PE
category: address
status: active
name:
  en: "Peruvian Postal Code Validator"
summary:
  en: "Validate codigo postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "15001 Lima"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-address-normalizer, peru-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Postal Code Validator | ValidoHub"
  description:
    en: "Validate codigo postal shape, split area/delivery hints, and preserve official postal lookup boundaries."
