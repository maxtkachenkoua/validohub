schemaVersion: 1
id: peru-remittance-text-builder
kind: tool
module: validohub
country: PE
category: finance
status: active
name:
  en: "Peruvian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 PE RUC 20123456789 1,234.56 PEN"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-payment-reconciliation-helper, peru-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
