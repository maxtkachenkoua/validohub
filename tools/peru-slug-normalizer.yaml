schemaVersion: 1
id: peru-slug-normalizer
kind: tool
module: validohub
country: PE
category: developer-tools
status: active
name:
  en: "Peruvian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Peru sample company Av. Larco 123, Miraflores, 15074 Lima"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-document-ocr-fixer, peru-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
