schemaVersion: 1
id: peru-vat-rate-sanity-helper
kind: tool
module: validohub
country: PE
category: tax
status: active
name:
  en: "Peruvian VAT Rate Sanity Helper"
summary:
  en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.peru-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "IGV / RUC 20% base 1,234.56 PEN"
    actions: [validate, parse, format, explain]
related:
  explicit: [peru-vat-return-field-helper, peru-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Peruvian VAT Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
