schemaVersion: 1
id: philippines-company-onboarding-auditor
kind: tool
module: validohub
country: PH
category: developer-tools
status: active
name:
  en: "Philippine Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for SEC registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.philippines-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"PH\",\"tin\":\"123-456-789-000\",\"instapay\":\"0101234567890\",\"amount\":\"1,234.56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [philippines-business-register-readiness-helper, philippines-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Philippine Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for SEC registration number, VAT, address, banking, and official registry handoff readiness."
