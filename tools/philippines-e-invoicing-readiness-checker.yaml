schemaVersion: 1
id: philippines-e-invoicing-readiness-checker
kind: tool
module: validohub
country: PH
category: tax
status: active
name:
  en: "Philippine BIR invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.philippines-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"PH\",\"tin\":\"123-456-789-000\",\"instapay\":\"0101234567890\",\"amount\":\"1,234.56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [philippines-tax-authority-handoff-helper, philippines-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Philippine BIR invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
