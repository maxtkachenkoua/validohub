schemaVersion: 1
id: philippines-form-field-auditor
kind: tool
module: validohub
country: PH
category: developer-tools
status: active
name:
  en: "Philippine Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.philippines-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=123-456-789-000&postal=1000 Manila&phone=+63 917 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [philippines-locale-number-parser, philippines-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Philippine Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
