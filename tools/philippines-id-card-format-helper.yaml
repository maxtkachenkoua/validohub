summary:
  en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.philippines-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CARD input"
        required: true
        placeholder:
          en: "1234-5678-9012-3456"
    actions: [validate, parse, format, explain]
related:
  explicit: [philippines-passport-number-helper, philippines-mrz-passport-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Philippine ID Card Format Helper | ValidoHub"
  description:
    en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
