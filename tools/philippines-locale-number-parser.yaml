    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Philippine Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Philippines."
