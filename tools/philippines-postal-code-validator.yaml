schemaVersion: 1
id: philippines-postal-code-validator
kind: tool
module: validohub
country: PH
category: address
status: active
name:
  en: "Philippine Postal Code Validator"
summary:
  en: "Validate ZIP code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.philippines-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "1000 Manila"
    actions: [validate, parse, format, explain]
related:
  explicit: [philippines-address-normalizer, philippines-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Philippine Postal Code Validator | ValidoHub"
  description:
    en: "Validate ZIP code shape, split area/delivery hints, and preserve official postal lookup boundaries."
