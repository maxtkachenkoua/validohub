schemaVersion: 1
id: philippines-regex-pack-helper
kind: tool
module: validohub
country: PH
category: developer-tools
status: active
name:
  en: "Philippine Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.philippines-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "PhilSys boundary SEC registration number ZIP code  010 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [philippines-api-payload-auditor, philippines-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Philippine Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
