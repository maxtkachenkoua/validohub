  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: Polish Bank Code / NRB Inspector
  description:
    en: Extract and explain Polish bank and branch code segments from NRB or PL IBAN numbers.
