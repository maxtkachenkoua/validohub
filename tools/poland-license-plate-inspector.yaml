schemaVersion: 1
id: poland-license-plate-inspector
kind: tool
module: validohub
country: PL
category: national-identifiers
status: active
name:
  en: Polish License Plate Inspector
summary:
  en: Inspect Polish vehicle plate formats, regional prefixes, and plate categories locally.
capabilities:
  - validate
  - parse
  - generate
  - explain
algorithm:
  algorithmId: validohub.poland-suite
forms:
  validate:
    inputs:
      - type: text
        name: input
        label:
          en: License plate
        required: true
        placeholder:
          en: WA12345
    actions: [validate, parse, generate, explain]
related:
  explicit: [pesel-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: Polish License Plate Inspector
  description:
    en: Inspect Polish vehicle plate formats, regional prefixes, and plate categories locally.
