schemaVersion: 1
id: portugal-address-normalizer
kind: tool
module: validohub
country: PT
category: address
status: active
name:
  en: "Portuguese Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Rua Augusta 100, 1100-053 Lisboa"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-address-transliteration-normalizer, portugal-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
