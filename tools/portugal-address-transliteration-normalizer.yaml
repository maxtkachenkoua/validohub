schemaVersion: 1
id: portugal-address-transliteration-normalizer
kind: tool
module: validohub
country: PT
category: address
status: active
name:
  en: "Portuguese Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Rua Augusta 100, 1100-053 Lisboa"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-region-code-mapper, portugal-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
