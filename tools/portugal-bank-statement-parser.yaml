schemaVersion: 1
id: portugal-bank-statement-parser
kind: tool
module: validohub
country: PT
category: finance
status: active
name:
  en: "Portuguese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1 234,56 EUR; PT50000201231234567490154; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-masked-iban-formatter, portugal-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
