schemaVersion: 1
id: portugal-currency-decimal-formatter
kind: tool
module: validohub
country: PT
category: finance
status: active
name:
  en: "Portuguese EUR Decimal Currency Formatter"
summary:
  en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-vat-rate-sanity-helper, portugal-vat-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese EUR Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
