schemaVersion: 1
id: portugal-eori-validator
kind: tool
module: validohub
country: PT
category: national-identifiers
status: active
name:
  en: "Portuguese EORI / Customs Identifier Helper"
summary:
  en: "Inspect customs identifiers, country prefixes, VAT-style bodies, and border-process boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EORI input"
        required: true
        placeholder:
          en: "PTPT123456749"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-niss-social-insurance-helper, portugal-company-onboarding-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese EORI / Customs Identifier Helper | ValidoHub"
  description:
    en: "Inspect customs identifiers, country prefixes, VAT-style bodies, and border-process boundaries."
