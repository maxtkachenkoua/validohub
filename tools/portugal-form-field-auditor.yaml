schemaVersion: 1
id: portugal-form-field-auditor
kind: tool
module: validohub
country: PT
category: developer-tools
status: active
name:
  en: "Portuguese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=PT123456749&postal=1000-001 Lisboa&phone=+351 912 345 678"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-locale-number-parser, portugal-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
