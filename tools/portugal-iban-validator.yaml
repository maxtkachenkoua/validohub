schemaVersion: 1
id: portugal-iban-validator
kind: tool
module: validohub
country: PT
category: finance
status: active
name:
  en: "Portugal IBAN Validator"
summary:
  en: "Validate PT IBAN shape, replay MOD-97 evidence, and split bank/account blocks for debugging."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "IBAN input"
        required: true
        placeholder:
          en: "PT50000201231234567490154"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-iban-generator, portugal-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portugal IBAN Validator | ValidoHub"
  description:
    en: "Validate PT IBAN shape, replay MOD-97 evidence, and split bank/account blocks for debugging."
