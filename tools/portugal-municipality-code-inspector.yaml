schemaVersion: 1
id: portugal-municipality-code-inspector
kind: tool
module: validohub
country: PT
category: address
status: active
name:
  en: "Portuguese Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Rua Augusta 100, 1100-053 Lisboa"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-phone-number-validator, portugal-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
