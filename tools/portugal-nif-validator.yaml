summary:
  en: "Validate NIF shape, split date/control/body evidence, and prepare privacy-safe debugging output."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ID input"
        required: true
        placeholder:
          en: "123456749"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-nipc-validator, portugal-vat-id-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese NIF Validator | ValidoHub"
  description:
    en: "Validate NIF shape, split date/control/body evidence, and prepare privacy-safe debugging output."
