schemaVersion: 1
id: portugal-remittance-text-builder
kind: tool
module: validohub
country: PT
category: finance
status: active
name:
  en: "Portuguese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 PT123456749 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-payment-reconciliation-helper, portugal-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
