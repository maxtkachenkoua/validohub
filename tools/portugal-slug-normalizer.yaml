schemaVersion: 1
id: portugal-slug-normalizer
kind: tool
module: validohub
country: PT
category: developer-tools
status: active
name:
  en: "Portuguese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Portugal sample company Rua Augusta 100, 1100-053 Lisboa"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-document-ocr-fixer, portugal-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
