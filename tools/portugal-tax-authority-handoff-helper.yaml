schemaVersion: 1
id: portugal-tax-authority-handoff-helper
kind: tool
module: validohub
country: PT
category: tax
status: active
name:
  en: "Portuguese Tax Authority Handoff Helper"
summary:
  en: "Prepare local tax evidence for browser-only QA before regulated authority portals or API submissions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "PT123456749 21/07/2026 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-accounting-audit-trail-checklist-generator, portugal-postal-code-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Tax Authority Handoff Helper | ValidoHub"
  description:
    en: "Prepare local tax evidence for browser-only QA before regulated authority portals or API submissions."
