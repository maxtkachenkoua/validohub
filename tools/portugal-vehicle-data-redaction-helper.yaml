schemaVersion: 1
id: portugal-vehicle-data-redaction-helper
kind: tool
module: validohub
country: PT
category: transport
status: active
name:
  en: "Portuguese Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.portugal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "12-AA-34 WVWZZZ1JZXW000001 123456749"
    actions: [validate, parse, format, explain]
related:
  explicit: [portugal-customs-declaration-helper, portugal-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Portuguese Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
