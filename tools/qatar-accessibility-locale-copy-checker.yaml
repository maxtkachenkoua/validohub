schemaVersion: 1
id: qatar-accessibility-locale-copy-checker
kind: tool
module: validohub
country: QA
category: localization
status: active
name:
  en: "Qatari Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "QID boundary input, PO Box input, amount 1,234.56 QAR"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-support-ticket-scrubber, qatar-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
