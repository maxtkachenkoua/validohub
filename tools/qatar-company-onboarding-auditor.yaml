schemaVersion: 1
id: qatar-company-onboarding-auditor
kind: tool
module: validohub
country: QA
category: developer-tools
status: active
name:
  en: "Qatari Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"QA\",\"qid\":\"29012345678\",\"iban\":\"QA58DOHB00001234567890ABCDEFG\",\"naps\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-business-register-readiness-helper, qatar-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
