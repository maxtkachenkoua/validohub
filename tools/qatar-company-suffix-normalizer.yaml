schemaVersion: 1
id: qatar-company-suffix-normalizer
kind: tool
module: validohub
country: QA
category: developer-tools
status: active
name:
  en: "Qatari Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Qatar Sample Holding Ltd 123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-procurement-identifier-helper, qatar-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
