schemaVersion: 1
id: qatar-csv-locale-normalizer
kind: tool
module: validohub
country: QA
category: developer-tools
status: active
name:
  en: "Qatari CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Qatar decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 QAR;21/07/2026;TC1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-slug-normalizer, qatar-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Qatar decimal, date, postal, phone, tax, and banking fields."
