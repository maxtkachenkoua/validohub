schemaVersion: 1
id: qatar-form-field-auditor
kind: tool
module: validohub
country: QA
category: developer-tools
status: active
name:
  en: "Qatari Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TC1234567&postal=PO Box 12345 Doha&phone=+974 3312 3456"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-locale-number-parser, qatar-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
