schemaVersion: 1
id: qatar-json-fixture-generator
kind: tool
module: validohub
country: QA
category: developer-tools
status: active
name:
  en: "Qatari JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"QA\",\"qid\":\"29012345678\",\"iban\":\"QA58DOHB00001234567890ABCDEFG\",\"naps\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [qatar-regex-pack-helper, qatar-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
