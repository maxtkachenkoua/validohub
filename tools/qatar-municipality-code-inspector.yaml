schemaVersion: 1
id: qatar-municipality-code-inspector
kind: tool
module: validohub
country: QA
category: address
status: active
name:
  en: "Qatari Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "West Bay, Doha, PO Box 12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-phone-number-validator, qatar-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
