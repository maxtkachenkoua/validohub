schemaVersion: 1
id: qatar-pii-masker
kind: tool
module: validohub
country: QA
category: privacy
status: active
name:
  en: "Qatari PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "29012345678 +974 3312 3456 DOHB 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-personal-data-fixture-generator, qatar-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
