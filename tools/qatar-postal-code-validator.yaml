schemaVersion: 1
id: qatar-postal-code-validator
kind: tool
module: validohub
country: QA
category: address
status: active
name:
  en: "Qatari Postal Code Validator"
summary:
  en: "Validate PO Box shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "PO Box 12345 Doha"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-address-normalizer, qatar-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Postal Code Validator | ValidoHub"
  description:
    en: "Validate PO Box shape, split area/delivery hints, and preserve official postal lookup boundaries."
