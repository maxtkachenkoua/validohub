schemaVersion: 1
id: qatar-regex-pack-helper
kind: tool
module: validohub
country: QA
category: developer-tools
status: active
name:
  en: "Qatari Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "QID boundary commercial registration number PO Box  DOHB 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-api-payload-auditor, qatar-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
