schemaVersion: 1
id: qatar-remittance-text-builder
kind: tool
module: validohub
country: QA
category: finance
status: active
name:
  en: "Qatari Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.qatar-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 TC1234567 1,234.56 QAR"
    actions: [validate, parse, format, explain]
related:
  explicit: [qatar-payment-reconciliation-helper, qatar-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Qatari Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
