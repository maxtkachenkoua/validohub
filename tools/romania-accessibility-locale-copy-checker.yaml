schemaVersion: 1
id: romania-accessibility-locale-copy-checker
kind: tool
module: validohub
country: RO
category: localization
status: active
name:
  en: "Romanian Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.romania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "CNP input, cod postal input, amount 1.234,56 RON"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-support-ticket-scrubber, romania-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
