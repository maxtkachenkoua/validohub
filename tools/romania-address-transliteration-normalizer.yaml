schemaVersion: 1
id: romania-address-transliteration-normalizer
kind: tool
module: validohub
country: RO
category: address
status: active
name:
  en: "Romanian Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.romania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Calea Victoriei 1, 010061 Bucuresti"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-region-code-mapper, romania-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
