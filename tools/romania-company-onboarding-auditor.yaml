    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"RO\",\"cnp\":\"1850101123451\",\"cui\":\"RO12345674\",\"iban\":\"RO49AAAA1B31007593840000\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-business-register-readiness-helper, romania-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for CUI / CIF, VAT, address, banking, and official registry handoff readiness."
