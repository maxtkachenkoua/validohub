schemaVersion: 1
id: romania-form-field-auditor
kind: tool
module: validohub
country: RO
category: developer-tools
status: active
name:
  en: "Romanian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.romania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=RO12345674&postal=010011 Bucuresti&phone=+40 721 234 567"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-locale-number-parser, romania-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
