  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romania IBAN Generator | ValidoHub"
  description:
    en: "Generate RO IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
