schemaVersion: 1
id: romania-locale-number-parser
kind: tool
module: validohub
country: RO
category: localization
status: active
name:
  en: "Romanian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Romania."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.romania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 RON"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-calendar-week-helper, romania-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Romania."
