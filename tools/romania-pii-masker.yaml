schemaVersion: 1
id: romania-pii-masker
kind: tool
module: validohub
country: RO
category: privacy
status: active
name:
  en: "Romanian PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.romania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "1850101123451 +40 721 234 567 RO49AAAA1B31007593840000"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-personal-data-fixture-generator, romania-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
