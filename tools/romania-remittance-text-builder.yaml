schemaVersion: 1
id: romania-remittance-text-builder
kind: tool
module: validohub
country: RO
category: finance
status: active
name:
  en: "Romanian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.romania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 RO12345674 1.234,56 RON"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-payment-reconciliation-helper, romania-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
