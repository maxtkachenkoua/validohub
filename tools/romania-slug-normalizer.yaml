schemaVersion: 1
id: romania-slug-normalizer
kind: tool
module: validohub
country: RO
category: developer-tools
status: active
name:
  en: "Romanian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.romania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Romania sample company Calea Victoriei 1, 010061 Bucuresti"
    actions: [validate, parse, format, explain]
related:
  explicit: [romania-document-ocr-fixer, romania-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Romanian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
