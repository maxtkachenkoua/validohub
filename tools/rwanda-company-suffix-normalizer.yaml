      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Rwanda Sample Holding Ltd RW-REG-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [rwanda-procurement-identifier-helper, rwanda-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Rwandan Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
