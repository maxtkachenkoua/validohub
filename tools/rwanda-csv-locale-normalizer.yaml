schemaVersion: 1
id: rwanda-csv-locale-normalizer
kind: tool
module: validohub
country: RW
category: developer-tools
status: active
name:
  en: "Rwandan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Rwanda decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.rwanda-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 RWF;24/07/2026;RW123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [rwanda-slug-normalizer, rwanda-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Rwandan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Rwanda decimal, date, postal, phone, tax, and banking fields."
