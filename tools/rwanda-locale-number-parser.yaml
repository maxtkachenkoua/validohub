schemaVersion: 1
id: rwanda-locale-number-parser
kind: tool
module: validohub
country: RW
category: localization
status: active
name:
  en: "Rwandan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Rwanda."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.rwanda-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 RWF"
    actions: [validate, parse, format, explain]
related:
  explicit: [rwanda-calendar-week-helper, rwanda-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Rwandan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Rwanda."
