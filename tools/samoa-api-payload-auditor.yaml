schemaVersion: 1
id: samoa-api-payload-auditor
kind: tool
module: validohub
country: WS
category: developer-tools
status: active
name:
  en: "Samoan API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"WS\",\"taxNumber\":\"WS123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-form-field-auditor, samoa-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
