  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan WST Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize WST amount strings, decimal separators, grouping, and API-safe numeric previews."
