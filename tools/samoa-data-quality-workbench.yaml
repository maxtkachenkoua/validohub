schemaVersion: 1
id: samoa-data-quality-workbench
kind: tool
module: validohub
country: WS
category: developer-tools
status: active
name:
  en: "Samoan Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"WS\",\"taxNumber\":\"WS123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-json-fixture-generator, samoa-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
