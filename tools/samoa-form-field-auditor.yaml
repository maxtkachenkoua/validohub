schemaVersion: 1
id: samoa-form-field-auditor
kind: tool
module: validohub
country: WS
category: developer-tools
status: active
name:
  en: "Samoan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=WS123456789&postal=Apia&phone=+685 12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-locale-number-parser, samoa-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
