schemaVersion: 1
id: samoa-json-fixture-generator
kind: tool
module: validohub
country: WS
category: developer-tools
status: active
name:
  en: "Samoan JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"WS\",\"taxNumber\":\"WS123456789\"}"
    actions: [generate, validate, explain]
related:
  explicit: [samoa-regex-pack-helper, samoa-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
