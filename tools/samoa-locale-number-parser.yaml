schemaVersion: 1
id: samoa-locale-number-parser
kind: tool
module: validohub
country: WS
category: localization
status: active
name:
  en: "Samoan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Samoa."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 WST"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-calendar-week-helper, samoa-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Samoa."
