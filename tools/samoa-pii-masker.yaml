schemaVersion: 1
id: samoa-pii-masker
kind: tool
module: validohub
country: WS
category: privacy
status: active
name:
  en: "Samoan PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "WS-TIN-123456 +685 12345 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-personal-data-fixture-generator, samoa-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
