schemaVersion: 1
id: samoa-privacy-redaction-helper
kind: tool
module: validohub
country: WS
category: privacy
status: active
name:
  en: "Samoan privacy boundary Redaction Helper"
summary:
  en: "Mask personal, tax, banking, phone, and address evidence for logs and support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PRIV input"
        required: true
        placeholder:
          en: "{\"country\":\"WS\",\"taxNumber\":\"WS123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-pii-masker, samoa-personal-data-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan privacy boundary Redaction Helper | ValidoHub"
  description:
    en: "Mask personal, tax, banking, phone, and address evidence for logs and support tickets."
