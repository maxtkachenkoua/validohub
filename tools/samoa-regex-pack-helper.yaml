schemaVersion: 1
id: samoa-regex-pack-helper
kind: tool
module: validohub
country: WS
category: developer-tools
status: active
name:
  en: "Samoan Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "tax ID boundary company registration number village/locality  001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-api-payload-auditor, samoa-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
