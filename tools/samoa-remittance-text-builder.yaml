schemaVersion: 1
id: samoa-remittance-text-builder
kind: tool
module: validohub
country: WS
category: finance
status: active
name:
  en: "Samoan Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 WS123456789 1,234.56 WST"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-payment-reconciliation-helper, samoa-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
