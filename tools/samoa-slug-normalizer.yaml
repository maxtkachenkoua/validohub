schemaVersion: 1
id: samoa-slug-normalizer
kind: tool
module: validohub
country: WS
category: developer-tools
status: active
name:
  en: "Samoan Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Samoa sample company Beach Road, Apia"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-document-ocr-fixer, samoa-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
