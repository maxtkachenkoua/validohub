schemaVersion: 1
id: samoa-support-ticket-scrubber
kind: tool
module: validohub
country: WS
category: privacy
status: active
name:
  en: "Samoan Support Ticket Scrubber"
summary:
  en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent WS-TIN-123456, 001 1234567890, Beach Road, Apia"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-integration-smoke-test-builder, samoa-tax-id-boundary-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Support Ticket Scrubber | ValidoHub"
  description:
    en: "Detect and mask local personal, payment, vehicle, tax, and address evidence in support tickets."
