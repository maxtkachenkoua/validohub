schemaVersion: 1
id: samoa-tax-return-field-helper
kind: tool
module: validohub
country: WS
category: tax
status: active
name:
  en: "Samoan Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.samoa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "VAGST / tax boundary; WS123456789; period 2026-07; 1,234.56 WST"
    actions: [validate, parse, format, explain]
related:
  explicit: [samoa-invoice-number-helper, samoa-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Samoan Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
