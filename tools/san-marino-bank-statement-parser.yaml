schemaVersion: 1
id: san-marino-bank-statement-parser
kind: tool
module: validohub
country: SM
category: finance
status: active
name:
  en: "Sammarinese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.san-marino-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 EUR; SM86U0322509800000000270100; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [san-marino-masked-iban-formatter, san-marino-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sammarinese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
