schemaVersion: 1
id: san-marino-form-field-auditor
kind: tool
module: validohub
country: SM
category: developer-tools
status: active
name:
  en: "Sammarinese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.san-marino-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SM12345&postal=47890 San Marino&phone=+378 0549 123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [san-marino-locale-number-parser, san-marino-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sammarinese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
