schemaVersion: 1
id: san-marino-phone-number-validator
kind: tool
module: validohub
country: SM
category: address
status: active
name:
  en: "Sammarinese Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.san-marino-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+378 0549 123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [san-marino-phone-e164-formatter, san-marino-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sammarinese Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
