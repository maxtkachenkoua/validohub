schemaVersion: 1
id: sao-tome-and-principe-form-field-auditor
kind: tool
module: validohub
country: ST
category: developer-tools
status: active
name:
  en: "Sao Tomean Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sao-tome-and-principe-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=ST123456789&postal=1000 Sao Tome&phone=+239 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [sao-tome-and-principe-locale-number-parser, sao-tome-and-principe-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sao Tomean Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
