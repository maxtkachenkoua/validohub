        required: true
        placeholder:
          en: "P<STPSAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567STP8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [sao-tome-and-principe-bank-account-validator, sao-tome-and-principe-bank-account-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sao Tomean MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
