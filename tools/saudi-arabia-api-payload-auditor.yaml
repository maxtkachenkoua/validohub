schemaVersion: 1
id: saudi-arabia-api-payload-auditor
kind: tool
module: validohub
country: SA
category: developer-tools
status: active
name:
  en: "Saudi API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"SA\",\"vat\":\"300123456700003\",\"iban\":\"SA0380000000608010167519\",\"sadad\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [saudi-arabia-form-field-auditor, saudi-arabia-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
