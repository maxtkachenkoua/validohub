schemaVersion: 1
id: saudi-arabia-company-onboarding-auditor
kind: tool
module: validohub
country: SA
category: developer-tools
status: active
name:
  en: "Saudi Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for Commercial Registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"SA\",\"vat\":\"300123456700003\",\"iban\":\"SA0380000000608010167519\",\"sadad\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [saudi-arabia-business-register-readiness-helper, saudi-arabia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for Commercial Registration number, VAT, address, banking, and official registry handoff readiness."
