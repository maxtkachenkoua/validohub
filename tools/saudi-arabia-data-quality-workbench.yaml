schemaVersion: 1
id: saudi-arabia-data-quality-workbench
kind: tool
module: validohub
country: SA
category: developer-tools
status: active
name:
  en: "Saudi Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"SA\",\"vat\":\"300123456700003\",\"iban\":\"SA0380000000608010167519\",\"sadad\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [saudi-arabia-json-fixture-generator, saudi-arabia-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
