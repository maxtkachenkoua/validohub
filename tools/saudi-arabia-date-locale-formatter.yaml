schemaVersion: 1
id: saudi-arabia-date-locale-formatter
kind: tool
module: validohub
country: SA
category: localization
status: active
name:
  en: "Saudi Date Locale Formatter"
summary:
  en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "21/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [saudi-arabia-csv-locale-normalizer, saudi-arabia-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi Date Locale Formatter | ValidoHub"
  description:
    en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
