schemaVersion: 1
id: saudi-arabia-form-field-auditor
kind: tool
module: validohub
country: SA
category: developer-tools
status: active
name:
  en: "Saudi Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=300123456700003&postal=12211 Riyadh&phone=+966 50 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [saudi-arabia-locale-number-parser, saudi-arabia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
