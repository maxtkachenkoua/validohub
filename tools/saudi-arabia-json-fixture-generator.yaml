schemaVersion: 1
id: saudi-arabia-json-fixture-generator
kind: tool
module: validohub
country: SA
category: developer-tools
status: active
name:
  en: "Saudi JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"SA\",\"vat\":\"300123456700003\",\"iban\":\"SA0380000000608010167519\",\"sadad\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [saudi-arabia-regex-pack-helper, saudi-arabia-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
