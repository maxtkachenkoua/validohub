schemaVersion: 1
id: saudi-arabia-postal-code-validator
kind: tool
module: validohub
country: SA
category: address
status: active
name:
  en: "Saudi Postal Code Validator"
summary:
  en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "12211 Riyadh"
    actions: [validate, parse, format, explain]
related:
  explicit: [saudi-arabia-address-normalizer, saudi-arabia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
