schemaVersion: 1
id: saudi-arabia-remittance-text-builder
kind: tool
module: validohub
country: SA
category: finance
status: active
name:
  en: "Saudi Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.saudi-arabia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 300123456700003 1,234.56 SAR"
    actions: [validate, parse, format, explain]
related:
  explicit: [saudi-arabia-payment-reconciliation-helper, saudi-arabia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Saudi Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
