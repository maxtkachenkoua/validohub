schemaVersion: 1
id: secret-pii-redactor
kind: tool
module: validohub
category: developer-tools
status: active
name:
  en: Secret & PII Scanner Redactor
summary:
  en: Detect tokens, email, phone, IBAN, JWT, and API-key evidence, then produce masked output locally.
capabilities: [validate, generate, parse, explain]
algorithm:
  algorithmId: validohub.secret-pii
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: Payload text
      - type: select
        name: mode
        label:
          en: Redaction mode
        options: [balanced, strict, preview]
        default: balanced
    actions: [validate, generate, parse, explain]
related:
  explicit: [iban-validator, iban-generator, uuid-generator, regex-tester]
  auto:
    sameCountry: false
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: Secret & PII Scanner Redactor
  description:
    en: Detect tokens, email, phone, IBAN, JWT, and API-key evidence, then produce masked output locally.
