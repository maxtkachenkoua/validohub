schemaVersion: 1
id: secret-scanner-workbench
kind: tool
module: validohub
category: developer-tools
status: active
name:
  en: Secret Scanner Workbench
summary:
  en: Scan pasted payloads for API keys, private keys, JWTs, OAuth tokens, credentials, and produce masked remediation output locally.
capabilities: [validate, generate, explain, parse]
algorithm:
  algorithmId: validohub.secret-scanner
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: Payload, log, env, or config text
      - type: select
        name: mode
        label:
          en: Redaction mode
        options:
          - balanced
          - strict
          - ci
        default: "balanced"
    actions: [validate, generate, explain, parse]
related:
  explicit: [jwt-jwk-oauth-inspector, csp-builder-auditor, cookie-security-inspector, url-redirect-utm-workbench]
  auto:
    sameCountry: false
    sameCategory: true
    sameCapability: true
    sameModule: true
seo:
  title:
    en: Secret Scanner Workbench
  description:
    en: Scan pasted payloads for API keys, private keys, JWTs, OAuth tokens, credentials, and produce masked remediation output locally.
