schemaVersion: 1
id: senegal-csv-locale-normalizer
kind: tool
module: validohub
country: SN
category: developer-tools
status: active
name:
  en: "Senegalese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Senegal decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.senegal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;SN123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [senegal-slug-normalizer, senegal-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Senegalese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Senegal decimal, date, postal, phone, tax, and banking fields."
