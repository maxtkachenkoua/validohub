schemaVersion: 1
id: senegal-document-ocr-fixer
kind: tool
module: validohub
country: SN
category: documents
status: active
name:
  en: "Senegalese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.senegal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "SN-ID-123456 SN123456789 001 1234567890 1000 Dakar"
    actions: [validate, parse, format, explain]
related:
  explicit: [senegal-privacy-redaction-helper, senegal-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Senegalese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
