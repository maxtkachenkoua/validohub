schemaVersion: 1
id: senegal-form-field-auditor
kind: tool
module: validohub
country: SN
category: developer-tools
status: active
name:
  en: "Senegalese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.senegal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SN123456789&postal=1000 Dakar&phone=+221 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [senegal-locale-number-parser, senegal-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Senegalese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
