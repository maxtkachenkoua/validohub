schemaVersion: 1
id: senegal-locale-number-parser
kind: tool
module: validohub
country: SN
category: localization
status: active
name:
  en: "Senegalese Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Senegal."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.senegal-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 XOF"
    actions: [validate, parse, format, explain]
related:
  explicit: [senegal-calendar-week-helper, senegal-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Senegalese Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Senegal."
