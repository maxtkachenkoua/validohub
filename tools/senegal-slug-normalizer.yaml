    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Senegalese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
