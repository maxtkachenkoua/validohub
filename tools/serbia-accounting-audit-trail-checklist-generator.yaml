schemaVersion: 1
id: serbia-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: RS
category: tax
status: active
name:
  en: "Serbian Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.serbia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21.07.2026 1.234,56 RSD RS100123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [serbia-postal-code-validator, serbia-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Serbian Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, VAT, dates, and immutable logs."
