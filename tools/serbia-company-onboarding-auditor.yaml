summary:
  en: "Audit company intake payloads for MB / registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.serbia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"RS\",\"pib\":\"100123456\",\"iban\":\"RS35260005601001611379\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [serbia-business-register-readiness-helper, serbia-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Serbian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for MB / registration number, VAT, address, banking, and official registry handoff readiness."
