schemaVersion: 1
id: serbia-document-ocr-fixer
kind: tool
module: validohub
country: RS
category: documents
status: active
name:
  en: "Serbian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.serbia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "0101980712345 RS100123456 RS35260005601001611379 11000 Belgrade"
    actions: [validate, parse, format, explain]
related:
  explicit: [serbia-gdpr-redaction-helper, serbia-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Serbian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
