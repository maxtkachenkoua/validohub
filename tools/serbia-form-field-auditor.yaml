schemaVersion: 1
id: serbia-form-field-auditor
kind: tool
module: validohub
country: RS
category: developer-tools
status: active
name:
  en: "Serbian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.serbia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=RS100123456&postal=11000 Belgrade&phone=+381 60 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [serbia-locale-number-parser, serbia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Serbian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
