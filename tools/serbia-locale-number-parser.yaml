schemaVersion: 1
id: serbia-locale-number-parser
kind: tool
module: validohub
country: RS
category: localization
status: active
name:
  en: "Serbian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Serbia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.serbia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 RSD"
    actions: [validate, parse, format, explain]
related:
  explicit: [serbia-calendar-week-helper, serbia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Serbian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Serbia."
