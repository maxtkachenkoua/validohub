schemaVersion: 1
id: serbia-postal-code-validator
kind: tool
module: validohub
country: RS
category: address
status: active
name:
  en: "Serbian Postal Code Validator"
summary:
  en: "Validate postanski broj shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.serbia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "11000 Belgrade"
    actions: [validate, parse, format, explain]
related:
  explicit: [serbia-address-normalizer, serbia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Serbian Postal Code Validator | ValidoHub"
  description:
    en: "Validate postanski broj shape, split area/delivery hints, and preserve official postal lookup boundaries."
