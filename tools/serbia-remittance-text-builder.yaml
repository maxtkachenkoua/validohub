schemaVersion: 1
id: serbia-remittance-text-builder
kind: tool
module: validohub
country: RS
category: finance
status: active
name:
  en: "Serbian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.serbia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 RS100123456 1.234,56 RSD"
    actions: [validate, parse, format, explain]
related:
  explicit: [serbia-payment-reconciliation-helper, serbia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Serbian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
