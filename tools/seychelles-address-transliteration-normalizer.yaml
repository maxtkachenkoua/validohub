summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.seychelles-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Central business district, Victoria 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [seychelles-region-code-mapper, seychelles-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Seychellois Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
