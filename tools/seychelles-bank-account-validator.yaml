capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.seychelles-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "BANK input"
        required: true
        placeholder:
          en: "001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [seychelles-bank-account-fixture-generator, seychelles-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Seychelles Bank Account Validator | ValidoHub"
  description:
    en: "Validate local bank-account or routing shape, split bank/account blocks, and keep ownership lookup outside the browser."
