schemaVersion: 1
id: seychelles-customs-declaration-helper
kind: tool
module: validohub
country: SC
category: government
status: active
name:
  en: "Seychellois Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.seychelles-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "SC123456789 HS 8471 1,234.56 SCR"
    actions: [validate, parse, format, explain]
related:
  explicit: [seychelles-postal-tracking-helper, seychelles-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Seychellois Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
