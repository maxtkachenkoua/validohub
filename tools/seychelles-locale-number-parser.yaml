schemaVersion: 1
id: seychelles-locale-number-parser
kind: tool
module: validohub
country: SC
category: localization
status: active
name:
  en: "Seychellois Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Seychelles."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.seychelles-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 SCR"
    actions: [validate, parse, format, explain]
related:
  explicit: [seychelles-calendar-week-helper, seychelles-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Seychellois Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Seychelles."
