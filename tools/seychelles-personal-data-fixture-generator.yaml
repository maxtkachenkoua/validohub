schemaVersion: 1
id: seychelles-personal-data-fixture-generator
kind: tool
module: validohub
country: SC
category: privacy
status: active
name:
  en: "Seychellois Personal Data Fixture Helper"
summary:
  en: "Generate fixture-safe local identity/address/payment snippets with clear non-official boundaries."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.seychelles-suite
forms:
