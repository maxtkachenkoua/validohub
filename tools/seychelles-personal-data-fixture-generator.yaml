    inputs:
      - type: textarea
        name: input
        label:
          en: "FIX input"
        required: true
        placeholder:
          en: "SC-ID-123456\\nCentral business district, Victoria 1000\\n+248 123 456 789"
    actions: [generate, validate, explain]
related:
  explicit: [seychelles-driving-licence-format-helper, seychelles-residence-permit-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Seychellois Personal Data Fixture Helper | ValidoHub"
  description:
    en: "Generate fixture-safe local identity/address/payment snippets with clear non-official boundaries."
