schemaVersion: 1
id: seychelles-slug-normalizer
kind: tool
module: validohub
country: SC
category: developer-tools
status: active
name:
  en: "Seychellois Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.seychelles-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Seychelles sample company Central business district, Victoria 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [seychelles-document-ocr-fixer, seychelles-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Seychellois Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
