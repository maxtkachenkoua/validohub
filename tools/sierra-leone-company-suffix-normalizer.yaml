schemaVersion: 1
id: sierra-leone-company-suffix-normalizer
kind: tool
module: validohub
country: SL
category: developer-tools
status: active
name:
  en: "Sierra Leonean Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Sierra Leone Sample Holding Ltd SL-REG-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-procurement-identifier-helper, sierra-leone-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
