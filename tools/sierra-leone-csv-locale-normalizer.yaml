schemaVersion: 1
id: sierra-leone-csv-locale-normalizer
kind: tool
module: validohub
country: SL
category: developer-tools
status: active
name:
  en: "Sierra Leonean CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Sierra Leone decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 SLE;24/07/2026;SL123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-slug-normalizer, sierra-leone-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Sierra Leone decimal, date, postal, phone, tax, and banking fields."
