schemaVersion: 1
id: sierra-leone-form-field-auditor
kind: tool
module: validohub
country: SL
category: developer-tools
status: active
name:
  en: "Sierra Leonean Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SL123456789&postal=1000 Freetown&phone=+232 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-locale-number-parser, sierra-leone-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
