schemaVersion: 1
id: sierra-leone-json-fixture-generator
kind: tool
module: validohub
country: SL
category: developer-tools
status: active
name:
  en: "Sierra Leonean JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"SL\",\"taxNumber\":\"SL123456789\",\"paymentReference\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [sierra-leone-regex-pack-helper, sierra-leone-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
