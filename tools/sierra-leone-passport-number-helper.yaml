schemaVersion: 1
id: sierra-leone-passport-number-helper
kind: tool
module: validohub
country: SL
category: national-identifiers
status: active
name:
  en: "Sierra Leonean Passport Number Helper"
summary:
  en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "P<SLESIERRA LEONEAN<<SAMPLE<<<<<<<<<<<<<<<<<<"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-mrz-passport-parser, sierra-leone-bank-account-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Passport Number Helper | ValidoHub"
  description:
    en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
