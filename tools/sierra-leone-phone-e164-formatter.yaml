capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+232 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-date-locale-formatter, sierra-leone-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
