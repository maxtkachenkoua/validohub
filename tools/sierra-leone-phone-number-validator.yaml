schemaVersion: 1
id: sierra-leone-phone-number-validator
kind: tool
module: validohub
country: SL
category: address
status: active
name:
  en: "Sierra Leonean Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+232 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-phone-e164-formatter, sierra-leone-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
