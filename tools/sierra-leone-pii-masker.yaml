schemaVersion: 1
id: sierra-leone-pii-masker
kind: tool
module: validohub
country: SL
category: privacy
status: active
name:
  en: "Sierra Leonean PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "SL-ID-123456 +232 123 456 789 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-personal-data-fixture-generator, sierra-leone-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
