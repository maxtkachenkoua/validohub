schemaVersion: 1
id: sierra-leone-remittance-text-builder
kind: tool
module: validohub
country: SL
category: finance
status: active
name:
  en: "Sierra Leonean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 SL123456789 1,234.56 SLE"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-payment-reconciliation-helper, sierra-leone-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
