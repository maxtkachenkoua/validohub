schemaVersion: 1
id: sierra-leone-slug-normalizer
kind: tool
module: validohub
country: SL
category: developer-tools
status: active
name:
  en: "Sierra Leonean Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Sierra Leone sample company Central business district, Freetown 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-document-ocr-fixer, sierra-leone-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
