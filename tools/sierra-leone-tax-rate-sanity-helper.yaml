schemaVersion: 1
id: sierra-leone-tax-rate-sanity-helper
kind: tool
module: validohub
country: SL
category: tax
status: active
name:
  en: "Sierra Leonean Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sierra-leone-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "tax number / VAT boundary 20% base 1,234.56 SLE"
    actions: [validate, parse, format, explain]
related:
  explicit: [sierra-leone-tax-return-field-helper, sierra-leone-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sierra Leonean Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
