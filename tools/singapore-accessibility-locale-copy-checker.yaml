schemaVersion: 1
id: singapore-accessibility-locale-copy-checker
kind: tool
module: validohub
country: SG
category: localization
status: active
name:
  en: "Singapore Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.singapore-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "NRIC / FIN input, postal code input, amount 1,234.56 SGD"
    actions: [validate, parse, format, explain]
related:
  explicit: [singapore-support-ticket-scrubber, singapore-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Singapore Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
