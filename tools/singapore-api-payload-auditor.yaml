schemaVersion: 1
id: singapore-api-payload-auditor
kind: tool
module: validohub
country: SG
category: developer-tools
status: active
name:
  en: "Singapore API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.singapore-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"SG\",\"uen\":\"201912345K\",\"nric\":\"S1234567D\",\"paynow\":\"+6581234567\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [singapore-form-field-auditor, singapore-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Singapore API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
