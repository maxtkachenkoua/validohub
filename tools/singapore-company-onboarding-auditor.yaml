schemaVersion: 1
id: singapore-company-onboarding-auditor
kind: tool
module: validohub
country: SG
category: developer-tools
status: active
name:
  en: "Singapore Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for UEN, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.singapore-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"SG\",\"uen\":\"201912345K\",\"nric\":\"S1234567D\",\"paynow\":\"+6581234567\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [singapore-business-register-readiness-helper, singapore-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Singapore Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for UEN, VAT, address, banking, and official registry handoff readiness."
