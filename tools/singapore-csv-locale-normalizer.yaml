schemaVersion: 1
id: singapore-csv-locale-normalizer
kind: tool
module: validohub
country: SG
category: developer-tools
status: active
name:
  en: "Singapore CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Singapore decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.singapore-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 SGD;21/07/2026;M91234567X"
    actions: [validate, parse, format, explain]
related:
  explicit: [singapore-slug-normalizer, singapore-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Singapore CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Singapore decimal, date, postal, phone, tax, and banking fields."
