schemaVersion: 1
id: singapore-form-field-auditor
kind: tool
module: validohub
country: SG
category: developer-tools
status: active
name:
  en: "Singapore Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.singapore-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=M91234567X&postal=049315 Singapore&phone=+65 8123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [singapore-locale-number-parser, singapore-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Singapore Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
