schemaVersion: 1
id: singapore-integration-smoke-test-builder
kind: tool
module: validohub
country: SG
category: developer-tools
status: active
name:
  en: "Singapore Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.singapore-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"SG\",\"uen\":\"201912345K\",\"nric\":\"S1234567D\",\"paynow\":\"+6581234567\"}"
    actions: [generate, validate, explain]
related:
  explicit: [singapore-nric-fin-validator, singapore-uen-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Singapore Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
