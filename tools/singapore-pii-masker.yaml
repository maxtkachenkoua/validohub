    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "S1234567D +65 8123 4567 7171 001 123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [singapore-personal-data-fixture-generator, singapore-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Singapore PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
