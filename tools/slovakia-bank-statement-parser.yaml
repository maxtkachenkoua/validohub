schemaVersion: 1
id: slovakia-bank-statement-parser
kind: tool
module: validohub
country: SK
category: finance
status: active
name:
  en: "Slovak Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1 234,56 EUR; SK3112000000198742637541; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-masked-iban-formatter, slovakia-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
