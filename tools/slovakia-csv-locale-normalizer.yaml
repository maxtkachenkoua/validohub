schemaVersion: 1
id: slovakia-csv-locale-normalizer
kind: tool
module: validohub
country: SK
category: developer-tools
status: active
name:
  en: "Slovak CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Slovakia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 EUR;21.07.2026;SK2020312297"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-slug-normalizer, slovakia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Slovakia decimal, date, postal, phone, tax, and banking fields."
