schemaVersion: 1
id: slovakia-currency-decimal-formatter
kind: tool
module: validohub
country: SK
category: finance
status: active
name:
  en: "Slovak EUR Decimal Currency Formatter"
summary:
  en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-vat-rate-sanity-helper, slovakia-vat-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak EUR Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize EUR amount strings, decimal separators, grouping, and API-safe numeric previews."
