schemaVersion: 1
id: slovakia-form-field-auditor
kind: tool
module: validohub
country: SK
category: developer-tools
status: active
name:
  en: "Slovak Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SK2020312297&postal=811 01 Bratislava&phone=+421 905 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-locale-number-parser, slovakia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
