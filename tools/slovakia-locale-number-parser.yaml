schemaVersion: 1
id: slovakia-locale-number-parser
kind: tool
module: validohub
country: SK
category: localization
status: active
name:
  en: "Slovak Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Slovakia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-calendar-week-helper, slovakia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Slovakia."
