schemaVersion: 1
id: slovakia-postal-code-validator
kind: tool
module: validohub
country: SK
category: address
status: active
name:
  en: "Slovak Postal Code Validator"
summary:
  en: "Validate PSC shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "811 01 Bratislava"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-address-normalizer, slovakia-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak Postal Code Validator | ValidoHub"
  description:
    en: "Validate PSC shape, split area/delivery hints, and preserve official postal lookup boundaries."
