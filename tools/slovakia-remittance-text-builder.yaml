schemaVersion: 1
id: slovakia-remittance-text-builder
kind: tool
module: validohub
country: SK
category: finance
status: active
name:
  en: "Slovak Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 SK2020312297 1 234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-payment-reconciliation-helper, slovakia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
