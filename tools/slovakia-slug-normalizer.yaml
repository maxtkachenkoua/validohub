schemaVersion: 1
id: slovakia-slug-normalizer
kind: tool
module: validohub
country: SK
category: developer-tools
status: active
name:
  en: "Slovak Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Slovakia sample company Hlavne namestie 1, 811 01 Bratislava"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-document-ocr-fixer, slovakia-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
