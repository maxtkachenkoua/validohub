schemaVersion: 1
id: slovakia-vehicle-data-redaction-helper
kind: tool
module: validohub
country: SK
category: transport
status: active
name:
  en: "Slovak Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovakia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "BA123AB WVWZZZ1JZXW000001 800101/0008"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovakia-customs-declaration-helper, slovakia-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovak Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
