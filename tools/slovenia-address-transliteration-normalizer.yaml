    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Slovenska cesta 1, 1000 Ljubljana"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-region-code-mapper, slovenia-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
