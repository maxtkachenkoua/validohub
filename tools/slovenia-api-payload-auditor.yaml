schemaVersion: 1
id: slovenia-api-payload-auditor
kind: tool
module: validohub
country: SI
category: developer-tools
status: active
name:
  en: "Slovenian API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"SI\",\"ddv\":\"SI12345678\",\"iban\":\"SI56263300012039086\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-form-field-auditor, slovenia-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
