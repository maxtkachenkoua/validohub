schemaVersion: 1
id: slovenia-company-suffix-normalizer
kind: tool
module: validohub
country: SI
category: developer-tools
status: active
name:
  en: "Slovenian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Slovenia Sample Holding Ltd 1234567000"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-procurement-identifier-helper, slovenia-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
