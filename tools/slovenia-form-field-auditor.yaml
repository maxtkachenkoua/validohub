schemaVersion: 1
id: slovenia-form-field-auditor
kind: tool
module: validohub
country: SI
category: developer-tools
status: active
name:
  en: "Slovenian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SI12345678&postal=1000 Ljubljana&phone=+386 40 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-locale-number-parser, slovenia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
