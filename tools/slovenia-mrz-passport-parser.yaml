schemaVersion: 1
id: slovenia-mrz-passport-parser
kind: tool
module: validohub
country: SI
category: national-identifiers
status: active
name:
  en: "Slovenian MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<SVNSAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567SVN8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-iban-validator, slovenia-iban-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
