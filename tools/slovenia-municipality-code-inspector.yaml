schemaVersion: 1
id: slovenia-municipality-code-inspector
kind: tool
module: validohub
country: SI
category: address
status: active
name:
  en: "Slovenian Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Slovenska cesta 1, 1000 Ljubljana"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-phone-number-validator, slovenia-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
