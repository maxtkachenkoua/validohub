      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 EUR; SI56263300012039086; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
