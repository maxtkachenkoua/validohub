        placeholder:
          en: "0101980500123 +386 40 123 456 SI56263300012039086"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-personal-data-fixture-generator, slovenia-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
