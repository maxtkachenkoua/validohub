schemaVersion: 1
id: slovenia-remittance-text-builder
kind: tool
module: validohub
country: SI
category: finance
status: active
name:
  en: "Slovenian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.slovenia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 SI12345678 1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [slovenia-payment-reconciliation-helper, slovenia-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Slovenian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
