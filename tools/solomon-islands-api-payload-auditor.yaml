schemaVersion: 1
id: solomon-islands-api-payload-auditor
kind: tool
module: validohub
country: SB
category: developer-tools
status: active
name:
  en: "Solomon Islands API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"SB\",\"taxNumber\":\"SB123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-form-field-auditor, solomon-islands-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
