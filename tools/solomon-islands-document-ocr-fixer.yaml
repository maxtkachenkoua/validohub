schemaVersion: 1
id: solomon-islands-document-ocr-fixer
kind: tool
module: validohub
country: SB
category: documents
status: active
name:
  en: "Solomon Islands Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "SB-TIN-123456 SB123456789 001 1234567890 Honiara"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-privacy-redaction-helper, solomon-islands-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
