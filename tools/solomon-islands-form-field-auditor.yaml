schemaVersion: 1
id: solomon-islands-form-field-auditor
kind: tool
module: validohub
country: SB
category: developer-tools
status: active
name:
  en: "Solomon Islands Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SB123456789&postal=Honiara&phone=+677 12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-locale-number-parser, solomon-islands-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
