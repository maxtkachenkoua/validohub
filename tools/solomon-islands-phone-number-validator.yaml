schemaVersion: 1
id: solomon-islands-phone-number-validator
kind: tool
module: validohub
country: SB
category: address
status: active
name:
  en: "Solomon Islands Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+677 12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-phone-e164-formatter, solomon-islands-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
