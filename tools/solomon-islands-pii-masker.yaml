schemaVersion: 1
id: solomon-islands-pii-masker
kind: tool
module: validohub
country: SB
category: privacy
status: active
name:
  en: "Solomon Islands PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "SB-TIN-123456 +677 12345 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-personal-data-fixture-generator, solomon-islands-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
