schemaVersion: 1
id: solomon-islands-postal-code-validator
kind: tool
module: validohub
country: SB
category: address
status: active
name:
  en: "Solomon Islands Postal Code Validator"
summary:
  en: "Validate province/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "Honiara"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-address-normalizer, solomon-islands-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands Postal Code Validator | ValidoHub"
  description:
    en: "Validate province/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
