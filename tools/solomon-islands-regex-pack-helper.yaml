schemaVersion: 1
id: solomon-islands-regex-pack-helper
kind: tool
module: validohub
country: SB
category: developer-tools
status: active
name:
  en: "Solomon Islands Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "TIN boundary company registration number province/locality  001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-api-payload-auditor, solomon-islands-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
