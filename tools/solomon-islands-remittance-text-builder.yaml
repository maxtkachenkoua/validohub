schemaVersion: 1
id: solomon-islands-remittance-text-builder
kind: tool
module: validohub
country: SB
category: finance
status: active
name:
  en: "Solomon Islands Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.solomon-islands-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 SB123456789 1,234.56 SBD"
    actions: [validate, parse, format, explain]
related:
  explicit: [solomon-islands-payment-reconciliation-helper, solomon-islands-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Solomon Islands Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
