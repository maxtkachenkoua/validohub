schemaVersion: 1
id: somalia-document-ocr-fixer
kind: tool
module: validohub
country: SO
category: documents
status: active
name:
  en: "Somali Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.somalia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "SO-ID-123456 SO123456789 001 1234567890 1000 Mogadishu"
    actions: [validate, parse, format, explain]
related:
  explicit: [somalia-privacy-redaction-helper, somalia-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Somali Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
