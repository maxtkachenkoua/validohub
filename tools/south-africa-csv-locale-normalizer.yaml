schemaVersion: 1
id: south-africa-csv-locale-normalizer
kind: tool
module: validohub
country: ZA
category: developer-tools
status: active
name:
  en: "South African CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for South Africa decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-africa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 ZAR;24/07/2026;ZA123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-africa-slug-normalizer, south-africa-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South African CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for South Africa decimal, date, postal, phone, tax, and banking fields."
