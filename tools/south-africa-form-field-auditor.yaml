schemaVersion: 1
id: south-africa-form-field-auditor
kind: tool
module: validohub
country: ZA
category: developer-tools
status: active
name:
  en: "South African Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-africa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=ZA123456789&postal=1000 Pretoria&phone=+27 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-africa-locale-number-parser, south-africa-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South African Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
