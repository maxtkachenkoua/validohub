schemaVersion: 1
id: south-africa-remittance-text-builder
kind: tool
module: validohub
country: ZA
category: finance
status: active
name:
  en: "South African Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-africa-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 ZA123456789 1,234.56 ZAR"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-africa-payment-reconciliation-helper, south-africa-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South African Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
