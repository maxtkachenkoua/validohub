schemaVersion: 1
id: south-korea-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: KR
category: tax
status: active
name:
  en: "South Korean Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 2026.07.21 1,234,567 KRW 123-45-67890"
    actions: [generate, validate, explain]
related:
  explicit: [south-korea-postal-code-validator, south-korea-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
