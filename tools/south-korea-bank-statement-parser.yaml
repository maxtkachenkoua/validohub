schemaVersion: 1
id: south-korea-bank-statement-parser
kind: tool
module: validohub
country: KR
category: finance
status: active
name:
  en: "South Korean Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026.07.21; 1,234,567 KRW; 088 1234567890123; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-masked-bank-account-formatter, south-korea-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
