schemaVersion: 1
id: south-korea-company-onboarding-auditor
kind: tool
module: validohub
country: KR
category: developer-tools
status: active
name:
  en: "South Korean Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for Business Registration Number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"KR\",\"businessNumber\":\"123-45-67890\",\"bankCode\":\"088\",\"amount\":\"1,234,567\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-business-register-readiness-helper, south-korea-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for Business Registration Number, VAT, address, banking, and official registry handoff readiness."
