schemaVersion: 1
id: south-korea-data-quality-workbench
kind: tool
module: validohub
country: KR
category: developer-tools
status: active
name:
  en: "South Korean Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"KR\",\"businessNumber\":\"123-45-67890\",\"bankCode\":\"088\",\"amount\":\"1,234,567\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-json-fixture-generator, south-korea-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
