    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
