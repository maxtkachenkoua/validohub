schemaVersion: 1
id: south-korea-form-field-auditor
kind: tool
module: validohub
country: KR
category: developer-tools
status: active
name:
  en: "South Korean Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=123-45-67890&postal=04524 Seoul&phone=+82 10 1234 5678"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-locale-number-parser, south-korea-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
