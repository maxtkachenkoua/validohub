schemaVersion: 1
id: south-korea-integration-smoke-test-builder
kind: tool
module: validohub
country: KR
category: developer-tools
status: active
name:
  en: "South Korean Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"KR\",\"businessNumber\":\"123-45-67890\",\"bankCode\":\"088\",\"amount\":\"1,234,567\"}"
    actions: [generate, validate, explain]
related:
  explicit: [south-korea-rrn-boundary-validator, south-korea-business-registration-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
