schemaVersion: 1
id: south-korea-json-fixture-generator
kind: tool
module: validohub
country: KR
category: developer-tools
status: active
name:
  en: "South Korean JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"KR\",\"businessNumber\":\"123-45-67890\",\"bankCode\":\"088\",\"amount\":\"1,234,567\"}"
    actions: [generate, validate, explain]
related:
  explicit: [south-korea-regex-pack-helper, south-korea-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
