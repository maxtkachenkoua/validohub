      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "2026.07.21; 1,234,567 KRW; 088 1234567890123; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
