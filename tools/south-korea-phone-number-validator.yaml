schemaVersion: 1
id: south-korea-phone-number-validator
kind: tool
module: validohub
country: KR
category: address
status: active
name:
  en: "South Korean Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+82 10 1234 5678"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-phone-e164-formatter, south-korea-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
