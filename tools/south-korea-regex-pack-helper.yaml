schemaVersion: 1
id: south-korea-regex-pack-helper
kind: tool
module: validohub
country: KR
category: developer-tools
status: active
name:
  en: "South Korean Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "RRN boundary Business Registration Number postal code  088 1234567890123"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-api-payload-auditor, south-korea-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
