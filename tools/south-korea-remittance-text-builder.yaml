schemaVersion: 1
id: south-korea-remittance-text-builder
kind: tool
module: validohub
country: KR
category: finance
status: active
name:
  en: "South Korean Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 123-45-67890 1,234,567 KRW"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-payment-reconciliation-helper, south-korea-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
