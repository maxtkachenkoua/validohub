schemaVersion: 1
id: south-korea-slug-normalizer
kind: tool
module: validohub
country: KR
category: developer-tools
status: active
name:
  en: "South Korean Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "South Korea sample company Sejong-daero 110, Jung-gu, Seoul 04524"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-document-ocr-fixer, south-korea-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
