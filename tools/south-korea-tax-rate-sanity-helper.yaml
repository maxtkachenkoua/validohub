schemaVersion: 1
id: south-korea-tax-rate-sanity-helper
kind: tool
module: validohub
country: KR
category: tax
status: active
name:
  en: "South Korean Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-korea-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "VAT / tax invoice number 20% base 1,234,567 KRW"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-korea-tax-return-field-helper, south-korea-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Korean Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
