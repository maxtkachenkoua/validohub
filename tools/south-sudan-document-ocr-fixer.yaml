schemaVersion: 1
id: south-sudan-document-ocr-fixer
kind: tool
module: validohub
country: SS
category: documents
status: active
name:
  en: "South Sudanese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-sudan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "SS-ID-123456 SS123456789 001 1234567890 1000 Juba"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-sudan-privacy-redaction-helper, south-sudan-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Sudanese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
