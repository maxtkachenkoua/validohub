schemaVersion: 1
id: south-sudan-remittance-text-builder
kind: tool
module: validohub
country: SS
category: finance
status: active
name:
  en: "South Sudanese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.south-sudan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 SS123456789 1,234.56 SSP"
    actions: [validate, parse, format, explain]
related:
  explicit: [south-sudan-payment-reconciliation-helper, south-sudan-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "South Sudanese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
