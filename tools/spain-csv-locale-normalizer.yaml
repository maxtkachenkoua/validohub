schemaVersion: 1
id: spain-csv-locale-normalizer
kind: tool
module: validohub
country: ES
category: developer-tools
status: active
name:
  en: "Spanish CSV Locale Normalizer"
summary:
  en: "Audit Spanish CSV snippets for semicolon delimiters, comma decimals, dates, NIF, IBAN, and address evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "nif;iban;importe;fecha B12345674;ES9121000418450200051332;1.234,56;12/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-postal-code-validator, spain-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish CSV Locale Normalizer | ValidoHub"
  description:
    en: "Audit Spanish CSV snippets for semicolon delimiters, comma decimals, dates, NIF, IBAN, and address evidence."
