schemaVersion: 1
id: spain-data-quality-workbench
kind: tool
module: validohub
country: ES
category: developer-tools
status: active
name:
  en: "Spanish Data Quality Workbench"
summary:
  en: "Audit mixed Spanish payloads for identifiers, dates, amounts, addresses, phone, and locale consistency."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "B12345674;ES9121000418450200051332;28013 Madrid;+34 612345678;1.234,56;12/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-postal-code-validator, spain-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed Spanish payloads for identifiers, dates, amounts, addresses, phone, and locale consistency."
