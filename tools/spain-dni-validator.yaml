schemaVersion: 1
id: spain-dni-validator
kind: tool
module: validohub
country: ES
category: national-identifiers
status: active
name:
  en: "Spanish DNI Validator"
summary:
  en: "Replay DNI modulo-23 control letters, normalize separators, and expose body/check-letter debugging fields."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DNI input"
        required: true
        placeholder:
          en: "00000000T"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-id-validator, spain-nif-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish DNI Validator | ValidoHub"
  description:
    en: "Replay DNI modulo-23 control letters, normalize separators, and expose body/check-letter debugging fields."
