schemaVersion: 1
id: spain-iban-generator
kind: tool
module: validohub
country: ES
category: finance
status: active
name:
  en: Spain IBAN Generator
summary:
  en: Generate Spanish IBAN check digits from CCC/BBAN body, then replay MOD-97 validation locally.
capabilities: [generate, validate, parse, explain]
algorithm:
  algorithmId: validohub.spain-suite
forms:
  generate:
    inputs:
      - type: text
        name: country
        label:
          en: Country code
        required: true
      - type: text
        name: bban
        label:
          en: Spain CCC / BBAN body
        required: true
      - type: text
        name: iban
        label:
          en: Existing IBAN to repair or inspect
    actions: [generate, validate, explain]
related:
  explicit: [spain-iban-validator, spain-ccc-bank-account-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: Spain IBAN Generator | ValidoHub
  description:
    en: Generate Spanish IBAN check digits and inspect generated Spanish IBAN/CCC structure locally.
