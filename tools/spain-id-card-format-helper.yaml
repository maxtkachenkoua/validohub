schemaVersion: 1
id: spain-id-card-format-helper
kind: tool
module: validohub
country: ES
category: national-identifiers
status: active
name:
  en: "Spanish ID Card Format Helper"
summary:
  en: "Inspect Spanish identity-card snippets, DNI/NIE evidence, dates, and official identity-proof boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DOC input"
        required: true
        placeholder:
          en: "DNI 00000000T validez 12/07/2030"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-id-validator, spain-nif-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish ID Card Format Helper | ValidoHub"
  description:
    en: "Inspect Spanish identity-card snippets, DNI/NIE evidence, dates, and official identity-proof boundaries."
