schemaVersion: 1
id: spain-json-fixture-generator
kind: tool
module: validohub
country: ES
category: developer-tools
status: active
name:
  en: "Spanish JSON Fixture Helper"
summary:
  en: "Inspect Spanish JSON fixtures for locale, NIF, IBAN, phone, date, amount, and privacy-safe payload shape."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"locale\":\"es-ES\",\"nif\":\"B12345674\",\"iban\":\"ES9121000418450200051332\",\"fecha\":\"12/07/2026\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-postal-code-validator, spain-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish JSON Fixture Helper | ValidoHub"
  description:
    en: "Inspect Spanish JSON fixtures for locale, NIF, IBAN, phone, date, amount, and privacy-safe payload shape."
