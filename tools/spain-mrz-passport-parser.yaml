schemaVersion: 1
id: spain-mrz-passport-parser
kind: tool
module: validohub
country: ES
category: developer-tools
status: active
name:
  en: "Spanish MRZ / Passport Parser"
summary:
  en: "Parse Spanish passport MRZ snippets, split document, nationality, birth-date, expiry, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<ESPGARCIA<<MARIA<<<<<<<<<<<<<<<<<<<< A1234567<ESP8501019F3001012<<<<<<<<<<<<<<04"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-postal-code-validator, spain-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse Spanish passport MRZ snippets, split document, nationality, birth-date, expiry, and checksum evidence without identity proof."
