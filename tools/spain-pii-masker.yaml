schemaVersion: 1
id: spain-pii-masker
kind: tool
module: validohub
country: ES
category: developer-tools
status: active
name:
  en: "Spanish PII Masker"
summary:
  en: "Mask Spanish DNI/NIE/NIF, IBAN, phone, address, and invoice evidence while preserving debugging structure."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "00000000T ES9121000418450200051332 +34 612345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-postal-code-validator, spain-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish PII Masker | ValidoHub"
  description:
    en: "Mask Spanish DNI/NIE/NIF, IBAN, phone, address, and invoice evidence while preserving debugging structure."
