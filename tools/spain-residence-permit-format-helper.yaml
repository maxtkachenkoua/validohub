capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TIE input"
        required: true
        placeholder:
          en: "TIE X1234567L expira 12/07/2030"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-id-validator, spain-nif-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish Residence Permit Format Helper | ValidoHub"
  description:
    en: "Inspect Spanish TIE/residence-permit snippets, NIE evidence, dates, and official immigration boundary notes."
