    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Niño y Compañía Sociedad Limitada"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-postal-code-validator, spain-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish Slug Normalizer | ValidoHub"
  description:
    en: "Normalize Spanish names, accents, legal suffixes, and URL-safe slugs for developer payloads."
