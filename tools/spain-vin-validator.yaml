schemaVersion: 1
id: spain-vin-validator
kind: tool
module: validohub
country: ES
category: developer-tools
status: active
name:
  en: "Spanish VIN Validator"
summary:
  en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare Spanish vehicle-intake diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.spain-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VIN input"
        required: true
        placeholder:
          en: "VSSZZZ1JZXW000001"
    actions: [validate, parse, format, explain]
related:
  explicit: [spain-postal-code-validator, spain-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Spanish VIN Validator | ValidoHub"
  description:
    en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare Spanish vehicle-intake diagnostics."
