capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21/07/2026 1,234.56 LKR 104567890"
    actions: [generate, validate, explain]
related:
  explicit: [sri-lanka-postal-code-validator, sri-lanka-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
