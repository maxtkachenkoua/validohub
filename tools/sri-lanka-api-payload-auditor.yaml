schemaVersion: 1
id: sri-lanka-api-payload-auditor
kind: tool
module: validohub
country: LK
category: developer-tools
status: active
name:
  en: "Sri Lankan API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"LK\",\"nic\":\"199012345678\",\"vat\":\"104567890\",\"cefts\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-form-field-auditor, sri-lanka-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
