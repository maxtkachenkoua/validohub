schemaVersion: 1
id: sri-lanka-csv-locale-normalizer
kind: tool
module: validohub
country: LK
category: developer-tools
status: active
name:
  en: "Sri Lankan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Sri Lanka decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 LKR;21/07/2026;104567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-slug-normalizer, sri-lanka-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Sri Lanka decimal, date, postal, phone, tax, and banking fields."
