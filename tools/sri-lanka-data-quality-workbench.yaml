schemaVersion: 1
id: sri-lanka-data-quality-workbench
kind: tool
module: validohub
country: LK
category: developer-tools
status: active
name:
  en: "Sri Lankan Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"LK\",\"nic\":\"199012345678\",\"vat\":\"104567890\",\"cefts\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-json-fixture-generator, sri-lanka-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
