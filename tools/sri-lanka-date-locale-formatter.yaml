schemaVersion: 1
id: sri-lanka-date-locale-formatter
kind: tool
module: validohub
country: LK
category: localization
status: active
name:
  en: "Sri Lankan Date Locale Formatter"
summary:
  en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "21/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-csv-locale-normalizer, sri-lanka-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Date Locale Formatter | ValidoHub"
  description:
    en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
