schemaVersion: 1
id: sri-lanka-integration-smoke-test-builder
kind: tool
module: validohub
country: LK
category: developer-tools
status: active
name:
  en: "Sri Lankan Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"LK\",\"nic\":\"199012345678\",\"vat\":\"104567890\",\"cefts\":\"INV-2026-001\"}"
    actions: [generate, validate, explain]
related:
  explicit: [sri-lanka-nic-boundary-validator, sri-lanka-company-registration-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
