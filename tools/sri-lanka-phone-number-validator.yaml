schemaVersion: 1
id: sri-lanka-phone-number-validator
kind: tool
module: validohub
country: LK
category: address
status: active
name:
  en: "Sri Lankan Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+94 77 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-phone-e164-formatter, sri-lanka-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
