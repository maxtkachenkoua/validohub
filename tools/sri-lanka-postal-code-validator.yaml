schemaVersion: 1
id: sri-lanka-postal-code-validator
kind: tool
module: validohub
country: LK
category: address
status: active
name:
  en: "Sri Lankan Postal Code Validator"
summary:
  en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "00100 Colombo"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-address-normalizer, sri-lanka-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
