schemaVersion: 1
id: sri-lanka-remittance-text-builder
kind: tool
module: validohub
country: LK
category: finance
status: active
name:
  en: "Sri Lankan Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 104567890 1,234.56 LKR"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-payment-reconciliation-helper, sri-lanka-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
