schemaVersion: 1
id: sri-lanka-tax-rate-sanity-helper
kind: tool
module: validohub
country: LK
category: tax
status: active
name:
  en: "Sri Lankan Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sri-lanka-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "TIN / VAT 20% base 1,234.56 LKR"
    actions: [validate, parse, format, explain]
related:
  explicit: [sri-lanka-tax-return-field-helper, sri-lanka-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sri Lankan Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
