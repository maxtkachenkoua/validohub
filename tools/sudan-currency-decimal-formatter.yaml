  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sudanese SDG Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize SDG amount strings, decimal separators, grouping, and API-safe numeric previews."
