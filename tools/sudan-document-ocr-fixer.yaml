schemaVersion: 1
id: sudan-document-ocr-fixer
kind: tool
module: validohub
country: SD
category: documents
status: active
name:
  en: "Sudanese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sudan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "SD-ID-123456 SD123456789 001 1234567890 1000 Khartoum"
    actions: [validate, parse, format, explain]
related:
  explicit: [sudan-privacy-redaction-helper, sudan-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Sudanese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
