schemaVersion: 1
id: suriname-accessibility-locale-copy-checker
kind: tool
module: validohub
country: SR
category: localization
status: active
name:
  en: "Surinamese Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "ID number input, postal/address reference input, amount 1.234,56 SRD"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-support-ticket-scrubber, suriname-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
