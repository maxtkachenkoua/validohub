schemaVersion: 1
id: suriname-bank-statement-parser
kind: tool
module: validohub
country: SR
category: finance
status: active
name:
  en: "Surinamese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21-07-2026; 1.234,56 SRD; SR-BANK-001-123456789; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-masked-bank-account-formatter, suriname-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, domestic account, counterparty, reference, and local decimal conventions."
