schemaVersion: 1
id: suriname-company-onboarding-auditor
kind: tool
module: validohub
country: SR
category: developer-tools
status: active
name:
  en: "Surinamese Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registry number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"SR\",\"tax\":\"123456\",\"account\":\"001-123456789\",\"amount\":\"1.234,56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-business-register-readiness-helper, suriname-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registry number, VAT, address, banking, and official registry handoff readiness."
