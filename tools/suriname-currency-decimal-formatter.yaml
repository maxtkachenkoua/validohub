  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese SRD Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize SRD amount strings, decimal separators, grouping, and API-safe numeric previews."
