schemaVersion: 1
id: suriname-document-ocr-fixer
kind: tool
module: validohub
country: SR
category: documents
status: active
name:
  en: "Surinamese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "AB123456 SR TAX 123456 SR-BANK-001-123456789 Paramaribo"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-gdpr-redaction-helper, suriname-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
