schemaVersion: 1
id: suriname-form-field-auditor
kind: tool
module: validohub
country: SR
category: developer-tools
status: active
name:
  en: "Surinamese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SR TAX 123456&postal=Paramaribo&phone=+597 812 3456"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-locale-number-parser, suriname-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
