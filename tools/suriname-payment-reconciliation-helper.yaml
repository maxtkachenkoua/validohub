schemaVersion: 1
id: suriname-payment-reconciliation-helper
kind: tool
module: validohub
country: SR
category: finance
status: active
name:
  en: "Surinamese Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21-07-2026; 1.234,56 SRD; SR-BANK-001-123456789; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-bank-statement-parser, suriname-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
