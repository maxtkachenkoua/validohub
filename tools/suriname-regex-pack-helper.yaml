schemaVersion: 1
id: suriname-regex-pack-helper
kind: tool
module: validohub
country: SR
category: developer-tools
status: active
name:
  en: "Surinamese Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "ID number company registry number postal/address reference  SR-BANK-001-123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-api-payload-auditor, suriname-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
