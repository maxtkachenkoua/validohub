schemaVersion: 1
id: suriname-remittance-text-builder
kind: tool
module: validohub
country: SR
category: finance
status: active
name:
  en: "Surinamese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 SR TAX 123456 1.234,56 SRD"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-payment-reconciliation-helper, suriname-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
