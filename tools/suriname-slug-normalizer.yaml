schemaVersion: 1
id: suriname-slug-normalizer
kind: tool
module: validohub
country: SR
category: developer-tools
status: active
name:
  en: "Surinamese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.suriname-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Suriname sample company Waterkant 1, Paramaribo"
    actions: [validate, parse, format, explain]
related:
  explicit: [suriname-document-ocr-fixer, suriname-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Surinamese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
