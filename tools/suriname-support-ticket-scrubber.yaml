      - type: textarea
        name: input
        label:
          en: "SUP input"
        required: true
        placeholder:
          en: "Customer sent AB123456, SR-BANK-001-123456789, Waterkant 1, Paramaribo"
    actions: [validate, parse, format, explain]
related:
