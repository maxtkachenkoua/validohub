schemaVersion: 1
id: sweden-csv-locale-normalizer
kind: tool
module: validohub
country: SE
category: developer-tools
status: active
name:
  en: "Swedish CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Sweden decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sweden-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234,56 SEK;2026-07-21;SE556016068001"
    actions: [validate, parse, format, explain]
related:
  explicit: [sweden-slug-normalizer, sweden-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swedish CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Sweden decimal, date, postal, phone, tax, and banking fields."
