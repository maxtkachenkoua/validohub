schemaVersion: 1
id: sweden-form-field-auditor
kind: tool
module: validohub
country: SE
category: developer-tools
status: active
name:
  en: "Swedish Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sweden-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=SE556016068001&postal=111 20 Stockholm&phone=+46 70 123 45 67"
    actions: [validate, parse, format, explain]
related:
  explicit: [sweden-locale-number-parser, sweden-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swedish Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
