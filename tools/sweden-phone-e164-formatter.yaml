schemaVersion: 1
id: sweden-phone-e164-formatter
kind: tool
module: validohub
country: SE
category: address
status: active
name:
  en: "Swedish Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sweden-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+46 70 123 45 67"
    actions: [validate, parse, format, explain]
related:
  explicit: [sweden-date-locale-formatter, sweden-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swedish Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
