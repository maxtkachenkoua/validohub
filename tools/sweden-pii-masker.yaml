schemaVersion: 1
id: sweden-pii-masker
kind: tool
module: validohub
country: SE
category: privacy
status: active
name:
  en: "Swedish PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sweden-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "850101-1236 +46 70 123 45 67 SE4550000000058398257466"
    actions: [validate, parse, format, explain]
related:
  explicit: [sweden-personal-data-fixture-generator, sweden-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swedish PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
