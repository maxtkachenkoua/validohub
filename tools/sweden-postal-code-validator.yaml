schemaVersion: 1
id: sweden-postal-code-validator
kind: tool
module: validohub
country: SE
category: address
status: active
name:
  en: "Swedish Postal Code Validator"
summary:
  en: "Validate postnummer shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sweden-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "111 20 Stockholm"
    actions: [validate, parse, format, explain]
related:
  explicit: [sweden-address-normalizer, sweden-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swedish Postal Code Validator | ValidoHub"
  description:
    en: "Validate postnummer shape, split area/delivery hints, and preserve official postal lookup boundaries."
