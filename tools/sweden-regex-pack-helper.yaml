schemaVersion: 1
id: sweden-regex-pack-helper
kind: tool
module: validohub
country: SE
category: developer-tools
status: active
name:
  en: "Swedish Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sweden-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Personnummer Organisationsnummer postnummer  SE4550000000058398257466"
    actions: [validate, parse, format, explain]
related:
  explicit: [sweden-api-payload-auditor, sweden-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swedish Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
