schemaVersion: 1
id: sweden-remittance-text-builder
kind: tool
module: validohub
country: SE
category: finance
status: active
name:
  en: "Swedish Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.sweden-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 SE556016068001 1 234,56 SEK"
    actions: [validate, parse, format, explain]
related:
  explicit: [sweden-payment-reconciliation-helper, sweden-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Swedish Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
