schemaVersion: 1
id: switzerland-api-payload-auditor
kind: tool
module: validohub
country: CH
category: developer-tools
status: active
name:
  en: "Swiss API Payload Auditor"
summary:
  en: "Audit API payload text for Swiss locale codes, UID, VAT suffix, IBAN, phone, canton, and privacy-risk fields."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.switzerland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"locale\":\"de-CH\",\"uid\":\"CHE-123.456.789 MWST\",\"iban\":\"CH9300762011623852957\",\"phone\":\"+41791234567\",\"canton\":\"ZH\"}"
    actions: [parse, validate, generate, format, explain]
related:
  explicit: [switzerland-json-fixture-generator, switzerland-regex-pack-helper, switzerland-form-field-auditor, switzerland-csv-locale-normalizer]
seo:
  title:
    en: "Swiss API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload text for Swiss locale codes, UID, VAT suffix, IBAN, phone, canton, and privacy-risk fields."
