schemaVersion: 1
id: switzerland-municipality-code-inspector
kind: tool
module: validohub
country: CH
category: national-identifiers
status: active
name:
  en: "Municipality Code Inspector"
summary:
  en: "Inspect Swiss municipality-code-shaped values, canton context, and register-handoff boundaries."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.switzerland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "GDE input"
        required: true
        placeholder:
          en: "Municipality 261 Zurich canton ZH"
    actions: [parse, validate, generate, format, explain]
related:
  explicit: [switzerland-postal-code-validator, switzerland-address-normalizer, switzerland-address-transliteration-normalizer, switzerland-multilingual-address-helper]
seo:
  title:
    en: "Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect Swiss municipality-code-shaped values, canton context, and register-handoff boundaries."
