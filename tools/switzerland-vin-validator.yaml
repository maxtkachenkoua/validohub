schemaVersion: 1
id: switzerland-vin-validator
kind: tool
module: validohub
country: CH
category: national-identifiers
status: active
name:
  en: "VIN Validator for Swiss Workflows"
summary:
  en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare Swiss vehicle-intake diagnostics."
capabilities:
  - validate
  - parse
  - generate
  - format
  - explain
  - calculate
algorithm:
  algorithmId: validohub.switzerland-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VIN input"
        required: true
        placeholder:
          en: "WVWZZZ1JZXW000001"
    actions: [validate, parse, generate, format, explain]
related:
  explicit: [switzerland-vehicle-plate-inspector, switzerland-vehicle-data-redaction-helper]
seo:
  title:
    en: "VIN Validator for Swiss Workflows | ValidoHub"
  description:
    en: "Validate VIN shape, split WMI/VDS/VIS evidence, and prepare Swiss vehicle-intake diagnostics."
