schemaVersion: 1
id: syria-company-onboarding-auditor
kind: tool
module: validohub
country: SY
category: developer-tools
status: active
name:
  en: "Syrian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.syria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"SY\",\"tax\":\"TAX123456\",\"payment\":\"official-boundary\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [syria-business-register-readiness-helper, syria-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for commercial registration number, VAT, address, banking, and official registry handoff readiness."
