schemaVersion: 1
id: syria-form-field-auditor
kind: tool
module: validohub
country: SY
category: developer-tools
status: active
name:
  en: "Syrian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.syria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TAX123456&postal=0100 Damascus&phone=+963 944 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [syria-locale-number-parser, syria-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
