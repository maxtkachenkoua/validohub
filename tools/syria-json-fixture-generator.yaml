schemaVersion: 1
id: syria-json-fixture-generator
kind: tool
module: validohub
country: SY
category: developer-tools
status: active
name:
  en: "Syrian JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.syria-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"SY\",\"tax\":\"TAX123456\",\"payment\":\"official-boundary\"}"
    actions: [generate, validate, explain]
related:
  explicit: [syria-regex-pack-helper, syria-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
