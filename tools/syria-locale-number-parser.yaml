schemaVersion: 1
id: syria-locale-number-parser
kind: tool
module: validohub
country: SY
category: localization
status: active
name:
  en: "Syrian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Syria."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.syria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234,567 SYP"
    actions: [validate, parse, format, explain]
related:
  explicit: [syria-calendar-week-helper, syria-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Syria."
