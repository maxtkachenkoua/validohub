schemaVersion: 1
id: syria-municipality-code-inspector
kind: tool
module: validohub
country: SY
category: address
status: active
name:
  en: "Syrian Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.syria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Malki 1, Damascus 0100"
    actions: [validate, parse, format, explain]
related:
  explicit: [syria-phone-number-validator, syria-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
