schemaVersion: 1
id: syria-tax-id-validator
kind: tool
module: validohub
country: SY
category: national-identifiers
status: active
name:
  en: "Syrian tax number Validator"
summary:
  en: "Normalize tax number identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.syria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "TAX123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [syria-customs-importer-code-helper, syria-social-insurance-boundary-social-insurance-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian tax number Validator | ValidoHub"
  description:
    en: "Normalize tax number identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
