    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
