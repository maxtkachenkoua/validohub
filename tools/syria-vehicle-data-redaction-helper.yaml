schemaVersion: 1
id: syria-vehicle-data-redaction-helper
kind: tool
module: validohub
country: SY
category: transport
status: active
name:
  en: "Syrian Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.syria-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "DAM 123456 WVWZZZ1JZXW000001 01012345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [syria-customs-declaration-helper, syria-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Syrian Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
