schemaVersion: 1
id: taiwan-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: TW
category: tax
status: active
name:
  en: "Taiwanese Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.taiwan-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 2026/07/21 1,234 TWD 12345675"
    actions: [generate, validate, explain]
related:
  explicit: [taiwan-postal-code-validator, taiwan-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
