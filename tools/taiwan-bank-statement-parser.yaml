      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "2026/07/21; 1,234 TWD; 004 123456789012; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [taiwan-masked-bank-account-formatter, taiwan-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
