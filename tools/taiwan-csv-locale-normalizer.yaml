schemaVersion: 1
id: taiwan-csv-locale-normalizer
kind: tool
module: validohub
country: TW
category: developer-tools
status: active
name:
  en: "Taiwanese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Taiwan decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.taiwan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234 TWD;2026/07/21;12345675"
    actions: [validate, parse, format, explain]
related:
  explicit: [taiwan-slug-normalizer, taiwan-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Taiwan decimal, date, postal, phone, tax, and banking fields."
