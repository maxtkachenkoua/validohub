schemaVersion: 1
id: taiwan-form-field-auditor
kind: tool
module: validohub
country: TW
category: developer-tools
status: active
name:
  en: "Taiwanese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.taiwan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=12345675&postal=100 Taipei&phone=+886 912 345 678"
    actions: [validate, parse, format, explain]
related:
  explicit: [taiwan-locale-number-parser, taiwan-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
