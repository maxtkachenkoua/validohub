schemaVersion: 1
id: taiwan-phone-number-validator
kind: tool
module: validohub
country: TW
category: address
status: active
name:
  en: "Taiwanese Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.taiwan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+886 912 345 678"
    actions: [validate, parse, format, explain]
related:
  explicit: [taiwan-phone-e164-formatter, taiwan-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
