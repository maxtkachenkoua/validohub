schemaVersion: 1
id: taiwan-pii-masker
kind: tool
module: validohub
country: TW
category: privacy
status: active
name:
  en: "Taiwanese PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.taiwan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "A123456789 +886 912 345 678 004 123456789012"
    actions: [validate, parse, format, explain]
related:
  explicit: [taiwan-personal-data-fixture-generator, taiwan-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
