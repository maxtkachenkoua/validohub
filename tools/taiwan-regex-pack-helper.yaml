schemaVersion: 1
id: taiwan-regex-pack-helper
kind: tool
module: validohub
country: TW
category: developer-tools
status: active
name:
  en: "Taiwanese Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.taiwan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "National ID boundary GUI number postal code  004 123456789012"
    actions: [validate, parse, format, explain]
related:
  explicit: [taiwan-api-payload-auditor, taiwan-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
