schemaVersion: 1
id: taiwan-slug-normalizer
kind: tool
module: validohub
country: TW
category: developer-tools
status: active
name:
  en: "Taiwanese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.taiwan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Taiwan sample company Zhongxiao East Road 1, Taipei 100"
    actions: [validate, parse, format, explain]
related:
  explicit: [taiwan-document-ocr-fixer, taiwan-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Taiwanese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
