schemaVersion: 1
id: tajikistan-company-onboarding-auditor
kind: tool
module: validohub
country: TJ
category: developer-tools
status: active
name:
  en: "Tajik Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tajikistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"TJ\",\"tin\":\"123456789\",\"mfo\":\"350101\",\"payment\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [tajikistan-business-register-readiness-helper, tajikistan-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tajik Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
