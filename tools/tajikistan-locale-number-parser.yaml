schemaVersion: 1
id: tajikistan-locale-number-parser
kind: tool
module: validohub
country: TJ
category: localization
status: active
name:
  en: "Tajik Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tajikistan."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tajikistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 TJS"
    actions: [validate, parse, format, explain]
related:
  explicit: [tajikistan-calendar-week-helper, tajikistan-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tajik Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tajikistan."
