schemaVersion: 1
id: tajikistan-phone-number-validator
kind: tool
module: validohub
country: TJ
category: address
status: active
name:
  en: "Tajik Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tajikistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+992 90 123 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [tajikistan-phone-e164-formatter, tajikistan-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tajik Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
