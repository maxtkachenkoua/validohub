    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Tajikistan sample company Rudaki Avenue 1, Dushanbe 734000"
    actions: [validate, parse, format, explain]
related:
