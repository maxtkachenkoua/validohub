schemaVersion: 1
id: tanzania-document-ocr-fixer
kind: tool
module: validohub
country: TZ
category: documents
status: active
name:
  en: "Tanzanian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tanzania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "TZ-ID-123456 TZ123456789 001 1234567890 1000 Dodoma"
    actions: [validate, parse, format, explain]
related:
  explicit: [tanzania-privacy-redaction-helper, tanzania-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tanzanian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
