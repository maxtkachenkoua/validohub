schemaVersion: 1
id: tanzania-form-field-auditor
kind: tool
module: validohub
country: TZ
category: developer-tools
status: active
name:
  en: "Tanzanian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tanzania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TZ123456789&postal=1000 Dodoma&phone=+255 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [tanzania-locale-number-parser, tanzania-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tanzanian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
