schemaVersion: 1
id: tanzania-locale-number-parser
kind: tool
module: validohub
country: TZ
category: localization
status: active
name:
  en: "Tanzanian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tanzania."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tanzania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 TZS"
    actions: [validate, parse, format, explain]
related:
  explicit: [tanzania-calendar-week-helper, tanzania-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tanzanian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tanzania."
