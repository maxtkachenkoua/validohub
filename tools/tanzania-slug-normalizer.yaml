schemaVersion: 1
id: tanzania-slug-normalizer
kind: tool
module: validohub
country: TZ
category: developer-tools
status: active
name:
  en: "Tanzanian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tanzania-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Tanzania sample company Central business district, Dodoma 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [tanzania-document-ocr-fixer, tanzania-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tanzanian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
