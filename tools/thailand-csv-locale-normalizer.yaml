schemaVersion: 1
id: thailand-csv-locale-normalizer
kind: tool
module: validohub
country: TH
category: developer-tools
status: active
name:
  en: "Thai CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Thailand decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.thailand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 THB;21/07/2026;0105559123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [thailand-slug-normalizer, thailand-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Thai CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Thailand decimal, date, postal, phone, tax, and banking fields."
