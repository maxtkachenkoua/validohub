schemaVersion: 1
id: thailand-form-field-auditor
kind: tool
module: validohub
country: TH
category: developer-tools
status: active
name:
  en: "Thai Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.thailand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=0105559123456&postal=10110 Bangkok&phone=+66 81 234 5678"
    actions: [validate, parse, format, explain]
related:
  explicit: [thailand-locale-number-parser, thailand-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Thai Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
