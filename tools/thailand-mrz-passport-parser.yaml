schemaVersion: 1
id: thailand-mrz-passport-parser
kind: tool
module: validohub
country: TH
category: national-identifiers
status: active
name:
  en: "Thai MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.thailand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<THASAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567THA8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [thailand-bank-account-validator, thailand-bank-account-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Thai MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
