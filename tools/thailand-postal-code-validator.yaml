schemaVersion: 1
id: thailand-postal-code-validator
kind: tool
module: validohub
country: TH
category: address
status: active
name:
  en: "Thai Postal Code Validator"
summary:
  en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.thailand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "10110 Bangkok"
    actions: [validate, parse, format, explain]
related:
  explicit: [thailand-address-normalizer, thailand-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Thai Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
