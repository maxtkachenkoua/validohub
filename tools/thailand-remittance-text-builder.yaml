schemaVersion: 1
id: thailand-remittance-text-builder
kind: tool
module: validohub
country: TH
category: finance
status: active
name:
  en: "Thai Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.thailand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 0105559123456 1,234.56 THB"
    actions: [validate, parse, format, explain]
related:
  explicit: [thailand-payment-reconciliation-helper, thailand-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Thai Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
