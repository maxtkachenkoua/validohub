schemaVersion: 1
id: thailand-slug-normalizer
kind: tool
module: validohub
country: TH
category: developer-tools
status: active
name:
  en: "Thai Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.thailand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Thailand sample company Sukhumvit Road 1, Bangkok 10110"
    actions: [validate, parse, format, explain]
related:
  explicit: [thailand-document-ocr-fixer, thailand-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Thai Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
