schemaVersion: 1
id: thailand-tax-rate-sanity-helper
kind: tool
module: validohub
country: TH
category: tax
status: active
name:
  en: "Thai Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.thailand-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "Revenue Department tax ID 20% base 1,234.56 THB"
    actions: [validate, parse, format, explain]
related:
  explicit: [thailand-tax-return-field-helper, thailand-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Thai Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
