schemaVersion: 1
id: timor-leste-address-normalizer
kind: tool
module: validohub
country: TL
category: address
status: active
name:
  en: "Timorese Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Avenida Nicolau Lobato 1, Dili 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-address-transliteration-normalizer, timor-leste-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
