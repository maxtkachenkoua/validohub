schemaVersion: 1
id: timor-leste-csv-locale-normalizer
kind: tool
module: validohub
country: TL
category: developer-tools
status: active
name:
  en: "Timorese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Timor-Leste decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 USD;21/07/2026;TIN1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-slug-normalizer, timor-leste-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Timor-Leste decimal, date, postal, phone, tax, and banking fields."
