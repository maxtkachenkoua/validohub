schemaVersion: 1
id: timor-leste-data-quality-workbench
kind: tool
module: validohub
country: TL
category: developer-tools
status: active
name:
  en: "Timorese Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"TL\",\"tin\":\"TIN1234567\",\"rtimor\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-json-fixture-generator, timor-leste-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
