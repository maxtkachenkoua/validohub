schemaVersion: 1
id: timor-leste-document-ocr-fixer
kind: tool
module: validohub
country: TL
category: documents
status: active
name:
  en: "Timorese Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "TL-1234567 TIN1234567 001 1234567890 Dili 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-privacy-redaction-helper, timor-leste-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
