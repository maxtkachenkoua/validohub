schemaVersion: 1
id: timor-leste-e-invoicing-readiness-checker
kind: tool
module: validohub
country: TL
category: tax
status: active
name:
  en: "Timorese tax invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"TL\",\"tin\":\"TIN1234567\",\"rtimor\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-tax-authority-handoff-helper, timor-leste-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese tax invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
