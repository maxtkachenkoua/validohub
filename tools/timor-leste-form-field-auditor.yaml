schemaVersion: 1
id: timor-leste-form-field-auditor
kind: tool
module: validohub
country: TL
category: developer-tools
status: active
name:
  en: "Timorese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TIN1234567&postal=Dili 1000&phone=+670 7723 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-locale-number-parser, timor-leste-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
