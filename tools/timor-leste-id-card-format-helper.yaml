  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese ID Card Format Helper | ValidoHub"
  description:
    en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
