schemaVersion: 1
id: timor-leste-locale-number-parser
kind: tool
module: validohub
country: TL
category: localization
status: active
name:
  en: "Timorese Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Timor-Leste."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 USD"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-calendar-week-helper, timor-leste-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Timor-Leste."
