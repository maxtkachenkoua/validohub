schemaVersion: 1
id: timor-leste-municipality-code-inspector
kind: tool
module: validohub
country: TL
category: address
status: active
name:
  en: "Timorese Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Avenida Nicolau Lobato 1, Dili 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-phone-number-validator, timor-leste-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
