schemaVersion: 1
id: timor-leste-phone-e164-formatter
kind: tool
module: validohub
country: TL
category: address
status: active
name:
  en: "Timorese Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+670 7723 4567"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-date-locale-formatter, timor-leste-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
