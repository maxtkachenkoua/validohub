schemaVersion: 1
id: timor-leste-postal-code-validator
kind: tool
module: validohub
country: TL
category: address
status: active
name:
  en: "Timorese Postal Code Validator"
summary:
  en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "Dili 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-address-normalizer, timor-leste-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
