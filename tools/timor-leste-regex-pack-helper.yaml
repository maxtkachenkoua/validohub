schemaVersion: 1
id: timor-leste-regex-pack-helper
kind: tool
module: validohub
country: TL
category: developer-tools
status: active
name:
  en: "Timorese Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "ID boundary company registration number postal code  001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-api-payload-auditor, timor-leste-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
