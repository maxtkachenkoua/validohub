schemaVersion: 1
id: timor-leste-remittance-text-builder
kind: tool
module: validohub
country: TL
category: finance
status: active
name:
  en: "Timorese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 TIN1234567 1,234.56 USD"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-payment-reconciliation-helper, timor-leste-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
