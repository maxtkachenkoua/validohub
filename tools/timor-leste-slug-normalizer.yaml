schemaVersion: 1
id: timor-leste-slug-normalizer
kind: tool
module: validohub
country: TL
category: developer-tools
status: active
name:
  en: "Timorese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.timor-leste-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Timor-Leste sample company Avenida Nicolau Lobato 1, Dili 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [timor-leste-document-ocr-fixer, timor-leste-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Timorese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
