schemaVersion: 1
id: togo-csv-locale-normalizer
kind: tool
module: validohub
country: TG
category: developer-tools
status: active
name:
  en: "Togolese CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Togo decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.togo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 XOF;24/07/2026;TG123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [togo-slug-normalizer, togo-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Togolese CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Togo decimal, date, postal, phone, tax, and banking fields."
