schemaVersion: 1
id: togo-form-field-auditor
kind: tool
module: validohub
country: TG
category: developer-tools
status: active
name:
  en: "Togolese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.togo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TG123456789&postal=1000 Lome&phone=+228 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [togo-locale-number-parser, togo-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Togolese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
