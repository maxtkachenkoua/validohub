schemaVersion: 1
id: togo-pii-masker
kind: tool
module: validohub
country: TG
category: privacy
status: active
name:
  en: "Togolese PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.togo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "TG-ID-123456 +228 123 456 789 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [togo-personal-data-fixture-generator, togo-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Togolese PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
