schemaVersion: 1
id: togo-slug-normalizer
kind: tool
module: validohub
country: TG
category: developer-tools
status: active
name:
  en: "Togolese Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.togo-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Togo sample company Central business district, Lome 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [togo-document-ocr-fixer, togo-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Togolese Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
