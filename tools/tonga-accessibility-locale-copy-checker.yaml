schemaVersion: 1
id: tonga-accessibility-locale-copy-checker
kind: tool
module: validohub
country: TO
category: localization
status: active
name:
  en: "Tongan Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tonga-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "tax ID boundary input, village/locality input, amount 1,234.56 TOP"
    actions: [validate, parse, format, explain]
related:
  explicit: [tonga-support-ticket-scrubber, tonga-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tongan Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
