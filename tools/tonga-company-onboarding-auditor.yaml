schemaVersion: 1
id: tonga-company-onboarding-auditor
kind: tool
module: validohub
country: TO
category: developer-tools
status: active
name:
  en: "Tongan Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tonga-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"TO\",\"taxNumber\":\"TO123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [tonga-business-register-readiness-helper, tonga-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tongan Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
