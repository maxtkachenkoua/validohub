schemaVersion: 1
id: tonga-csv-locale-normalizer
kind: tool
module: validohub
country: TO
category: developer-tools
status: active
name:
  en: "Tongan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Tonga decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tonga-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 TOP;24/07/2026;TO123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [tonga-slug-normalizer, tonga-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tongan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Tonga decimal, date, postal, phone, tax, and banking fields."
