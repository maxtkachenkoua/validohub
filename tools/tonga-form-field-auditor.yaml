schemaVersion: 1
id: tonga-form-field-auditor
kind: tool
module: validohub
country: TO
category: developer-tools
status: active
name:
  en: "Tongan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tonga-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TO123456789&postal=Nukuʻalofa&phone=+676 12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [tonga-locale-number-parser, tonga-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tongan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
