schemaVersion: 1
id: tonga-municipality-code-inspector
kind: tool
module: validohub
country: TO
category: address
status: active
name:
  en: "Tongan Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tonga-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Taufaʻahau Road, Nukuʻalofa"
    actions: [validate, parse, format, explain]
related:
  explicit: [tonga-phone-number-validator, tonga-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tongan Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
