    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "consumption tax boundary; TO123456789; period 2026-07; 1,234.56 TOP"
    actions: [validate, parse, format, explain]
related:
  explicit: [tonga-invoice-number-helper, tonga-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tongan Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
