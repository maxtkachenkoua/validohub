schemaVersion: 1
id: tunisia-locale-number-parser
kind: tool
module: validohub
country: TN
category: localization
status: active
name:
  en: "Tunisian Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tunisia."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tunisia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 TND"
    actions: [validate, parse, format, explain]
related:
  explicit: [tunisia-calendar-week-helper, tunisia-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tunisian Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tunisia."
