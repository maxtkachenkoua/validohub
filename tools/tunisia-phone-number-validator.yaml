schemaVersion: 1
id: tunisia-phone-number-validator
kind: tool
module: validohub
country: TN
category: address
status: active
name:
  en: "Tunisian Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tunisia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+216 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [tunisia-phone-e164-formatter, tunisia-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tunisian Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
