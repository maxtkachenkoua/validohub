schemaVersion: 1
id: turkey-accessibility-locale-copy-checker
kind: tool
module: validohub
country: TR
category: localization
status: active
name:
  en: "Turkish Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "T.C. Kimlik boundary input, postal code input, amount 1.234,56 TRY"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-support-ticket-scrubber, turkey-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
