schemaVersion: 1
id: turkey-address-normalizer
kind: tool
module: validohub
country: TR
category: address
status: active
name:
  en: "Turkish Address Normalizer"
summary:
  en: "Normalize street, postal code, locality, region, and country lines for local address forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ADDR input"
        required: true
        placeholder:
          en: "Ataturk Bulvari 1, Ankara 06420"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-address-transliteration-normalizer, turkey-region-code-mapper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Address Normalizer | ValidoHub"
  description:
    en: "Normalize street, postal code, locality, region, and country lines for local address forms."
