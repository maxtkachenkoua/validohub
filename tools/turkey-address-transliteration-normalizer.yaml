schemaVersion: 1
id: turkey-address-transliteration-normalizer
kind: tool
module: validohub
country: TR
category: address
status: active
name:
  en: "Turkish Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Ataturk Bulvari 1, Ankara 06420"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-region-code-mapper, turkey-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
