schemaVersion: 1
id: turkey-bank-statement-parser
kind: tool
module: validohub
country: TR
category: finance
status: active
name:
  en: "Turkish Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 TRY; 0061 0519786457841326; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-masked-bank-account-formatter, turkey-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
