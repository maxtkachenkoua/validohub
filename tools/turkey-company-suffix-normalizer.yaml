schemaVersion: 1
id: turkey-company-suffix-normalizer
kind: tool
module: validohub
country: TR
category: developer-tools
status: active
name:
  en: "Turkish Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Turkey Sample Holding Ltd 0123456789012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-procurement-identifier-helper, turkey-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
