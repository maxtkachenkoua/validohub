schemaVersion: 1
id: turkey-csv-locale-normalizer
kind: tool
module: validohub
country: TR
category: developer-tools
status: active
name:
  en: "Turkish CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Turkey decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 TRY;21.07.2026;1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-slug-normalizer, turkey-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Turkey decimal, date, postal, phone, tax, and banking fields."
