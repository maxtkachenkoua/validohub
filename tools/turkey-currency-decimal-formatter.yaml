summary:
  en: "Normalize TRY amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1.234,56 TRY"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-tax-rate-sanity-helper, turkey-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish TRY Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize TRY amount strings, decimal separators, grouping, and API-safe numeric previews."
