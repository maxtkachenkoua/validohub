schemaVersion: 1
id: turkey-customs-declaration-helper
kind: tool
module: validohub
country: TR
category: government
status: active
name:
  en: "Turkish Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "1234567890 HS 8471 1.234,56 TRY"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-postal-tracking-helper, turkey-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
