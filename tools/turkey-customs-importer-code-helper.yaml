schemaVersion: 1
id: turkey-customs-importer-code-helper
kind: tool
module: validohub
country: TR
category: national-identifiers
status: active
name:
  en: "Turkish Customs / Importer Code Helper"
summary:
  en: "Inspect customs identifiers, importer references, tax bodies, and border-process boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUS input"
        required: true
        placeholder:
          en: "TR0123456789012345"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-sgk-boundary-social-insurance-helper, turkey-company-onboarding-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Customs / Importer Code Helper | ValidoHub"
  description:
    en: "Inspect customs identifiers, importer references, tax bodies, and border-process boundaries."
