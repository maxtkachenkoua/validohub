schemaVersion: 1
id: turkey-document-ocr-fixer
kind: tool
module: validohub
country: TR
category: documents
status: active
name:
  en: "Turkish Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "10000000146 1234567890 0061 0519786457841326 06420 Ankara"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-privacy-redaction-helper, turkey-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
