schemaVersion: 1
id: turkey-municipality-code-inspector
kind: tool
module: validohub
country: TR
category: address
status: active
name:
  en: "Turkish Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Ataturk Bulvari 1, Ankara 06420"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-phone-number-validator, turkey-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
