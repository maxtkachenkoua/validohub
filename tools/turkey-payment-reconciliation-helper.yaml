schemaVersion: 1
id: turkey-payment-reconciliation-helper
kind: tool
module: validohub
country: TR
category: finance
status: active
name:
  en: "Turkish Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21.07.2026; 1.234,56 TRY; 0061 0519786457841326; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-bank-statement-parser, turkey-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
