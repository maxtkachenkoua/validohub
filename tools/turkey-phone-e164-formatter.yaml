schemaVersion: 1
id: turkey-phone-e164-formatter
kind: tool
module: validohub
country: TR
category: address
status: active
name:
  en: "Turkish Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+90 532 123 45 67"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-date-locale-formatter, turkey-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
