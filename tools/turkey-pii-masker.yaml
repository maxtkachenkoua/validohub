schemaVersion: 1
id: turkey-pii-masker
kind: tool
module: validohub
country: TR
category: privacy
status: active
name:
  en: "Turkish PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "10000000146 +90 532 123 45 67 0061 0519786457841326"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-personal-data-fixture-generator, turkey-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
