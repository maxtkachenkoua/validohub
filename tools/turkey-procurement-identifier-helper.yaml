schemaVersion: 1
id: turkey-procurement-identifier-helper
kind: tool
module: validohub
country: TR
category: government
status: active
name:
  en: "Turkish Procurement Identifier Helper"
summary:
  en: "Inspect buyer/seller identifiers, invoice references, and public-procurement handoff evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PROC input"
        required: true
        placeholder:
          en: "0123456789012345 PO-2026-001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-accessibility-locale-copy-checker, turkey-support-ticket-scrubber]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Procurement Identifier Helper | ValidoHub"
  description:
    en: "Inspect buyer/seller identifiers, invoice references, and public-procurement handoff evidence."
