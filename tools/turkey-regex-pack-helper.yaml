schemaVersion: 1
id: turkey-regex-pack-helper
kind: tool
module: validohub
country: TR
category: developer-tools
status: active
name:
  en: "Turkish Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "T.C. Kimlik boundary MERSIS number postal code  0061 0519786457841326"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-api-payload-auditor, turkey-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
