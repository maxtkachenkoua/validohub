schemaVersion: 1
id: turkey-remittance-text-builder
kind: tool
module: validohub
country: TR
category: finance
status: active
name:
  en: "Turkish Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 1234567890 1.234,56 TRY"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-payment-reconciliation-helper, turkey-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
