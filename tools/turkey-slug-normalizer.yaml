schemaVersion: 1
id: turkey-slug-normalizer
kind: tool
module: validohub
country: TR
category: developer-tools
status: active
name:
  en: "Turkish Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Turkey sample company Ataturk Bulvari 1, Ankara 06420"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-document-ocr-fixer, turkey-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
