schemaVersion: 1
id: turkey-tax-authority-handoff-helper
kind: tool
module: validohub
country: TR
category: tax
status: active
name:
  en: "Turkish Tax Authority Handoff Helper"
summary:
  en: "Prepare local tax evidence for browser-only QA before regulated authority portals or API submissions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "1234567890 21.07.2026 1.234,56 TRY"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-accounting-audit-trail-checklist-generator, turkey-postal-code-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Tax Authority Handoff Helper | ValidoHub"
  description:
    en: "Prepare local tax evidence for browser-only QA before regulated authority portals or API submissions."
