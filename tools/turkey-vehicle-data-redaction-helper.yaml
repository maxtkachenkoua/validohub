schemaVersion: 1
id: turkey-vehicle-data-redaction-helper
kind: tool
module: validohub
country: TR
category: transport
status: active
name:
  en: "Turkish Vehicle Data Redaction Helper"
summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkey-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "06 ABC 123 WVWZZZ1JZXW000001 10000000146"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkey-customs-declaration-helper, turkey-postal-tracking-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkish Vehicle Data Redaction Helper | ValidoHub"
  description:
    en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
