schemaVersion: 1
id: turkmenistan-e-invoicing-readiness-checker
kind: tool
module: validohub
country: TM
category: tax
status: active
name:
  en: "Turkmen tax invoice Readiness Checker"
summary:
  en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkmenistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "EINV input"
        required: true
        placeholder:
          en: "{\"country\":\"TM\",\"tax\":\"12345678\",\"bank\":\"3901012345678901\",\"payment\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkmenistan-tax-authority-handoff-helper, turkmenistan-accounting-audit-trail-checklist-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkmen tax invoice Readiness Checker | ValidoHub"
  description:
    en: "Audit e-invoicing payload readiness for seller, buyer, tax, address, totals, and official submission boundaries."
