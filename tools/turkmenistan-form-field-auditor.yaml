schemaVersion: 1
id: turkmenistan-form-field-auditor
kind: tool
module: validohub
country: TM
category: developer-tools
status: active
name:
  en: "Turkmen Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkmenistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=12345678&postal=744000 Ashgabat&phone=+993 12 345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkmenistan-locale-number-parser, turkmenistan-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkmen Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
