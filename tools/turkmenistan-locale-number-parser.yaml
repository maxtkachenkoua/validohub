schemaVersion: 1
id: turkmenistan-locale-number-parser
kind: tool
module: validohub
country: TM
category: localization
status: active
name:
  en: "Turkmen Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Turkmenistan."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkmenistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234,56 TMT"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkmenistan-calendar-week-helper, turkmenistan-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkmen Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Turkmenistan."
