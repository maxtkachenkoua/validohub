schemaVersion: 1
id: turkmenistan-phone-number-validator
kind: tool
module: validohub
country: TM
category: address
status: active
name:
  en: "Turkmen Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkmenistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+993 12 345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkmenistan-phone-e164-formatter, turkmenistan-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkmen Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
