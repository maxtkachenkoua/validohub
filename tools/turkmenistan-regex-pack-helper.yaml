schemaVersion: 1
id: turkmenistan-regex-pack-helper
kind: tool
module: validohub
country: TM
category: developer-tools
status: active
name:
  en: "Turkmen Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.turkmenistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Passport / ID boundary company registration number postal code  3901012345678901"
    actions: [validate, parse, format, explain]
related:
  explicit: [turkmenistan-api-payload-auditor, turkmenistan-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Turkmen Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
