schemaVersion: 1
id: tuvalu-accessibility-locale-copy-checker
kind: tool
module: validohub
country: TV
category: localization
status: active
name:
  en: "Tuvaluan Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tuvalu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "national ID boundary input, island/locality input, amount 1,234.56 AUD"
    actions: [validate, parse, format, explain]
related:
  explicit: [tuvalu-support-ticket-scrubber, tuvalu-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tuvaluan Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
