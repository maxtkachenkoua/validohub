schemaVersion: 1
id: tuvalu-company-suffix-normalizer
kind: tool
module: validohub
country: TV
category: developer-tools
status: active
name:
  en: "Tuvaluan Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tuvalu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Tuvalu Sample Holding Ltd TV-REG-123456"
    actions: [validate, parse, format, explain]
related:
  explicit: [tuvalu-procurement-identifier-helper, tuvalu-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tuvaluan Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
