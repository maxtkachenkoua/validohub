schemaVersion: 1
id: tuvalu-csv-locale-normalizer
kind: tool
module: validohub
country: TV
category: developer-tools
status: active
name:
  en: "Tuvaluan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Tuvalu decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tuvalu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 AUD;24/07/2026;TV123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [tuvalu-slug-normalizer, tuvalu-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tuvaluan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Tuvalu decimal, date, postal, phone, tax, and banking fields."
