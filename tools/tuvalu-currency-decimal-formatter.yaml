schemaVersion: 1
id: tuvalu-currency-decimal-formatter
kind: tool
module: validohub
country: TV
category: finance
status: active
name:
  en: "Tuvaluan AUD Decimal Currency Formatter"
summary:
  en: "Normalize AUD amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tuvalu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234.56 AUD"
    actions: [validate, parse, format, explain]
related:
  explicit: [tuvalu-tax-rate-sanity-helper, tuvalu-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tuvaluan AUD Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize AUD amount strings, decimal separators, grouping, and API-safe numeric previews."
