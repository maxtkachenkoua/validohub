schemaVersion: 1
id: tuvalu-form-field-auditor
kind: tool
module: validohub
country: TV
category: developer-tools
status: active
name:
  en: "Tuvaluan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tuvalu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TV123456789&postal=Funafuti&phone=+688 12345"
    actions: [validate, parse, format, explain]
related:
  explicit: [tuvalu-locale-number-parser, tuvalu-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tuvaluan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
