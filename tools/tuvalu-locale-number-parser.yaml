schemaVersion: 1
id: tuvalu-locale-number-parser
kind: tool
module: validohub
country: TV
category: localization
status: active
name:
  en: "Tuvaluan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tuvalu."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tuvalu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 AUD"
    actions: [validate, parse, format, explain]
related:
  explicit: [tuvalu-calendar-week-helper, tuvalu-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tuvaluan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Tuvalu."
