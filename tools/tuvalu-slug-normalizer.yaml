schemaVersion: 1
id: tuvalu-slug-normalizer
kind: tool
module: validohub
country: TV
category: developer-tools
status: active
name:
  en: "Tuvaluan Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.tuvalu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Tuvalu sample company Vaiaku, Funafuti"
    actions: [validate, parse, format, explain]
related:
  explicit: [tuvalu-document-ocr-fixer, tuvalu-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Tuvaluan Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
