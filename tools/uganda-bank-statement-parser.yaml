schemaVersion: 1
id: uganda-bank-statement-parser
kind: tool
module: validohub
country: UG
category: finance
status: active
name:
  en: "Ugandan Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uganda-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "24/07/2026; 1,234.56 UGX; 001 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [uganda-masked-bank-account-formatter, uganda-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ugandan Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
