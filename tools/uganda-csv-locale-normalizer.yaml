schemaVersion: 1
id: uganda-csv-locale-normalizer
kind: tool
module: validohub
country: UG
category: developer-tools
status: active
name:
  en: "Ugandan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Uganda decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uganda-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 UGX;24/07/2026;UG123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [uganda-slug-normalizer, uganda-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ugandan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Uganda decimal, date, postal, phone, tax, and banking fields."
