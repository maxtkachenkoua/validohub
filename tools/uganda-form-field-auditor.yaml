schemaVersion: 1
id: uganda-form-field-auditor
kind: tool
module: validohub
country: UG
category: developer-tools
status: active
name:
  en: "Ugandan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uganda-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=UG123456789&postal=1000 Kampala&phone=+256 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [uganda-locale-number-parser, uganda-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ugandan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
