schemaVersion: 1
id: uganda-locale-number-parser
kind: tool
module: validohub
country: UG
category: localization
status: active
name:
  en: "Ugandan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Uganda."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uganda-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234.56 UGX"
    actions: [validate, parse, format, explain]
related:
  explicit: [uganda-calendar-week-helper, uganda-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ugandan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Uganda."
