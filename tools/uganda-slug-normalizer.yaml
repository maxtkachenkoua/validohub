schemaVersion: 1
id: uganda-slug-normalizer
kind: tool
module: validohub
country: UG
category: developer-tools
status: active
name:
  en: "Ugandan Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uganda-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Uganda sample company Central business district, Kampala 1000"
    actions: [validate, parse, format, explain]
related:
  explicit: [uganda-document-ocr-fixer, uganda-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ugandan Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
