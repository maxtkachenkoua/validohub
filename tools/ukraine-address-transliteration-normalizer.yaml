schemaVersion: 1
id: ukraine-address-transliteration-normalizer
kind: tool
module: validohub
country: UA
category: address
status: active
name:
  en: "Ukrainian Address Transliteration Normalizer"
summary:
  en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "ASCII input"
        required: true
        placeholder:
          en: "Khreshchatyk 1, 01001 Kyiv"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-region-code-mapper, ukraine-municipality-code-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Address Transliteration Normalizer | ValidoHub"
  description:
    en: "Prepare ASCII-safe address keys while preserving local display text and search/debug evidence."
