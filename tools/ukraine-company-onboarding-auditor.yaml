schemaVersion: 1
id: ukraine-company-onboarding-auditor
kind: tool
module: validohub
country: UA
category: developer-tools
status: active
name:
  en: "Ukrainian Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for EDRPOU, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"UA\",\"rnokpp\":\"1234567890\",\"edrpou\":\"12345678\",\"iban\":\"UA213223130000026007233566001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-business-register-readiness-helper, ukraine-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for EDRPOU, VAT, address, banking, and official registry handoff readiness."
