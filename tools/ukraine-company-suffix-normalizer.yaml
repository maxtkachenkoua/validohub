schemaVersion: 1
id: ukraine-company-suffix-normalizer
kind: tool
module: validohub
country: UA
category: developer-tools
status: active
name:
  en: "Ukrainian Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Ukraine Sample Holding Ltd 12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-procurement-identifier-helper, ukraine-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
