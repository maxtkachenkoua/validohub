schemaVersion: 1
id: ukraine-document-ocr-fixer
kind: tool
module: validohub
country: UA
category: documents
status: active
name:
  en: "Ukrainian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "1234567890 UA123456789012 UA213223130000026007233566001 01001 Kyiv"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-gdpr-redaction-helper, ukraine-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
