schemaVersion: 1
id: ukraine-municipality-code-inspector
kind: tool
module: validohub
country: UA
category: address
status: active
name:
  en: "Ukrainian Municipality Code Inspector"
summary:
  en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Khreshchatyk 1, 01001 Kyiv"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-phone-number-validator, ukraine-phone-e164-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Municipality Code Inspector | ValidoHub"
  description:
    en: "Inspect municipality/city evidence, address fields, postal slices, and administrative-code boundaries."
