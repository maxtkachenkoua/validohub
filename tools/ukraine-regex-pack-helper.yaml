schemaVersion: 1
id: ukraine-regex-pack-helper
kind: tool
module: validohub
country: UA
category: developer-tools
status: active
name:
  en: "Ukrainian Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "RNOKPP EDRPOU postal code  UA213223130000026007233566001"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-api-payload-auditor, ukraine-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
