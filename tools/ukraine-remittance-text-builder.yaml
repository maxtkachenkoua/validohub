schemaVersion: 1
id: ukraine-remittance-text-builder
kind: tool
module: validohub
country: UA
category: finance
status: active
name:
  en: "Ukrainian Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 UA123456789012 1 234,56 UAH"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-payment-reconciliation-helper, ukraine-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
