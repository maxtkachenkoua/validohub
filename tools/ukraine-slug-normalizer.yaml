schemaVersion: 1
id: ukraine-slug-normalizer
kind: tool
module: validohub
country: UA
category: developer-tools
status: active
name:
  en: "Ukrainian Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Ukraine sample company Khreshchatyk 1, 01001 Kyiv"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-document-ocr-fixer, ukraine-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
