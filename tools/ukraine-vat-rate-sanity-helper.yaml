schemaVersion: 1
id: ukraine-vat-rate-sanity-helper
kind: tool
module: validohub
country: UA
category: tax
status: active
name:
  en: "Ukrainian VAT Rate Sanity Helper"
summary:
  en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.ukraine-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "PDV / VAT 20% base 1 234,56 UAH"
    actions: [validate, parse, format, explain]
related:
  explicit: [ukraine-vat-return-field-helper, ukraine-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Ukrainian VAT Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
