schemaVersion: 1
id: united-arab-emirates-date-locale-formatter
kind: tool
module: validohub
country: AE
category: localization
status: active
name:
  en: "UAE Date Locale Formatter"
summary:
  en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-arab-emirates-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DATE input"
        required: true
        placeholder:
          en: "21/07/2026"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-arab-emirates-csv-locale-normalizer, united-arab-emirates-slug-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "UAE Date Locale Formatter | ValidoHub"
  description:
    en: "Normalize local dates, ISO previews, fiscal-period hints, and locale parsing diagnostics."
