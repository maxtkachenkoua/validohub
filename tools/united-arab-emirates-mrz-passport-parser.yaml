schemaVersion: 1
id: united-arab-emirates-mrz-passport-parser
kind: tool
module: validohub
country: AE
category: national-identifiers
status: active
name:
  en: "UAE MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-arab-emirates-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<ARESAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567ARE8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-arab-emirates-bank-account-validator, united-arab-emirates-bank-account-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "UAE MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
