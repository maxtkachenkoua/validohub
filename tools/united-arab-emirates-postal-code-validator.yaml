schemaVersion: 1
id: united-arab-emirates-postal-code-validator
kind: tool
module: validohub
country: AE
category: address
status: active
name:
  en: "UAE Postal Code Validator"
summary:
  en: "Validate PO Box / Makani shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-arab-emirates-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "PO Box 12345 Abu Dhabi"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-arab-emirates-address-normalizer, united-arab-emirates-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "UAE Postal Code Validator | ValidoHub"
  description:
    en: "Validate PO Box / Makani shape, split area/delivery hints, and preserve official postal lookup boundaries."
