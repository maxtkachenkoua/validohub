schemaVersion: 1
id: united-kingdom-api-payload-auditor
kind: tool
module: validohub
country: GB
category: developer-tools
status: active
name:
  en: "British API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"GB\",\"nino\":\"QQ123456C\",\"company\":\"01234567\",\"sortCode\":\"60-16-13\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-form-field-auditor, united-kingdom-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, IBAN, dates, amounts, and official boundaries."
