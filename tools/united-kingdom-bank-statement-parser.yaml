schemaVersion: 1
id: united-kingdom-bank-statement-parser
kind: tool
module: validohub
country: GB
category: finance
status: active
name:
  en: "British Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1,234.56 GBP; GB29NWBK60161331926819; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-masked-iban-formatter, united-kingdom-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, IBAN, counterparty, reference, and local decimal conventions."
