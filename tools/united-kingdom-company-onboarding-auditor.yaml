schemaVersion: 1
id: united-kingdom-company-onboarding-auditor
kind: tool
module: validohub
country: GB
category: developer-tools
status: active
name:
  en: "British Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for Companies House number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"GB\",\"nino\":\"QQ123456C\",\"company\":\"01234567\",\"sortCode\":\"60-16-13\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-business-register-readiness-helper, united-kingdom-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for Companies House number, VAT, address, banking, and official registry handoff readiness."
