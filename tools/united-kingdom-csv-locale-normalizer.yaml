schemaVersion: 1
id: united-kingdom-csv-locale-normalizer
kind: tool
module: validohub
country: GB
category: developer-tools
status: active
name:
  en: "British CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for United Kingdom decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 GBP;21/07/2026;GB123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-slug-normalizer, united-kingdom-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for United Kingdom decimal, date, postal, phone, tax, and banking fields."
