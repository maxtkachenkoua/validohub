schemaVersion: 1
id: united-kingdom-form-field-auditor
kind: tool
module: validohub
country: GB
category: developer-tools
status: active
name:
  en: "British Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=GB123456789&postal=SW1A 1AA London&phone=+44 20 7946 0018"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-locale-number-parser, united-kingdom-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
