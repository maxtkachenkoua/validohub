summary:
  en: "Inspect invoice numbering, period hints, VAT/customer evidence, and duplicate-risk diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "INV input"
        required: true
        placeholder:
          en: "INV-2026-0001 GB123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-e-invoicing-readiness-checker, united-kingdom-tax-authority-handoff-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Invoice Number Helper | ValidoHub"
  description:
    en: "Inspect invoice numbering, period hints, VAT/customer evidence, and duplicate-risk diagnostics."
