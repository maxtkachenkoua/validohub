schemaVersion: 1
id: united-kingdom-passport-number-helper
kind: tool
module: validohub
country: GB
category: national-identifiers
status: active
name:
  en: "British Passport Number Helper"
summary:
  en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PASS input"
        required: true
        placeholder:
          en: "P<GBRBRITISH<<SAMPLE<<<<<<<<<<<<<<<<<<"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-mrz-passport-parser, united-kingdom-iban-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Passport Number Helper | ValidoHub"
  description:
    en: "Parse passport-number snippets, nationality hints, issue/expiry dates, and MRZ handoff evidence."
