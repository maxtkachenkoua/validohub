schemaVersion: 1
id: united-kingdom-phone-e164-formatter
kind: tool
module: validohub
country: GB
category: address
status: active
name:
  en: "British Phone E.164 Formatter"
summary:
  en: "Normalize local phone input to E.164-style previews and split country/national evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "E164 input"
        required: true
        placeholder:
          en: "+44 20 7946 0018"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-date-locale-formatter, united-kingdom-csv-locale-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Phone E.164 Formatter | ValidoHub"
  description:
    en: "Normalize local phone input to E.164-style previews and split country/national evidence."
