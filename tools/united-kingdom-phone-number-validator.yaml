schemaVersion: 1
id: united-kingdom-phone-number-validator
kind: tool
module: validohub
country: GB
category: address
status: active
name:
  en: "British Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+44 20 7946 0018"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-phone-e164-formatter, united-kingdom-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
