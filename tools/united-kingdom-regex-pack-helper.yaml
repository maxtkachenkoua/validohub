capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "National Insurance number Companies House number postcode  GB29NWBK60161331926819"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-api-payload-auditor, united-kingdom-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, VAT, IBAN, postal, phone, dates, and debug labels."
