summary:
  en: "Mask VIN, plate, owner, address, and insurance evidence for transport-support logs."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "VEH input"
        required: true
        placeholder:
          en: "AB12 CDE WVWZZZ1JZXW000001 QQ123456C"
    actions: [validate, parse, format, explain]
related:
