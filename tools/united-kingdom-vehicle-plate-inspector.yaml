schemaVersion: 1
id: united-kingdom-vehicle-plate-inspector
kind: tool
module: validohub
country: GB
category: transport
status: active
name:
  en: "British Vehicle Plate Inspector"
summary:
  en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.united-kingdom-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PLATE input"
        required: true
        placeholder:
          en: "AB12 CDE"
    actions: [validate, parse, format, explain]
related:
  explicit: [united-kingdom-vin-validator, united-kingdom-vehicle-data-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "British Vehicle Plate Inspector | ValidoHub"
  description:
    en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
