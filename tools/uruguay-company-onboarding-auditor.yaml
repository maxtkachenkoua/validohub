schemaVersion: 1
id: uruguay-company-onboarding-auditor
kind: tool
module: validohub
country: UY
category: developer-tools
status: active
name:
  en: "Uruguayan Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for RUT, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"UY\",\"rut\":\"210123456789\",\"cfe\":\"A-123456\",\"amount\":\"1.234,56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-business-register-readiness-helper, uruguay-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for RUT, VAT, address, banking, and official registry handoff readiness."
