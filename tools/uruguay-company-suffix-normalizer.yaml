schemaVersion: 1
id: uruguay-company-suffix-normalizer
kind: tool
module: validohub
country: UY
category: developer-tools
status: active
name:
  en: "Uruguayan Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Uruguay Sample Holding Ltd 210123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-procurement-identifier-helper, uruguay-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
