schemaVersion: 1
id: uruguay-csv-locale-normalizer
kind: tool
module: validohub
country: UY
category: developer-tools
status: active
name:
  en: "Uruguayan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Uruguay decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 UYU;21/07/2026;UY RUT 210123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-slug-normalizer, uruguay-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Uruguay decimal, date, postal, phone, tax, and banking fields."
