    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect customs/tax ID, invoice, amount, HS-code, and border handoff evidence without official filing."
