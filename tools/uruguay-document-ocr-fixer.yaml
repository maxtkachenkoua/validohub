schemaVersion: 1
id: uruguay-document-ocr-fixer
kind: tool
module: validohub
country: UY
category: documents
status: active
name:
  en: "Uruguayan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "1.234.567-8 UY RUT 210123456789 UY-BANK-001-1234567890 11000 Montevideo"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-gdpr-redaction-helper, uruguay-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
