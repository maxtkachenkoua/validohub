schemaVersion: 1
id: uruguay-json-fixture-generator
kind: tool
module: validohub
country: UY
category: developer-tools
status: active
name:
  en: "Uruguayan JSON Fixture Helper"
summary:
  en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "JSON input"
        required: true
        placeholder:
          en: "{\"country\":\"UY\",\"rut\":\"210123456789\",\"cfe\":\"A-123456\",\"amount\":\"1.234,56\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-regex-pack-helper, uruguay-api-payload-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan JSON Fixture Helper | ValidoHub"
  description:
    en: "Generate and inspect JSON fixtures for local identifiers, addresses, payments, and privacy-safe tests."
