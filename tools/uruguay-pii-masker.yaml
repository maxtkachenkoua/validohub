schemaVersion: 1
id: uruguay-pii-masker
kind: tool
module: validohub
country: UY
category: privacy
status: active
name:
  en: "Uruguayan PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "1.234.567-8 +598 94 123 456 UY-BANK-001-1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-personal-data-fixture-generator, uruguay-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
