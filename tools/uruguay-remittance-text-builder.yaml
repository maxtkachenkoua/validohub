schemaVersion: 1
id: uruguay-remittance-text-builder
kind: tool
module: validohub
country: UY
category: finance
status: active
name:
  en: "Uruguayan Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 UY RUT 210123456789 1.234,56 UYU"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-payment-reconciliation-helper, uruguay-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
