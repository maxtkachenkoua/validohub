schemaVersion: 1
id: uruguay-vat-rate-sanity-helper
kind: tool
module: validohub
country: UY
category: tax
status: active
name:
  en: "Uruguayan VAT Rate Sanity Helper"
summary:
  en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uruguay-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "IVA / RUT 20% base 1.234,56 UYU"
    actions: [validate, parse, format, explain]
related:
  explicit: [uruguay-vat-return-field-helper, uruguay-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uruguayan VAT Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect VAT-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
