schemaVersion: 1
id: uzbekistan-accessibility-locale-copy-checker
kind: tool
module: validohub
country: UZ
category: localization
status: active
name:
  en: "Uzbek Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "PINFL boundary input, postal code input, amount 1 234 567,89 UZS"
    actions: [validate, parse, format, explain]
related:
  explicit: [uzbekistan-support-ticket-scrubber, uzbekistan-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
