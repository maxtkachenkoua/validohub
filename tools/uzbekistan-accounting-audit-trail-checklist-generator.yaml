schemaVersion: 1
id: uzbekistan-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: UZ
category: tax
status: active
name:
  en: "Uzbek Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21.07.2026 1 234 567,89 UZS 123456789"
    actions: [generate, validate, explain]
related:
  explicit: [uzbekistan-postal-code-validator, uzbekistan-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
