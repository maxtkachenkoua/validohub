schemaVersion: 1
id: uzbekistan-company-onboarding-auditor
kind: tool
module: validohub
country: UZ
category: developer-tools
status: active
name:
  en: "Uzbek Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for STIR / company tax number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"UZ\",\"pinfl\":\"30101876543212\",\"stir\":\"123456789\",\"mfo\":\"00444\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [uzbekistan-business-register-readiness-helper, uzbekistan-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for STIR / company tax number, VAT, address, banking, and official registry handoff readiness."
