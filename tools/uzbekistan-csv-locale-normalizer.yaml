schemaVersion: 1
id: uzbekistan-csv-locale-normalizer
kind: tool
module: validohub
country: UZ
category: developer-tools
status: active
name:
  en: "Uzbek CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Uzbekistan decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1 234 567,89 UZS;21.07.2026;123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [uzbekistan-slug-normalizer, uzbekistan-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Uzbekistan decimal, date, postal, phone, tax, and banking fields."
