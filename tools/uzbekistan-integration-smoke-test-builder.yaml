schemaVersion: 1
id: uzbekistan-integration-smoke-test-builder
kind: tool
module: validohub
country: UZ
category: developer-tools
status: active
name:
  en: "Uzbek Integration Smoke Test Builder"
summary:
  en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SMOKE input"
        required: true
        placeholder:
          en: "{\"country\":\"UZ\",\"pinfl\":\"30101876543212\",\"stir\":\"123456789\",\"mfo\":\"00444\"}"
    actions: [generate, validate, explain]
related:
  explicit: [uzbekistan-pinfl-boundary-validator, uzbekistan-stir-company-tax-number-validator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Integration Smoke Test Builder | ValidoHub"
  description:
    en: "Build local smoke-test evidence for forms, APIs, payments, invoices, and privacy-safe fixtures."
