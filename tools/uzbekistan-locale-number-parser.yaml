schemaVersion: 1
id: uzbekistan-locale-number-parser
kind: tool
module: validohub
country: UZ
category: localization
status: active
name:
  en: "Uzbek Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Uzbekistan."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1 234 567,89 UZS"
    actions: [validate, parse, format, explain]
related:
  explicit: [uzbekistan-calendar-week-helper, uzbekistan-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Uzbekistan."
