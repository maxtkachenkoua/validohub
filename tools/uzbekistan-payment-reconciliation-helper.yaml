    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
