    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "30101876543212 +998 90 123 45 67 00444 20208000123456789001"
    actions: [validate, parse, format, explain]
related:
  explicit: [uzbekistan-personal-data-fixture-generator, uzbekistan-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
