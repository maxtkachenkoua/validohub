schemaVersion: 1
id: uzbekistan-remittance-text-builder
kind: tool
module: validohub
country: UZ
category: finance
status: active
name:
  en: "Uzbek Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 123456789 1 234 567,89 UZS"
    actions: [validate, parse, format, explain]
related:
  explicit: [uzbekistan-payment-reconciliation-helper, uzbekistan-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
