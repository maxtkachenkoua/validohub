schemaVersion: 1
id: uzbekistan-tax-rate-sanity-helper
kind: tool
module: validohub
country: UZ
category: tax
status: active
name:
  en: "Uzbek Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.uzbekistan-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "STIR / QQS 20% base 1 234 567,89 UZS"
    actions: [validate, parse, format, explain]
related:
  explicit: [uzbekistan-tax-return-field-helper, uzbekistan-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Uzbek Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
