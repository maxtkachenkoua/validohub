schemaVersion: 1
id: vanuatu-api-payload-auditor
kind: tool
module: validohub
country: VU
category: developer-tools
status: active
name:
  en: "Vanuatuan API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"VU\",\"taxNumber\":\"VU123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-form-field-auditor, vanuatu-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
