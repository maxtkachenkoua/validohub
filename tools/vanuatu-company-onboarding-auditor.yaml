schemaVersion: 1
id: vanuatu-company-onboarding-auditor
kind: tool
module: validohub
country: VU
category: developer-tools
status: active
name:
  en: "Vanuatuan Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"VU\",\"taxNumber\":\"VU123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-business-register-readiness-helper, vanuatu-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for company registration number, VAT, address, banking, and official registry handoff readiness."
