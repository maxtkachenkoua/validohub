schemaVersion: 1
id: vanuatu-currency-decimal-formatter
kind: tool
module: validohub
country: VU
category: finance
status: active
name:
  en: "Vanuatuan VUV Decimal Currency Formatter"
summary:
  en: "Normalize VUV amount strings, decimal separators, grouping, and API-safe numeric previews."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUR input"
        required: true
        placeholder:
          en: "1,234 VUV"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-tax-rate-sanity-helper, vanuatu-tax-return-field-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan VUV Decimal Currency Formatter | ValidoHub"
  description:
    en: "Normalize VUV amount strings, decimal separators, grouping, and API-safe numeric previews."
