schemaVersion: 1
id: vanuatu-customs-declaration-helper
kind: tool
module: validohub
country: VU
category: government
status: active
name:
  en: "Vanuatuan Customs Declaration Helper"
summary:
  en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CUSTOMS input"
        required: true
        placeholder:
          en: "VU123456789 HS 8471 1,234 VUV"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-postal-tracking-helper, vanuatu-data-quality-workbench]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Customs Declaration Helper | ValidoHub"
  description:
    en: "Inspect importer code, tax, invoice, amount, HS-code, and border handoff evidence without official filing."
