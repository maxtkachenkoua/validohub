schemaVersion: 1
id: vanuatu-data-quality-workbench
kind: tool
module: validohub
country: VU
category: developer-tools
status: active
name:
  en: "Vanuatuan Data Quality Workbench"
summary:
  en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "DQ input"
        required: true
        placeholder:
          en: "{\"country\":\"VU\",\"taxNumber\":\"VU123456789\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-json-fixture-generator, vanuatu-regex-pack-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Data Quality Workbench | ValidoHub"
  description:
    en: "Audit mixed local data for identifiers, tax, banking, locale, privacy, and missing field evidence."
