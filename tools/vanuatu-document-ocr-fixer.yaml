schemaVersion: 1
id: vanuatu-document-ocr-fixer
kind: tool
module: validohub
country: VU
category: documents
status: active
name:
  en: "Vanuatuan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "VU-TIN-123456 VU123456789 001 1234567890 Port Vila"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-privacy-redaction-helper, vanuatu-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
