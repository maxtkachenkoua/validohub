schemaVersion: 1
id: vanuatu-locale-number-parser
kind: tool
module: validohub
country: VU
category: localization
status: active
name:
  en: "Vanuatuan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Vanuatu."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1,234 VUV"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-calendar-week-helper, vanuatu-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Vanuatu."
