schemaVersion: 1
id: vanuatu-pii-masker
kind: tool
module: validohub
country: VU
category: privacy
status: active
name:
  en: "Vanuatuan PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "VU-TIN-123456 +678 12345 001 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-personal-data-fixture-generator, vanuatu-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
