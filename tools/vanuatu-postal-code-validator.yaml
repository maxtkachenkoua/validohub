schemaVersion: 1
id: vanuatu-postal-code-validator
kind: tool
module: validohub
country: VU
category: address
status: active
name:
  en: "Vanuatuan Postal Code Validator"
summary:
  en: "Validate island/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "Port Vila"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-address-normalizer, vanuatu-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Postal Code Validator | ValidoHub"
  description:
    en: "Validate island/locality shape, split area/delivery hints, and preserve official postal lookup boundaries."
