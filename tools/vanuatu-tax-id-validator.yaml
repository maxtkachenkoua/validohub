summary:
  en: "Normalize VAT boundary identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "TAX input"
        required: true
        placeholder:
          en: "VU123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-customs-importer-code-helper, vanuatu-social-boundary-social-insurance-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan VAT boundary Validator | ValidoHub"
  description:
    en: "Normalize VAT boundary identifiers, inspect local tax body evidence, and prepare authority handoff diagnostics."
