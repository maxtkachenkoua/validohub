schemaVersion: 1
id: vanuatu-tax-rate-sanity-helper
kind: tool
module: validohub
country: VU
category: tax
status: active
name:
  en: "Vanuatuan Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "VAT boundary 20% base 1,234 VUV"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-tax-return-field-helper, vanuatu-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
