schemaVersion: 1
id: vanuatu-tax-return-field-helper
kind: tool
module: validohub
country: VU
category: tax
status: active
name:
  en: "Vanuatuan Tax Return Field Helper"
summary:
  en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vanuatu-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RET input"
        required: true
        placeholder:
          en: "VAT boundary; VU123456789; period 2026-07; 1,234 VUV"
    actions: [validate, parse, format, explain]
related:
  explicit: [vanuatu-invoice-number-helper, vanuatu-e-invoicing-readiness-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vanuatuan Tax Return Field Helper | ValidoHub"
  description:
    en: "Map tax-return field labels, tax evidence, period dates, and export-safe developer payloads."
