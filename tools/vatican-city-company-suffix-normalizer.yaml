      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Vatican City Sample Holding Ltd VA-ENTITY-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [vatican-city-procurement-identifier-helper, vatican-city-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
