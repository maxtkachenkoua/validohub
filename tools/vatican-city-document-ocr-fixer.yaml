schemaVersion: 1
id: vatican-city-document-ocr-fixer
kind: tool
module: validohub
country: VA
category: documents
status: active
name:
  en: "Vatican Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vatican-city-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "SCV123456 VA00123456789 VA59001123000000012345678 00120 Vatican City"
    actions: [validate, parse, format, explain]
related:
  explicit: [vatican-city-gdpr-redaction-helper, vatican-city-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
