schemaVersion: 1
id: vatican-city-form-field-auditor
kind: tool
module: validohub
country: VA
category: developer-tools
status: active
name:
  en: "Vatican Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vatican-city-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=VA00123456789&postal=00120 Vatican City&phone=+39 06 6982 1234"
    actions: [validate, parse, format, explain]
related:
  explicit: [vatican-city-locale-number-parser, vatican-city-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
