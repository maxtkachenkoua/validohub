    inputs:
      - type: textarea
        name: input
        label:
          en: "IBG input"
        required: true
        placeholder:
          en: "001123000000012345678"
    actions: [generate, validate, explain]
related:
  explicit: [vatican-city-bank-account-inspector, vatican-city-bic-swift-inspector]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican City IBAN Generator | ValidoHub"
  description:
    en: "Generate VA IBAN check digits from a local BBAN/account body, replay MOD-97 evidence, and prepare payment fixtures."
