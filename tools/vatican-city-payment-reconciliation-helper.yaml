schemaVersion: 1
id: vatican-city-payment-reconciliation-helper
kind: tool
module: validohub
country: VA
category: finance
status: active
name:
  en: "Vatican Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vatican-city-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 EUR; VA59001123000000012345678; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [vatican-city-bank-statement-parser, vatican-city-masked-iban-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
