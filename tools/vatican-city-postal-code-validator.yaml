schemaVersion: 1
id: vatican-city-postal-code-validator
kind: tool
module: validohub
country: VA
category: address
status: active
name:
  en: "Vatican Postal Code Validator"
summary:
  en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vatican-city-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "POST input"
        required: true
        placeholder:
          en: "00120 Vatican City"
    actions: [validate, parse, format, explain]
related:
  explicit: [vatican-city-address-normalizer, vatican-city-address-transliteration-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican Postal Code Validator | ValidoHub"
  description:
    en: "Validate postal code shape, split area/delivery hints, and preserve official postal lookup boundaries."
