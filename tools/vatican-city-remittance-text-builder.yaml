schemaVersion: 1
id: vatican-city-remittance-text-builder
kind: tool
module: validohub
country: VA
category: finance
status: active
name:
  en: "Vatican Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vatican-city-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 VA00123456789 1.234,56 EUR"
    actions: [validate, parse, format, explain]
related:
  explicit: [vatican-city-payment-reconciliation-helper, vatican-city-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
