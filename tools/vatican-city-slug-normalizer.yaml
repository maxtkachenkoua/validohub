schemaVersion: 1
id: vatican-city-slug-normalizer
kind: tool
module: validohub
country: VA
category: developer-tools
status: active
name:
  en: "Vatican Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vatican-city-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Vatican City sample company Cortile San Damaso, 00120 Vatican City"
    actions: [validate, parse, format, explain]
related:
  explicit: [vatican-city-document-ocr-fixer, vatican-city-gdpr-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vatican Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
