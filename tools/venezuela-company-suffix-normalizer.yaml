schemaVersion: 1
id: venezuela-company-suffix-normalizer
kind: tool
module: validohub
country: VE
category: developer-tools
status: active
name:
  en: "Venezuelan Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Venezuela Sample Holding Ltd J-12345678-9"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-procurement-identifier-helper, venezuela-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
