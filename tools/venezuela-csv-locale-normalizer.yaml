schemaVersion: 1
id: venezuela-csv-locale-normalizer
kind: tool
module: validohub
country: VE
category: developer-tools
status: active
name:
  en: "Venezuelan CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Venezuela decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1.234,56 VES;21/07/2026;VE J-12345678-9"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-slug-normalizer, venezuela-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Venezuela decimal, date, postal, phone, tax, and banking fields."
