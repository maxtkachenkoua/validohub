schemaVersion: 1
id: venezuela-document-ocr-fixer
kind: tool
module: validohub
country: VE
category: documents
status: active
name:
  en: "Venezuelan Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "V-12345678 VE J-12345678-9 VE-BANK-0102-1234567890 1010 Caracas"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-gdpr-redaction-helper, venezuela-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
