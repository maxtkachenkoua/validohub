schemaVersion: 1
id: venezuela-form-field-auditor
kind: tool
module: validohub
country: VE
category: developer-tools
status: active
name:
  en: "Venezuelan Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=VE J-12345678-9&postal=1010 Caracas&phone=+58 412 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-locale-number-parser, venezuela-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
