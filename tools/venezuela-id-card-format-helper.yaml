schemaVersion: 1
id: venezuela-id-card-format-helper
kind: tool
module: validohub
country: VE
category: national-identifiers
status: active
name:
  en: "Venezuelan ID Card Format Helper"
summary:
  en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CARD input"
        required: true
        placeholder:
          en: "V-12345678"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-passport-number-helper, venezuela-mrz-passport-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan ID Card Format Helper | ValidoHub"
  description:
    en: "Inspect local identity-card snippets, document numbers, dates, and privacy boundaries without proving identity."
