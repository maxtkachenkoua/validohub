schemaVersion: 1
id: venezuela-locale-number-parser
kind: tool
module: validohub
country: VE
category: localization
status: active
name:
  en: "Venezuelan Locale Number Parser"
summary:
  en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Venezuela."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "NUM input"
        required: true
        placeholder:
          en: "1.234,56 VES"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-calendar-week-helper, venezuela-company-suffix-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan Locale Number Parser | ValidoHub"
  description:
    en: "Parse decimal/grouping variants, currency labels, and API-safe numeric values for Venezuela."
