schemaVersion: 1
id: venezuela-payment-reconciliation-helper
kind: tool
module: validohub
country: VE
category: finance
status: active
name:
  en: "Venezuelan Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234,56 VES; VE-BANK-0102-1234567890; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-bank-statement-parser, venezuela-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
