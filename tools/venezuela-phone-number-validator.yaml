schemaVersion: 1
id: venezuela-phone-number-validator
kind: tool
module: validohub
country: VE
category: address
status: active
name:
  en: "Venezuelan Phone Number Validator"
summary:
  en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PHONE input"
        required: true
        placeholder:
          en: "+58 412 1234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-phone-e164-formatter, venezuela-date-locale-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan Phone Number Validator | ValidoHub"
  description:
    en: "Validate local phone shape, country prefix, national number blocks, and contact-form safety notes."
