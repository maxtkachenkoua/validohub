schemaVersion: 1
id: venezuela-pii-masker
kind: tool
module: validohub
country: VE
category: privacy
status: active
name:
  en: "Venezuelan PII Masker"
summary:
  en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PII input"
        required: true
        placeholder:
          en: "V-12345678 +58 412 1234567 VE-BANK-0102-1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-personal-data-fixture-generator, venezuela-driving-licence-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan PII Masker | ValidoHub"
  description:
    en: "Detect and mask local identifier, phone, address, bank, and tax evidence in plain text."
