schemaVersion: 1
id: venezuela-regex-pack-helper
kind: tool
module: validohub
country: VE
category: developer-tools
status: active
name:
  en: "Venezuelan Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.venezuela-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Cedula RIF codigo postal  VE-BANK-0102-1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [venezuela-api-payload-auditor, venezuela-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Venezuelan Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax, domestic account, postal, phone, dates, and debug labels."
