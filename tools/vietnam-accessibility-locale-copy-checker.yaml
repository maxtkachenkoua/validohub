schemaVersion: 1
id: vietnam-accessibility-locale-copy-checker
kind: tool
module: validohub
country: VN
category: localization
status: active
name:
  en: "Vietnamese Locale Copy Checker"
summary:
  en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "COPY input"
        required: true
        placeholder:
          en: "Citizen ID boundary input, postal code input, amount 1.234.567 VND"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-support-ticket-scrubber, vietnam-integration-smoke-test-builder]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Locale Copy Checker | ValidoHub"
  description:
    en: "Check UI labels for local identifier names, date/currency wording, and support-safe explanations."
