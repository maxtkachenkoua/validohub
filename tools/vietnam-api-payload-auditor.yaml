schemaVersion: 1
id: vietnam-api-payload-auditor
kind: tool
module: validohub
country: VN
category: developer-tools
status: active
name:
  en: "Vietnamese API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"VN\",\"taxCode\":\"0101234567\",\"napas\":\"9704\",\"vietqr\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-form-field-auditor, vietnam-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
