schemaVersion: 1
id: vietnam-bank-statement-parser
kind: tool
module: validohub
country: VN
category: finance
status: active
name:
  en: "Vietnamese Bank Statement Parser"
summary:
  en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "STMT input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234.567 VND; 9704 1234567890; sample counterparty"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-masked-bank-account-formatter, vietnam-currency-decimal-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Bank Statement Parser | ValidoHub"
  description:
    en: "Parse statement rows for date, amount, account/routing evidence, counterparty, reference, and local decimal conventions."
