schemaVersion: 1
id: vietnam-company-onboarding-auditor
kind: tool
module: validohub
country: VN
category: developer-tools
status: active
name:
  en: "Vietnamese Company Onboarding Auditor"
summary:
  en: "Audit company intake payloads for enterprise registration code, VAT, address, banking, and official registry handoff readiness."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "KYC input"
        required: true
        placeholder:
          en: "{\"country\":\"VN\",\"taxCode\":\"0101234567\",\"napas\":\"9704\",\"vietqr\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-business-register-readiness-helper, vietnam-id-card-format-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Company Onboarding Auditor | ValidoHub"
  description:
    en: "Audit company intake payloads for enterprise registration code, VAT, address, banking, and official registry handoff readiness."
