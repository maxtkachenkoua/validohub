schemaVersion: 1
id: vietnam-company-suffix-normalizer
kind: tool
module: validohub
country: VN
category: developer-tools
status: active
name:
  en: "Vietnamese Company Suffix Normalizer"
summary:
  en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SUFFIX input"
        required: true
        placeholder:
          en: "Vietnam Sample Holding Ltd 0101234567"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-procurement-identifier-helper, vietnam-accessibility-locale-copy-checker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Company Suffix Normalizer | ValidoHub"
  description:
    en: "Normalize local company suffixes, registry labels, and search-key variants for onboarding forms."
