schemaVersion: 1
id: vietnam-form-field-auditor
kind: tool
module: validohub
country: VN
category: developer-tools
status: active
name:
  en: "Vietnamese Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=0101234567&postal=100000 Hanoi&phone=+84 912 345 678"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-locale-number-parser, vietnam-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
