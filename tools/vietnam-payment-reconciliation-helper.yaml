schemaVersion: 1
id: vietnam-payment-reconciliation-helper
kind: tool
module: validohub
country: VN
category: finance
status: active
name:
  en: "Vietnamese Payment Reconciliation Helper"
summary:
  en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RECON input"
        required: true
        placeholder:
          en: "21/07/2026; 1.234.567 VND; 9704 1234567890; Invoice 2026-001"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-bank-statement-parser, vietnam-masked-bank-account-formatter]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Payment Reconciliation Helper | ValidoHub"
  description:
    en: "Match bank statement snippets against invoice, tax, amount, and local payment-reference evidence."
