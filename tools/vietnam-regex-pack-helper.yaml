schemaVersion: 1
id: vietnam-regex-pack-helper
kind: tool
module: validohub
country: VN
category: developer-tools
status: active
name:
  en: "Vietnamese Regex Pack Helper"
summary:
  en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REGEX input"
        required: true
        placeholder:
          en: "Citizen ID boundary enterprise registration code postal code  9704 1234567890"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-api-payload-auditor, vietnam-form-field-auditor]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Regex Pack Helper | ValidoHub"
  description:
    en: "Prepare regex snippets for local identifiers, tax IDs, bank accounts, postal, phone, dates, and debug labels."
