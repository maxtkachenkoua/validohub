schemaVersion: 1
id: vietnam-remittance-text-builder
kind: tool
module: validohub
country: VN
category: finance
status: active
name:
  en: "Vietnamese Remittance Text Builder"
summary:
  en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "REMIT input"
        required: true
        placeholder:
          en: "Invoice 2026-001 0101234567 1.234.567 VND"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-payment-reconciliation-helper, vietnam-bank-statement-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Remittance Text Builder | ValidoHub"
  description:
    en: "Build concise remittance text from invoice, customer, VAT, and local payment reference evidence."
