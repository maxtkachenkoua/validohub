schemaVersion: 1
id: vietnam-tax-rate-sanity-helper
kind: tool
module: validohub
country: VN
category: tax
status: active
name:
  en: "Vietnamese Tax Rate Sanity Helper"
summary:
  en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "RATE input"
        required: true
        placeholder:
          en: "tax code 20% base 1.234.567 VND"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-tax-return-field-helper, vietnam-invoice-number-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Tax Rate Sanity Helper | ValidoHub"
  description:
    en: "Inspect tax-rate snippets, local tax labels, amount bases, and official rate lookup boundaries."
