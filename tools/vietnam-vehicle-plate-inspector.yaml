schemaVersion: 1
id: vietnam-vehicle-plate-inspector
kind: tool
module: validohub
country: VN
category: transport
status: active
name:
  en: "Vietnamese Vehicle Plate Inspector"
summary:
  en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.vietnam-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "PLATE input"
        required: true
        placeholder:
          en: "30A-123.45"
    actions: [validate, parse, format, explain]
related:
  explicit: [vietnam-vin-validator, vietnam-vehicle-data-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Vietnamese Vehicle Plate Inspector | ValidoHub"
  description:
    en: "Inspect vehicle plate shape, regional hints, serial blocks, and official vehicle registry boundaries."
