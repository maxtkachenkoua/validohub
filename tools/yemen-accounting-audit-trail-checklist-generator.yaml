schemaVersion: 1
id: yemen-accounting-audit-trail-checklist-generator
kind: tool
module: validohub
country: YE
category: tax
status: active
name:
  en: "Yemeni Accounting Audit Trail Checklist Helper"
summary:
  en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
capabilities:
  - generate
  - validate
  - parse
  - explain
algorithm:
  algorithmId: validohub.yemen-suite
forms:
  generate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "AUDIT input"
        required: true
        placeholder:
          en: "invoice 21/07/2026 1,234,567 YER TAX123456"
    actions: [generate, validate, explain]
related:
  explicit: [yemen-postal-code-validator, yemen-address-normalizer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Yemeni Accounting Audit Trail Checklist Helper | ValidoHub"
  description:
    en: "Generate local accounting evidence checklist for invoices, payments, tax, dates, and immutable logs."
