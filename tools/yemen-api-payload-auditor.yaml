schemaVersion: 1
id: yemen-api-payload-auditor
kind: tool
module: validohub
country: YE
category: developer-tools
status: active
name:
  en: "Yemeni API Payload Auditor"
summary:
  en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.yemen-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "API input"
        required: true
        placeholder:
          en: "{\"country\":\"YE\",\"tax\":\"TAX123456\",\"remittance\":\"INV-2026-001\"}"
    actions: [validate, parse, format, explain]
related:
  explicit: [yemen-form-field-auditor, yemen-locale-number-parser]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Yemeni API Payload Auditor | ValidoHub"
  description:
    en: "Audit API payload snippets for locale, tax, identifiers, bank-account evidence, dates, amounts, and official boundaries."
