schemaVersion: 1
id: yemen-form-field-auditor
kind: tool
module: validohub
country: YE
category: developer-tools
status: active
name:
  en: "Yemeni Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.yemen-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=TAX123456&postal=1247 Sanaa&phone=+967 7 123 456"
    actions: [validate, parse, format, explain]
related:
  explicit: [yemen-locale-number-parser, yemen-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Yemeni Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
