      - type: textarea
        name: input
        label:
          en: "MUNI input"
        required: true
        placeholder:
          en: "Al-Zubayri Street 1, Sanaa 1247"
    actions: [validate, parse, format, explain]
related:
  explicit: [yemen-phone-number-validator, yemen-phone-e164-formatter]
