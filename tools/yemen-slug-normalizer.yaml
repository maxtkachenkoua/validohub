schemaVersion: 1
id: yemen-slug-normalizer
kind: tool
module: validohub
country: YE
category: developer-tools
status: active
name:
  en: "Yemeni Slug Normalizer"
summary:
  en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.yemen-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "SLUG input"
        required: true
        placeholder:
          en: "Yemen sample company Al-Zubayri Street 1, Sanaa 1247"
    actions: [validate, parse, format, explain]
related:
  explicit: [yemen-document-ocr-fixer, yemen-privacy-redaction-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Yemeni Slug Normalizer | ValidoHub"
  description:
    en: "Create locale-safe URL slugs from names, addresses, and organization labels without losing display text."
