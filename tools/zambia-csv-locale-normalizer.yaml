schemaVersion: 1
id: zambia-csv-locale-normalizer
kind: tool
module: validohub
country: ZM
category: developer-tools
status: active
name:
  en: "Zambian CSV Locale Normalizer"
summary:
  en: "Normalize CSV snippets for Zambia decimal, date, postal, phone, tax, and banking fields."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.zambia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "CSV input"
        required: true
        placeholder:
          en: "id;amount;date;tax\\n1;1,234.56 ZMW;24/07/2026;ZM123456789"
    actions: [validate, parse, format, explain]
related:
  explicit: [zambia-slug-normalizer, zambia-document-ocr-fixer]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Zambian CSV Locale Normalizer | ValidoHub"
  description:
    en: "Normalize CSV snippets for Zambia decimal, date, postal, phone, tax, and banking fields."
