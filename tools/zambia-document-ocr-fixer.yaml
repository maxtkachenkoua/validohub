schemaVersion: 1
id: zambia-document-ocr-fixer
kind: tool
module: validohub
country: ZM
category: documents
status: active
name:
  en: "Zambian Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.zambia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "ZM-ID-123456 ZM123456789 001 1234567890 1000 Lusaka"
    actions: [validate, parse, format, explain]
related:
  explicit: [zambia-privacy-redaction-helper, zambia-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Zambian Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
