schemaVersion: 1
id: zambia-form-field-auditor
kind: tool
module: validohub
country: ZM
category: developer-tools
status: active
name:
  en: "Zambian Form Field Auditor"
summary:
  en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.zambia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "FORM input"
        required: true
        placeholder:
          en: "tax=ZM123456789&postal=1000 Lusaka&phone=+260 123 456 789"
    actions: [validate, parse, format, explain]
related:
  explicit: [zambia-locale-number-parser, zambia-calendar-week-helper]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Zambian Form Field Auditor | ValidoHub"
  description:
    en: "Check local form-field labels and values for identifiers, tax, address, phone, banking, and privacy."
