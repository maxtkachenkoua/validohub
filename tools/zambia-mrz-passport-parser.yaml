schemaVersion: 1
id: zambia-mrz-passport-parser
kind: tool
module: validohub
country: ZM
category: national-identifiers
status: active
name:
  en: "Zambian MRZ / Passport Parser"
summary:
  en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.zambia-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "MRZ input"
        required: true
        placeholder:
          en: "P<ZMBSAMPLE<<TEST<<<<<<<<<<<<<<<<<<<<\\nAB1234567ZMB8501019M3107123<<<<<<<<<<<<<<06"
    actions: [validate, parse, format, explain]
related:
  explicit: [zambia-bank-account-validator, zambia-bank-account-fixture-generator]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Zambian MRZ / Passport Parser | ValidoHub"
  description:
    en: "Parse passport MRZ snippets, split document, nationality, dates, and checksum evidence without identity proof."
