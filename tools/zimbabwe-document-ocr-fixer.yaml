schemaVersion: 1
id: zimbabwe-document-ocr-fixer
kind: tool
module: validohub
country: ZW
category: documents
status: active
name:
  en: "Zimbabwean Document OCR Fixer"
summary:
  en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
capabilities:
  - validate
  - parse
  - format
  - explain
algorithm:
  algorithmId: validohub.zimbabwe-suite
forms:
  validate:
    inputs:
      - type: textarea
        name: input
        label:
          en: "OCR input"
        required: true
        placeholder:
          en: "ZW-ID-123456 ZW123456789 001 1234567890 1000 Harare"
    actions: [validate, parse, format, explain]
related:
  explicit: [zimbabwe-privacy-redaction-helper, zimbabwe-pii-masker]
  auto:
    sameCountry: true
    sameCategory: true
    sameCapability: true
seo:
  title:
    en: "Zimbabwean Document OCR Fixer | ValidoHub"
  description:
    en: "Clean OCR text for local invoices, IDs, banking strings, dates, and tax evidence."
